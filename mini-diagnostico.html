       Prometer meio de pagamento que não existe é a pior quebra possível: a
       pessoa decide comprar, chega no checkout e não acha o que foi prometido.
     - O convite para conversar no WhatsApp saiu a pedido dele: não quer abrir
       negociação de preço por mensagem.
     Sobrou a saída que é verdadeira e que os próprios leads pediram: parcelar.
     As três únicas respostas que a régua já recebeu foram todas a mesma coisa
     ("só terei dinheiro dia 6", "recebo no fim do mês", "tive que comprar
     remédio"), e nenhuma disse que achou caro. */
  function objecaoDinheiro(){
    return '<div class="objecao">'+
      '<h3>E se hoje os R$ 47 não caberem?</h3>'+
      '<p>Acontece, e não tem nada de errado nisso.</p>'+
      '<ul>'+
        '<li><b>'+PARCELA+' no cartão.</b> Menos de nove reais por mês, com o acesso liberado na hora.</li>'+
      '</ul>'+
      '<div class="fine">O que não espera é a prova: ela é no dia 6 de setembro com ou sem material, e cada semana que passa tira um pedaço do que ele ainda alcança.</div>'+
    '</div>';
  }

  // Qual eixo está segurando a pessoa hoje. A tela de oferta abre nomeando isto, então
  // precisa ser a MESMA régua do resto da página (CORTE_X / CORTE_Y), senão o topo
  // contradiz as barras que estão logo abaixo dele.
  // Cada caso traz a manchete inteira, e não só o nome do gargalo: encaixar nome variável
  // em molde fixo ("...foi <nome>") produzia "foi os dois: conteúdo e relógio" no caso
  // duplo, erro de concordância na primeira linha da página.
  //
  // No caso duplo a manchete DIZ QUAL PESA MAIS. A versão anterior dizia "pelos dois
  // motivos", que lê como empate e não informa nada: quem lê quer saber se é 90/10 ou
  // 50/50. Os dois eixos são número, então a comparação é feita, não sonegada. O critério
  // é a distância até o corte de cada eixo, não o valor bruto — os cortes são diferentes
  // (71 e 72) e as escalas não são intercambiáveis.
  //
  // Nome do perfil (um dos 4 do Mapa), mesma régua CORTE_X/CORTE_Y usada em
  // gargalo(r) e na manchete. Extraída à parte (04/08) porque virou dependência
  // de dois lugares: o quadrante e a pill "perfil provável" do hero — os dois
  // têm que sempre concordar, então os dois chamam a mesma função.
  /* Comparação com quem já fez, medida no banco em 07/08/2026 sobre 252 testes
     respondidos: mediana 3 de 7, média 3,50, e 62 pessoas (24,6%) com 5 ou mais.
     Existe porque a página inteira mede a pessoa contra ela mesma e nunca contra
     ninguém. "4 de 7" não diz se é bom ou ruim, e quem nunca prestou o Exame não
     tem referência nenhuma para saber. Duas frases só, e nenhuma delas elogia: a
     do quartil superior é fato, e a mediana serve igual para quem ficou abaixo.
     PARA ATUALIZAR o número:
       select percentile_cont(0.5) within group (order by acertos) as mediana,
              count(*) filter (where acertos>=5), count(*)
       from public.leads where acertos is not null; */
  /* 07/08/2026, segunda versão. A primeira comparava a pessoa com o GRUPO e os dois
     lados do if consolavam, cada um do seu jeito: quem tirava 5 ou mais lia "entre os
     25% que mais acertam" (elogio) e quem tirava 3 lia "a mediana de quem faz este
     teste é 3" (você está na média). Como 3 É a mediana, o caso mais comum da base
     recebia anestésico exatamente no bloco onde a página precisa de tensão.
     A régua passou a ser EXTERNA e é a única que decide de verdade: a prova corta em
     40 de 80, metade. A frase é aritmética da própria nota, não veredito — não diz
     que a pessoa passaria nem que reprovaria, e 7 questões não autorizariam nenhum
     dos dois. */
  function comparaMediana(c){
    var pct = Math.round(100*c/CONTENT.length);
    return pct + '% de acerto · o corte da prova é 50%';
  }

  function perfilNome(r){
    var hiX=r.X>=CORTE_X, hiY=r.Y>=CORTE_Y;
    if(hiX&&hiY) return 'Pronta de verdade';
    if(!hiX&&hiY) return 'Falta conteúdo';
    if(hiX&&!hiY) return 'Sabe mas trava';
    return 'Conteúdo e tática';
  }

  // O quadrante dos 4 perfis (04/08). No handoff é estático ("você está aqui" sempre
  // em "Conteúdo e tática"); aqui usa a MESMA régua do resto da página (CORTE_X/
  // CORTE_Y), então o perfil marcado bate com a manchete e com gargalo(r) — os três
  // usam exatamente os mesmos dois booleanos.
  function quadrante(r){
    var nome=perfilNome(r);
    function cel(n, classe, texto){
      return '<div class="cell'+(classe?' '+classe:'')+(n===nome?' here':'')+'">'+
        '<b>'+n+(n===nome?' <span class="badge">VOCÊ ESTÁ AQUI</span>':'')+'</b>'+
        '<p>'+texto+'</p></div>';
    }
    return '<div class="quad">'+
      '<div class="ax">↑ firmeza sob o relógio</div>'+
      '<div class="grid2">'+
        cel('Falta conteúdo','', 'Você decide bem, só não sabe a matéria. Fichas primeiro, tática depois.')+
        cel('Pronta de verdade','green', 'As duas pontas firmes. Aqui o trabalho é manutenção e simulado.')+
        cel('Conteúdo e tática','', 'As duas pontas cederam. A ordem importa muito: conteúdo de maior peso primeiro.')+
        cel('Sabe mas trava','', 'A matéria está lá, o relógio derruba. Aqui estudar mais não resolve.')+
      '</div>'+
      '<div class="ax right">domínio do conteúdo →</div>'+
    '</div>';
  }

  // "Execução" no lugar de "a hora da prova": é mais preciso e é a palavra que o resto da
  // página usa para o eixo Y.
  function gargalo(r){
    var cBaixo = r.X < CORTE_X, pBaixo = r.Y < CORTE_Y;
    if(cBaixo && pBaixo){
      var faltaC = CORTE_X - r.X, faltaE = CORTE_Y - r.Y;
      // Diferença pequena é empate de verdade, e cravar um "pesa mais" nesse caso seria
      // inventar precisão que o instrumento não tem.
      var quase = Math.abs(faltaC - faltaE) < 8;
      var maior = faltaC >= faltaE ? 'conteúdo' : 'execução';
      return {
        nome:'conteúdo e execução',
        h1: quase
          ? 'Hoje você perde ponto por <em>conteúdo e execução</em>, em partes parecidas.'
          : 'Hoje você perde ponto por conteúdo e por execução, e <em>'+maior+'</em> pesa mais.',
        // Só o que a MEDIÇÃO diz. O princípio ("treinar só estratégia não recupera ponto
        // que falta de conteúdo") saiu daqui em 03/08: ele estava aqui E na abertura da
        // seção 2, quase palavra por palavra, porque as duas foram escritas no mesmo dia
        // sem passar pelo inventário. Princípio é seção 2; hero é número.
        exp: quase
          ? 'As duas pontas cederam num grau parecido: a matéria em si e a firmeza para decidir com o tempo correndo.'
          : (maior==='conteúdo'
              ? 'As duas pontas cederam, e a matéria cedeu mais: a diferença entre elas aparece nas respostas que você errou tendo tempo de sobra.'
              // 04/08: dizia "você errou mais no fim do relógio do que no começo dele".
              // Era herança do eixo acoplado, e agora o eixo de execução não olha acerto
              // nenhum — a frase afirmava uma medição que não existe mais.
              : 'As duas pontas cederam, e o que mais custou foi a execução: não é o quanto você acertou, é o jeito como o relógio mexeu com você de uma questão para outra.')};
    }
    if(cBaixo) return {
      nome:'conteúdo',
      h1:'Hoje, o que mais tirou seus pontos foi <em>conteúdo</em>.',
      exp:'O relógio não foi o principal motivo da sua nota. O padrão das suas respostas mostra que, neste momento, recuperar pontos depende mais de conteúdo do que de velocidade.'};
    if(pBaixo) return {
      nome:'execução',
      h1:'Hoje, o que mais tirou seus pontos foi a <em>execução da prova</em>.',
      exp:'A matéria você tem. O que o teste pegou foi o relógio: o ritmo com que você decidiu, o quanto ele oscilou de uma questão para outra e o que mudou do começo para o fim.'};
    // "É o melhor resultado que este teste dá — e também o de menor alcance, porque uma
    // questão por matéria não alcança as outras 11" saiu do hero em 03/08: o alcance do
    // teste é a pergunta da seção 4, e antecipá-la aqui esvazia a seção inteira.
    return {
      nome:'nada, nestas 7',
      h1:'Nestas 7 questões, <em>nada cedeu</em>.',
      exp:'Nem a matéria nem o relógio: você acertou tudo o que respondeu, dentro do tempo. É o melhor resultado que este teste dá.'};
  }

  // Contexto compartilhado pelas duas telas do resultado. Existe porque em 02/08/2026 a
  // tela de resultado foi partida em duas: DIAGNÓSTICO (o que o teste achou, sem preço
  // nenhum) e SOLUÇÃO (a oferta). Antes era uma tela só, e a auditoria tinha apontado o
  // efeito: a oferta se disfarçava de continuação do diagnóstico e a etiqueta de preço
  // chegava no meio de uma tabela, sem aviso. Partida em duas, a oferta é uma coisa que
  // a pessoa PEDE, e o clique nesse pedido é um degrau novo de funil que dá para medir.
  function ctx(){
    var r=compute(), q=quadrant(r.X,r.Y,r), L=leituraMomento(q,r);
    // Checkout pré-preenchido com o que a pessoa já digitou: ela não encara o formulário
    // vazio de novo (é onde o funil perde gente).
    var digits=S.tel.replace(/\D/g,'');
    // O checkout brasileiro espera DDD + número, sem o 55. Mandar com DDI fazia a
    // Hotmart descartar o campo: no painel de abandono de 04/08/2026, 15 dos 16
    // registros vinham com "Telefone: –", e o único preenchido foi digitado à mão
    // pela própria pessoa. Sem telefone lá, o recuperador automático da Hotmart
    // não tem por onde falar com quem abandonou.
    var telLocal=(digits.length>11&&digits.indexOf('55')===0)?digits.slice(2):digits;
    // Duas grafias de propósito: a documentação da Hotmart usa minúsculas, o código
    // aqui usava camelCase, e não dá para saber qual ela lê sem testar. Parâmetro
    // que ela não reconhece é ignorado, então mandar os dois não custa nada.
    var fill='&name='+encodeURIComponent(S.nome)+
      (S.email?'&email='+encodeURIComponent(S.email):'')+
      (telLocal?'&phonenumber='+encodeURIComponent(telLocal)+
                '&phoneNumber='+encodeURIComponent(telLocal):'');
    // O trecho em itálico do título. Se 'hl' não estiver dentro de 'lab', o título sai
    // reto em vez de quebrar: substituição só acontece quando encontra.
    var h1=esc(q.lab);
    if(q.hl && q.lab.indexOf(q.hl)>=0) h1=h1.replace(esc(q.hl),'<em>'+esc(q.hl)+'</em>');
    if(!/[.!?]$/.test(q.lab)) h1+='.';
    return {
      r:r, q:q, L:L, h1:h1,
      nome: esc((S.nome.split(' ')[0])||'você'),
      buyUrl: CHECKOUT_URL+fill,
      forte: !!q.forte,
      erroN: CONTENT.length-r.c-r.estourou,
      // Mesma régua da manchete e do 'sabe'. A tabela não pode prometer "descobrir a
      // matéria" para quem o título acabou de absolver de falha de matéria.
      semFalhaDeMateria: perdaSeparada().mat===0,
      // A faixa de pagamento saiu da microcopy de 11,5px e virou linha própria: o Pix
      // é o que destrava quem não tem cartão com limite, e era a informação mais
      // escondida da página. O prazo de acesso passou a aparecer: a oferta.html sempre
      // disse "12 meses" e aqui só dizia "sem mensalidade", que lê como vitalício.
      // O total do parcelado sai escrito, sem ninguém perguntar. Para um público que
      // já se queimou com cursinho, mostrar o que a página poderia esconder compra
      // confiança, e ainda empurra para o Pix, que é melhor para os dois lados.
      PAGA:'<div class="pag"><span class="pix">Pix</span> <b>R$ 47</b> à vista '+
           '<span>ou '+PARCELA+' no cartão, '+TOTAL_PARCELADO+' no total</span></div>',
      MICRO:'pagamento único, sem mensalidade · acesso na hora, por 12 meses<br>7 dias de garantia',
      // No bloco final a garantia já está no selo, 20 pixels abaixo. Repetir ali era a
      // quarta aparição da mesma frase na mesma tela.
      MICRO_FIM:'pagamento único · acesso na hora'
    };
  }

  // Liga os botões de compra. Chamado só na tela de solução, que é a única que os tem.
  // Três coisas acontecem no clique, e a ORDEM importa:
  // 1. sck=<id do lead> entra na URL agora, e não na hora de montar o HTML, porque o id
  //    chega do banco depois do render. É ele que fecha lead -> venda dentro da Hotmart
  //    sem depender de casar e-mail.
  // 2. O InitiateCheckout dispara UMA VEZ por sessão. Quatro botões apontam para o mesmo
  //    checkout, e até 02/08/2026 quem clicava no do meio, voltava e clicava na barra
  //    fixa contava duas vezes. Com 2 checkouts no funil, um evento a mais é 50% de erro.
  //    Passou a vir antes do passo 3 porque é ele que decide se o servidor também manda
  //    o evento, e essa decisão viaja junto no mesmo beacon.
  // 3. O clique é gravado no banco, com o botão. O pixel diz quantos; isto diz quem —
  //    e, quando o passo 2 autorizou, leva de carona o id do evento e os cookies da
  //    Meta para o /api/clique repetir o checkout pela Conversions API.
  var icDisparado=false;
  function ligarCompra(){
    // 'buy2' saiu da lista em 03/08 junto com o link do Plano Completo. 'buy3' saiu em
    // 05/08 junto com a barra fixa. Sobraram os dois que apontam para o checkout de
    // R$47: meio da oferta e bloco final.
    // 'buyslim' entrou em 06/08/2026: e o atalho colado no veredito. Precisa estar
    // aqui para receber o mesmo tratamento dos outros, principalmente o sck (sem
    // ele a venda vinda do atalho ficaria sem atribuicao) e o eventID do checkout.
    // 'buydep' entrou em 07/08/2026 (botão depois dos depoimentos). 'buyslim' agora
    // existe só na tela de reencontro: no resultado ele virou âncora (#verof2), para
    // não disparar InitiateCheckout antes de a pessoa ver a oferta.
    // A faixa de quem voltou NÃO entra aqui: o botão dela é âncora para #oferta, não
    // checkout. Mesma razão que tirou o #verof2 desta lista em 07/08 — disparar
    // InitiateCheckout a 852 px ensina a Meta a caçar quem aperta botão, e isso já foi
    // medido uma vez (17% de conversão no atalho contra 80% no CTA do fim).
    ['buyslim','buy0','buy','buydep'].forEach(function(id){
      var el=document.getElementById(id);
      if(!el) return;
      el.onclick=function(){
        var oferta=parseInt(el.getAttribute('data-v'),10);
        if(LEAD_ID && el.href.indexOf('&sck=')<0) el.href = el.href + '&sck=' + encodeURIComponent(LEAD_ID);

        // O evento sai por dois caminhos: o pixel daqui e a Conversions API lá no
        // /api/clique, com nome, e-mail e telefone do lead, que o navegador não
        // manda. O `eventID` é o mesmo nos dois — é o que faz a Meta contar um
        // checkout, e não dois. Sem ele, o servidor duplicaria o que o pixel já
        // disse, que é justamente o erro corrigido em 02/08 por outro caminho.
        var extras=null;
        if(!icDisparado){
          icDisparado=true;
          extras={
            ic_event_id: 'ic-' + (LEAD_ID || 'x') + '-' + Date.now().toString(36),
            fbp: lerCookie('_fbp'),
            fbc: lerCookie('_fbc')
          };
          if(typeof fbq!=='undefined'){
            try{ fbq('track','InitiateCheckout',{value:oferta,currency:'BRL'},{eventID:extras.ic_event_id}); }catch(e){}
          }
        }
        marcarClique(id, oferta, extras);
      };
    });
  }

  // Barra fixa saiu da página (05/08/2026), a pedido: o preço já aparece no resumo
  // logo após o hero, no meio da oferta e no CTA final — a barra era um quarto
  // lugar dizendo a mesma coisa. marcarOferta() continua registrando o passo e o
  // ViewContent, que servem independente de barra nenhuma existir.

  // ===== TELA 1: DIAGNÓSTICO =====
  // Nenhum preço, nenhum botão de compra, nenhum depoimento. Só o que o teste achou.
  // Termina no lockbox (o que ficou fechado) e na ponte para a solução, nessa ordem,
  // porque é o bloco rasurado que cria a pergunta que o botão responde.
  // ===== PÁGINA DE VENDAS v2 (handoff de 04/08/2026) =====
  // Redesenho visual completo. A ARQUITETURA não mudou: continua a mesma ordem por
  // pergunta e por evidência do INVENTARIO-mini-diagnostico.md, e nenhum bloco novo
  // responde pergunta que já tinha dono. O que entrou de novo:
  //   - resumo da oferta logo abaixo do hero, para quem já decidiu não precisar rolar
  //   - comentário da questão colapsado (a prova continua visível, o porquê é pedido)
  //   - FAQ, que responde objeção e não repete argumento de venda
  //   - barra fixa, que já existia, agora com o nome novo
  //
  // Duas divergências deliberadas em relação ao arquivo do handoff:
  //   1. TRAVESSÕES. O design usa "—" em várias frases; foram trocados por vírgula ou
  //      dois pontos, conforme pedido no mesmo dia. A regra vale para a página inteira.
  //   2. O handoff é estático, com "Gustavo, 2/7" fixo. Aqui tudo o que é resultado
  //      continua vindo das 33 variantes de copy, da poda e do cálculo dos dois eixos.
  function result(){
    var C=ctx(), r=C.r, q=C.q, L=C.L, forte=C.forte;
    var bx=barraConteudo(r), by=barraPressao(r);
    var vt=tempo(), vp=pressao(), vx=trocou();
    var g=gargalo(r);
    var d=diasParaProva();

    document.body.className='vendas';

    var GAT = /\s*(O que falta descobrir|O que resolve|O que falta|Então o que te derruba está no que|O que ele não mede|O que ela não mede|Isso responde uma pergunta e abre outra)\b/;
    function podar(t){
      t = String(t);
      var m = t.search(GAT);
      if(m <= 20) return t;
      var corte = t.slice(0, m).replace(/[,;:\s—-]+$/,'');
      return /[.!?]$/.test(corte) ? corte : corte + '.';
    }

    var html =

      // ===== BARRA DE MARCA =====
      // A marca é o símbolo + "Só o que Cai" em Spectral, igual ao resto do site. O
      // handoff trazia um wordmark em Cinzel versalete; ficaria bonito e seria a única
      // página do site com outra marca.
      '<header class="vtopo">'+
        '<div class="wm">'+
          '<svg width="26" height="26" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+
            '<rect width="32" height="32" rx="8" fill="#F3EEE4"/>'+
            '<g stroke="#15212B" stroke-width="2.4" fill="none"><circle cx="16" cy="16" r="7.2"/>'+
            '<path d="M16 4.5v4M16 23.5v4M4.5 16h4M23.5 16h4"/></g>'+
            '<circle cx="16" cy="16" r="3" fill="#C77A2B"/></svg>'+
          '<span>Só o que Cai</span>'+
        '</div>'+
        '<div class="tg">1ª fase · OAB</div>'+
      '</header>'+

      // ===== 1. HERO — "por que perdi pontos?" · evidência numérica =====
      // O placar virou cartão dourado: é o número que a pessoa veio buscar, e ele
      // passa a ser a primeira coisa que o olho encontra depois da manchete.
      '<section class="vhero"><div class="in">'+
        '<div class="eyebrow gold">'+C.nome+' · seu resultado</div>'+
        (forte
          ? '<h1>Você acertou <em>7 de 7</em>. Excelente resultado.</h1>'
          : '<h1>'+g.h1+'</h1>')+
        '<div class="placar">'+
          '<div class="nota"><div class="n">'+r.c+'<span>/'+CONTENT.length+'</span></div>'+
            '<div class="lb">acertos</div>'+
            // COMPARAÇÃO EXTERNA (07/08/2026). A página inteira media a pessoa contra
            // ela mesma e nunca contra ninguém: "4 de 7" não diz se é bom ou ruim, e
            // quem nunca prestou o Exame não tem como saber. A mediana real de 252
            // testes respondidos é 3. Quem faz 5 ou mais está no quarto superior
            // (62 de 252 = 24,6%).
            // PARA ATUALIZAR: select percentile_cont(0.5) within group (order by
            // acertos), count(*) from leads where acertos is not null.
            '<div class="lbcomp">'+esc(comparaMediana(r.c))+'</div></div>'+
          '<div class="eixos">'+
            '<div class="eixo"><span>'+esc(bx.rot)+'</span>'+
              '<b class="laranja">'+esc(bx.v)+'</b></div>'+
            '<div class="eixo"><span>'+esc(by.rot)+'</span>'+
              '<b class="azul">'+esc(by.v)+'</b></div>'+
          '</div>'+
        '</div>'+
        '<p class="lede">'+(forte
          ? 'Nestas '+CONTENT.length+' nada cedeu, nem a matéria nem o relógio. O que fica em aberto é se esse desempenho se mantém numa amostra maior e nas outras matérias da prova.'
          : 'Você acertou <strong>'+r.c+' de '+CONTENT.length+'</strong>'+
            (r.estourou? (C.erroN>0? ', errou '+C.erroN+' e estourou o tempo em '+r.estourou+'.'
                                   : (r.estourou>1? '. Nas outras '+r.estourou+' o tempo acabou antes de você marcar.'
                                                  : '. Na outra o tempo acabou antes de você marcar.'))
                       : '.')+' '+esc(g.exp))+'</p>'+
        (traduzMargem()? '<p class="lede margem">'+esc(traduzMargem())+'</p>' : '')+
        '<div class="perfil">'+
          '<span class="pl">Perfil provável</span>'+
          '<span class="pill">'+esc(perfilNome(r))+'</span>'+
          '<span class="pt">um dos quatro perfis do Mapa</span>'+
        '</div>'+
        '<div class="micro">O teste mede esses dois fatores separadamente</div>'+
      '</div></section>'+

      // ===== RESUMO DA OFERTA — atalho para quem já decidiu =====
      // Não responde pergunta nova: é navegação. Por isso não tem argumento, só

      // O rótulo de "fechado" nomeia a alternativa certa ("Ver por que a C é a certa"),
      // e a letra muda conforme a questão sorteada — então ele é guardado, não reescrito.
      var rotuloFechado = gb.textContent;
      gb.onclick=function(){
        var aberto = !gx.hidden;
        gx.hidden = aberto;
        gb.textContent = aberto ? rotuloFechado : 'Fechar comentário';
      };
    }

    // FAQ: um aberto por vez.
    Array.prototype.forEach.call(app.querySelectorAll('.fitem'), function(it){
      var b=it.querySelector('.fq'), a=it.querySelector('.fa'), sinal=it.querySelector('.fq i');
      b.onclick=function(){
        var vaiAbrir = a.hidden;
        Array.prototype.forEach.call(app.querySelectorAll('.fitem'), function(o){
          o.querySelector('.fa').hidden = true;
          o.querySelector('.fq i').textContent = '+';
          o.classList.remove('on');
        });
        if(vaiAbrir){ a.hidden=false; sinal.textContent='−'; it.classList.add('on'); }
      };
    });

    // Âncora suave do resumo até a oferta.
    var vo=document.getElementById('verof');
    if(vo) vo.onclick=function(e){
      e.preventDefault();
      var alvo2=document.getElementById('oferta');
      if(alvo2) alvo2.scrollIntoView({behavior:'smooth', block:'start'});
    };

    // Marca que chegou na oferta. Sem a ponte, o sinal é a seção entrar na tela.
    // Ver a nota longa da versão anterior: IntersectionObserver foi descartado por
    // não disparar de forma confiável, e medição que não dá para conferir não serve.
    var alvo=document.getElementById('oferta'), marcou=false;
    function marcarOferta(){
      if(marcou) return; marcou=true;
      marcarPasso('oferta');
      if(typeof fbq!=='undefined'){
        try{ fbq('track','ViewContent',{content_name:'oferta',value:47,currency:'BRL'}); }catch(e){}
      }
    }
    if(alvo){
      var conferir=function(){
        if(alvo.getBoundingClientRect().top < window.innerHeight*0.85){
          marcarOferta();
          window.removeEventListener('scroll', conferir);
          window.removeEventListener('resize', conferir);
        }
      };
      window.addEventListener('scroll', conferir, {passive:true});
      window.addEventListener('resize', conferir);
      conferir();
    }

    // Marca que chegou até o BOTÃO de comprar (06/08/2026), não só o topo da
    // seção da oferta. A seção é longa (depoimentos, FAQ, preço, e só depois
    // o botão): viu_oferta_em sozinho não distingue quem parou logo no início
    // da oferta de quem leu tudo e não chegou a ver o botão. #buy0 é o
    // primeiro CTA que aparece na seção (ver ligarCompra()). Mesmo padrão de
    // scroll do bloco acima — sem IntersectionObserver, pelo mesmo motivo.
    var alvoCta=document.getElementById('buy0'), marcouCta=false;
    function marcarCta(){
      if(marcouCta) return; marcouCta=true;
      marcarPasso('oferta_cta');
    }
    if(alvoCta){
      var conferirCta=function(){
        if(alvoCta.getBoundingClientRect().top < window.innerHeight*0.85){
          marcarCta();
          window.removeEventListener('scroll', conferirCta);
          window.removeEventListener('resize', conferirCta);
        }
      };
      window.addEventListener('scroll', conferirCta, {passive:true});
      window.addEventListener('resize', conferirCta);
      conferirCta();
    }
  }

  /* ===================================================================
     MEMÓRIA DO RESULTADO (06/08/2026)
     -------------------------------------------------------------------
     O problema: a régua manda a pessoa direto para o checkout, e quem
     respondeu 7 questões reencontra uma tela de pagamento sem nada do que
     fez. 18 cliques de retorno, zero vendas.

     REGRA DE OURO: a página NUNCA sequestra a pessoa.
     - Entrada normal (anúncio, link na bio, endereço digitado): tela de
       sempre, teste começa do zero. Se houver resultado guardado, aparece
       uma faixa discreta oferecendo rever OU refazer.
     - Só com ?r=<id> (o link que a própria pessoa clicou na mensagem) a
       página abre direto no resultado.

     Por que a faixa e não a restauração automática: 9,2% das pessoas
     refazem o teste, e elas clicam em comprar 60% MAIS que a média
     (17,2% contra 10,7%). Refazer é comportamento de gente interessada;
     bloquear isso custaria venda.

     O que fica guardado é o mínimo para remontar a tela, e some em 30
     dias. Nada aqui é enviado para lugar nenhum: é só deste navegador.
     =================================================================== */
  var MEM = 'soqc-resultado-v1';
  var MEM_DIAS = 30;

  function guardarResultado(){
    try{
      // 07/08/2026: o resumo (acertos, total, matérias erradas) passou a ser gravado
      // junto. Não é para esta página, que recalcula tudo a partir de S: é para a
      // página do Plano Completo, que vive no mesmo domínio, lê esta mesma chave e
      // precisa saber em que matéria o ponto vazou. Sem isto ela teria que carregar
      // uma cópia do array CONTENT inteiro só para traduzir índice em matéria, e essa
      // cópia quebraria em silêncio na primeira vez que as 7 questões mudassem.
      var R = null;
      try{ R = compute(); }catch(e){}
      localStorage.setItem(MEM, JSON.stringify({
        quando: Date.now(),
        lead: LEAD_ID,
        acertos: R ? R.c : null,
        total: CONTENT.length,
        errou: materiasErradas(),
        // S inteiro não: só o que result() precisa para remontar a tela.
        s: { ans:S.ans, times:S.times, estourou:S.estourou, fora:S.fora, sel:S.sel,
             selT:S.selT, ansPrim:S.ansPrim, trocas:S.trocas, beh:S.beh,
             nome:S.nome, email:S.email, tel:S.tel, momento:S.momento }
      }));
    }catch(e){}
  }

  function lerResultado(){
    try{
      var m = JSON.parse(localStorage.getItem(MEM) || 'null');
      if(!m || !m.s || !m.quando) return null;
      if(Date.now() - m.quando > MEM_DIAS*24*60*60*1000){ localStorage.removeItem(MEM); return null; }
      return m;
    }catch(e){ return null; }
  }

  // Restaura o estado e abre a tela de resultado. Usada nos dois caminhos:
  // no clique da faixa e na chegada por ?r=<id>.
  function abrirResultadoGuardado(m){
    if(!m || !m.s) return false;
    Object.keys(m.s).forEach(function(k){ S[k] = m.s[k]; });
    if(m.lead) LEAD_ID = m.lead;
    // Toda entrada por aqui é, por definição, uma volta: só existe memória se a pessoa
    // já terminou o teste alguma vez. Ver a nota em VOLTOU.
    VOLTOU = true;
    VOLTOU_QUANDO = m.quando || null;
    // O passo vai para o BANCO, não só para o pixel. Até 07/08 o retorno era marcado
    // apenas com fbq('trackCustom','VoltouAoResultado'), que morre no Events Manager —
    // e o Events Manager é justamente o painel que a régua deste projeto manda não usar
    // como veredito. Sem coluna em `leads` não há como responder a única pergunta que
    // importa aqui: a correção de 06/08 fez alguém voltar e clicar?
    marcarPasso('voltou');
    S.screen = 'result';
    render();
    window.scrollTo(0,0);
    return true;
  }

  // A faixa. Fica no topo da tela de entrada, some depois de escolher, e o
  // botão de refazer é tão visível quanto o de rever: a pessoa decide.
  function faixaDeVolta(){
    if(S.screen !== 'intro') return;
    var m = lerResultado();
    if(!m) return;
    var dt = new Date(m.quando);
    var quando = dt.getDate() + ' de ' + ['janeiro','fevereiro','março','abril','maio','junho','julho',
      'agosto','setembro','outubro','novembro','dezembro'][dt.getMonth()];
    var acertos = null;
    // A resposta certa mora em CONTENT[i].c (não .r). Errar isso não quebraria a
    // página, porque está dentro do try, mas a faixa diria "acertou 0 de 7" para
    // todo mundo, que é pior que não dizer nada.
    try{ acertos = Object.keys(m.s.ans||{}).filter(function(k){ return m.s.ans[k]===CONTENT[k].c; }).length; }catch(e){}

    var box = document.createElement('div');
    box.className = 'voltafaixa';
    box.innerHTML =
      '<div class="vf-t">Você já fez este teste em ' + quando +
        (acertos!==null ? ', e acertou ' + acertos + ' de ' + CONTENT.length : '') + '.</div>' +
      '<div class="vf-b">' +
        '<button type="button" id="vf-ver">Ver o meu resultado</button>' +
        '<button type="button" id="vf-refazer">Fazer o teste de novo</button>' +
      '</div>';
    app.insertBefore(box, app.firstChild);
    document.getElementById('vf-ver').onclick = function(){
      marcarPixel('VoltouAoResultado', { origem:'faixa' });
      abrirResultadoGuardado(m);
    };
    document.getElementById('vf-refazer').onclick = function(){
      marcarPixel('RefezOTeste');
      box.remove();
    };
  }

  /* Chegada pelo link da mensagem: ?r=<id>. Duas camadas, e a ordem importa.
     1) Mesmo navegador: o que está guardado aqui é sempre mais completo (traz
        o gabarito questão a questão) e não depende de rede.
     2) Navegador diferente (o caso comum: fez o teste vindo do Instagram e
        volta pelo link do WhatsApp): pede o diagnóstico ao servidor, que
        remonta o que a base guarda. Sem o gabarito, porque a base guarda o
        resultado e não as respostas uma a uma.
     Se as duas falharem, não trava nada: cai na tela de entrada normal. */
  function tentarRestaurarPeloLink(){
    var alvo = null;
    try{ alvo = new URLSearchParams(location.search).get('r'); }catch(e){}
    if(!alvo) return false;

    var m = lerResultado();
    if(m && String(m.lead) === String(alvo).split('-')[0]){
      marcarPixel('VoltouAoResultado', { origem:'link-local' });
      return abrirResultadoGuardado(m);
    }

    // CAMADA 2: outro navegador. Pede o diagnóstico ao servidor e monta a tela
    // de reencontro. Assíncrono, então a entrada normal é desenhada primeiro e
    // trocada quando a resposta chega: se a rede falhar, a pessoa fica numa
    // página inteira em vez de olhar para um vazio esperando carregar.
    fetch(RESULTADO_URL + '?r=' + encodeURIComponent(alvo))
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){ if(d && d.id) telaReencontro(d); })
      .catch(function(){});
    return false;
  }

  /* Tela de reencontro (06/08/2026).

     Não é a tela de resultado original e não finge ser: a base guarda o
     RESULTADO (acertos, eixos, perfil, matérias), não as respostas uma a uma,
     então o gabarito comentado não tem como voltar aqui. O que ela faz é o
     essencial: a pessoa reencontra o próprio diagnóstico em vez de cair num
     checkout que não sabe quem ela é.

     A oferta abaixo é a MESMA da tela original, montada pelas mesmas funções.
     Nada de copy paralela: duas versões da oferta divergiriam na primeira
     mudança de preço. */
  function telaReencontro(d){
    LEAD_ID = d.id;
    S.nome = d.nome || ''; S.email = d.email || ''; S.tel = d.telefone || '';
    S.momento = d.momento || '';

    var digits = String(d.telefone||'').replace(/\D/g,'');
    var telLocal = (digits.length>11 && digits.indexOf('55')===0) ? digits.slice(2) : digits;
    var fill = '&name='+encodeURIComponent(S.nome)+
               (S.email?'&email='+encodeURIComponent(S.email):'')+
               (telLocal?'&phonenumber='+encodeURIComponent(telLocal)+
                         '&phoneNumber='+encodeURIComponent(telLocal):'');
    var buyUrl = CHECKOUT_URL + fill;

    var quando = '';
    try{
      var dt = new Date(d.criado_em);
      quando = dt.getDate()+' de '+['janeiro','fevereiro','março','abril','maio','junho','julho',
        'agosto','setembro','outubro','novembro','dezembro'][dt.getMonth()];
    }catch(e){}

    var mats = String(d.errou_em||'').split(',').map(function(x){ return x.trim(); }).filter(Boolean);

    app.innerHTML =
      '<div class="vwrap">'+
        '<section class="vsec estreita">'+
          '<div class="eyebrow">Você já esteve aqui</div>'+
          '<h2 class="grande">'+(S.nome? esc(S.nome)+', ' : '')+'este é o seu diagnóstico'+
            (quando? ' de '+esc(quando) : '')+'.</h2>'+
          (d.acertos!=null && d.total!=null
            ? '<p class="p">Você acertou <strong>'+d.acertos+' de '+d.total+'</strong>'+
              (d.perfil? '. '+esc(d.perfil)+'.' : '.')+'</p>'
            : '')+
          (mats.length
            ? '<div class="callout">Onde o ponto vazou: <strong>'+mats.map(esc).join(', ')+'</strong>.</div>'
            : '')+
          // Honestidade sobre o que esta tela não traz. Sem isso, quem lembra do
          // gabarito acha que a página perdeu, e perder confiança aqui custa a venda.
          '<p class="p sec">O gabarito comentado questão a questão fica no aparelho em que você fez o teste. '+
            'Se quiser rever tudo, dá para <a href="'+location.pathname+'" style="text-decoration:underline">refazer o teste</a>.</p>'+
          '<div class="ctaslim">'+
            '<a class="btn-lar" href="'+buyUrl+'" id="buyslim" data-v="47">Ver o Mapa da Aprovação: R$ 47</a>'+
            '<div class="price">Pix ou cartão, acesso na hora.</div>'+
          '</div>'+
        '</section>'+

        '<section class="vsec larga" id="oferta">'+
          '<div class="eyebrow">Continue de onde este diagnóstico parou</div>'+
          '<h2 class="grande">'+PRODUTO+'</h2>'+
          stackOferta()+
          provas()+
          bonusGuia()+
          porqueHoje()+
          '<div class="preco">'+
            '<div class="v">R$ 47 <span>no Pix · ou '+PARCELA+' no cartão ('+TOTAL_PARCELADO+')</span></div>'+
            '<a class="btn-lar grande" href="'+buyUrl+'" id="buy0" data-v="47">Quero descobrir exatamente o que corrigir: R$ 47</a>'+
            '<div class="micro2">pagamento único, sem mensalidade · acesso na hora, por 12 meses · garantia de 7 dias</div>'+
          '</div>'+
        '</section>'+

        '<section class="vsec larga centro">'+
          '<div class="eyebrow">Quem já fez</div>'+
          depoimentos()+
        '</section>'+
      '</div>';

    window.scrollTo(0,0);
    ligarCompra();
    marcarPasso('oferta');
    marcarPixel('VoltouAoResultado', { origem:'link-servidor' });
  }

  if(!tentarRestaurarPeloLink()) render();
  faixaDeVolta();
</script>
</body>
</html>
