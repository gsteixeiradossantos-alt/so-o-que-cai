<style>
  :root{
    --paper:#F3EEE4; --card:#FBF9F4; --ink:#231F1A; --muted2:#574F45; --muted:#8A8378;
    --line:#E4DBC9; --navy:#15212B; --ocre:#A65D1E; --ocre2:#C77A2B; --green:#3A7A5C;
    --red:#C0271A; --red2:#E8B4AE; --red3:#8E1A10;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--paper);color:var(--ink);font-family:'Hanken Grotesk',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:40px 22px 64px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
  .logo{display:flex;align-items:center}
  .logo svg{display:block;border-radius:8px}
  .word{font-family:'Spectral',serif;font-weight:600;font-size:21px}
  .tag{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  h1{font-family:'Spectral',serif;font-weight:600;font-size:27px;line-height:1.18;letter-spacing:-.01em;margin-bottom:12px}
  h1 em{font-style:italic;color:var(--ocre)}
  .lead{font-size:16px;color:var(--muted2);margin-bottom:8px}
  .prog{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
  .clock{display:inline-flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;font-size:11px;color:var(--muted2)}
  .clock i{width:7px;height:7px;border-radius:50%;background:var(--ocre);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
  /* Cronômetro regressivo. Era um relógio crescente de 11px escondido na barra de
     progresso: sumia na tela. Agora é o elemento mais visível da questão, porque a
     pressão do relógio é metade do que este teste mede. */
  .timer{text-align:center;margin-bottom:16px}
  .timer .num{font-family:'Space Mono',monospace;font-weight:700;font-size:40px;line-height:1;
    color:var(--red);font-variant-numeric:tabular-nums;display:inline-block;
    transition:transform .18s ease}
  .timer .bar{height:6px;border-radius:3px;background:var(--red2);overflow:hidden;margin-top:10px}
  .timer .bar i{display:block;height:100%;background:var(--red);border-radius:3px;
    width:100%;transform-origin:left center}
  /* Últimos 10s. Escala por transform e NÃO por font-size, para não empurrar o layout
     e fazer a questão pular embaixo do dedo da pessoa.
     Batida própria, e não o @keyframes pulse do pontinho: aquele vai a opacidade .2,
     e num número de 40px isso lê como "apagando", que é o oposto de urgência. Aqui a
     opacidade fica cheia e quem pulsa é a escala, como batimento. */
  @keyframes tictac{0%,100%{transform:scale(1.08)}50%{transform:scale(1.26)}}
  .timer.urgente .num{transform:scale(1.15);animation:tictac .9s infinite}
  .timer.urgente .bar i{background:var(--red3)}
  .timer .rule{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--muted);margin-top:8px}
  /* Progresso. Antes era uma linha cinza de 9,5px embaixo de um número vermelho de 40px:
     sumia. Só que saber que falta pouco é justamente o que segura quem cansa na quinta
     questão, e quem desiste no meio não vira lead. Os sete traços dizem isso sem texto. */
  /* Bloco de confiança. O lead do funil B vem do anúncio direto para o quiz e NUNCA
     passa pela landing: ele clica em pagar sem ter visto depoimento, garantia nem quem
     está por trás. Tudo isso já existe, a um bloco de distância, e não estava sendo
     trazido. Vai ANTES da oferta, porque confiança vem antes do pedido de dinheiro. */
  .confia{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:20px}
  .confia .autor{margin-top:0;background:none;border:none;padding:0;border-radius:0}
  .confia .dep{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted2);line-height:1.55}
  .confia .dep .quem{display:block;margin-top:7px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .confia .gar{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted2);line-height:1.55}
  .confia .gar b{color:var(--green)}
  /* Tabela de custo, duas colunas. A esquerda é longa e cara, a direita é curta e barata:
     a assimetria é o argumento, e ela lê num segundo, o que nenhum parágrafo consegue. */
  .custo{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .custo .lin{display:grid;grid-template-columns:1fr 1fr}
  .custo .lin+.lin{border-top:1px solid var(--line)}
  .custo .lin>div{padding:11px 13px;font-size:13.5px;line-height:1.42}
  .custo .lin>div:first-child{border-right:1px solid var(--line);color:var(--muted2)}
  .custo .lin>div:last-child{color:var(--ink);font-weight:500}
  .custo .cab>div{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.08em;
    text-transform:uppercase;padding:9px 13px;font-weight:700}
  .custo .cab>div:first-child{background:#F7E8E5;color:var(--red3)}
  .custo .cab>div:last-child{background:#E9F1EA;color:var(--green)}
  /* CTA enxuto logo depois do veredito. O preço só aparecia no 6º bloco de 7. */
  .ctaslim{margin:18px 0 6px}
  .ctaslim .price{font-family:'Space Mono',monospace;font-size:11.5px;color:var(--muted);margin-top:8px;text-align:center}
  .timer .prog7{display:flex;gap:4px;justify-content:center;margin-bottom:9px}
  .timer .prog7 i{width:18px;height:3px;border-radius:2px;background:var(--line)}
  .timer .prog7 i.ok{background:var(--ink)}
  .timer .conta{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--ink);margin-bottom:6px}
  /* Cor sozinha não pode carregar o sinal, por daltonismo: o tamanho, a barra drenando
     e o próprio número já carregam em paralelo. Aqui só se desliga o movimento. */
  @media (prefers-reduced-motion: reduce){
    .timer.urgente .num{animation:none}
    .clock i{animation:none}
  }
  .qbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px}
  .qmat{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ocre);margin-bottom:8px}
  .qtext{font-size:18px;font-weight:500;line-height:1.4;margin-bottom:18px}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:9px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;transition:.12s}
  .opt:hover{border-color:var(--ocre2)}
  .opt.sel{border-color:var(--ocre);background:#FBF1E6}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--navy);color:#fff;border:none;border-radius:12px;padding:14px 22px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;transition:.15s}
  .btn:hover{background:#0d161d}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .btn.full{width:100%}
  .back{background:none;border:none;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;margin-top:14px;padding:4px}
  .autor{display:flex;align-items:flex-start;gap:13px;margin-top:20px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px}
  .autor img{border-radius:50%;flex-shrink:0;object-fit:cover}
  .autor p{font-size:13.5px;color:var(--muted2);line-height:1.5}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:13.5px;color:var(--muted2);margin-bottom:5px}
  .field input{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;font:inherit;font-size:16px;color:var(--ink)}
  .field input:focus{outline:none;border-color:var(--ocre)}
  .small{font-size:12.5px;color:var(--muted);margin-top:10px}
  /* resultado */
  .verdict{border-radius:16px;padding:20px;margin:6px 0 18px;border:1px solid var(--line)}
  .verdict.ochre{background:#FBF1E6;border-color:#E7CFA8}
  .verdict.mixed{background:#F1ECE0}
  .verdict.green{background:#E9F1EA;border-color:#BFD8C4}
  .verdict .k{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);margin-bottom:6px}
  .verdict h2{font-family:'Spectral',serif;font-weight:600;font-size:22px;margin-bottom:8px}
  .verdict p{font-size:15px;color:var(--muted2)}
  .plot{position:relative;width:100%;max-width:280px;margin:0 auto 18px;aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:14px}
  .plot .vline,.plot .hline{position:absolute;background:var(--line)}
  .plot .vline{left:50%;top:8%;bottom:8%;width:1.5px}
  .plot .hline{top:50%;left:8%;right:8%;height:1.5px}
  .plot .ql{position:absolute;font-size:9.5px;color:var(--muted);font-family:'Space Mono',monospace;letter-spacing:.03em;max-width:42%}
  .plot .tl{top:8px;left:10px}.plot .tr{top:8px;right:10px;text-align:right}
  .plot .bl{bottom:8px;left:10px}.plot .br{bottom:8px;right:10px;text-align:right}
  .plot .you{position:absolute;transform:translate(-50%,-50%)}
  .plot .dot{width:15px;height:15px;border-radius:50%;background:var(--ocre);box-shadow:0 0 0 5px rgba(166,93,30,.18)}
  .plot .ylab{font-size:9.5px}
  .center{text-align:center}
  .offer{background:var(--navy);color:#fff;border-radius:16px;padding:24px 20px;margin-top:8px;text-align:center}
  .offer h3{font-family:'Spectral',serif;font-weight:600;font-size:21px;margin-bottom:8px;color:#fff}
  .offer p{font-size:14.5px;color:#C9C1B4;margin-bottom:16px}
  .offer .price{font-family:'Space Mono',monospace;font-size:13px;color:#E7CFA8;margin-top:12px}
  .offer .btn{background:var(--ocre);}
  .offer .btn:hover{background:#8c4d18}
  .offer .alt{display:inline-block;margin-top:14px;font-size:13px;color:#C9C1B4;text-decoration:underline;cursor:pointer}
  .offer .alt:hover{color:#fff}
  .foot{margin-top:28px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5}
  /* gabarito comentado (amostra do relatório pago) */
  .gab{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:0 0 18px}
  .gab .k{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin-bottom:8px}
  .gab .q{font-size:15px;font-weight:500;margin-bottom:10px}
  .gab .alt{font-size:14px;padding:9px 11px;border-radius:9px;margin-bottom:6px;border:1px solid var(--line);color:var(--muted2)}
  .gab .alt.certa{background:#E9F1EA;border-color:#BFD8C4;color:var(--ink);font-weight:500}
  .gab .alt.sua{border-color:#D9A05B;background:#FBF1E6}
  .gab .exp{font-size:14px;color:var(--muted2);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .gab .exp b{color:var(--ink)}
  /* bloco trancado (teaser do diagnóstico completo): o TÓPICO fica legível
     para dar curiosidade; só a RESPOSTA é rasurada. */
  .lockbox{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:18px;background:var(--card)}
  .lockbox .head{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);padding:14px 20px 4px}
  .lockbox .inner{padding:6px 20px 16px}
  .lockbox .row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line)}
  .lockbox .row:last-child{border-bottom:none}
  .lockbox .row .t{color:var(--ink)}
  /* O que as 5 questões já mostraram sai legível e verdadeiro. O que depende das
     24 vira barra opaca: sem texto por baixo, não há valor falso nem screenshot
     para comparar com o do colega. */
  .lockbox .val{color:var(--ink);white-space:nowrap;font-weight:600;font-size:13.5px;text-align:right}
  .lockbox .val.trava{display:inline-block;width:88px;height:10px;border-radius:5px;background:var(--muted2);opacity:.3;font-size:0}
  .lockbox .cta{font-size:12px;color:var(--muted);padding:0 20px 14px}
</style>

<script>
  // ===== CONFIGURAR =====
  var CHECKOUT_URL = "https://pay.hotmart.com/B106546831I?checkoutMode=10"; // diagnóstico completo R$47 + Order Bump Kit Reta Final
  var CHECKOUT_COMPLETO = "https://pay.hotmart.com/O106944368L?checkoutMode=10"; // Plano Completo R$127 (inclui o diagnóstico)
  // Para onde enviar os leads (nome/e-mail/WhatsApp). Cole aqui um endpoint de formulário
  // (ex.: Formspree, um Apps Script do Google, ou a API da sua ferramenta de e-mail).
  // Enquanto estiver vazio, o lead é só guardado no navegador (localStorage) e nada é perdido,
  // mas você precisa ligar isto para receber os contatos de verdade.
  var CAPTURE_URL = "https://formspree.io/f/mlgyzdwj"; // Formspree: so o aviso por e-mail
  var BASE_URL = "https://so-o-que-cai-app.vercel.app/api/lead"; // fonte de verdade do lead
  // ======================

  // 7 questões de conteúdo, TODAS difíceis, uma por matéria do núcleo duro
  // (Ética entra duas vezes porque é a maior fatia da prova) + 3 cenários
  // psicotécnicos.
  // Por que só difíceis: com questão de padrão médio todo mundo acertava 3 de 5,
  // batia o corte e recebia "chega bem nos dois". Em 02/08/2026, 9 de 9 pessoas
  // caíram no mesmo quadrante verde, incluindo quem já reprovou duas vezes. Uma
  // amostra que não consegue reprovar ninguém não mede nada e ainda alivia quem
  // deveria sair incomodado.
  // Critério de escolha, e agora é um só: TODAS são pegadinha de troca de palavra,
  // aquelas em que uma palavra vira o sentido inteiro. Saíram as que dependiam de
  // norma recente (EC 131/2023 e pacote anticrime), porque ali o erro é material
  // desatualizado, não a distinção que separa quem sabe de quem decorou.
  // O mapa das palavras: incompatibilidade x impedimento · voto direto x obrigatório ·
  // pretensão x direito · interrompe x suspende · culpabilidade x dolo · depois x antes
  // da denúncia · mesmo autorizado pelo cliente.
  // As questões vindas do banco do produto foram revisadas contra fontes primárias
  // em 04/07/2026. Cada 'exp' NOMEIA a palavra trocada, porque é ela que vende.
  // 'fatia' = peso aproximado da matéria na prova.
  var CONTENT = [
    {mat:'Ética', fatia:'8 das 80 questões, a maior fatia da prova', dif:true, q:'Um militar da ativa foi aprovado no Exame de Ordem. Sobre o exercício da advocacia, ele:', exp:'<b>Por que a C é a certa:</b> militar da ativa é caso de incompatibilidade, não de impedimento (art. 28, V, do Estatuto da Advocacia). A diferença cai muito: impedimento proíbe advogar contra certas partes, incompatibilidade proíbe advogar em qualquer hipótese, inclusive em causa própria e fora do horário de serviço.', o:['Pode advogar livremente, desde que fora do horário de serviço.','Está impedido: só não pode advogar contra a Fazenda Pública que o remunera.','Está incompatibilizado: não pode exercer a advocacia enquanto estiver na ativa, nem em causa própria.','Pode advogar apenas em causas da Justiça Militar.'], c:2},
    {mat:'Constitucional', fatia:'6 a 7 das 80 questões', dif:true, q:'Proposta de emenda constitucional pretende tornar o voto facultativo no Brasil. A proposta:', exp:'<b>Por que a C é a certa:</b> a cláusula pétrea do art. 60, § 4º, II, protege o voto <b>direto, secreto, universal e periódico</b>. A obrigatoriedade não está nessa lista: ela mora no art. 14, § 1º, e pode ser suprimida por emenda. A alternativa A troca uma palavra da lista por outra que não está nela, e é só isso que separa quem sabe de quem decorou.', o:['É inconstitucional, pois o voto obrigatório é cláusula pétrea.','É inconstitucional, pois matéria eleitoral não admite emenda.','É constitucional, pois a cláusula pétrea protege o voto direto, secreto, universal e periódico, e não a sua obrigatoriedade.','Só seria válida se aprovada também por referendo popular.'], c:2},
    {mat:'Civil', fatia:'7 das 80 questões', dif:true, q:'Sobre prescrição e decadência, é correto que:', exp:'<b>Por que a B é a certa:</b> violado o direito, nasce a pretensão, e é ela que a prescrição extingue (art. 189 do Código Civil). O direito em si continua existindo, tanto que a dívida prescrita paga não se repete. A decadência é outra coisa: atinge o próprio direito potestativo, aquele que se exerce por prazo certo.', o:['A prescrição atinge o próprio direito.','A prescrição extingue a pretensão.','A decadência extingue a pretensão.','Prescrição e decadência são sinônimos.'], c:1},
    {mat:'Processo Civil', fatia:'6 a 7 das 80 questões', dif:true, q:'Publicada sentença omissa quanto a um dos pedidos, General Cargas opôs embargos de declaração. Quanto ao prazo dos demais recursos:', exp:'<b>Por que a D é a certa:</b> os embargos de declaração <b>interrompem</b> o prazo recursal para as duas partes, e interromper significa que o prazo recomeça do zero depois do julgamento (CPC, arts. 1.023 e 1.026). A alternativa A troca interromper por suspender, que devolveria só o saldo. Essa troca é uma das que mais derruba gente, e derruba advogado também: é perda de prazo real.', o:['Fica suspenso, voltando a correr pelo restante após o julgamento.','Continua correndo, pois os embargos não interferem em outros prazos.','Fica suspenso apenas para a parte embargante.','Fica interrompido para ambas as partes, reiniciando por inteiro após a publicação do julgamento dos embargos.'], c:3},
    {mat:'Penal', fatia:'5 a 6 das 80 questões', dif:true, q:'Criado em comunidade isolada onde a prática era tida como lícita, Josué praticou conduta típica sem qualquer possibilidade de conhecer sua ilicitude, o que ficou provado. Josué:', exp:'<b>Por que a A é a certa:</b> erro de proibição inevitável isenta de pena; se fosse evitável, apenas diminuiria de um sexto a um terço (CP, art. 21). O erro clássico está na D: erro de proibição atua na <b>culpabilidade</b> e o dolo permanece inteiro. Quem exclui o dolo está confundindo com erro de tipo (art. 20), que é outra figura.', o:['Fica isento de pena, pois o erro de proibição inevitável exclui a culpabilidade.','Responde pelo crime com pena reduzida de um sexto a um terço.','Responde normalmente, pois ninguém se escusa de cumprir a lei.','Tem excluído o dolo, respondendo por culpa.'], c:0},
    {mat:'Processo Penal', fatia:'5 a 6 das 80 questões', dif:true, q:'Vítima de crime de ação penal pública condicionada, Sula ofereceu representação, mas se arrependeu. Quanto à retratação:', exp:'<b>Por que a D é a certa:</b> a representação só se torna irretratável <b>depois de oferecida a denúncia</b> (CPP, art. 25). Antes desse marco a vítima pode se retratar validamente. A alternativa A troca "denúncia" por "boletim de ocorrência" e a B por "trânsito em julgado". Um marco temporal trocado e a questão inteira cai.', o:['É vedada após o registro do boletim de ocorrência.','É possível a qualquer tempo, até o trânsito em julgado.','Depende de homologação judicial com oitiva do investigado.','É admitida somente até o oferecimento da denúncia.'], c:3},

  ];
  // Parte 2: psicotécnico indireto. Cenários de OUTRO domínio (trânsito, prazo,
  // memória em público) que revelam congelamento/afobação/controle sem perguntar
  // "você é ansioso?" — ninguém se declara ansioso. Cada opção carrega a pontuação.
  // 'leit' = leitura do resultado por pontuação (0/1/2): traduz o cenário de
  // volta para a prova, sem rotular ninguém de "ansioso" — mostra o comportamento.
  var BEHAVIOR = [
    {q:'Você está dirigindo num trevo desconhecido, o GPS trava e os carros atrás começam a buzinar. O que acontece primeiro?',
     o:[['Sigo por qualquer saída, só para não ficar parado ali',1],['Dou uma travada de alguns segundos antes de conseguir decidir',0],['Encosto onde dá e decido o caminho com calma',2]],
     leit:{0:'No trevo, você travou antes de decidir. Na prova, esse é o perfil que dá branco numa questão difícil e perde o ritmo nas três seguintes.',1:'No trevo, você seguiu por qualquer saída para escapar da pressão. Na prova, é quem marca sem reler o enunciado e cai na alternativa que parece certa.',2:'No trevo, você parou e escolheu com calma: você decide bem debaixo de buzina.'}},
    {q:'Faltando 20 minutos para entregar algo importante, você percebe um erro numa parte que já estava pronta.',
     o:[['Corrijo o essencial e entrego no prazo',2],['Tento refazer tudo e por pouco não estouro o prazo',0],['Entrego como está e passo o resto do dia remoendo',1]],
     leit:{0:'Com o prazo estourando, você tentou refazer tudo. Na prova, é quem empaca numa questão e chega sem tempo nas dez últimas.',1:'Você entregou, mas ficou remoendo. Na prova, é quem carrega a questão anterior na cabeça e erra a seguinte por distração.',2:'Com o prazo apertado, você priorizou e entregou: sua gestão de tempo funciona sob pressão.'}},
    {q:'Na frente de outras pessoas, te pedem um dado que você sabe de cor.',
     o:[['Vem na hora, normal',2],['Às vezes dá branco na hora, e a resposta aparece depois, sozinho',0],['Peço um segundo e a resposta vem',1]],
     leit:{0:'O dado que você sabe de cor não saiu na hora, na frente dos outros. É o branco clássico: o problema não é saber, é acessar sob observação. E a prova inteira é sob observação.',1:'Você pediu um segundo e a resposta veio: você acessa a memória sob pressão, pagando um pequeno preço em tempo.',2:'A resposta veio na hora, mesmo com plateia: memória estável sob observação.'}}
  ];

  // Segundos por questão. Único lugar para mexer. 40 porque ler quatro alternativas
  // de pegadinha com atenção consome 25 a 30, e o que sobra é a hesitação, que é
  // justamente o que este teste quer medir.
  var LIMITE = 40;

  var S = { screen:'intro', ci:0, ans:{}, times:{}, estourou:{}, fora:{}, bi:0, beh:{},
            nome:'', email:'', tel:'', momento:'' };

  // Em que ponto da caminhada a pessoa está. Serve para saber quem o anúncio traz
  // (bacharel de primeira prova, reprovado, quem ainda está na faculdade) e para
  // calibrar a leitura do resultado. Uma escolha só, obrigatória.
  var MOMENTO = [
    'Ainda estou na faculdade',
    'Já me formei e vou fazer a minha primeira prova',
    'Já fiz a prova uma vez e não passei',
    'Já fiz duas ou mais vezes e não passei',
    'Só estou olhando, por curiosidade'
  ];
  var app = document.getElementById('app');
  var esc = function(s){ return String(s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); };

  function render(){
    if(S.screen==='intro') return intro();
    if(S.screen==='content') return content();
    if(S.screen==='behavior') return behavior();
    if(S.screen==='form') return form();
    if(S.screen==='result') return result();
  }

  function intro(){
    app.innerHTML =
      '<h1>Em 4 minutos, descubra <em>onde</em> você perde ponto na 1ª fase.</h1>'+
      '<p class="lead">Existem dois jeitos de reprovar: não saber a matéria, e saber e travar na hora. Este mini-diagnóstico separa os dois e te diz qual está te derrubando.</p>'+
      // A regra aparece uma vez, seca, e SÓ a regra. A versão anterior empilhava sete
      // informações antes do botão, todas de restrição, no exato segundo em que a pessoa
      // decide se começa. Saiu também o "todas são pegadinha": tempo é regra de jogo e
      // precisa ser anunciado, dificuldade é o teste, e teste não se anuncia, senão a
      // pessoa sai com a desculpa pronta de que errou porque era pegadinha.
      // A página não explica e não defende o relógio: justificar abre a porta para
      // "na prova eu teria mais tempo", que anula a dor.
      '<p class="lead" style="margin-bottom:22px">São '+CONTENT.length+' questões, uma de cada matéria que decide a prova. <b style="color:var(--red)">Você tem '+LIMITE+' segundos em cada uma</b>: passou o tempo, a questão passa. Fora desta aba, o relógio corre em dobro.</p>'+
      '<button class="btn full" id="go">Começar o mini-diagnóstico</button>';
    document.getElementById('go').onclick = function(){ S.screen='content'; render(); window.scrollTo(0,0); };
  }

  // Desliga relógio e ouvintes de aba. Chamada em toda saída da Parte 1, senão o
  // ouvinte da questão anterior continua vivo e debita tempo na questão errada.
  function pararRelogio(){
    if(window._clk){ clearInterval(window._clk); window._clk=null; }
    if(window._vis){ document.removeEventListener('visibilitychange', window._vis); window._vis=null; }
    if(window._sai){ window.removeEventListener('blur', window._sai); window._sai=null; }
    if(window._volta){ window.removeEventListener('focus', window._volta); window._volta=null; }
  }

  function content(){
    pararRelogio();
    var i=S.ci, Q=CONTENT[i];
    var dots=''; for(var d=0;d<CONTENT.length;d++) dots+='<i class="'+(d<=i?'ok':'')+'"></i>';
    app.innerHTML =
      '<div class="timer" id="tmr">'+
        '<div class="prog7">'+dots+'</div>'+
        '<div class="conta">Questão '+(i+1)+' de '+CONTENT.length+'</div>'+
        '<div class="num" id="clk">'+LIMITE+'</div>'+
        '<div class="bar"><i id="clkbar"></i></div>'+
        '<div class="rule">'+esc(Q.mat)+'</div>'+
      '</div>'+
      '<div class="qbox"><div class="qtext">'+esc(Q.q)+'</div>'+
      Q.o.map(function(op,j){ return '<button class="opt" data-j="'+j+'">'+esc(op)+'</button>'; }).join('')+
      '</div>';
    // NÃO existe "Voltar" na Parte 1. Com questão cronometrada, voltar seria a brecha:
    // deixa estourar, volta e responde com 40 segundos novos.

    S.qStart=Date.now();
    S.qGasto=0;          // segundos debitados a mais por ausência (a 2ª contagem do dobro)
    S.foraDesde=null;
    if(S.fora[i]==null) S.fora[i]=0;
    var encerrada=false;

    // O tempo consumido SEMPRE sai de Date.now(), nunca de acumulador de tique.
    // Navegador de celular suspende setInterval em aba de fundo, então um contador
    // por tique congelaria justamente para quem saiu da aba para pesquisar: a defesa
    // viraria a brecha. O setInterval abaixo só pinta a tela.
    function consumido(){ return (Date.now()-S.qStart)/1000 + S.qGasto; }

    function sair(){ if(S.foraDesde==null) S.foraDesde=Date.now(); }
    function voltar(){
      if(S.foraDesde==null) return;
      var ausente=(Date.now()-S.foraDesde)/1000; S.foraDesde=null;
      // Fora da aba o relógio corre em dobro. O Date.now() já contou a primeira vez;
      // aqui se debita a segunda.
      S.fora[i]+=ausente; S.qGasto+=ausente;
      pintar();
    }

    function pintar(){
      var el=document.getElementById('clk'), bar=document.getElementById('clkbar'), box=document.getElementById('tmr');
      if(!el) return;
      var resta=Math.max(0, LIMITE-consumido());
      el.textContent=Math.ceil(resta);
      if(bar) bar.style.transform='scaleX('+(resta/LIMITE)+')';
      if(box){ if(resta<=10) box.classList.add('urgente'); else box.classList.remove('urgente'); }
      if(resta<=0) estourar();
    }

    function fechar(){ encerrada=true; pararRelogio(); }

    function avancar(){
      if(i+1<CONTENT.length){ S.ci=i+1; } else { S.screen='behavior'; S.bi=0; }
      render(); window.scrollTo(0,0);
    }

    function estourar(){
      if(encerrada) return;
      fechar();
      S.estourou[i]=true;
      S.times[i]=LIMITE;
      S.ans[i]=null;               // não respondeu: não é a mesma coisa que errar
      avancar();
    }

    window._vis=function(){ if(document.hidden) sair(); else voltar(); };
    window._sai=sair; window._volta=voltar;
    document.addEventListener('visibilitychange', window._vis);
    window.addEventListener('blur', window._sai);
    window.addEventListener('focus', window._volta);
    window._clk=setInterval(pintar,200);
    pintar();

    Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(b){
      b.onclick = function(){
        if(encerrada) return;
        fechar();
        b.classList.add('sel');
        S.ans[i]=parseInt(b.getAttribute('data-j'),10);
        S.times[i]=Math.max(1, Math.min(LIMITE, Math.round(consumido())));
        setTimeout(avancar, 160);
      };
    });
  }

  function behavior(){
    pararRelogio();
    var i=S.bi, sel=S.beh[i], B=BEHAVIOR[i];
    app.innerHTML =
      '<div class="prog">Parte 2 · situação '+(i+1)+' de '+BEHAVIOR.length+'</div>'+
      '<div class="qbox"><div class="qmat">No dia a dia</div><div class="qtext">'+esc(B.q)+'</div>'+
      B.o.map(function(op,j){ return '<button class="opt'+(sel===j?' sel':'')+'" data-j="'+j+'">'+esc(op[0])+'</button>'; }).join('')+
      '</div>'+
      // O "Voltar" só anda dentro da Parte 2. Voltar para a Parte 1 daria 40 segundos
      // novos numa questão já vencida, que é a mesma brecha do voltar da Parte 1.
      (i>0?'<button class="back" id="back">Voltar</button>':'');
    Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(b){
      b.onclick = function(){
        S.beh[i] = parseInt(b.getAttribute('data-j'),10);
        setTimeout(function(){
          if(i+1<BEHAVIOR.length){ S.bi=i+1; render(); }
          else { S.screen='form'; render(); }
          window.scrollTo(0,0);
        }, 160);
      };
    });
    if(i>0) document.getElementById('back').onclick = function(){ S.bi=i-1; render(); };
  }

  function form(){
    app.innerHTML =
      // "Pra onde mando o seu resultado" prometia envio e o resultado aparece na tela,
      // não é mandado. Promessa que não se cumpre no segundo seguinte custa confiança
      // justamente no degrau em que se pede o telefone. E saiu o "mapa": ninguém no
      // primeiro contato sabe o que é isso.
      '<div class="prog">Terminou</div>'+
      '<h1 style="font-size:23px">Seu resultado está pronto.</h1>'+
      '<p class="lead" style="margin-bottom:18px">Só falta saber quem é você. Ele aparece na próxima tela.</p>'+
      '<div class="field"><label>Onde você está hoje</label>'+
        MOMENTO.map(function(op){ return '<button class="opt'+(S.momento===op?' sel':'')+'" data-m="'+esc(op)+'">'+esc(op)+'</button>'; }).join('')+
      '</div>'+
      '<div class="field"><label>Seu nome</label><input id="f_nome" type="text" placeholder="Como você se chama" value="'+esc(S.nome)+'"></div>'+
      '<div class="field"><label>Seu WhatsApp (com DDD)</label><input id="f_tel" type="tel" inputmode="numeric" placeholder="(00) 00000-0000" value="'+esc(S.tel)+'"></div>'+
      '<div class="field"><label>Seu e-mail (opcional)</label><input id="f_email" type="email" placeholder="seu@email.com" value="'+esc(S.email)+'"></div>'+
      '<button class="btn full" id="see">Ver o meu resultado</button>'+
      '<div class="small">É grátis e sem spam. Você pode sair quando quiser.</div>';
    // Marcar a opção NÃO re-renderiza o formulário. Antes chamava render(), que refazia a
    // tela inteira e jogava a rolagem para o topo no celular, no último degrau antes do
    // lead. Aqui só troca a classe.
    var opts=app.querySelectorAll('.opt');
    Array.prototype.forEach.call(opts, function(b){
      b.onclick = function(){
        S.momento = b.getAttribute('data-m');
        Array.prototype.forEach.call(opts, function(x){ x.classList.remove('sel'); });
        b.classList.add('sel');
      };
    });
    document.getElementById('see').onclick = function(){
      var nome=document.getElementById('f_nome').value.trim();
      var email=document.getElementById('f_email').value.trim();
      var tel=document.getElementById('f_tel').value.trim();
      var digits=tel.replace(/\D/g,'');
      if(!S.momento){ alert('Marque onde você está hoje para ver o resultado.'); return; }
      if(!nome || digits.length<10){ alert('Preencha o nome e um WhatsApp válido com DDD para ver o resultado.'); return; }
      if(email && !/.+@.+\..+/.test(email)){ alert('O e-mail parece inválido — corrija ou deixe em branco.'); return; }
      S.nome=nome; S.email=email; S.tel=tel;
      saveLead();
      S.screen='result'; render(); window.scrollTo(0,0);
    };
  }

  function saveLead(){
    var lead={ nome:S.nome, email:S.email, tel:S.tel, momento:S.momento, ans:S.ans, beh:S.beh, ts:new Date().toISOString() };
    try{ var all=JSON.parse(localStorage.getItem('soqc_leads')||'[]'); all.push(lead); localStorage.setItem('soqc_leads', JSON.stringify(all)); }catch(e){}

    // O mesmo resultado que a pessoa vê vai junto no e-mail do lead. Sem isso
    // chega só um nome e um telefone, e não dá para saber quem o anúncio trouxe.
    var R = compute();
    var Q = quadrant(R.X, R.Y, R);
    var conta = {}, ordem = [];
    CONTENT.forEach(function(qq,i){
      if(S.ans[i]!==qq.c){ if(!conta[qq.mat]){ conta[qq.mat]=0; ordem.push(qq.mat); } conta[qq.mat]++; }
    });
    var erradas = ordem.map(function(m){ return conta[m]>1 ? m+' ('+conta[m]+')' : m; });
    var tsoma = 0, tn = 0;
    CONTENT.forEach(function(_,i){ if(S.times[i]!=null){ tsoma += S.times[i]; tn++; } });

    // Mediana, a mesma que alimenta o eixo de pressão: o número gravado na base
    // tem que ser o mesmo que a pessoa viu na tela, senão a análise não fecha.
    var tmed = tempoMedio();
    var errouEm = erradas.length ? erradas.join(', ') : 'nenhuma';
    var q = new URLSearchParams(location.search);

    // Marca o Lead no pixel. Só roda depois que o lead foi guardado de verdade:
    // disparar antes faz a Meta contar gente que a gente perdeu no caminho.
    function marcarPixel(){
      if(typeof fbq==='undefined') return;
      try{
        // Advanced matching: melhora o EMQ do pixel (a Meta faz o hash sozinha).
        var am={};
        if(S.email) am.em=S.email.trim().toLowerCase();
        var d=S.tel.replace(/\D/g,''); if(d) am.ph='55'+d;
        fbq('init','1024990753668044',am);
        fbq('track','Lead');
      }catch(e){}
    }

    // 1) Base própria (Supabase, via /api/lead na Vercel). É a fonte de verdade:
    //    não tem teto mensal e permite cruzar lead contra venda depois.
    var naBase = fetch(BASE_URL, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        nome:S.nome, telefone:S.tel, email:S.email, momento:S.momento,
        acertos:R.c, total_questoes:CONTENT.length,
        eixo_conteudo:R.X, eixo_pressao:R.Y, perfil:Q.lab,
        errou_em:errouEm, tempo_medio:tmed,
        utm_campaign:q.get('utm_campaign'), utm_content:q.get('utm_content'),
        referrer:document.referrer || null
      })
    }).then(function(r){ return r.ok; }).catch(function(){ return false; });

    // 2) Formspree segue como aviso por e-mail, em paralelo. Se um falhar, o outro salva.
    var noEmail = CAPTURE_URL ? fetch(CAPTURE_URL,{
      method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify({ nome:S.nome, email:S.email, telefone:S.tel, momento:S.momento,
        acertos: R.c + ' de ' + CONTENT.length,
        eixo_conteudo: R.X + '%',
        eixo_pressao: R.Y + '%',
        perfil: Q.lab,
        errou_em: errouEm,
        tempo_medio: tmed != null ? tmed + 's por questão' : 'sem registro',
        quando:lead.ts, _subject:'Novo lead do mini-diagnostico Só o que Cai' })
    }).then(function(r){ return r.ok; }).catch(function(){ return false; }) : Promise.resolve(false);

    Promise.all([naBase, noEmail]).then(function(ok){
      if(ok[0] || ok[1]) return marcarPixel();
      // Os dois falharam: tenta a base mais uma vez antes de desistir.
      return fetch(BASE_URL, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ nome:S.nome, telefone:S.tel, email:S.email, momento:S.momento })
      }).then(function(r){ if(r.ok) marcarPixel(); }).catch(function(){});
    });
  }

  // ===== EIXO DE PRESSÃO =====
  // Refeito em 02/08/2026. A versão anterior era 70% relógio + 30% autorrelato, e o 100
  // continuava fácil por dois motivos: o autorrelato tem uma alternativa obviamente
  // "certa" em cada cenário, e a faixa boa do relógio era um platô de 15 segundos, que é
  // exatamente onde cai quem lê com atenção. Resultado: não separava ninguém de ninguém.
  // Agora são quatro componentes, e 85% deles são MEDIDOS, não declarados.

  // 1) DECISÃO. Tempo cruzado com acerto, por questão. O tempo sozinho mentia: quem passa
  // por 7 questões a 25 segundos e acerta 3 não decidiu bem, chutou num ritmo confortável.
  function notaDecisao(t, estourou, acertou){
    if(estourou) return 0;
    if(t==null) return null;
    if(t<10)  return acertou? 60 : 0;    // reflexo: acertar assim pode ser sorte; errar é chute
    if(t<18)  return acertou? 85 : 15;   // rápido para pegadinha
    if(t<=32) return acertou? 100: 35;   // leu, pesou e decidiu. Errar aqui é conteúdo, não pressão
    return      acertou? 70 : 25;        // chegou no limite do relógio
  }
  function decisoes(){
    var out=[];
    CONTENT.forEach(function(Q,i){
      var n=notaDecisao(S.times[i], S.estourou[i], S.ans[i]===Q.c);
      if(n!=null) out.push(n);
    });
    return out;
  }
  function notaDecisaoMedia(){
    var d=decisoes(); if(!d.length) return null;
    var s=0; d.forEach(function(x){ s+=x; });
    return Math.round(s/d.length);
  }

  // 2) CONSTÂNCIA. O que mede travar não é a média, é a oscilação. 20,22,19,21,20,23,20 e
  // 8,40,12,38,9,40,15 têm quase a mesma média e são duas pessoas completamente
  // diferentes: a segunda chuta em umas e congela em outras. Coeficiente de variação.
  function notaConstancia(){
    var ts=[]; CONTENT.forEach(function(_,i){ if(S.times[i]!=null) ts.push(S.times[i]); });
    if(ts.length<3) return null;
    var m=0; ts.forEach(function(t){ m+=t; }); m/=ts.length;
    if(m<=0) return 0;
    var v=0; ts.forEach(function(t){ v+=(t-m)*(t-m); }); v/=ts.length;
    var cv=Math.sqrt(v)/m;
    if(cv<=0.20) return 100;
    if(cv<=0.35) return 80;
    if(cv<=0.50) return 55;
    if(cv<=0.70) return 30;
    return 10;
  }

  // 3) RESISTÊNCIA. Na prova o que derruba é cair ao longo das 80. Aqui se compara as 3
  // últimas contra as 3 primeiras, pela nota de DECISÃO e não pelo tempo puro, porque a
  // queda aparece como mais erro E mais tempo ao mesmo tempo. É uma versão crua do "em
  // que ponto o seu rendimento cai" que o produto pago mede em 24 questões.
  function notaResistencia(){
    var d=decisoes(); if(d.length<6) return null;
    function med(a){ var s=0; a.forEach(function(x){ s+=x; }); return s/a.length; }
    var delta=med(d.slice(-3))-med(d.slice(0,3));
    // Faixas largas de propósito. Com 7 questões e 3 de cada lado, UM erro que por acaso
    // caiu no fim já move a média em ~33 pontos. Estreitar isso faria a página acusar
    // queda em quem só teve azar na ordem dos erros. Um erro tardio fica em 80 e não
    // dispara nada; dois erros tardios já é padrão, e aí sim.
    if(delta>=0)   return 100;   // não caiu, ou melhorou
    if(delta>=-25) return 80;
    if(delta>=-50) return 55;
    if(delta>=-75) return 30;
    return 10;
  }

  function tempoMedio(){
    var soma=0, n=0;
    CONTENT.forEach(function(_,i){ if(S.times[i]!=null){ soma+=S.times[i]; n++; } });
    return n? Math.round(soma/n) : null;
  }

  function estourouQuantas(){
    var n=0; CONTENT.forEach(function(_,i){ if(S.estourou[i]) n++; }); return n;
  }
  function segundosFora(){
    var s=0; CONTENT.forEach(function(_,i){ if(S.fora[i]) s+=S.fora[i]; }); return Math.round(s);
  }

  function compute(){
    // Questão estourada é ponto perdido no conteúdo, porque na prova questão não
    // respondida também é ponto perdido. No TEXTO ela nunca se mistura com erro.
    var c=0; CONTENT.forEach(function(Q,i){ if(S.ans[i]===Q.c) c++; });
    var X=Math.round(c/CONTENT.length*100);
    // 4) AUTORRELATO. Cai de 30% para 15% do eixo: em cada cenário existe uma
    // alternativa obviamente "certa", e era ela que segurava o eixo lá em cima.
    var bp=0; BEHAVIOR.forEach(function(B,i){ bp += (S.beh[i]!=null?B.o[S.beh[i]][1]:0); });
    var Yrel=Math.round(bp/(BEHAVIOR.length*2)*100);
    var dec=notaDecisaoMedia(), cons=notaConstancia(), res=notaResistencia();
    // 45 decisão + 20 constância + 20 resistência + 15 autorrelato. 85% medido.
    // Cada peso que falta (por falta de dado) é redistribuído entre os que sobraram,
    // para o eixo nunca sair menor só porque um componente não pôde ser calculado.
    var partes=[[dec,0.45],[cons,0.20],[res,0.20],[Yrel,0.15]];
    var soma=0, peso=0;
    partes.forEach(function(p){ if(p[0]!=null){ soma+=p[0]*p[1]; peso+=p[1]; } });
    var Y = peso? Math.round(soma/peso) : Yrel;
    return {X:X,Y:Y,c:c,Yrel:Yrel,dec:dec,cons:cons,res:res,tmed:tempoMedio(),
            estourou:estourouQuantas(), fora:segundosFora()};
  }

  // Os cortes. Eram 50 e 50, e com 5 questões de padrão médio isso fez 9 de 9 pessoas
  // caírem no verde em 02/08/2026, incluindo quem já reprovou duas vezes com 3 de 5.
  // Agora: as SETE, sem estouro de tempo, e 80 no eixo de pressão.
  // Por que o Y subiu de 70 para 80: com o X exigindo as sete, o Y virou o ÚNICO
  // separador entre perfis que gabaritaram, e a 70 ele não separava mais nada. A 80 ele
  // exige execução parelha e sem queda no fim, que é o que o eixo passou a medir.
  var CORTE_X=100, CORTE_Y=80;

  function jaReprovou(){
    return S.momento==='Já fiz a prova uma vez e não passei' ||
           S.momento==='Já fiz duas ou mais vezes e não passei';
  }
  function reprovouMais(){ return S.momento==='Já fiz duas ou mais vezes e não passei'; }

  // Dias até a 1ª fase. Urgência REAL, tirada do calendário, nunca inventada.
  // ATUALIZAR a cada edição do exame.
  var DATA_PROVA=new Date(2026,8,6); // 06/09/2026
  function diasParaProva(){
    var d=Math.ceil((DATA_PROVA-new Date())/86400000);
    return d>0? d : null;
  }
  function faltam(){
    var d=diasParaProva();
    return d? 'Faltam '+d+' dias para a prova. ' : '';
  }

  // Números do exame, confirmados pelo Gustavo em 02/08/2026. ATUALIZAR a cada edição:
  // a taxa muda e o intervalo entre exames também. Número errado aqui é caro, porque o
  // candidato sabe exatamente quanto pagou e quanto esperou.
  var TAXA_EXAME='R$350', ESPERA_EXAME='4 meses';

  // Parcelamento real do checkout, informado pelo Gustavo em 02/08/2026.
  // ATENÇÃO ao escrever qualquer texto com isso: 6 x 8,82 = R$52,92, ou seja, o
  // parcelado TEM juros. Nunca escrever "sem juros" ao lado. Substituiu a divisão por
  // dia, que era um número derivado por retórica; este é uma opção de pagamento de
  // verdade e faz o mesmo trabalho de deixar o valor pequeno.
  var PARCELA='6x de R$8,82';

  // A comparação de custo, em duas colunas. Esquerda longa e cara, direita curta e
  // barata: a assimetria é o argumento inteiro. Muda pelo MOMENTO da pessoa, porque o
  // que ela perde ao não agir é completamente diferente em cada um.
  // Recebe 'forte' porque a tabela não pode desmentir o veredito de quem acertou as 7:
  // para essa pessoa não existe "buraco de hoje" nem "saber se é a matéria" — o veredito
  // acabou de dizer que matéria ela tem. A linha que contradiz troca pela dúvida que as
  // 7 deixam em aberto, que é o único argumento honesto para esse perfil.
  function tabelaCusto(forte){
    var linhas;
    if(jaReprovou()){
      linhas=[
        ['Mais uma reprovação, pelo mesmo motivo de antes','O motivo, com nome, antes da próxima'],

          ? ['Repetir a mesma preparação, sem saber o que corrigir','Ver em que ponto o seu rendimento cede, com número']
          : ['Repetir a mesma preparação, sem saber o que corrigir','Saber se o que te derruba é a matéria ou a hora da prova']
      ];
    } else if(S.momento==='Já me formei e vou fazer a minha primeira prova'){
      linhas=[
        forte
          ? ['A primeira reprovação, que é a que instala a dúvida','Chegar sabendo que o seu acerto se sustenta']
          : ['A primeira reprovação, que é a que instala a dúvida','Chegar sabendo onde você perde ponto'],
        [TAXA_EXAME+' na inscrição do próximo exame','R$47, uma vez, ou '+PARCELA],
        [ESPERA_EXAME+' esperando a próxima chance','20 minutos'],

      ];
    } else if(S.momento==='Ainda estou na faculdade'){
      linhas=[
        forte
          ? ['Descobrir só no dia o que as 7 não alcançam','Medir isso antes, em 24 questões']
          : ['Chegar na prova com o mesmo buraco de hoje','Chegar com ele fechado'],
        [TAXA_EXAME+' na inscrição, e de novo se reprovar','R$47, uma vez, ou '+PARCELA],
        [ESPERA_EXAME+' entre um exame e o seguinte','20 minutos'],

      ];
    } else { return ''; }
    var html='<div class="custo"><div class="lin cab"><div>Se você não fizer nada</div><div>Se você olhar agora</div></div>';
    linhas.forEach(function(l){ html+='<div class="lin"><div>'+esc(l[0])+'</div><div>'+esc(l[1])+'</div></div>'; });
    return html+'</div>';
  }
  // Quantas a pessoa errou de verdade, sem contar as que o tempo estourou.
  function errosReais(){
    var n=0; CONTENT.forEach(function(Q,i){ if(!S.estourou[i] && S.ans[i]!==Q.c) n++; });
    return n;
  }

  // Nomeia a causa REAL da queda de pressão, em vez de listar possibilidades. A página
  // tem o dado; oferecer "ou isso, ou aquilo, ou aquilo outro" soa como chute e é o
  // oposto de diagnóstico.
  function causaPressao(r){
    if(!r) return 'o relógio te cobrou';
    if(r.estourou) return 'em '+r.estourou+(r.estourou>1?' questões o tempo acabou antes de você marcar':' questão o tempo acabou antes de você marcar');
    if(r.res!=null && r.res<=55) return 'o seu rendimento caiu nas três últimas em relação às três primeiras';
    if(r.cons!=null && r.cons<=55) return 'o seu ritmo oscilou demais de uma questão para outra';
    if(r.tmed!=null && r.tmed>=33) return 'você decidiu no limite do relógio, questão após questão';
    if(r.tmed!=null && r.tmed<10) return 'você decidiu rápido demais para quem está lendo questão difícil';
    return 'o relógio te cobrou';
  }

  function quadrant(X,Y,r){
    var hiX=X>=CORTE_X, hiY=Y>=CORTE_Y;
    var perdeu=errosReais()+estourouQuantas();
    // O quinto desfecho, e ele existe por um motivo só: quem já reprovou NUNCA sai
    // "apto". Acrescentar parágrafo não bastava, porque o rótulo verde continuava na
    // tela. Aqui o próprio veredito é interceptado, e a cor deixa de dizer "está tudo
    // bem". A contradição entre gabaritar e ter reprovado não é elogio: é o diagnóstico.
    // Cada desfecho termina numa CURIOSIDADE ESPECÍFICA, e ela não é enfeite: é o que
    // entrega o leitor para o bloco rasurado logo abaixo. A frase final aponta para uma
    // linha trancada do lockbox, então os dois respiram juntos em vez de repetir.
    if(hiX&&hiY&&jaReprovou()) return {cls:'ochre',forte:true,lab:'O seu problema não está no que estas 7 medem',txt:'Você acertou as sete, no tempo, sem consultar. E já prestou o exame sem passar. As duas coisas juntas dizem uma coisa só: a matéria das 6 que decidem a prova você tem. O que te derrubou estava fora do alcance destas 7 questões, e é por isso que você nunca achou sozinho. O que falta descobrir é em que ponto exatamente o seu rendimento cede, porque é ali que a sua prova é decidida.'};
    if(hiX&&hiY) return {cls:'green',forte:true,lab:'Você acertou as sete',txt:'Sete questões difíceis, todas certas, dentro do tempo. Você sabe a matéria que decide a prova. O que estas 7 não medem é a questão 40, com três horas de prova nas costas e a sala esvaziando ao seu redor: é ali que quem sabe começa a errar. E tem uma diferença que decide muita coisa: sete questões não acharem nada em você não é a mesma coisa que não existir nada.'};
    if(hiX&&!hiY) return {cls:'ochre',lab:'Você sabe a matéria. O problema é a hora da prova',txt:'Você acertou o que precisava acertar, e mesmo assim '+causaPressao(r)+'. Na prova isso não aparece como erro de matéria. Aparece como questão em branco nas dez últimas, com você sabendo a resposta. Estudar mais matéria não conserta isso, e por acaso é o único conselho que você recebe enquanto estiver pagando mensalidade. O que resolve é saber em que ponto da prova o seu rendimento cai, e em qual matéria ele cai primeiro.'};
    if(!hiX&&hiY) return {cls:'mixed',lab:'Você se segura bem, mas a matéria não respondeu',txt:'Sob pressão você funcionou, e isso é metade do caminho. A outra metade: você perdeu '+perdeu+' das 7, e estas 7 são uma de cada matéria do núcleo, com Ética entrando duas vezes porque sozinha ela vale 8 das 80 questões da prova. Ponto perdido aí não se compensa nas 11 matérias de fora: elas valem menos, e é justamente por isso que são de fora. O que falta é o número. Em qual das 6 está o buraco, e de que tamanho ele é.'};
    return {cls:'mixed',lab:'Você perdeu ponto dos dois lados',txt:'Você perdeu '+perdeu+' das 7 e o relógio ainda te cobrou. É o diagnóstico mais duro de receber e o mais fácil de tratar, porque aqui a ordem muda tudo: tática de prova em cima de matéria que você não sabe não vira ponto nenhum. Primeiro fecha a matéria de maior peso, e só depois trabalha o tempo. O que não funciona é o que você provavelmente já tentou: estudar tudo, todo dia, esperando que a conta feche sozinha. O que falta você saber é qual das 6 matérias entra primeiro nessa ordem, e quanto você tem em cada uma delas hoje.'};
  }

  // A frase que o placar sozinho não diz. O 'momento' era o dado mais pesado do
  // formulário e até 02/08/2026 não entrava em lugar nenhum: era só gravado.
  // Não mexe na nota, porque nota é desempenho medido. Mexe na LEITURA, que é
  // onde ele vale: quem já reprovou e vai bem numa amostra está no ponto cego
  // que este produto existe para tratar.
  // Estrutura fixa de dois tempos: o que a SUA situação revela · o que corrige, com o
  // entregável dito por extenso e o preço na frase.
  // Duas regras aprendidas na marra em 02/08/2026:
  // 1. NUNCA consolar. "Você está cedo, e isso é vantagem" tira a urgência inteira e a
  //    pessoa fecha a aba tranquila. Se ela errou, o fato é que hoje ela não passaria.
  // 2. NUNCA falar por metáfora. "Um mapa do que cai" não significa nada para quem está
  //    no primeiro contato. Dizer o que a pessoa recebe: 24 questões cronometradas, a
  //    porcentagem em cada uma das 6, o nome da que derruba.
  // A urgência aqui é sempre REAL: a data da prova e o próprio placar dela.
  function leituraMomento(q, r){
    var forte=!!q.forte, p='';
    // O NÚMERO é do quadrante. Aqui não se repete, senão saem duas frases seguidas
    // dizendo "você perdeu 4 de 7" e o texto vira eco.
    // DIAG NÃO enumera o que o relatório mostra. O bloco rasurado faz isso logo abaixo,
    // e melhor, porque é visual. Enumerar aqui matava a curiosidade que o quadrante
    // acabou de criar, antes de o lockbox poder usá-la. Aqui fica só formato e preço.
    // O R$47 NÃO é só o relatório: inclui as fichas, a folha de tática e 3 simulados.
    // A versão anterior vendia só o diagnóstico, e diagnóstico é informação, que é a coisa
    // mais difícil de vender que existe, porque o comprador não sabe o que fazer com ela.
    // Isso não repete o bloco rasurado: lá é o que o RELATÓRIO revela, aqui é o kit.
    var DIAG='São 24 questões cronometradas nas 6 matérias que decidem a prova, e o relatório sai na hora, com o seu nome. Junto vêm as fichas do que mais cai, a folha de tática para o seu perfil e 3 simulados para medir se você está subindo. Tudo por R$47.';
    // Para quem acertou as sete, a oferta não pode prometer "descubra onde você perde
    // ponto": ela acabou de não perder nenhum. Mas também não pode NEGAR isso, porque em
    // parte dos textos o gancho promete exatamente achar a matéria, e uma frase desmentia
    // a outra. Aqui só se responde a pergunta que o veredito acabou de deixar no ar.
    var DIAG_F='São 24 questões cronometradas nas mesmas 6 matérias, e o relatório responde isso com número: onde o seu rendimento começa a cair, e em qual matéria. Junto vêm as fichas do que mais cai, a folha de tática para o seu perfil e 3 simulados. Tudo por R$47.';
    if(forte) DIAG=DIAG_F;
    if(reprovouMais()){
      p = forte
        ? '<b>E aqui está o ponto.</b> Duas provas ou mais sem passar, e a matéria do núcleo você tem. Então o que te derruba está no que este teste nem tocou: as outras 11 matérias, o ritmo ao longo de 80 questões e o cansaço da terceira hora. Duas reprovações apontam para o mesmo lugar, e você nunca teve como medir esse lugar.'
        : '<b>E aqui está o ponto.</b> O padrão acabou de se repetir na sua frente, em quatro minutos. Isso não é falta de esforço, e é bem provável que você tenha estudado mais do que muita gente que passou. O esforço é que foi para o lugar errado: mais um ano na matéria que você já sabia, enquanto a que te derruba seguiu intocada, porque ninguém nunca te disse qual era.';
      p += forte
        ? '</p><p><b>O que corrige:</b> medir o que ainda não foi medido. '+DIAG+' E o Plano Completo cobre justamente o pedaço que as suas provas apontaram: as fichas das 17 disciplinas, dois simulados de 80 questões para ver onde o rendimento cai, e o cronograma dia a dia até a prova, por R$127.'
        : '</p><p><b>O que corrige:</b> saber o nome dessa matéria antes de abrir o próximo caderno. '+DIAG;
    } else if(jaReprovou()){
      p = forte
        ? '<b>E aqui está o ponto.</b> Você acertou tudo aqui e mesmo assim prestou e não passou. Entre o que você sabe e a nota que saiu tem alguma coisa se perdendo, e não é a matéria do núcleo. Enquanto ela não tiver nome, a segunda tentativa é a primeira de novo.'
        : '<b>E aqui está o ponto.</b> Você já prestou uma vez e não passou, e o mesmo resultado reapareceu num teste de quatro minutos, sem sala cheia e sem cinco horas de prova. Repetir a mesma preparação costuma devolver a mesma nota.';
      p += '</p><p><b>O que corrige:</b> trocar suposição por número. '+DIAG+' Se o que te derrubou está entre essas 6 matérias, ele aparece ali com nome.';
    } else if(S.momento==='Já me formei e vou fazer a minha primeira prova'){
      // O ramo 'forte' existe porque o texto padrão fala de "esse resultado" como se
      // fosse ruim, e quem gabaritou leria a página desmentindo o próprio veredito.
      p = forte
        ? '<b>E aqui está o ponto.</b> Você vai prestar pela primeira vez e acabou de ver o melhor resultado que este teste dá. O que ele não mede é o que acontece com esse acerto na questão 40, com três horas de prova nas costas. É na primeira prova que isso pega quem sabe a matéria, justamente porque nunca foi medido.'+
          '</p><p><b>O que corrige:</b> medir antes do dia. '+faltam()+DIAG
        : '<b>E aqui está o ponto.</b> Você vai prestar pela primeira vez, e acabou de ver esse resultado no conforto de casa: sem sala cheia, sem cinco horas de prova e sem as outras 11 matérias no meio. No dia, tudo isso entra junto.'+
          '</p><p><b>O que corrige:</b> olhar antes, e não depois. '+faltam()+DIAG;
    } else if(S.momento==='Ainda estou na faculdade'){
      // Mesmo motivo do ramo acima: "a faculdade não te protegeu disso" é falso para
      // quem acabou de acertar as sete.
      p = forte
        ? '<b>E aqui está o ponto.</b> A OAB cobra um pedaço pequeno do Direito, em cinco horas, e nesse pedaço, nestas 7, você não cedeu. O que ninguém mediu ainda é se isso se sustenta por 80 questões seguidas, porque a faculdade não cronometra ninguém.'+
          '</p><p><b>O que corrige:</b> medir isso antes do dia. '+faltam()+DIAG
        : '<b>E aqui está o ponto.</b> Estar na faculdade não te protegeu disso, e não é culpa sua: a faculdade ensina o Direito inteiro, em cinco anos, e a OAB cobra um pedaço pequeno dele, em cinco horas. São duas coisas diferentes, e ninguém avisa. Quem estuda para a faculdade não está estudando para o exame.'+
          // A esperança fica ancorada no que dá para SABER, nunca no tempo que resta.
          // Quem está na faculdade pode estar a três semanas da prova, e "você está
          // cedo" faz essa pessoa desconectar na hora.
          '</p><p><b>O que corrige:</b> saber desde já quais são as 6 matérias que decidem a prova e em qual delas você já perde ponto, em vez de descobrir isso no dia. '+DIAG+' A maioria reprova sem nunca saber onde perdeu. Você acabou de descobrir que dá para saber antes.';
    } else {
      return '';
    }
    return '<p>'+p+'</p>';
  }

  // Matérias em que a pessoa ERROU (respondeu e errou), sem repetir. Questão em que
  // o tempo estourou fica de fora: não responder não é a mesma coisa que errar, e
  // misturar as duas destrói justamente a separação que este produto vende.
  // materiasErradas() e materiasEstouradas() foram REMOVIDAS em 02/08. Existiam só para
  // imprimir o nome das matérias na linha legível do bloco rasurado, e isso saiu: dizer
  // "você errou Civil e Ética" entrega metade do diagnóstico, que é exatamente o que o
  // R$47 vende. Se um dia for preciso reabrir, está no histórico do git.

  // O bloco do que ainda está trancado. É o motor da urgência e o único bloco que
  // CRESCEU nesta revisão: tudo o mais na tela de resultado encolheu, porque o
  // resultado grátis estava entregando o que o R$47 vende e tirando a urgência.
  // Regra: o que as 7 já mostraram sai legível e verdadeiro; o que depende das 24 sai
  // como barra opaca, sem número por baixo. Valor fixo que parece calculado destrói a
  // credibilidade no primeiro print comparado entre duas pessoas.
  function lockbox(){
    // 02/08: o NOME das matérias erradas saiu da linha legível e virou barra opaca.
    // Dizer "você errou Civil e Ética" é entregar metade do diagnóstico de graça, e era
    // exatamente o que o R$47 vende. No lugar entra a CONTAGEM: prova que o teste mediu
    // alguma coisa, sem dizer o quê, e cria mais curiosidade do que o nome criava,
    // porque agora a pergunta é "quais três?".
    var cederam=[]; CONTENT.forEach(function(qq,i){
      if((S.estourou[i]||S.ans[i]!==qq.c) && cederam.indexOf(qq.mat)<0) cederam.push(qq.mat);
    });
    function real(t,v){ return '<div class="row"><span class="t">'+t+'</span><span class="val">'+esc(v)+'</span></div>'; }
    function trava(t){ return '<div class="row"><span class="t">'+t+'</span><span class="val trava"></span></div>'; }
    var linhas = real('Matérias do núcleo em que você cedeu', cederam.length? cederam.length+' de 6' : 'nenhuma');
    linhas += real('Seu tempo médio por questão', (tempoMedio()!=null? tempoMedio()+'s' : 'sem registro'));
    linhas +=
      // Só faz sentido perguntar "quais são" se houve alguma. Para quem gabaritou essa
      // linha ficaria contradizendo o "nenhuma" que ela acabou de ler duas linhas acima.
      (cederam.length? trava('Quais delas são, com nome') : '')+
      trava('Sua porcentagem em cada uma das 6')+
      trava('Se o que te derruba é a matéria ou a hora da prova, uma por uma')+
      trava('Em que ponto das 24 questões o seu rendimento cai')+
      trava('Por onde começar a estudar amanhã');
    return '<div class="lockbox">'+
      '<div class="head">O que o diagnóstico completo revela sobre você</div>'+
      '<div class="inner">'+linhas+'</div>'+
      '<div class="cta">O que está legível saiu das suas '+CONTENT.length+' respostas. O resto depende das 24, e sai na hora, com o seu nome.</div>'+
    '</div>';
  }

  function gabarito(){
    // A demo do produto: UMA questão corrigida no formato do relatório pago. É o único
    // bloco de conteúdo que sobrou de graça, e sobrou de propósito: é 1 de 248 questões,
    // não substitui o produto, e é a única prova na tela de que ele é competente.
    // Prioridade: primeiro uma questão em que o TEMPO ESTOUROU, porque é ali que mora a
    // desculpa do relógio, e ler o comentário mata a desculpa sozinho, sem a página
    // precisar discutir. Depois a primeira errada. Só então sorteia, para não repetir a
    // mesma em todo mundo e virar atalho de grupo de WhatsApp.
    var idx=-1, k;
    for(k=0;k<CONTENT.length;k++){ if(S.estourou[k]){ idx=k; break; } }
    if(idx<0) for(k=0;k<CONTENT.length;k++){ if(S.ans[k]!==CONTENT[k].c){ idx=k; break; } }
    if(idx<0) idx=Math.floor(Math.random()*CONTENT.length);
    var Q=CONTENT[idx], sua=S.ans[idx];
    var alts=Q.o.map(function(op,j){
      var cls='alt'+(j===Q.c?' certa':'')+(j===sua&&sua!==Q.c?' sua':'');
      var pre=String.fromCharCode(65+j)+') ';
      var suf=(j===Q.c?' — correta':(j===sua?' — a sua resposta':''));
      return '<div class="'+cls+'">'+pre+esc(op)+suf+'</div>';
    }).join('');
    var nota = S.estourou[idx] ? '<p style="margin-bottom:8px"><b>Nesta o tempo acabou antes de você marcar.</b></p>' : '';
    return '<div class="gab"><div class="k">Gabarito comentado · amostra do relatório</div>'+
      '<div class="q">'+esc(Q.mat)+' · '+esc(Q.q)+'</div>'+alts+nota+
      '<div class="exp">'+Q.exp+' <b>No diagnóstico completo, cada uma das 24 questões vem com um comentário assim.</b></div></div>';
  }

  function pressao(){
    // ENCOLHIDO em 02/08/2026. Antes imprimia a leitura dos TRÊS cenários, o que era a
    // folha de tática de prova entregue de graça e tirava a urgência de comprar. Agora
    // nomeia só o pior, em uma frase, sem dizer o que fazer com aquilo.
    // Regra da tela inteira: nomear sem dimensionar e sem prescrever.
    var pior=null;
    BEHAVIOR.forEach(function(B,i){
      var sel=S.beh[i]; if(sel==null) return;
      var sc=B.o[sel][1];
      if(pior===null || sc<pior.sc) pior={sc:sc, txt:B.leit[sc]};
    });
    if(!pior) return '';
    // Só a primeira frase do 'leit': ela nomeia o comportamento. O resto do texto
    // original traduzia aquilo de volta para a prova, que é a parte que ensina.
    var frase=String(pior.txt).split('. ')[0];
    if(frase.slice(-1)!=='.') frase+='.';
    var cls=pior.sc===0?'ochre':(pior.sc===1?'mixed':'green');
    var fecho=pior.sc===2
      ? ' O diagnóstico mede se isso se sustenta por 24 questões seguidas.'
      : ' O tamanho disso está no diagnóstico.';
    return '<div class="verdict '+cls+'"><div class="k">Sob pressão</div><p style="margin-bottom:0">'+esc(frase)+fecho+'</p></div>';
  }

  function tempo(){
    // ENCOLHIDO em 02/08/2026: eram até três achados analisados, que é o raio-x de
    // pressão de graça. Agora sai UM, o mais forte, por prioridade: estouro, erro com
    // convicção, ritmo. Reporta o fato e para. Não defende a regra do relógio: página
    // que argumenta soa insegura e abre a porta para "na prova eu teria mais tempo".
    var est=estourouQuantas(), fora=segundosFora(), lin=null, ruim=false;
    var cons=notaConstancia(), res=notaResistencia(), tm=tempoMedio();
    var rapErr=null;
    CONTENT.forEach(function(Q,i){
      if(S.times[i]!=null && !S.estourou[i] && S.ans[i]!==Q.c && S.times[i]<=15 &&
         (rapErr===null||S.times[i]<rapErr.t)) rapErr={i:i,t:S.times[i]};
    });
    if(est){
      ruim=true;
      lin='O tempo acabou antes de você marcar em <b>'+est+'</b> '+(est>1?'questões':'questão')+'. Na prova, questão não respondida vale o mesmo que questão errada.';
    } else if(res!=null && res<=55){
      // A queda ao longo do teste é o achado mais vendável que existe aqui: é a prova,
      // com o número da própria pessoa, de que o problema aparece com o tempo de prova.
      ruim=true;
      lin='Você foi pior nas três últimas do que nas três primeiras. E aqui foram sete questões, não oitenta.';
    } else if(cons!=null && cons<=55){
      ruim=true;
      lin='Seu ritmo oscilou muito de uma questão para outra: em umas você decidiu quase na hora, em outras quase no limite. Não é lentidão, é irregularidade.';
    } else if(rapErr){
      ruim=true;
      lin='Você errou a questão de <b>'+esc(CONTENT[rapErr.i].mat)+'</b> em '+rapErr.t+' segundos, sem hesitar. Erro com convicção é o que mais passa despercebido.';
    } else if(tm!=null && tm>=33){
      ruim=true; lin='Você decidiu no limite do relógio: '+tm+' segundos por questão, em média.';
    } else if(tm!=null && tm<10){
      ruim=true; lin='Você decidiu em '+tm+' segundos por questão, em média. Nenhuma questão dessas se lê nesse tempo.';
    } else if(tm!=null){
      lin='Ritmo firme e parelho: '+tm+' segundos por questão, sem oscilar e sem cair no fim.';
    }
    if(lin===null) return '';
    var extra = fora>=3
      ? '<p style="margin-bottom:0">Você ficou '+fora+' segundos fora desta aba durante a Parte 1, e fora da aba o relógio corre em dobro.</p>'
      : '';
    return '<div class="verdict '+(ruim?'ochre':'green')+'"><div class="k">O que o relógio mostrou</div>'+
      '<p'+(extra?'':' style="margin-bottom:0"')+'>'+lin+'</p>'+extra+'</div>';
  }

  // custoErros() foi REMOVIDO em 02/08/2026. Ele listava, matéria por matéria, quanto
  // cada erro vale na prova, que é literalmente o "por onde começar a estudar" que o
  // R$47 vende. Era o bloco que mais canibalizava o produto. A matéria em que a pessoa
  // tropeçou continua aparecendo, uma vez só, na linha legível do lockbox.
  // O campo 'fatia' segue no CONTENT porque é dado verdadeiro e barato de manter.

  // Depoimentos REAIS, autorizados por escrito, os mesmos três da landing. O do resultado
  // fraco é o da Luciana porque ela descreve exatamente o que essa pessoa acabou de viver;
  // o do resultado forte é o do Luiz Henrique, que fala do método e não da dificuldade.
  // Nunca inventar depoimento, nunca editar a frase de quem autorizou.
  function confianca(forte){
    var d = forte
      ? {t:'É diferente do que eu tinha visto para a OAB. Antes de te apresentar conteúdo, ele te faz entender o que é preciso corrigir, e isso muda a forma de estudar.', q:'Luiz Henrique Wrublack, advogado · Francisco Beltrão/PR'}
      : {t:'Eu passava horas lendo e continuava com dificuldade nas questões, e o diagnóstico expõe exatamente esse tipo de problema. Fui, devagarinho, me sentindo mais confiante e segura para fazer a prova.', q:'Luciana Maria, advogada · Nova Prata do Iguaçu/PR'};
    return '<div class="confia">'+
      '<div class="autor">'+
        '<img src="assets/gustavo.webp" alt="Gustavo" width="48" height="48">'+
        '<p>Quem fez isto é o <b>Gustavo, advogado</b>. Passei pela 1ª fase enchendo a mesa de apostila e quase me enrolei, não por não saber, mas por gastar as poucas horas que tinha na matéria errada.</p>'+
      '</div>'+
      '<div class="dep">"'+esc(d.t)+'"<span class="quem">'+esc(d.q)+'</span></div>'+
      '<div class="gar"><b>7 dias de garantia.</b> Faça o diagnóstico inteiro. Se você não achar que valeu, é só pedir: eu devolvo, sem discussão. O risco é meu, não seu.</div>'+
    '</div>';
  }

  function result(){
    var r=compute(), q=quadrant(r.X,r.Y,r);
    var nome=esc((S.nome.split(' ')[0])||'você');
    var left=Math.max(10,Math.min(90,r.X)), top=Math.max(10,Math.min(90,100-r.Y));
    // Checkout pré-preenchido com o que a pessoa já digitou: ela não encara
    // o formulário vazio de novo (é onde o funil perde gente).
    var digits=S.tel.replace(/\D/g,'');
    var fill='&name='+encodeURIComponent(S.nome)+
      (S.email?'&email='+encodeURIComponent(S.email):'')+
      (digits?'&phoneNumber='+encodeURIComponent(digits):'');
    var buyUrl=CHECKOUT_URL+fill, buyUrlC=CHECKOUT_COMPLETO+fill;
    // Quem chega forte não compra "descobrir fraqueza": recebe o Plano Completo como
    // oferta principal. Os demais, o R$47. A flag vem do PRÓPRIO desfecho e não mais da
    // cor, porque o quinto desfecho (quem já reprovou e gabaritou) é forte e NÃO é verde.
    var forte=!!q.forte;
    // Erros de verdade, fora os estouros. Sem isso, quem acerta 5 e estoura 2 lia
    // "Errou 0 e estourou o tempo em 2" e ganhava "são dois problemas diferentes"
    // quando só existe um.
    var erroN=CONTENT.length-r.c-r.estourou;
    app.innerHTML =
      '<div class="prog">Seu resultado</div>'+
      '<h1 style="font-size:24px">'+nome+', aqui está o seu sinal.</h1>'+
      // Erro e estouro nunca se misturam na mesma frase: são dois problemas diferentes,
      // e essa separação é a tese que a landing afirma e que aqui o quiz demonstra com
      // o número da própria pessoa.
      '<p class="lead" style="margin-bottom:6px">Você acertou <b>'+r.c+' de '+CONTENT.length+'</b>.'+
        (r.estourou? (erroN>0? ' Errou '+erroN+' e estourou o tempo em '+r.estourou+'.'
                             : (r.estourou>1? ' Nas outras '+r.estourou+' o tempo acabou antes de você marcar.'
                                            : ' Na outra o tempo acabou antes de você marcar.')) : '')+'</p>'+
      '<p class="lead" style="margin-bottom:16px">'+
        (r.estourou && erroN>0? 'São dois problemas diferentes, com soluções diferentes, e é por isso que estudar mais matéria não resolve o segundo.'
                   : 'Dois eixos, medidos separados: o quanto você domina o conteúdo que cai, e o quanto você se segura na hora.')+'</p>'+
      '<div class="plot"><div class="vline"></div><div class="hline"></div>'+
        // Para quem já reprovou e gabaritou, "Pronto de verdade" no gráfico é o mesmo
        // selo de "apto" que o quinto desfecho existe para impedir.
        '<div class="ql tr">'+(forte&&jaReprovou()?'Pronto nestas 7':'Pronto de verdade')+'</div><div class="ql br">Sabe, mas trava</div>'+
        '<div class="ql tl">Falta conteúdo</div><div class="ql bl">Conteúdo e tática</div>'+
        '<div class="you" style="left:'+left+'%;top:'+top+'%"><div class="dot"></div></div>'+
      '</div>'+
      '<div class="verdict '+q.cls+'"><div class="k">Onde você está</div><h2>'+q.lab+'</h2><p>'+q.txt+'</p>'+leituraMomento(q,r)+'</div>'+
      // A comparação de custo vem logo depois do gancho e ANTES do botão: é ela que
      // transforma o diagnóstico em decisão. Sem ela o botão pede dinheiro sem ter
      // colocado nada na outra ponta da balança.
      tabelaCusto(forte)+
      // CTA logo depois. Antes o primeiro preço só aparecia no sexto bloco de sete, o
      // que no celular é muito rolar para quem já decidiu. Agora TODOS pedem R$47,
      // inclusive quem gabaritou: menor pedido para quem tem menos dor.
      '<div class="ctaslim">'+
        '<a class="btn full" href="'+buyUrl+'" id="buy0" data-v="47">Quero o diagnóstico completo</a>'+
        '<div class="price">R$ 47 à vista, no Pix ou no cartão<br>ou em até '+PARCELA+' · sem mensalidade · 7 dias de garantia</div>'+
      '</div>'+
      tempo()+
      pressao()+
      gabarito()+
      lockbox()+
      confianca(forte)+
      (forte
        // Oferta de quem acertou tudo. Refeita em 02/08: a versão anterior empurrava o
        // produto de R$127 para quem acabou de provar que não precisa de diagnóstico, e
        // isso faz o teste inteiro parecer funil de venda. Agora o pedido é o MENOR, e o
        // argumento é o único honesto que existe para essa pessoa: sete questões não
        // acharem nada não é o mesmo que não existir nada.
        ? '<div class="offer">'+
            '<h3>Sete questões não acharam nada. Vinte e quatro podem.</h3>'+
            '<p>Este teste mediu 7 questões, uma por matéria. Não achou buraco em você, e isso é bom. Mas com uma questão por matéria, tudo o que dá para afirmar é que naquela você acertou.</p>'+
            '<p><b>O diagnóstico completo mede 24, cronometradas, nas mesmas 6 matérias.</b> É a partir dali que aparece o que 7 não alcançam: em qual delas o seu acerto oscila, em que ponto o seu rendimento começa a cair, e a diferença entre saber a resposta e sustentar isso por 80 questões seguidas. O que ele encontrar é exatamente o tipo de coisa que decide uma reprovação, e que ninguém descobre estudando mais matéria.</p>'+
            '<p>E ele não vem sozinho: junto vão as fichas do que mais cai, a folha de tática de prova para o seu perfil e 3 simulados. Para você eles servem menos para achar fraqueza e mais para o que importa agora, que é chegar no dia aquecido em vez de parado.</p>'+
            // Pergunta direta, e é o fecho certo para quem gabaritou: essa pessoa não tem
            // dor para empurrar, tem uma dúvida em aberto. O trabalho da oferta é fazer
            // ela olhar para essa dúvida e decidir se quer levá-la para a sala de prova.
            '<p><b>Então a pergunta é essa: você quer entrar na prova com essa dúvida em aberto, ou prefere fechá-la em 20 minutos?</b></p>'+
            '<a class="btn full" href="'+buyUrl+'" id="buy" data-v="47">Quero o diagnóstico completo</a>'+
            '<div class="price">R$ 47 à vista, no Pix ou no cartão<br>ou em até '+PARCELA+' · sem mensalidade · 7 dias de garantia</div>'+
            '<a class="alt" href="'+buyUrlC+'" id="buy2" data-v="127">Quer as 17 disciplinas, 2 simulados de 80 questões e o cronograma até a prova? Plano Completo por R$ 127</a>'+
          '</div>'
        : '<div class="offer">'+
            '<h3>Esse foi o raio-x de '+CONTENT.length+' questões. A prova tem 80.</h3>'+
            '<p>O jeito mais comum de reprovar de novo é estudar no escuro: semanas inteiras na matéria que você já sabe, enquanto a que te derruba segue intocada.</p>'+
            // A enumeração do que o relatório revela saiu daqui: era a QUARTA vez que os
            // mesmos itens apareciam na tela (gancho do veredito, bloco rasurado, e aqui).
            '<p>O diagnóstico completo acende a luz: 24 questões cronometradas, e no fim você tem o número de cada matéria em vez de suposição. E leva junto o kit para agir: as fichas do que mais cai, a folha de tática para o seu perfil e 3 simulados para medir se está subindo.</p>'+
            '<a class="btn full" href="'+buyUrl+'" id="buy" data-v="47">Quero meu diagnóstico completo</a>'+
            '<div class="price">R$ 47 à vista, no Pix ou no cartão<br>ou em até '+PARCELA+' · sem mensalidade · 7 dias de garantia</div>'+
            '<a class="alt" href="'+buyUrlC+'" id="buy2" data-v="127">Quer o pacote inteiro de uma vez? Plano Completo por R$ 127</a>'+
          '</div>');
      // O bloco do autor saiu daqui e virou parte do bloco de confiança, ACIMA da oferta.
      // Confiança depois do pedido de dinheiro chega tarde para quem já decidiu não pagar.
    // Não existe "refazer": a tela de resultado é a tela de decisão, e uma
    // terceira saída ao lado do botão de compra só serve para quem estava
    // hesitando desistir sem custo. Quem quiser repetir recarrega a página.
    ['buy0','buy','buy2'].forEach(function(id){
      var el=document.getElementById(id);
      if(el) el.onclick=function(){ if(typeof fbq!=='undefined'){ try{ fbq('track','InitiateCheckout',{value:parseInt(el.getAttribute('data-v'),10),currency:'BRL'}); }catch(e){} } };
    });
  }

  render();
</script>
