  // sozinho, sem depender de acertar corte nenhum.
  //
  // A separação matéria x execução não é retórica, é a mesma régua que notaDecisao()
  // já usa: errar uma pegadinha depois de 18 segundos é ter lido, pesado e errado, o
  // que é conteúdo. Errar em menos de 18 é não ter lido direito, o que é execução.
  // Tempo estourado é execução por definição.
  function perdaSeparada(){
    // Trava contra a leitura absurda, encontrada no teste com os leads reais: o
    // Deocleciano acertou 1 de 7 respondendo em 11 segundos, e a regra crua devolvia
    // "você perdeu 6, e nenhuma por falta de matéria". Errar rápido só é problema de
    // DECISÃO em quem provou conteúdo no resto da prova. Em quem não provou, decidir
    // rápido é o sintoma de não saber e chutar, e chutar é matéria.
    var acertos=0; CONTENT.forEach(function(Q,i){ if(S.ans[i]===Q.c) acertos++; });
    var provouConteudo = Math.round(acertos/CONTENT.length*100) >= CORTE_X;
    var mat=0, exec=0;
    CONTENT.forEach(function(Q,i){
      if(S.estourou[i]){ exec++; return; }      // não respondeu: o relógio levou, sempre
      if(S.ans[i]===Q.c) return;                // acertou
      var t=S.times[i];
      if(provouConteudo && t!=null && t<18) exec++;  // sabe, mas decidiu afobado
      else mat++;                                     // leu e errou, ou chutou por não saber
    });
    return {mat:mat, exec:exec, total:mat+exec};
  }

  // Monta {lab, hl} da manchete. 'hl' é o trecho que sai em itálico ocre e PRECISA
  // existir dentro de 'lab', senão a substituição não acha nada e o título sai reto.
  function manchete(){
    var p=perdaSeparada(), n=p.total;
    if(n===0) return {lab:'Você não perdeu nenhuma das '+CONTENT.length, hl:'nenhuma'};
    var quantas = n===1 ? 'Você perdeu 1' : 'Você perdeu '+n;
    if(p.exec===0) return {lab:quantas+', e '+(n===1?'ela foi':'todas foram')+' de matéria', hl:'de matéria'};
    if(p.mat===0)  return {lab:quantas+', e nenhuma por falta de matéria', hl:'nenhuma por falta de matéria'};
    return {lab:quantas+': '+p.mat+' de matéria e '+p.exec+' na hora de decidir', hl:p.exec+' na hora de decidir'};
  }

  // A tradução da distância para a régua da prova. É o que empresta o vocabulário do
  // "39" sem inventar projeção: NÃO diz que a pessoa tiraria X na prova, porque estas
  // 7 são pegadinhas escolhidas a dedo e não uma amostra proporcional das 80. Diz o
  // que a distância VALE, que é verdadeiro e é o que a pessoa reconhece.
  function traduzMargem(){
    var n=perdaSeparada().total;
    if(n===0) return '';
    if(n===1) return 'Na prova, 1 questão é a diferença entre 39 e 40. Entre voltar e não voltar.';
    if(n<=3)  return 'Na prova, '+n+' questões são a distância entre 38 e 41. É nessa faixa que a maioria reprova.';
    return '';
  }

  // A matéria que mais pesa entre as que a pessoa errou, com o peso REAL dela na
  // prova. O campo 'fatia' existia em cada questão desde o começo e nunca era lido:
  // era o argumento mais concreto do produto, escrito questão por questão, morto no
  // código. Substituiu o holofote genérico na Ética, que os dados desmentiram: nos
  // 11 leads reais, Ética foi a MENOS errada (3), e Penal e Constitucional as mais
  // erradas (8 cada). Apontar para a matéria da PESSOA é melhor do que apontar para
  // a matéria que a gente achava que era.
  function materiaPeso(){
    for(var i=0;i<CONTENT.length;i++){
      if(!S.estourou[i] && S.ans[i]!==CONTENT[i].c) return CONTENT[i];
    }
    return null;
  }

  // "Reprovou" aqui significa uma coisa só: parou NA 1ª FASE. Quem parou na 2ª não
  // entra, porque venceu a 1ª — e todo o texto que depende deste teste fala da 1ª.
  function jaReprovou(){
    return S.momento==='Não passei na 1ª fase (uma vez)' ||
           S.momento==='Não passei na 1ª fase (duas ou mais)';
  }
  function reprovouMais(){ return S.momento==='Não passei na 1ª fase (duas ou mais)'; }
  function nuncaPrestou(){ return S.momento==='Ainda não prestei o Exame'; }
  // Já venceu a 1ª fase. Não é o público deste produto, e a página assume isso na cara
  // em vez de empurrar a venda: o diagnóstico continua servindo, mas como aferição de
  // quem voltou depois de um tempo parado, não como remédio para reprovação na 1ª.
  function passou1aFase(){ return S.momento==='Passei na 1ª fase, parei na 2ª'; }

  // Dias até a 1ª fase. Urgência REAL, tirada do calendário, nunca inventada.
  // ATUALIZAR a cada edição do exame.
  var DATA_PROVA=new Date(2026,8,6); // 06/09/2026
  function diasParaProva(){
    var d=Math.ceil((DATA_PROVA-new Date())/86400000);
    return d>0? d : null;
  }
  function faltam(){
    var d=diasParaProva();
    return d? 'Faltam '+d+' dias para a prova. ' : '';
  }

  // Números do exame, confirmados pelo Gustavo em 02/08/2026. ATUALIZAR a cada edição:
  // a taxa muda e o intervalo entre exames também. Número errado aqui é caro, porque o
  // candidato sabe exatamente quanto pagou e quanto esperou.
  var TAXA_EXAME='R$350', ESPERA_EXAME='4 meses';

  // Parcelamento real do checkout, informado pelo Gustavo em 02/08/2026.
  // ATENÇÃO ao escrever qualquer texto com isso: 6 x 8,82 = R$52,92, ou seja, o
  // parcelado TEM juros. Nunca escrever "sem juros" ao lado. Substituiu a divisão por
  // dia, que era um número derivado por retórica; este é uma opção de pagamento de
  // verdade e faz o mesmo trabalho de deixar o valor pequeno.
  var PARCELA='6x de R$8,82';
  // 6 x 8,82. Escrito na página de propósito: esconder o total é o que faz o leitor
  // desconfiar do parcelado, e mostrar empurra para o Pix.
  var TOTAL_PARCELADO='R$52,92';

  // A comparação de custo, em duas colunas. Esquerda longa e cara, direita curta e
  // barata: a assimetria é o argumento inteiro. Muda pelo MOMENTO da pessoa, porque o
  // que ela perde ao não agir é completamente diferente em cada um.
  // Recebe 'forte' porque a tabela não pode desmentir o veredito de quem acertou as 7:
  // para essa pessoa não existe "buraco de hoje" nem "saber se é a matéria" — o veredito
  // acabou de dizer que matéria ela tem. A linha que contradiz troca pela dúvida que as
  // 7 deixam em aberto, que é o único argumento honesto para esse perfil.
  function tabelaCusto(forte){
    var linhas;
    // A promessa da coluna da direita não pode ser uma pergunta que a manchete ACABOU
    // de responder. Quem lê "Você perdeu 4, e todas foram de matéria" e três blocos
    // abaixo encontra "saber se o que te derruba é a matéria ou a hora da prova" percebe
    // que a oferta está fingindo que a dúvida segue aberta. Aqui a promessa avança para
    // o que de fato continua desconhecido depois do veredito.
    var ps=perdaSeparada();
    var promessa = forte
      ? 'Ver em que ponto o seu rendimento cede, com número'
      : (ps.exec===0
          ? 'As matérias, com nome, e quanto falta em cada uma'
          : 'Saber se o que te derruba é a matéria ou a hora da prova');
    if(jaReprovou()){
      linhas=[
        ['Mais uma reprovação, pelo mesmo motivo de antes','O motivo, com nome, antes da próxima'],
        [ESPERA_EXAME+' até poder tentar de novo','20 minutos'],
        [TAXA_EXAME+' na inscrição do próximo exame','R$47, uma vez, ou '+PARCELA],
        ['Repetir a mesma preparação, sem saber o que corrigir', promessa]
      ];
    } else if(nuncaPrestou()){
      // Ramo único de quem nunca prestou, juntando os dois que existiam (faculdade e
      // bacharel de primeira prova). A dor comum é não ter referência nenhuma: sem nota
      // anterior, o único jeito de descobrir onde perde ponto é a própria prova.
      // A primeira linha não fala em "primeira reprovação" como fato dado — quem está
      // na faculdade pode estar a três anos do exame, e anunciar a reprovação dela
      // soaria a agouro em vez de risco.
      linhas=[
        forte
          ? ['Descobrir só no dia o que estas 7 não alcançam','Medir isso antes, em 24 questões']
          : ['Chegar na prova com o mesmo buraco de hoje','Chegar com ele fechado'],
        [ESPERA_EXAME+' entre um exame e o seguinte','20 minutos'],
        [TAXA_EXAME+' na inscrição, e de novo se reprovar','R$47, uma vez, ou '+PARCELA],
        // Esta linha dizia "Sair da faculdade já advogado". Saiu em 02/08/2026: a
        // coluna da direita é o que a pessoa RECEBE, e ali estava o resultado do
        // exame. Isso é promessa de aprovação dita pela estrutura da tabela, e é
        // proibido. Todas as outras entregas da coluna são informacionais.
        ['A turma se preparando para a 2ª fase sem você','Entrar na prova com o número, e não com a esperança']
      ];
    } else if(passou1aFase()){
      // Quem já venceu a 1ª fase. A tabela não pode fingir que ele corre risco de
      // reprovar na 1ª: ele já provou que passa. O risco real e honesto é outro — o
      // tempo parado entre a 2ª fase e a próxima 1ª, se ele precisar prestar de novo.
      // A coluna da esquerda perde a reprovação e ganha a incerteza; sem isso a tabela
      // mentiria para a única pessoa que tem como conferir.
      linhas=[
        forte
          ? ['Supor que o que passou antes continua de pé','Ver, com número, que continua']
          : ['Supor que a 1ª fase está resolvida para sempre','Conferir se ainda está'],
        [ESPERA_EXAME+' entre um exame e o seguinte','20 minutos'],
        [TAXA_EXAME+' na inscrição, se precisar refazer a 1ª','R$47, uma vez, ou '+PARCELA],
        ['Descobrir num reteste que enferrujou','Saber hoje em qual matéria']
      ];
    } else {
      // "Só estou olhando". Devolvia string vazia, e a oferta ficava sem nada na
      // outra ponta da balança. Linhas neutras, sem inventar uma reprovação que
      // essa pessoa não declarou.
      linhas=[
        forte
          ? ['Sair daqui sabendo só que acertou 7 questões','Saber o que as 7 não alcançaram']
          : ['Sair daqui sabendo que tem um buraco, sem saber onde','O nome dele, e o tamanho'],
        [ESPERA_EXAME+' entre um exame e o seguinte','20 minutos'],
        [TAXA_EXAME+' na inscrição, quando você decidir prestar','R$47, uma vez, ou '+PARCELA],
        // Quarta linha acrescentada em 02/08: com três linhas e o dinheiro movido para
        // depois do tempo, esta tabela passou a FECHAR no preço, enquanto as outras
        // três variantes fecham num ganho. Última linha é a que fica na cabeça.
        ['Continuar sem saber o tamanho disso', promessa]
      ];
    }
    var html='<div class="custo"><div class="lin cab"><div>Se você não fizer nada</div><div>Se você olhar agora</div></div>';
    linhas.forEach(function(l){ html+='<div class="lin"><div>'+esc(l[0])+'</div><div>'+esc(l[1])+'</div></div>'; });
    return html+'</div>';
  }
  // Quantas a pessoa errou de verdade, sem contar as que o tempo estourou.
  function errosReais(){
    var n=0; CONTENT.forEach(function(Q,i){ if(!S.estourou[i] && S.ans[i]!==Q.c) n++; });
    return n;
  }

  // Nomeia a causa REAL da queda de pressão, em vez de listar possibilidades. A página
  // tem o dado; oferecer "ou isso, ou aquilo, ou aquilo outro" soa como chute e é o
  // oposto de diagnóstico.
  function causaPressao(r){
    if(!r) return 'o relógio te cobrou';
    if(r.estourou) return 'em '+r.estourou+(r.estourou>1?' questões o tempo acabou antes de você marcar':' questão o tempo acabou antes de você marcar');
    if(r.res!=null && r.res<=55) return 'o seu rendimento caiu nas três últimas em relação às três primeiras';
    if(r.cons!=null && r.cons<=55) return 'o seu ritmo oscilou demais de uma questão para outra';
    if(r.tmed!=null && r.tmed>=33) return 'você decidiu no limite do relógio, questão após questão';
    if(r.tmed!=null && r.tmed<10) return 'você decidiu rápido demais para quem está lendo questão difícil';
    // Chegar aqui significa que o relógio não acusou nada: o que puxou o Y foi o que a
    // própria pessoa respondeu nos 3 cenários. Dizer "o relógio te cobrou" seria mentira
    // conferível no bloco do relógio, logo abaixo, que sai verde.
    return 'as suas próprias respostas sobre o dia de prova dizem que é ali que você cede';
  }

  // O relógio acusou alguma coisa MEDIDA? Espelha as condições ruins de tempo() (menos
  // o erro com convicção, que é achado de conteúdo). Manter em sincronia com tempo():
  // é ela que impede o veredito de acusar o relógio quando o bloco do relógio sai verde.
  function relogioAcusou(r){
    if(!r) return false;
    if(r.estourou) return true;
    if(r.res!=null && r.res<=55) return true;
    if(r.cons!=null && r.cons<=55) return true;
    if(r.tmed!=null && (r.tmed>=33 || r.tmed<10)) return true;
    return false;
  }

  function quadrant(X,Y,r){
    var hiX=X>=CORTE_X, hiY=Y>=CORTE_Y;
    var perdeu=errosReais()+estourouQuantas();
    // O quinto desfecho, e ele existe por um motivo só: quem já reprovou NUNCA sai
    // "apto". Acrescentar parágrafo não bastava, porque o rótulo verde continuava na
    // tela. Aqui o próprio veredito é interceptado, e a cor deixa de dizer "está tudo
    // bem". A contradição entre gabaritar e ter reprovado não é elogio: é o diagnóstico.
    // Cada desfecho termina numa CURIOSIDADE ESPECÍFICA, e ela não é enfeite: é o que
    // entrega o leitor para o bloco rasurado logo abaixo. A frase final aponta para uma
    // linha trancada do lockbox, então os dois respiram juntos em vez de repetir.
    // 02/08 · v3: o veredito virou CAMPOS em vez de um blob de texto, porque o layout
    // novo distribui a mesma copy em três lugares (manchete com trecho em itálico,
    // lead do hero, dois parágrafos do diagnóstico). Nenhuma frase foi reescrita: só
    // repartida. 'hl' é o trecho que sai em itálico ocre dentro do título, e precisa
    // existir DENTRO de 'lab', senão a substituição não acha nada e o título sai reto.
    // A MANCHETE é a mesma função para todos os desfechos: a distância medida.
    // Cada ramo abaixo continua escolhendo cor, lead e os dois parágrafos, mas nenhum
    // deles escolhe mais o título. Era ali que 8 de 12 pessoas liam a mesma frase.
    var M = manchete();
    // 'forte' passou a significar UMA coisa só: não perdeu nenhuma. Antes era
    // hiX&&hiY, e com o corte em 5 de 7 isso faria a página dizer "você acertou tudo"
    // para quem errou duas. Todo texto de gabarito está pendurado aqui.
    var gabaritou = perdeu===0;

    if(hiX&&hiY&&jaReprovou()) return {cls:'ochre',forte:gabaritou,
      lab:M.lab, hl:M.hl,
      lead:(gabaritou
        ? 'Sete pegadinhas, nenhuma perdida, tudo dentro do tempo. E você já prestou o exame sem passar.'
        : 'Você segurou '+r.c+' das '+CONTENT.length+' mais difíceis. E já prestou o exame sem passar.'),
      p1:'As duas coisas juntas dizem uma coisa só: o que te reprovou não é o núcleo de matéria que estas '+CONTENT.length+' cobrem.',
      p2:'O que te derrubou estava fora do alcance destas '+CONTENT.length+' questões, e é por isso que você nunca achou sozinho. O que falta descobrir é em que ponto exatamente o seu rendimento cede, porque é ali que a sua prova é decidida.'};
    if(hiX&&hiY) return {cls:'green',forte:gabaritou,
      lab:M.lab, hl:M.hl,
      lead:(gabaritou
        ? 'As '+CONTENT.length+' eram difíceis e você não deixou nenhuma passar.'
        : 'As '+CONTENT.length+' eram pegadinhas escolhidas para derrubar, e você segurou '+r.c+'.'),
      // Reescrita em 04/08/2026. Dizia "O que estas 7 não medem é a questão 40…", que é
      // a pergunta da seção 4 inteira, dita na seção 2. A poda automática não alcançava:
      // o gatilho estava na PRIMEIRA palavra, e cortar ali apagaria o parágrafo todo.
      // Agora ela interpreta o resultado, que é o trabalho desta seção. O limite do
      // teste continua sendo dito, mas onde tem dono, uma seção adiante.
      p1:'Acertar as '+CONTENT.length+' com o relógio correndo diz uma coisa concreta: nas matérias de maior peso, você decide certo sob pressão. É o desempenho que a prova cobra nas primeiras horas, quando a sala ainda está cheia e o cansaço não entrou.',
      p2:'E tem uma diferença que decide muita coisa: sete questões não acharem nada em você não é a mesma coisa que não existir nada.'};
    if(hiX&&!hiY) return {cls:'ochre',forte:gabaritou,
      lab:M.lab, hl:M.hl,
      // Quando houve estouro, o prefixo do lead já disse "nas outras N o tempo acabou
      // antes de você marcar". Chamar causaPressao() aqui repetia a frase inteira dentro
      // da mesma linha. Só cabe quando a causa NÃO é o estouro.
      lead:(r.estourou>0
        ? 'Nada do que você marcou estava errado. O que faltou foi tempo.'
        : 'O que cedeu não foi o conteúdo: '+causaPressao(r)+'.'),
      p1:'Na prova isso não aparece como erro de matéria. Aparece como questão em branco nas dez últimas, com você sabendo a resposta.',
      p2:'Estudar mais matéria não conserta isso, e por acaso é o único conselho que você recebe enquanto estiver pagando mensalidade. O que resolve é saber em que ponto da prova o seu rendimento cai, e em qual matéria ele cai primeiro.'};
    // Estouro puro: acertou tudo o que respondeu e o que perdeu foi inteiro para o
    // relógio. Sem este desfecho a pessoa caía em "perdeu ponto dos dois lados" com o
    // conselho invertido (fechar matéria primeiro), violando a regra de que estouro
    // nunca se mistura com erro no texto. Vem ANTES do ramo hiY porque com um estouro
    // só o Y ainda pode passar do corte, e "a matéria não respondeu" seria falso.
    // O X continua contando estouro como ponto perdido (decisão registrada no compute);
    // é o texto que separa, não a régua.
    if(errosReais()===0 && estourouQuantas()>0){
      return {cls:'ochre', lab:M.lab, hl:M.hl,
        lead:'Tudo o que você marcou estava certo.',
        p1:'Na prova, questão em branco vale o mesmo que questão errada.',
        p2:'Estudar mais matéria não muda isso: matéria você mostrou que tem. O que falta saber é para onde o seu tempo vai: em qual matéria você trava, e em que ponto da prova isso começa.'};
    }
    // O peso da matéria que a pessoa errou, dito com o número dela. Antes esta frase
    // apontava sempre para Ética, e os leads reais desmentiram: Ética é a menos errada.
    var mp = materiaPeso();
    var peso = mp ? ' A primeira que caiu foi '+mp.mat+', que vale '+mp.fatia+'.' : '';
    if(!hiX&&hiY) return {cls:'mixed', lab:M.lab, hl:M.hl,
      lead:'Sob pressão você funcionou, e isso é metade do caminho.',
      p1:'A outra metade: você perdeu '+perdeu+' das '+CONTENT.length+', e estas '+CONTENT.length+' são uma de cada matéria do núcleo que decide a prova.'+peso,
      p2:'Ponto perdido aí não se compensa nas 11 matérias de fora: elas valem menos, e é justamente por isso que são de fora. O que falta é o número. Em qual das 6 está o buraco, e de que tamanho ele é.'};
    // O Y cai junto com os erros (a nota de decisão pune errar), então dá para chegar
    // aqui com o relógio limpo. Nesse caso a abertura não pode acusar o relógio: o bloco
    // "O que o relógio mostrou", três blocos abaixo, sai verde e desmentiria o veredito.
    // O lead TEM que sair da mesma régua da manchete, e até 02/08/2026 não saía:
    // vinha de relogioAcusou(), que olha estouro, queda de rendimento e ritmo, enquanto
    // a manchete passou a vir de perdaSeparada(), que olha ONDE o ponto foi perdido.
    // As duas discordavam e a tela dizia, com duas linhas de distância, "todas foram de
    // matéria" e "os dois eixos cederam ao mesmo tempo". Régua diferente para a mesma
    // pergunta produz contradição na cara do leitor, e este publico desconfia de curso.
    // A queda de rendimento continua sendo dita, no bloco "O que o relógio mostrou",
    // que é onde ela é achado e não veredito.
    var ps=perdaSeparada();
    var abriu = (ps.mat>0 && ps.exec>0)
      ? 'Os dois eixos cederam ao mesmo tempo.'
      : (ps.exec===0
          ? 'O relógio não tirou ponto seu: o que pesou foi a matéria.'
          : 'A matéria você mostrou que tem. O que cedeu foi a execução.');
    return {cls:'mixed', lab:M.lab, hl:M.hl,
      lead:abriu,
      // "É o diagnóstico mais duro de receber e o mais fácil de tratar" saiu em 03/08.
      // Era afirmação forte demais e não nascia do parágrafo anterior — chegava como
      // veredito de fora. A abertura agora emenda no princípio que a seção acabou de
      // enunciar (não dá para corrigir os dois de uma vez) e entrega a consequência
      // prática: existe ordem, e a ordem é essa.
      p1:'A vantagem de separar conteúdo e execução é que você deixa de corrigir tudo ao mesmo tempo: os dois problemas são diferentes e podem ser tratados em ordem. E aqui a ordem muda tudo, porque tática de prova em cima de matéria que você não sabe não vira ponto nenhum. Primeiro fecha a matéria de maior peso, e só depois trabalha o tempo.'+peso,
      p2:'O que não funciona é o que você provavelmente já tentou: estudar tudo, todo dia, esperando que a conta feche sozinha. O que falta você saber é qual das 6 matérias entra primeiro nessa ordem, e quanto você tem em cada uma delas hoje.'};
  }

  // A frase que o placar sozinho não diz. O 'momento' era o dado mais pesado do
  // formulário e até 02/08/2026 não entrava em lugar nenhum: era só gravado.
  // Não mexe na nota, porque nota é desempenho medido. Mexe na LEITURA, que é
  // onde ele vale: quem já reprovou e vai bem numa amostra está no ponto cego
  // que este produto existe para tratar.
  // Estrutura fixa de dois tempos: o que a SUA situação revela · o que corrige, com o
  // entregável dito por extenso e o preço na frase.
  // Duas regras aprendidas na marra em 02/08/2026:
  // 1. NUNCA consolar. "Você está cedo, e isso é vantagem" tira a urgência inteira e a
  //    pessoa fecha a aba tranquila. Se ela errou, o fato é que hoje ela não passaria.
  // 2. NUNCA falar por metáfora. "Um mapa do que cai" não significa nada para quem está
  //    no primeiro contato. Dizer o que a pessoa recebe: 24 questões cronometradas, a
  //    porcentagem em cada uma das 6, o nome da que derruba.
  // A urgência aqui é sempre REAL: a data da prova e o próprio placar dela.
  // 02/08 · v3: devolve CAMPOS, não HTML. O layout novo usa os dois tempos em lugares
  // diferentes da página: o "ponto" vira pull-quote logo abaixo do diagnóstico, e o
  // "o que corrige" vira TÍTULO de seção (Spectral) mais parágrafo. Nenhuma frase foi
  // reescrita: o que era "<b>O que corrige:</b> trocar suposição por número. DIAG"
  // virou {titulo:'Trocar suposição por número', texto:DIAG}.
  // Devolve null para "Só estou olhando" (esse momento não tem leitura).
  function leituraMomento(q, r){
    var forte=!!q.forte;
    // Terceiro perfil, descoberto na revisão de 02/08: acertou as 7 mas o eixo da hora
    // não fechou. O ramo padrão mandava essa pessoa ler "a matéria que te derruba seguiu
    // intocada" logo depois de o veredito dizer "Você sabe a matéria". O discriminador
    // de matéria não é 'forte', é não ter errado conteúdo: X cheio OU estouro puro.
    // 'sabe' = não perdeu NENHUMA por matéria. Tem que ser exatamente a mesma régua
    // da manchete, senão o título diz "nenhuma por falta de matéria" e a seção de
    // oferta, 30 linhas abaixo, promete achar a matéria que derruba. Foi o que o
    // teste de borda pegou no caso de quem sabe e decide afobado: erra respondendo,
    // então errosReais() é 2, mas nenhuma dessas duas é matéria.
    var sabe = !forte && perdaSeparada().mat===0;
    // DIAG NÃO enumera o que o relatório mostra: o bloco rasurado faz isso logo abaixo,
    // e melhor, porque é visual. Aqui fica só formato e preço. O R$47 NÃO é só o
    // relatório: inclui as fichas, a folha de tática e 3 simulados.
    // A prosa parou de enumerar fichas, folha de tática e simulados: a lista "O que
    // chega na sua mão" está logo abaixo e faz isso melhor. Duas enumerações iguais na
    // mesma dobra fazem a oferta parecer menor, não maior.
    // Começa em "Elas" porque o título da seção acabou de dizer "As 24 questões".
    // Antes o número aparecia três vezes na mesma altura de tela: no título, aqui, e no
    // primeiro item da lista. A terceira repetição não aumenta desejo nenhum.
    var DIAG='Elas são cronometradas, nas 6 matérias que decidem a prova, e o relatório sai na hora, com o seu nome.';
    // Para quem não perdeu matéria, a oferta não pode prometer "descubra onde você perde
    // ponto": ela acabou de não perder nenhum. Responde a pergunta que o veredito deixou.
    var DIAG_F='Elas são cronometradas, nas mesmas 6 matérias, e o relatório responde isso com número: onde o seu rendimento começa a cair, e em qual matéria.';
    if(forte||sabe) DIAG=DIAG_F;
    var ponto, titulo, texto;
    if(reprovouMais()){
      ponto = forte
        ? 'Duas provas ou mais sem passar, e a matéria do núcleo você tem. Então o que te derruba está no que este teste nem tocou: as outras 11 matérias, o ritmo ao longo de 80 questões e o cansaço da terceira hora. Duas reprovações apontam para o mesmo lugar, e você nunca teve como medir esse lugar.'
        : sabe
        ? 'Duas provas ou mais sem passar, e o que te derrubou aqui não foi a matéria. O que cedeu foi a hora, e agora isso tem registro: aconteceu de novo, num teste de quatro minutos. Duas reprovações e este resultado apontam para o mesmo lugar, e não é o caderno.'
        // Encurtado em 02/08: eram cinco linhas no ponto em que a pessoa já aceitou o
        // diagnóstico e quer saber "e agora". A absolvição ("não é falta de esforço")
        // fica, porque num público em que a regra é o autoflagelo ela é o que segura a
        // leitura. O que saiu foi a repetição do argumento, não o argumento.
        : 'O padrão acabou de se repetir na sua frente, em quatro minutos. Não é falta de esforço: é esforço na matéria errada, porque ninguém nunca te disse qual era.';
      titulo = forte? 'Medir o que ainda não foi medido'
        : sabe? 'Parar de estudar de novo o que você já tem'
        : 'Saber o nome dessa matéria antes de abrir o próximo caderno';
      // A frase que vendia o Plano Completo (R$127) aqui dentro saiu em 03/08, junto com
      // o link no fim da página: esta tela vende UMA coisa, o R$47. O R$127 passou a ser
      // upsell pós-compra na Hotmart.
      texto = DIAG;
    } else if(jaReprovou()){
      ponto = forte
        ? 'Você acertou tudo aqui e mesmo assim prestou e não passou. Entre o que você sabe e a nota que saiu tem alguma coisa se perdendo, e não é a matéria do núcleo. Enquanto ela não tiver nome, a segunda tentativa é a primeira de novo.'
        : sabe
        ? 'Você já prestou uma vez e não passou, e aqui a matéria não foi o problema. O que cedeu foi a hora, num teste de quatro minutos, sem sala cheia e sem cinco horas de prova. No dia, isso só aumenta.'
        : 'Você já prestou uma vez e não passou, e o mesmo resultado reapareceu num teste de quatro minutos, sem sala cheia e sem cinco horas de prova. Repetir a mesma preparação costuma devolver a mesma nota.';
      titulo = 'Trocar suposição por número';
      // O rabo "aparece ali com nome" só para quem de fato perdeu matéria: para X cheio
      // o veredito acabou de dizer que matéria não é o problema, e a frase desmentiria.
      texto = DIAG + ((forte||sabe)? '' : ' Se o que te derrubou está entre essas 6 matérias, ele aparece ali com nome.');
    } else if(nuncaPrestou()){
      // Ramo único de quem nunca prestou. O texto não pode assumir faculdade nem
      // bacharelado, porque agora os dois caem aqui: fala do que ambos têm em comum,
      // que é nunca ter sido medido. A âncora é o que dá para SABER, nunca o tempo que
      // resta — essa pessoa pode estar a três anos ou a três semanas da prova, e
      // "você está cedo" faz metade dela desconectar na hora.
      ponto = forte
        ? 'Você ainda não prestou e acabou de ver o melhor resultado que este teste dá. O que ele não mede é o que acontece com esse acerto na questão 40, com três horas de prova nas costas, e é exatamente aí que pega quem sabe a matéria, justamente porque nunca foi medido.'
        : sabe
        ? 'Você ainda não prestou, e o que te cobrou aqui não foi a matéria: foi a hora, no conforto de casa. No dia são 80 questões, cinco horas e a sala cheia. Ninguém nunca te cronometrou, e é isso que a prova faz primeiro.'
        : 'Você ainda não prestou, e acabou de ver esse resultado no conforto de casa: sem sala cheia, sem cinco horas e sem as outras 11 matérias no meio. Não é culpa sua e não é falta de estudo: a faculdade ensina o Direito inteiro em cinco anos, e a OAB cobra um pedaço pequeno dele em cinco horas. São duas coisas diferentes, e ninguém avisa.';
      titulo = (forte||sabe)? 'Medir isso antes do dia' : 'Saber desde já em qual matéria você perde ponto';
      texto = (forte||sabe)? (faltam()+DIAG)
        : (DIAG + ' A maioria reprova sem nunca saber onde perdeu. Você acabou de descobrir que dá para saber antes.');
    } else if(passou1aFase()){
      // Quem parou na 2ª fase. O texto DIZ que este teste não é o problema dele, e é a
      // única leitura em que a página abre mão do argumento de venda: fingir que ele
      // corre risco na 1ª seria mentir para a única pessoa que tem prova em contrário
      // — ela já passou. O que sobra é verdadeiro e menor: tempo parado enferruja, e
      // se ela precisar refazer a 1ª, o que passou antes não passa sozinho de novo.
      ponto = forte
        ? 'Você já venceu a 1ª fase, e acabou de mostrar que continua vencendo: acertou tudo. Então seja franco com você mesmo: o que te separa da carteira hoje é a 2ª fase, e não é disso que este teste trata.'
        : sabe
        ? 'Você já venceu a 1ª fase, e a matéria aqui não foi o problema. O que apareceu foi a hora, e isso atravessa as duas fases: a 2ª também é cronometrada, e lá não existe alternativa para marcar.'
        : 'Você já venceu a 1ª fase uma vez, mas hoje, sem consulta e com o relógio correndo, ela cobrou. Isso costuma ser tempo parado, e não perda do que você sabia: quem foca na 2ª passa meses sem tocar no conteúdo da 1ª.';
      titulo = forte? 'Conferir se o que passou continua de pé'
        : 'Saber em qual matéria a 1ª fase enferrujou';
      // Sem faltam(): a contagem regressiva da 1ª fase não é a urgência dele.
      texto = DIAG + ' É um diagnóstico de 1ª fase, então ele responde uma pergunta só: se você precisar refazê-la, o que já não está mais no lugar.';
    } else {
      // "Só estou olhando". Até 02/08/2026 este momento devolvia null, e o efeito
      // era grave: sem leitura e sem tabela de custo, a oferta aparecia como uma
      // lista de itens e um botão, sem uma única frase de transição depois do
      // diagnóstico. Era o único perfil que via o preço sem nenhum antecedente.
      // Nenhum dos 18 leads reais marcou esta opção, então o texto é curto de
      // propósito: existe para a página não quebrar, não para converter.
      ponto = forte
        ? 'Você entrou por curiosidade e não perdeu nenhuma. Isso responde uma pergunta e abre outra: estas '+CONTENT.length+' não medem o que acontece na questão 40, com três horas de prova nas costas.'
        : sabe
        ? 'Você entrou por curiosidade e a matéria não foi o problema. O que apareceu foi a hora, num teste de quatro minutos feito sem sala cheia e sem cinco horas de prova.'
        : 'Você entrou por curiosidade e o teste achou alguma coisa. Curiosidade que encontra buraco deixa de ser curiosidade.';
      titulo = 'Saber o tamanho disso antes de decidir qualquer coisa';
      texto = DIAG;
    }
    return {ponto:ponto, titulo:titulo, texto:texto};
  }

  // Matérias em que a pessoa ERROU (respondeu e errou), sem repetir. Questão em que
  // o tempo estourou fica de fora: não responder não é a mesma coisa que errar, e
  // misturar as duas destrói justamente a separação que este produto vende.
  // materiasErradas() e materiasEstouradas() foram REMOVIDAS em 02/08. Existiam só para
  // imprimir o nome das matérias na linha legível do bloco rasurado, e isso saiu: dizer
  // "você errou Civil e Ética" entrega metade do diagnóstico, que é exatamente o que o
  // R$47 vende. Se um dia for preciso reabrir, está no histórico do git.

  // O bloco do que ainda está trancado. É o motor da urgência e o único bloco que
  // CRESCEU nesta revisão: tudo o mais na tela de resultado encolheu, porque o
  // resultado grátis estava entregando o que o R$47 vende e tirando a urgência.
  // Regra: o que as 7 já mostraram sai legível e verdadeiro; o que depende das 24 sai
  // como barra opaca, sem número por baixo. Valor fixo que parece calculado destrói a
  // credibilidade no primeiro print comparado entre duas pessoas.
  function lockbox(){
    // Dois cartões, desde 04/08/2026. O de cima mostra o que a pessoa JÁ TEM (as
    // matérias em que cedeu, com nome, e o tempo médio). O de baixo mostra, riscado,
    // o que estas 7 questões não alcançam.
    //
    // Os nomes das matérias ficam LEGÍVEIS, e isso já foi testado dos dois jeitos.
    // Em 02/08 viraram barra opaca, com o argumento de que dizer "você errou Civil e
    // Ética" entregava metade do diagnóstico de graça. O que a aposta custou está
    // medido: 63 leads e 3 checkouts (4,8%), com 12 pessoas entre as que foram pior e
    // nenhum clique vindo delas. Devolvido em 03/08, por três razões:
    //   1. Curiosidade não é ruminação. "3 de 6" é abstração, e ninguém rumina uma
    //      abstração no ônibus. Nome tem cara e endereço.
    //   2. O contrato. O anúncio promete diagnóstico; ela paga com 7 questões e o
    //      e-mail e recebia um diagnóstico rasurado. Este público é majoritariamente
    //      gente que já reprovou e desconfia por experiência própria.
    //   3. O R$47 nunca foi "os nomes". É porcentagem por matéria, matéria vs. relógio
    //      e a ordem das correções, e tudo isso segue trancado logo abaixo.
    //
    // A lista riscada só pode conter PERGUNTA. Nenhum substantivo de entrega (plano,
    // ficha, simulado, cronograma) entra aqui: quem responde é a seção da oferta, e
    // antecipar a resposta faz a oferta ler como repetição.
    var cederam=[]; CONTENT.forEach(function(qq,i){
      if((S.estourou[i]||S.ans[i]!==qq.c) && cederam.indexOf(qq.mat)<0) cederam.push(qq.mat);
    });
    var estq=estourouQuantas(), tmed=tempoMedio();

    var chips = cederam.map(function(m){ return '<span class="chip">'+esc(m)+'</span>'; }).join('');
    if(tmed!=null) chips += '<span class="chip fraco"><b>'+tmed+'s</b> tempo médio/questão'+
      (estq? ' (nas '+(CONTENT.length-estq)+' que você respondeu)' : '')+'</span>';

    var perguntas=[
      'Sua porcentagem em cada uma das 6',
      'Quais conteúdos dentro delas custam mais ponto',
      'Se o que te derruba é a matéria ou a hora da prova, uma por uma',
      'O que acontece nas matérias que este teste não mediu',
      'Qual deve ser a ordem das correções'
    ];

    return '<div class="cardn cedeu">'+
        '<div class="cnum">'+cederam.length+' <span>de 6</span></div>'+
        '<div class="clb">matérias do núcleo</div>'+
        (chips? '<div class="chips">'+chips+'</div>' : '')+
      '</div>'+
      '<h2 class="apos">O que estas '+CONTENT.length+' questões ainda não respondem</h2>'+
      '<p class="p">Elas mostraram <strong>em quais</strong> matérias você cedeu. O que não conseguem mostrar:</p>'+
      '<div class="cardb riscado">'+
        perguntas.map(function(t){ return '<div class="ri">'+esc(t)+'</div>'; }).join('')+
        '<div class="ripe">O que está legível saiu das suas '+CONTENT.length+' respostas. O que está riscado é o que elas não alcançam.</div>'+
      '</div>';
  }


  function gabarito(){
    // A demo do produto: UMA questão corrigida no formato do relatório pago. É o único
    // bloco de conteúdo que sobrou de graça, e sobrou de propósito: é 1 de 248 questões,
    // não substitui o produto, e é a única prova na tela de que ele é competente.
    // Prioridade: primeiro uma questão em que o TEMPO ESTOUROU, porque é ali que mora a
    // desculpa do relógio, e ler o comentário mata a desculpa sozinho, sem a página
    // precisar discutir. Depois a primeira errada. Só então sorteia, para não repetir a
    // mesma em todo mundo e virar atalho de grupo de WhatsApp.
    var idx=-1, k;
    for(k=0;k<CONTENT.length;k++){ if(S.estourou[k]){ idx=k; break; } }
    if(idx<0) for(k=0;k<CONTENT.length;k++){ if(S.ans[k]!==CONTENT[k].c){ idx=k; break; } }
    if(idx<0) idx=Math.floor(Math.random()*CONTENT.length);
    var Q=CONTENT[idx], sua=S.ans[idx];
    var alts=Q.o.map(function(op,j){
      var cls='alt'+(j===Q.c?' certa':'')+(j===sua&&sua!==Q.c?' sua':'');
      var pre=String.fromCharCode(65+j)+') ';
      var suf=(j===Q.c?' · correta':(j===sua?' · a sua resposta':''));
      return '<div class="'+cls+'">'+pre+esc(op)+suf+'</div>';
    }).join('');
    var nota = S.estourou[idx] ? '<p class="notagab"><b>Nesta o tempo acabou antes de você marcar.</b></p>' : '';
    var letra = String.fromCharCode(65+Q.c);
    // O COMENTÁRIO FICA FECHADO (04/08/2026). A questão, as alternativas, a que ela
    // marcou e qual é a certa continuam à vista: isso é a prova, e prova não se
    // esconde. O que fica atrás do botão é o PORQUÊ, que é longo e que nem todo mundo
    // quer ler ali. Quem abre está pedindo, e pedir é um sinal de interesse que a
    // página não tinha como ler quando o texto vinha aberto por padrão.
    return '<div class="gab">'+
      '<div class="mat">'+esc(Q.mat)+'</div>'+
      '<div class="q">'+esc(Q.q)+'</div>'+alts+nota+
      '<div class="exp" id="gabexp" hidden>'+Q.exp+
        ' <b>Cada questão do Mapa da Aprovação vem com um comentário assim.</b></div>'+
      '<button type="button" class="gabbtn" id="gabtoggle">Ver por que a '+letra+' é a certa: comentário completo</button>'+
    '</div>';
  }

  function pressao(){
    // v3: devolve OBJETO. Nomeia só o pior cenário, em uma frase, sem dizer o que fazer
    // com aquilo. Regra da tela inteira: nomear sem dimensionar e sem prescrever.
    var pior=null;
    BEHAVIOR.forEach(function(B,i){
      var sel=S.beh[i]; if(sel==null) return;
      var sc=B.o[sel][1];
      if(pior===null || sc<pior.sc) pior={sc:sc, txt:B.leit[sc]};
    });
    if(!pior) return null;
    // Só a primeira frase do 'leit': ela nomeia o comportamento. O resto traduzia aquilo
    // de volta para a prova, que é a parte que ensina, e ensinar de graça é o produto.
    var frase=String(pior.txt).split('. ')[0];
    if(frase.slice(-1)!=='.') frase+='.';
    // Duas correções em 03/08, na mesma frase. Primeiro saiu "o tamanho disso está no
    // diagnóstico": a pessoa ACABOU de sair de um diagnóstico e o cérebro perguntava
    // "que diagnóstico?". A substituta, "o que fica em aberto é o tamanho disso", ficou
    // abstrata — "o tamanho" de quê, medido como?
    // Agora a frase diz o que o teste alcança e o que não alcança, em unidade concreta
    // (uma vez x 80 questões), sem nomear produto: quem vende é a seção 5.
    var fecho=pior.sc===2
      ? ' O que ninguém mediu ainda é se isso se sustenta por 24 questões seguidas.'
      : ' O teste mostrou que isso aconteceu uma vez. Quanto custa ao longo de 80 questões é outra medida.';
    return {k:'Sob pressão', p:esc(frase)+fecho, cls:(pior.sc===0?'ochre':(pior.sc===1?'':'green'))};
  }

  // A leitura das trocas. Só aparece quando a pessoa REALMENTE trocou certa por errada:
  // é medição, não retórica, e uma linha que só sai quando é verdade não desgasta.
  // Vem antes de tempo() na tela porque é o achado mais específico que a página tem --
  // e porque é o único que a pessoa já suspeitava sozinha, sem conseguir provar.
  // Segue a regra da tela: nomear sem dimensionar e sem prescrever. Quantas foram, sim;
  // em quais matérias e o que fazer com isso, não -- isso é o que o diagnóstico vende.
  function trocou(){
    var t=trocasResumo();
    if(!t.perdeu) return null;
    var uma=t.perdeu===1;
    var p='Você tinha marcado a alternativa certa em '+(uma?'uma questão':t.perdeu+' questões')+
          ' e trocou por outra antes de confirmar.';
    if(t.salvou) p+=' Em '+(t.salvou===1?'outra':t.salvou+' outras')+' a troca te salvou: '+
                    'estava errada e você corrigiu. Trocar não é o problema.';
    p+=' O diagnóstico mostra em quais matérias isso acontece, e se acontece cedo ou na hora que o tempo aperta.';
    return {k:'Ao trocar de resposta', p:esc(p), cls:'ochre'};
  }

  function tempo(){
    // v3: devolve OBJETO. Sai UM achado, o mais forte, por prioridade: estouro, queda no
    // fim, oscilação, erro com convicção, ritmo. Reporta o fato e para. Não defende a
    // regra do relógio: página que argumenta soa insegura e abre a porta para "na prova
    // eu teria mais tempo".
    var est=estourouQuantas(), fora=segundosFora(), lin=null, ruim=false;
    var cons=notaConstancia(), res=notaResistencia(), tm=tempoMedio();
    var rapErr=null;
    CONTENT.forEach(function(Q,i){
      if(S.times[i]!=null && !S.estourou[i] && S.ans[i]!==Q.c && S.times[i]<=15 &&
         (rapErr===null||S.times[i]<rapErr.t)) rapErr={i:i,t:S.times[i]};
    });
    if(est){
      ruim=true;
      lin='O tempo acabou antes de você marcar em <b>'+est+'</b> '+(est>1?'questões':'questão')+'. Na prova, questão não respondida vale o mesmo que questão errada.';
    } else if(res!=null && res<=55){
      // A queda ao longo do teste é o achado mais vendável daqui: é a prova, com o número
      // da própria pessoa, de que o problema aparece com o tempo de prova.
      ruim=true;
      lin='Você foi pior nas três últimas do que nas três primeiras. E aqui foram sete questões, não oitenta.';
    } else if(cons!=null && cons<=55){
      ruim=true;
      lin='Seu ritmo oscilou muito de uma questão para outra: em umas você decidiu quase na hora, em outras quase no limite. Não é lentidão, é irregularidade.';
    } else if(rapErr){
      ruim=true;
      // "em 1 segundos" aparecia para quem respondia no primeiro segundo. Numa frase que
      // acusa pressa, o erro de concordância entrega a página junto.
      lin='Você errou a questão de <b>'+esc(CONTENT[rapErr.i].mat)+'</b> em '+rapErr.t+
          (rapErr.t===1?' segundo':' segundos')+', sem hesitar. Erro com convicção é o que mais passa despercebido.';
    } else if(tm!=null && tm>=33){
      ruim=true; lin='Você decidiu no limite do relógio: '+tm+' segundos por questão, em média.';
    } else if(tm!=null && tm<10){
      ruim=true; lin='Você decidiu em '+tm+' segundos por questão, em média. Nenhuma questão dessas se lê nesse tempo.';
    } else if(tm!=null){
      lin='Ritmo firme e parelho: '+tm+' segundos por questão, sem oscilar e sem cair no fim.';
    }
    if(lin===null) return null;
    if(fora>=3) lin+=' Você ficou '+fora+' segundos fora desta aba durante a Parte 1, e fora da aba o relógio corre em dobro.';
    return {k:'O que o relógio mostrou', p:lin, cls:(ruim?'ochre':'green')};
  }

  // Rótulo e largura de cada barra do hero. A barra substituiu o gráfico de quadrante:
  // o quadrante exigia leitura de eixo e um rótulo por canto, e no celular virava

  // Teto de 96%: barra cheia encostando na borda lê como "completo", e nada aqui é

  function barraConteudo(r){
    // Estouro puro: acertou TUDO o que respondeu e o que perdeu foi inteiro para o
    // relógio. A barra media acertos sobre as 7 e saía "Parcial · 6/7" em vermelho,
    // a 200 pixels de uma manchete que dizia "não foi a matéria, foi o relógio".
    // Duas afirmações opostas na mesma tela. Aqui a barra passa a medir o que a
    // pessoa de fato respondeu, que é a única coisa que o conteúdo dela sustenta.
    if(errosReais()===0 && r.estourou>0){
      var resp=CONTENT.length-r.estourou;
      return {rot:'Domínio do conteúdo que cai', v:'Alto · '+r.c+'/'+resp+' do que deu tempo', cls:'ok', w:96};

  var CHECK='<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="8" fill="#E9F1EA" stroke="#BFD8C4"/><path d="M5.5 9.2l2.3 2.3 4.7-4.8" stroke="#3A7A5C" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>';

  // O que a pessoa recebe, item a item. Existe porque "diagnóstico" sozinho é

  // Reescrita em 03/08/2026. A pilha antiga listava cinco linhas de uma frase, e quatro
  // delas começavam pela palavra "diagnóstico", "gabarito", "fichas" — nomes de arquivo.

  // Qual eixo está segurando a pessoa hoje. A tela de oferta abre nomeando isto, então
  // precisa ser a MESMA régua do resto da página (CORTE_X / CORTE_Y), senão o topo
  // contradiz as barras que estão logo abaixo dele.
  // Cada caso traz a manchete inteira, e não só o nome do gargalo: encaixar nome variável
  // em molde fixo ("...foi <nome>") produzia "foi os dois: conteúdo e relógio" no caso
  // duplo, erro de concordância na primeira linha da página.
  //
  // No caso duplo a manchete DIZ QUAL PESA MAIS. A versão anterior dizia "pelos dois
  // motivos", que lê como empate e não informa nada: quem lê quer saber se é 90/10 ou
  // 50/50. Os dois eixos são número, então a comparação é feita, não sonegada. O critério
  // é a distância até o corte de cada eixo, não o valor bruto — os cortes são diferentes
  // (71 e 72) e as escalas não são intercambiáveis.
  //
  // "Execução" no lugar de "a hora da prova": é mais preciso e é a palavra que o resto da
  // página usa para o eixo Y.
  function gargalo(r){
    var cBaixo = r.X < CORTE_X, pBaixo = r.Y < CORTE_Y;
    if(cBaixo && pBaixo){
      var faltaC = CORTE_X - r.X, faltaE = CORTE_Y - r.Y;
      // Diferença pequena é empate de verdade, e cravar um "pesa mais" nesse caso seria
      // inventar precisão que o instrumento não tem.
      var quase = Math.abs(faltaC - faltaE) < 8;
      var maior = faltaC >= faltaE ? 'conteúdo' : 'execução';
      return {
        nome:'conteúdo e execução',
        h1: quase
          ? 'Hoje você perde ponto por <em>conteúdo e execução</em>, em partes parecidas.'
          : 'Hoje você perde ponto por conteúdo e por execução, e <em>'+maior+'</em> pesa mais.',
        // Só o que a MEDIÇÃO diz. O princípio ("treinar só estratégia não recupera ponto
        // que falta de conteúdo") saiu daqui em 03/08: ele estava aqui E na abertura da
        // seção 2, quase palavra por palavra, porque as duas foram escritas no mesmo dia
        // sem passar pelo inventário. Princípio é seção 2; hero é número.
        exp: quase
          ? 'As duas pontas cederam num grau parecido: a matéria em si e a firmeza para decidir com o tempo correndo.'
          : (maior==='conteúdo'
              ? 'As duas pontas cederam, e a matéria cedeu mais: a diferença entre elas aparece nas respostas que você errou tendo tempo de sobra.'
              : 'As duas pontas cederam, e o que mais custou foi a execução: você errou mais no fim do relógio do que no começo dele.')};
    }
    if(cBaixo) return {
      nome:'conteúdo',
      h1:'Hoje, o que mais tirou seus pontos foi <em>conteúdo</em>.',
      exp:'O relógio não foi o principal motivo da sua nota. O padrão das suas respostas mostra que, neste momento, recuperar pontos depende mais de conteúdo do que de velocidade.'};
    if(pBaixo) return {
      nome:'execução',
      h1:'Hoje, o que mais tirou seus pontos foi a <em>execução da prova</em>.',
      exp:'A matéria você tem. O que aparece nas suas respostas é o que acontece com ela sob o relógio: hesitação, decisão apressada, e o ponto que escapa por isso.'};
    // "É o melhor resultado que este teste dá — e também o de menor alcance, porque uma
    // questão por matéria não alcança as outras 11" saiu do hero em 03/08: o alcance do
    // teste é a pergunta da seção 4, e antecipá-la aqui esvazia a seção inteira.
    return {
      nome:'nada, nestas 7',
      h1:'Nestas 7 questões, <em>nada cedeu</em>.',
      exp:'Nem a matéria nem o relógio: você acertou tudo o que respondeu, dentro do tempo. É o melhor resultado que este teste dá.'};
  }

  // Contexto compartilhado pelas duas telas do resultado. Existe porque em 02/08/2026 a
  // tela de resultado foi partida em duas: DIAGNÓSTICO (o que o teste achou, sem preço
  // nenhum) e SOLUÇÃO (a oferta). Antes era uma tela só, e a auditoria tinha apontado o
  // efeito: a oferta se disfarçava de continuação do diagnóstico e a etiqueta de preço
  // chegava no meio de uma tabela, sem aviso. Partida em duas, a oferta é uma coisa que
  // a pessoa PEDE, e o clique nesse pedido é um degrau novo de funil que dá para medir.
  function ctx(){
    var r=compute(), q=quadrant(r.X,r.Y,r), L=leituraMomento(q,r);
    // Checkout pré-preenchido com o que a pessoa já digitou: ela não encara o formulário
    // vazio de novo (é onde o funil perde gente).
    var digits=S.tel.replace(/\D/g,'');
    var fill='&name='+encodeURIComponent(S.nome)+
      (S.email?'&email='+encodeURIComponent(S.email):'')+
      (digits?'&phoneNumber='+encodeURIComponent(digits):'');
    // O trecho em itálico do título. Se 'hl' não estiver dentro de 'lab', o título sai
    // reto em vez de quebrar: substituição só acontece quando encontra.
    var h1=esc(q.lab);
    if(q.hl && q.lab.indexOf(q.hl)>=0) h1=h1.replace(esc(q.hl),'<em>'+esc(q.hl)+'</em>');
    if(!/[.!?]$/.test(q.lab)) h1+='.';
    return {
      r:r, q:q, L:L, h1:h1,
      nome: esc((S.nome.split(' ')[0])||'você'),
      buyUrl: CHECKOUT_URL+fill,
      forte: !!q.forte,
      erroN: CONTENT.length-r.c-r.estourou,
      // Mesma régua da manchete e do 'sabe'. A tabela não pode prometer "descobrir a
      // matéria" para quem o título acabou de absolver de falha de matéria.
      semFalhaDeMateria: perdaSeparada().mat===0,
      // A faixa de pagamento saiu da microcopy de 11,5px e virou linha própria: o Pix
      // é o que destrava quem não tem cartão com limite, e era a informação mais
      // escondida da página. O prazo de acesso passou a aparecer: a oferta.html sempre
      // disse "12 meses" e aqui só dizia "sem mensalidade", que lê como vitalício.
      // O total do parcelado sai escrito, sem ninguém perguntar. Para um público que
      // já se queimou com cursinho, mostrar o que a página poderia esconder compra
      // confiança, e ainda empurra para o Pix, que é melhor para os dois lados.
      PAGA:'<div class="pag"><span class="pix">Pix</span> <b>R$ 47</b> à vista '+
           '<span>ou '+PARCELA+' no cartão, '+TOTAL_PARCELADO+' no total</span></div>',
      MICRO:'pagamento único, sem mensalidade · acesso na hora, por 12 meses<br>7 dias de garantia',
      // No bloco final a garantia já está no selo, 20 pixels abaixo. Repetir ali era a
      // quarta aparição da mesma frase na mesma tela.
      MICRO_FIM:'pagamento único · acesso na hora'
    };
  }

  // Liga os botões de compra. Chamado só na tela de solução, que é a única que os tem.
  // Três coisas acontecem no clique, e a ORDEM importa:
  // 1. sck=<id do lead> entra na URL agora, e não na hora de montar o HTML, porque o id
  //    chega do banco depois do render. É ele que fecha lead -> venda dentro da Hotmart
  //    sem depender de casar e-mail.
  // 2. O InitiateCheckout dispara UMA VEZ por sessão. Quatro botões apontam para o mesmo
  //    checkout, e até 02/08/2026 quem clicava no do meio, voltava e clicava na barra
  //    fixa contava duas vezes. Com 2 checkouts no funil, um evento a mais é 50% de erro.
  //    Passou a vir antes do passo 3 porque é ele que decide se o servidor também manda
  //    o evento, e essa decisão viaja junto no mesmo beacon.
  // 3. O clique é gravado no banco, com o botão. O pixel diz quantos; isto diz quem —
  //    e, quando o passo 2 autorizou, leva de carona o id do evento e os cookies da
  //    Meta para o /api/clique repetir o checkout pela Conversions API.
  var icDisparado=false;
  function ligarCompra(){
    // 'buy2' saiu da lista em 03/08 junto com o link do Plano Completo. Sobraram os três
    // que apontam para o mesmo checkout de R$47: meio da oferta, bloco final e barra fixa.
    ['buy0','buy','buy3'].forEach(function(id){
      var el=document.getElementById(id);
      if(!el) return;
      el.onclick=function(){
        var oferta=parseInt(el.getAttribute('data-v'),10);
        if(LEAD_ID && el.href.indexOf('&sck=')<0) el.href = el.href + '&sck=' + encodeURIComponent(LEAD_ID);

        // O evento sai por dois caminhos: o pixel daqui e a Conversions API lá no
        // /api/clique, com nome, e-mail e telefone do lead, que o navegador não
        // manda. O `eventID` é o mesmo nos dois — é o que faz a Meta contar um
        // checkout, e não dois. Sem ele, o servidor duplicaria o que o pixel já
        // disse, que é justamente o erro corrigido em 02/08 por outro caminho.
        var extras=null;
        if(!icDisparado){
          icDisparado=true;
          extras={
            ic_event_id: 'ic-' + (LEAD_ID || 'x') + '-' + Date.now().toString(36),
            fbp: lerCookie('_fbp'),
            fbc: lerCookie('_fbc')
          };
          if(typeof fbq!=='undefined'){
            try{ fbq('track','InitiateCheckout',{value:oferta,currency:'BRL'},{eventID:extras.ic_event_id}); }catch(e){}
          }
        }
        marcarClique(id, oferta, extras);
      };
    });
  }

  // Barra fixa: só depois de 1,2 tela rolada, quando o primeiro CTA já saiu de vista.
  function ligarBarraFixa(){
    var stk=document.getElementById('stk'), visivel=false;
    if(!stk) return;
    function checarBarra(){
      var deve = window.scrollY > window.innerHeight*1.2;
      if(deve!==visivel){ visivel=deve; stk.className='sticky'+(deve?' on':''); }
    }
    if(window._stk) window.removeEventListener('scroll', window._stk);
    window._stk=checarBarra;
    window.addEventListener('scroll', checarBarra, {passive:true});
    checarBarra();
  }

  // ===== TELA 1: DIAGNÓSTICO =====
  // Nenhum preço, nenhum botão de compra, nenhum depoimento. Só o que o teste achou.
  // Termina no lockbox (o que ficou fechado) e na ponte para a solução, nessa ordem,
  // porque é o bloco rasurado que cria a pergunta que o botão responde.
  // ===== PÁGINA DE VENDAS v2 (handoff de 04/08/2026) =====
  // Redesenho visual completo. A ARQUITETURA não mudou: continua a mesma ordem por
  // pergunta e por evidência do INVENTARIO-mini-diagnostico.md, e nenhum bloco novo
  // responde pergunta que já tinha dono. O que entrou de novo:
  //   - resumo da oferta logo abaixo do hero, para quem já decidiu não precisar rolar
  //   - comentário da questão colapsado (a prova continua visível, o porquê é pedido)
  //   - FAQ, que responde objeção e não repete argumento de venda
  //   - barra fixa, que já existia, agora com o nome novo
  //
  // Duas divergências deliberadas em relação ao arquivo do handoff:
  //   1. TRAVESSÕES. O design usa "—" em várias frases; foram trocados por vírgula ou
  //      dois pontos, conforme pedido no mesmo dia. A regra vale para a página inteira.
  //   2. O handoff é estático, com "Gustavo, 2/7" fixo. Aqui tudo o que é resultado
  //      continua vindo das 33 variantes de copy, da poda e do cálculo dos dois eixos.
  function result(){
    var C=ctx(), r=C.r, q=C.q, L=C.L, forte=C.forte;
    var bx=barraConteudo(r), by=barraPressao(r);
    var vt=tempo(), vp=pressao(), vx=trocou();
    var g=gargalo(r);
    var d=diasParaProva();

    document.body.className='vendas';

    var GAT = /\s*(O que falta descobrir|O que resolve|O que falta|Então o que te derruba está no que|O que ele não mede|O que ela não mede|Isso responde uma pergunta e abre outra)\b/;
    function podar(t){
      t = String(t);
      var m = t.search(GAT);
      if(m <= 20) return t;
      var corte = t.slice(0, m).replace(/[,;:\s—-]+$/,'');
      return /[.!?]$/.test(corte) ? corte : corte + '.';
    }

    var html =

      // ===== BARRA DE MARCA =====
      '<header class="vtopo">'+
        '<div class="wm">SÓ O QUE CAI</div>'+
        '<div class="tg">1ª fase · OAB</div>'+
      '</header>'+

      // ===== 1. HERO — "por que perdi pontos?" · evidência numérica =====
      // O placar virou cartão dourado: é o número que a pessoa veio buscar, e ele
      // passa a ser a primeira coisa que o olho encontra depois da manchete.
      '<section class="vhero"><div class="in">'+
        '<div class="eyebrow gold">'+C.nome+' · seu resultado</div>'+
        (forte
          ? '<h1>Você acertou <em>7 de 7</em>. Excelente resultado.</h1>'
          : '<h1>'+g.h1+'</h1>')+
        '<div class="placar">'+
          '<div class="nota"><div class="n">'+r.c+'<span>/'+CONTENT.length+'</span></div>'+
            '<div class="lb">acertos</div></div>'+
          '<div class="eixos">'+
            '<div class="eixo"><span>'+esc(bx.rot)+'</span>'+
              '<b class="laranja">'+esc(bx.v)+'</b></div>'+
            '<div class="eixo"><span>'+esc(by.rot)+'</span>'+
              '<b class="azul">'+esc(by.v)+'</b></div>'+
          '</div>'+
        '</div>'+
        '<p class="lede">'+(forte
          ? 'Nestas '+CONTENT.length+' nada cedeu, nem a matéria nem o relógio. O que fica em aberto é se esse desempenho se mantém numa amostra maior e nas outras matérias da prova.'
          : 'Você acertou <strong>'+r.c+' de '+CONTENT.length+'</strong>'+
            (r.estourou? (C.erroN>0? ', errou '+C.erroN+' e estourou o tempo em '+r.estourou+'.'
                                   : (r.estourou>1? '. Nas outras '+r.estourou+' o tempo acabou antes de você marcar.'
                                                  : '. Na outra o tempo acabou antes de você marcar.'))
                       : '.')+' '+esc(g.exp))+'</p>'+
        (traduzMargem()? '<p class="lede margem">'+esc(traduzMargem())+'</p>' : '')+
        '<div class="micro">O teste mede esses dois fatores separadamente</div>'+
      '</div></section>'+

      // ===== RESUMO DA OFERTA — atalho para quem já decidiu =====
      // Não responde pergunta nova: é navegação. Por isso não tem argumento, só
      // nome, preço e um link para a seção que argumenta.
      '<section class="vresumo"><div class="cardres">'+
        '<div><div class="t">'+PRODUTO+'</div>'+
          '<div class="s">R$ 47 único · acesso na hora, por 12 meses · garantia de 7 dias</div></div>'+
        '<a href="#oferta" class="btn-lar" id="verof">Ver a oferta completa</a>'+
      '</div></section>'+

      // ===== 2. O QUE ISSO SIGNIFICA =====
      '<section class="vsec estreita">'+
        '<div class="eyebrow">O que isso significa</div>'+
        '<p class="p">O erro mais comum depois de um resultado como este é tentar resolver tudo ao mesmo tempo. Quando falta conteúdo, treinar só estratégia de prova não recupera ponto. Quando falta execução, estudar mais matéria também não resolve sozinho.</p>'+
        '<div class="callout">'+esc(podar(q.p1))+'</div>'+
        ((vt||vp||vx)? '<div class="obsgrid">'+
          (vx? '<div class="obs"><i>'+esc(vx.k)+'</i><p>'+vx.p+'</p></div>' : '')+
          (vt? '<div class="obs"><i>'+esc(vt.k)+'</i><p>'+vt.p+'</p></div>' : '')+
          (vp? '<div class="obs"><i>'+esc(vp.k)+'</i><p>'+vp.p+'</p></div>' : '')+
        '</div>' : '')+
        (L? '<p class="p sec">'+esc(podar(L.ponto))+'</p>' : '')+
      '</section>'+

      // ===== 3. QUESTÃO COMENTADA — prova do método =====
      // O comentário fica COLAPSADO. A questão, as alternativas e qual foi a resposta
      // dela continuam à vista: isso é a prova. O porquê é o que ela pede ao clicar,
      // e pedir é um sinal de interesse que a página não tinha como ler antes.
      '<section class="vsec estreita">'+
        '<div class="eyebrow">Como este diagnóstico pensa</div>'+
        '<h2>A palavra que a banca trocou nesta questão</h2>'+
        gabarito()+
        '<div class="vidlinha">'+
          '<span>Quer entender por que este diagnóstico existe?</span>'+
          '<a href="#" id="vplay">▶ 28 segundos</a>'+
        '</div>'+
        '<div class="vid" id="vwrap" hidden><video controls playsinline preload="none" poster="assets/video/diagnostico-explicado.jpg">'+
          '<source src="assets/video/diagnostico-explicado.mp4" type="video/mp4">'+
        '</video></div>'+
      '</section>'+

      // ===== 4. O QUE FALTA — só perguntas =====
      '<section class="vsec estreita">'+
        '<div class="eyebrow">Onde você cedeu</div>'+
        lockbox()+
      '</section>'+

      // ===== 5. A OFERTA =====
      '<section class="vsec larga" id="oferta">'+
        '<div class="eyebrow">Continue de onde este diagnóstico parou</div>'+
        '<h2 class="grande">'+PRODUTO+'</h2>'+
        '<p class="p">Por <strong>R$ 47</strong>, acesso imediato para transformar este diagnóstico em pontos na prova. O objetivo não é estudar mais: é estudar <strong>o que precisa</strong> e fazer a prova com uma estratégia melhor.</p>'+
        stackOferta()+
        bonusKit()+
        // Bloco de preço. Borda dourada de 2px é o único elemento da página com esse
        // tratamento: é o ponto onde a decisão acontece.
        '<div class="preco">'+
          '<div class="v">R$ 47 <span>no Pix · ou '+PARCELA+' no cartão ('+TOTAL_PARCELADO+')</span></div>'+
          '<a class="btn-lar grande" href="'+C.buyUrl+'" id="buy0" data-v="47">Quero descobrir exatamente o que corrigir: R$ 47</a>'+
          '<div class="micro2">pagamento único, sem mensalidade · acesso na hora, por 12 meses · garantia de 7 dias</div>'+
          '<div class="selo2">Seus dados não são vendidos</div>'+
        '</div>'+
      '</section>'+

      // ===== 6. DEPOIMENTOS — evidência social =====
      '<section class="vsec larga">'+
        '<div class="eyebrow">Quem já fez</div>'+
        '<h2>Três pessoas que estavam onde você está agora</h2>'+
        depoimentos()+
      '</section>'+

      // ===== 7 e 8. AUTORIDADE e RISCO, lado a lado =====
      '<section class="vsec larga"><div class="duo">'+
        '<div class="cardb">'+
          '<div class="eyebrow">Quem criou isto</div>'+
          '<div class="autorlinha">'+
            '<img src="assets/gustavo.webp" alt="Gustavo, advogado" width="72" height="72" loading="lazy">'+
            '<div><b>Gustavo</b><i>Advogado</i></div>'+
          '</div>'+
          '<p>“Gustavo, advogado. Também passei pela fase de estudar demais e ainda assim errar as questões erradas. Este diagnóstico nasceu justamente para separar falta de conteúdo de erro de execução.”</p>'+
        '</div>'+
        '<div class="cardn">'+
          '<div class="eyebrow gold">Sem risco</div>'+
          '<h3>Use o material inteiro. Só depois decida se valeu.</h3>'+
          '<p>Se em até 7 dias você concluir que ele não trouxe valor, basta pedir o reembolso. Sem perguntas e sem discussão. O risco é meu, não seu.</p>'+
        '</div>'+
      '</div></section>'+

      // ===== FAQ — objeção, não argumento =====
      // Cada pergunta aqui é uma dúvida operacional que trava a compra. Nenhuma
      // repete argumento que já foi feito acima: isso seria a quinta resposta para
      // uma pergunta que já tem dono.
      '<section class="vsec estreita">'+
        '<div class="eyebrow">Perguntas rápidas</div>'+
        '<div class="faq">'+FAQ.map(function(f,i){
          return '<div class="fitem" data-i="'+i+'">'+
            '<button class="fq" type="button"><span>'+esc(f.q)+'</span><i>+</i></button>'+
            '<div class="fa" hidden><p>'+esc(f.a)+'</p></div>'+
          '</div>';
        }).join('')+'</div>'+
      '</section>'+

      // ===== CTA FINAL =====
      '<section class="vfim">'+
        '<h2>Estudar o que precisa, não estudar mais.</h2>'+
        '<div class="pfim">R$ 47 à vista no Pix · ou '+PARCELA+' no cartão</div>'+
        '<a class="btn-lar grande" href="'+C.buyUrl+'" id="buy" data-v="47">Quero descobrir exatamente o que corrigir: R$ 47</a>'+
        '<div class="micro2">pagamento único · acesso na hora · garantia de 7 dias</div>'+
        '<div class="legal">Não é vinculado à FGV nem à OAB. Não promete aprovação: mostra direção. Seus dados não são vendidos.</div>'+
      '</section>'+

      // ===== BARRA FIXA =====
      '<div class="sticky" id="stk"><div class="in">'+
        '<div class="t"><div class="a">Diagnóstico Completo</div>'+
          '<div class="b">R$ 47 no Pix · ou '+PARCELA+'</div></div>'+
        '<a class="btn-lar" href="'+C.buyUrl+'" id="buy3" data-v="47">Quero descobrir o que corrigir</a>'+
      '</div></div>';

    app.innerHTML = html;
    ligarCompra();
    ligarBarraFixa();

    // Vídeo sob demanda: só entra no DOM quando pedido.
    var vp2=document.getElementById('vplay'), vw=document.getElementById('vwrap');
    if(vp2&&vw) vp2.onclick=function(e){ e.preventDefault(); vw.hidden=false; vp2.parentNode.hidden=true;
      try{ vw.querySelector('video').play(); }catch(err){} };

    // Comentário da questão. Fechado por padrão; o rótulo alterna.
    var gb=document.getElementById('gabtoggle'), gx=document.getElementById('gabexp');
    if(gb&&gx){
      // O rótulo de "fechado" nomeia a alternativa certa ("Ver por que a C é a certa"),
      // e a letra muda conforme a questão sorteada — então ele é guardado, não reescrito.
      var rotuloFechado = gb.textContent;
      gb.onclick=function(){
        var aberto = !gx.hidden;
        gx.hidden = aberto;
        gb.textContent = aberto ? rotuloFechado : 'Fechar comentário';
      };
    }

    // FAQ: um aberto por vez.
    Array.prototype.forEach.call(app.querySelectorAll('.fitem'), function(it){
      var b=it.querySelector('.fq'), a=it.querySelector('.fa'), sinal=it.querySelector('.fq i');
      b.onclick=function(){
        var vaiAbrir = a.hidden;
        Array.prototype.forEach.call(app.querySelectorAll('.fitem'), function(o){
          o.querySelector('.fa').hidden = true;
          o.querySelector('.fq i').textContent = '+';
          o.classList.remove('on');
        });
        if(vaiAbrir){ a.hidden=false; sinal.textContent='−'; it.classList.add('on'); }
      };
    });

    // Âncora suave do resumo até a oferta.
    var vo=document.getElementById('verof');
    if(vo) vo.onclick=function(e){
      e.preventDefault();
      var alvo2=document.getElementById('oferta');
      if(alvo2) alvo2.scrollIntoView({behavior:'smooth', block:'start'});
    };

    // Marca que chegou na oferta. Sem a ponte, o sinal é a seção entrar na tela.
    // Ver a nota longa da versão anterior: IntersectionObserver foi descartado por
    // não disparar de forma confiável, e medição que não dá para conferir não serve.
    var alvo=document.getElementById('oferta'), marcou=false;
    function marcarOferta(){
      if(marcou) return; marcou=true;
      marcarPasso('oferta');
      if(typeof fbq!=='undefined'){
        try{ fbq('track','ViewContent',{content_name:'oferta',value:47,currency:'BRL'}); }catch(e){}
      }
    }
    if(alvo){
      var conferir=function(){
        if(alvo.getBoundingClientRect().top < window.innerHeight*0.85){
          marcarOferta();
          window.removeEventListener('scroll', conferir);
          window.removeEventListener('resize', conferir);
        }
      };
      window.addEventListener('scroll', conferir, {passive:true});
      window.addEventListener('resize', conferir);
      conferir();
    }
  }

  render();
</script>
</body>
</html>
