<style>
  /* ===== TOKENS =====
     A ESTRUTURA da página de vendas vem do handoff "Página de Vendas v2" (04/08/2026),

     Os tokens abaixo são os originais da marca. Os quatro do fim existem porque a

  :root{
    --paper:#F3EEE4; --card:#FBF9F4; --ink:#231F1A; --muted2:#574F45; --muted:#8A8378;
    --line:#E4DBC9; --navy:#15212B; --ocre:#A65D1E; --ocre2:#C77A2B; --green:#3A7A5C;
    --red:#C0271A; --red2:#E8B4AE; --red3:#8E1A10;
    /* Tokens que a estrutura nova pede e que a identidade do site não tinha nome para.

    --navy2:#0F1920; --gold:#C77A2B; --laranja2:#8C4D18; --azul:#B9BEC4;
    --green2:#2C5C44; --sec:#574F45;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--paper);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:var(--ocre)} a:hover{color:#8F6114}
  ::selection{background:var(--gold);color:var(--navy)}
  .wrap{max-width:560px;margin:0 auto;padding:40px 22px 64px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
  .logo{display:flex;align-items:center}
  .logo svg{display:block;border-radius:8px}
  .word{font-family:'Spectral',serif;font-weight:600;font-size:21px}
  .tag{font-family:'Hanken Grotesk',sans-serif;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  h1{font-family:'Spectral',serif;font-weight:600;font-size:27px;line-height:1.18;letter-spacing:-.01em;margin-bottom:12px}
  h1 em{font-style:italic;color:var(--ocre)}
  .lead{font-size:16px;color:var(--muted2);margin-bottom:8px}
  .prog{font-family:'Hanken Grotesk',sans-serif;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
  .clock{display:inline-flex;align-items:center;gap:6px;font-family:'Hanken Grotesk',sans-serif;font-size:11px;color:var(--muted2)}
  .clock i{width:7px;height:7px;border-radius:50%;background:var(--ocre);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
  /* Cronômetro regressivo. Era um relógio crescente de 11px escondido na barra de
     progresso: sumia na tela. Agora é o elemento mais visível da questão, porque a
     pressão do relógio é metade do que este teste mede. */
  .timer{text-align:center;margin-bottom:16px}
  .timer .num{font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:40px;line-height:1;
    color:var(--red);font-variant-numeric:tabular-nums;display:inline-block;
    transition:transform .18s ease}
  .timer .bar{height:6px;border-radius:3px;background:var(--red2);overflow:hidden;margin-top:10px}
  .timer .bar i{display:block;height:100%;background:var(--red);border-radius:3px;
    width:100%;transform-origin:left center}
  /* Últimos 10s. Escala por transform e NÃO por font-size, para não empurrar o layout
     e fazer a questão pular embaixo do dedo da pessoa.
     Batida própria, e não o @keyframes pulse do pontinho: aquele vai a opacidade .2,
     e num número de 40px isso lê como "apagando", que é o oposto de urgência. Aqui a
     opacidade fica cheia e quem pulsa é a escala, como batimento. */
  @keyframes tictac{0%,100%{transform:scale(1.08)}50%{transform:scale(1.26)}}
  .timer.urgente .num{transform:scale(1.15);animation:tictac .9s infinite}
  .timer.urgente .bar i{background:var(--red3)}
  .timer .rule{font-family:'Hanken Grotesk',sans-serif;font-size:9.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--muted);margin-top:8px}
  /* Progresso. Antes era uma linha cinza de 9,5px embaixo de um número vermelho de 40px:
     sumia. Só que saber que falta pouco é justamente o que segura quem cansa na quinta
     questão, e quem desiste no meio não vira lead. Os sete traços dizem isso sem texto. */
  /* Bloco de confiança. O lead do funil B vem do anúncio direto para o quiz e NUNCA
     passa pela landing: ele clica em pagar sem ter visto depoimento, garantia nem quem
     está por trás. Tudo isso já existe, a um bloco de distância, e não estava sendo
     trazido. Vai ANTES da oferta, porque confiança vem antes do pedido de dinheiro. */
  .confia{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:20px}
  .confia .autor{margin-top:0;background:none;border:none;padding:0;border-radius:0}
  .confia .dep{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted2);line-height:1.55}
  .confia .dep .quem{display:block;margin-top:7px;font-family:'Hanken Grotesk',sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .confia .gar{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted2);line-height:1.55}
  .confia .gar b{color:var(--green)}
  /* Tabela de custo, duas colunas. A esquerda é longa e cara, a direita é curta e barata:

  .custo{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .custo .lin{display:grid;grid-template-columns:1fr 1fr}
  .custo .lin+.lin{border-top:1px solid var(--line)}
  .custo .lin>div{padding:11px 13px;font-size:13.5px;line-height:1.42}
  .custo .lin>div:first-child{border-right:1px solid var(--line);color:var(--muted2)}
  .custo .lin>div:last-child{color:var(--ink);font-weight:500}
  .custo .cab>div{font-family:'Hanken Grotesk',sans-serif;font-size:9.5px;letter-spacing:.08em;
    text-transform:uppercase;padding:9px 13px;font-weight:700}
  .custo .cab>div:first-child{background:#F7E8E5;color:var(--red3)}
  .custo .cab>div:last-child{background:#E9F1EA;color:var(--green)}
  /* CTA enxuto logo depois do veredito. O preço só aparecia no 6º bloco de 7. */
  /* Faixa de quem ja fez o teste (06/08/2026). Discreta: e um aviso, nao uma

  .voltafaixa #vf-ver{background:var(--navy);border-color:var(--navy);color:#fff}
  .voltafaixa button:hover{border-color:var(--gold)}
  /* Centralizado desde 06/08/2026, a pedido: o botao e inline-block e ficava

  .ctaslim{margin:18px 0 6px;text-align:center}
  /* Destaque do Kit (06/08/2026). Fundo levemente mais quente e uma barra ocre na
     lateral: chama atencao sem borda dourada, que e tratamento exclusivo do bloco
     de preco. A faixa do calendario e a linha que carrega a urgencia, entao ela e

  .kitdestaque{border-left:3px solid var(--ocre2);background:var(--card)}
  .kitdestaque h4{font-family:'Source Serif 4',Georgia,serif;font-size:17px;color:var(--navy)}
  .kitfaixa{margin:0 0 8px;font-size:13.5px;font-weight:600;color:var(--ocre)}

  .timer .prog7{display:flex;gap:4px;justify-content:center;margin-bottom:9px}

  /* Cor sozinha não pode carregar o sinal, por daltonismo: o tamanho, a barra drenando
     e o próprio número já carregam em paralelo. Aqui só se desliga o movimento. */
  @media (prefers-reduced-motion: reduce){
    .timer.urgente .num{animation:none}
    .clock i{animation:none}
    .load .mark{animation:none}
  }
  /* Tela de apuração, entre o formulário e o resultado. Entrou em 02/08/2026 por dois
     motivos, e o segundo é o que decidiu:
     1. Resultado que aparece no mesmo instante do clique lê como tabela pronta. A pessoa
        acabou de gastar 4 minutos cronometrados; ver o cálculo acontecer é o que faz o
        resultado parecer dela.
     2. O id do lead volta do banco DEPOIS do render, e é ele que monta o sck= no

  .load{display:flex;flex-direction:column;align-items:center;justify-content:center;
        text-align:center;min-height:56vh;padding:0 8px}
  .load .mark{width:46px;height:46px;margin-bottom:26px;animation:respira 1.6s ease-in-out infinite}
  @keyframes respira{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.09);opacity:1}}
  .load .st{font-size:17px;font-weight:500;color:var(--ink);margin-bottom:20px;min-height:1.5em;

  .load .st.sai{opacity:0}
  .load .tr{width:100%;max-width:290px;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
  .load .tr i{display:block;height:100%;width:4%;border-radius:99px;

  .load .pe{margin-top:22px;font-family:'Hanken Grotesk',sans-serif;font-size:11px;
            letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .qbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px}

  .opt:hover{border-color:var(--ocre2)}
  .opt.sel{border-color:var(--ocre);background:#FBF1E6}
  /* O botão de confirmar da Parte 1 viveu poucas horas em 03/08/2026 e saiu no mesmo dia,

     trecho mais barato de abandonar. O clique na alternativa voltou a fechar a questão. */
  /* Vídeo em uma linha (03/08/2026). Era uma seção inteira, com título e legenda, o que
     fazia dele um degrau no meio do fluxo. Agora é um convite: quem quer, clica; quem

  .fecho-obj{margin-top:20px;padding:15px 17px;border-left:3px solid var(--ocre2);

     Escopo em body.vendas: o quiz continua com o layout e a paleta de sempre.
     Os tokens abaixo SOBRESCREVEM os de :root só dentro de body.vendas — CSS
     custom property em cascata, não rename global — porque as mesmas variáveis
     (--navy, --ocre, --gold...) são usadas nas telas de pergunta com os valores
     antigos. Reescrever :root mudaria o quiz inteiro; sobrescrever aqui muda só
     esta tela. Cores e tipografia batendo com o handoff, literal:
       navy #14304A · navy escuro (topo/CTA final) #0E2233 · dourado #F0B429
       dourado escuro, eyebrow/link #B07B1E, hover #8F6114
       laranja, ação/alerta #E07B39, hover #C9662A · azul claro #BFDCEE
       fundo #F7F4EE · cartão #FFFFFF · borda #E3DCCD
       texto principal #14304A · secundário #5B6B78 · riscado #A39B8A
       Cinzel (wordmark) · Source Serif 4 (títulos e números) · Source Sans 3 (corpo)
     ========================================================================== */
  body.vendas{
    --navy:#14304A; --navy2:#0E2233; --gold:#F0B429;
    --ocre:#B07B1E; --ocre2:#E07B39; --laranja2:#C9662A;
    --azul:#BFDCEE; --paper:#F7F4EE; --card:#FFFFFF; --line:#E3DCCD;
    --ink:#14304A; --sec:#5B6B78; --muted:#A39B8A; --green:#4E7A4E;
    background:var(--paper);padding-bottom:96px;
    font-family:'Source Sans 3',sans-serif;
  }
  body.vendas .wrap{max-width:none;padding:0}

  .vtopo{background:var(--navy2);color:var(--paper);display:flex;justify-content:space-between;
         align-items:center;padding:14px 24px;gap:12px}
  .vtopo .wm{display:flex;align-items:center;gap:10px}
  .vtopo .wm svg{display:none}
  .vtopo .wm span{font-family:'Cinzel',serif;font-weight:600;font-size:16px;
                  letter-spacing:3px;text-transform:uppercase}
  .vtopo .tg{font-family:'Source Sans 3',sans-serif;font-size:12px;letter-spacing:2.5px;
             color:var(--azul);text-transform:uppercase}

  /* ---- hero ---- */
  .vhero{background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);
         color:var(--paper);padding:56px 24px 64px}
  .vhero .in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
  .vhero h1{font-family:'Source Serif 4',Georgia,serif;font-size:38px;line-height:1.2;
            font-weight:700;text-wrap:pretty;margin:0}
  .vhero h1 em{font-style:italic;color:var(--gold)}
  .eyebrow{font-family:'Source Sans 3',sans-serif;font-size:12px;letter-spacing:3px;
           text-transform:uppercase;font-weight:700;color:var(--ocre)}
  .eyebrow.gold{color:var(--gold)}
  .placar{display:flex;gap:16px;flex-wrap:wrap;align-items:stretch}
  /* O placar é cartão dourado porque é o número que a pessoa veio buscar: tem que
     ser a primeira coisa que o olho encontra depois da manchete. */
  .placar .nota{flex:0 0 auto;background:var(--gold);color:var(--navy);border-radius:10px;
                padding:20px 28px;display:flex;flex-direction:column;justify-content:center;
                align-items:center;gap:2px}
  .placar .nota .n{font-family:'Source Serif 4',Georgia,serif;font-size:52px;font-weight:700;line-height:1}
  .placar .nota .n span{font-size:26px;font-weight:400}
  .placar .nota .lb{font-family:'Source Sans 3',sans-serif;font-size:12px;letter-spacing:2px;
                    text-transform:uppercase;font-weight:700}
  /* A comparação com os outros. Fica dentro do cartão dourado, colada no número,
     porque é o número que ela qualifica. Sem caixa alta e sem peso: é referência,
     não veredito. */
  .placar .nota .lbcomp{font-family:'Source Sans 3',sans-serif;font-size:11.5px;
                        line-height:1.3;text-align:center;max-width:150px;
                        color:rgba(20,48,74,.78);margin-top:4px}
  .placar .eixos{flex:1;min-width:220px;display:flex;flex-direction:column;gap:12px}
  .placar .eixo{background:rgba(247,244,238,.08);border:1px solid rgba(191,220,238,.3);
                border-radius:10px;padding:14px 18px;display:flex;justify-content:space-between;
                align-items:center;gap:12px;font-size:15px}
  .placar .eixo b{font-size:12px;font-weight:700;letter-spacing:1.5px;padding:4px 10px;
                  border-radius:4px;white-space:nowrap}
  .placar .eixo b.laranja{background:var(--ocre2);color:#fff}
  .placar .eixo b.azul{background:var(--azul);color:var(--navy)}
  .vhero .lede{font-size:17px;line-height:1.6;color:var(--azul);max-width:600px;margin:0}
  .vhero .lede strong{color:var(--paper)}
  .vhero .lede.margem{font-size:15px;opacity:.85}
  /* ---- perfil provável (04/08) ---- */
  .vhero .perfil{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .vhero .perfil .pl{font-family:'Source Sans 3',sans-serif;font-size:11px;letter-spacing:2px;
                     text-transform:uppercase;color:rgba(191,220,238,.6)}
  .vhero .perfil .pill{background:rgba(224,123,57,.2);border:1px solid var(--ocre2);
                       color:var(--paper);border-radius:999px;padding:5px 14px;
                       font-size:13px;font-weight:700}
  .vhero .perfil .pt{font-size:13px;color:rgba(191,220,238,.75)}
  .vhero .micro{font-family:'Source Sans 3',sans-serif;font-size:10px;letter-spacing:2px;
                text-transform:uppercase;color:rgba(191,220,238,.6)}

  /* ---- resumo flutuante ---- */
  .vresumo{max-width:760px;margin:-28px auto 0;padding:0 24px;position:relative;z-index:2}
  .cardres{background:var(--card);border:1px solid var(--line);border-radius:12px;
           box-shadow:0 8px 24px rgba(14,34,51,.10);padding:20px 24px;display:flex;
           justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  .cardres .t{font-family:'Source Serif 4',Georgia,serif;font-size:19px;font-weight:700}
  .cardres .s{font-size:14px;color:var(--sec);margin-top:4px}

  /* ---- botões ---- */
  .btn-lar{display:inline-block;background:var(--ocre2);color:#fff;text-decoration:none;
           font-weight:700;font-size:15px;padding:12px 22px;border-radius:8px;
           white-space:nowrap;border:none;cursor:pointer;transition:.15s;text-align:center}
  .btn-lar:hover{background:var(--laranja2);color:#fff}
  .btn-lar.grande{font-size:18px;padding:16px 36px;border-radius:10px;white-space:normal}

  /* ---- seções ---- */
  .vsec{margin:0 auto;padding:56px 24px 8px;display:flex;flex-direction:column;gap:20px}
  .vsec.estreita{max-width:680px}
  .vsec.larga{max-width:960px}
  .vsec h2{font-family:'Source Serif 4',Georgia,serif;font-size:26px;font-weight:700;line-height:1.25}
  .vsec h2.grande{font-size:32px}
  .vsec h2.apos{margin-top:12px}
  /* Seção de depoimentos: cabeçalho centralizado, igual ao handoff. */
  .vsec.centro>.eyebrow, .vsec.centro>h2{text-align:center}
  .vsec .p{font-size:17px;line-height:1.65;margin:0}
  .vsec .p.sec{color:var(--sec)}
  .callout{background:var(--card);border-left:4px solid var(--gold);border-radius:0 10px 10px 0;
           padding:16px 20px;font-family:'Source Serif 4',Georgia,serif;font-size:19px;
           font-weight:600;line-height:1.45}
  /* No celular este bloco chega a 77 palavras e 418 px, quase meia tela, e vem logo
     depois de um paragrafo de 45. Serifado em 19px seminegrito nesse comprimento deixa
     de ser destaque e vira muro, no ponto em que a pessoa acabou de receber o veredito
     e ainda esta decidindo se continua rolando. O texto e bom e nao muda: o que muda e
     o peso. A borda dourada continua fazendo o trabalho de dizer "isto importa". */
  @media (max-width:560px){
    .callout{font-size:17px;font-weight:500;line-height:1.5;padding:15px 17px}
  }
  .obsgrid{display:flex;flex-direction:column;gap:12px}
  .obs{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;
       display:flex;gap:14px;align-items:flex-start}
  .obs i{font-style:normal;font-family:'Source Sans 3',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;
         text-transform:uppercase;color:var(--ocre2);flex:0 0 84px;padding-top:3px}
  .obs p{font-size:15px;line-height:1.55;color:var(--sec);margin:0}

  /* ---- a régua (04/08) ---- */
  .regua{background:var(--navy);color:var(--paper);padding:56px 24px;margin-top:48px}
  .regua .in{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
  .regua .rtop{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
  .regua .rnum{flex:0 0 auto;background:var(--gold);color:var(--navy);border-radius:12px;
               padding:22px 30px;text-align:center}
  .regua .rnum .n{font-family:'Source Serif 4',Georgia,serif;font-size:50px;font-weight:700;line-height:1}
  .regua .rnum .n span{font-size:26px;font-weight:400}
  .regua .rnum .lb{font-family:'Source Sans 3',sans-serif;font-size:11px;letter-spacing:2px;
                   text-transform:uppercase;font-weight:700;margin-top:4px}
  .regua h2{flex:1;min-width:280px;font-family:'Source Serif 4',Georgia,serif;font-size:32px;
            line-height:1.25;font-weight:700;margin:0}
  .regua p{font-size:17px;line-height:1.6;color:var(--azul);max-width:640px;margin:0}
  .regua .rcall{background:rgba(247,244,238,.07);border:1px solid rgba(191,220,238,.25);
                border-radius:10px;padding:18px 22px;font-family:'Source Serif 4',Georgia,serif;
                font-size:19px;line-height:1.5;font-weight:600}

  /* ---- gabarito ---- */
  .gab{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .gab .mat{font-family:'Source Sans 3',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
            color:var(--ocre);padding:16px 18px 0}
  .gab .q{font-size:16px;line-height:1.5;font-weight:600;padding:8px 18px 14px}
  .gab .alt{margin:0 18px 8px;padding:10px 14px;border-radius:8px;background:var(--paper);
            font-size:14.5px;line-height:1.45;border:1px solid transparent}
  .gab .alt.sua{background:#FBEDE2;border-color:var(--ocre2)}
  .gab .alt.certa{background:#EAF3EA;border-color:var(--green)}
  .gab .notagab{padding:0 18px 8px;font-size:14px;color:var(--sec)}
  .gab .exp{margin:6px 18px 14px;padding:14px 16px;background:var(--paper);border-radius:8px;
            font-size:14.5px;line-height:1.6;color:var(--sec)}
  .gab .exp b{color:var(--ink)}
  .gabbtn{display:block;width:100%;background:var(--navy);color:var(--gold);border:none;
          padding:14px 18px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;
          text-align:center;transition:.15s}
  .gabbtn:hover{background:var(--navy2)}

  /* ---- cartões ---- */
  .cardb{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
  .cardb.pequeno h4{font-family:'Source Serif 4',Georgia,serif;font-size:18px;font-weight:700;margin-bottom:6px}
  .cardb.pequeno p{font-size:14px;line-height:1.55;color:var(--sec);margin:0}
  .cardn{background:var(--navy);color:var(--paper);border-radius:10px;padding:22px 24px}
  .cardn h3{font-family:'Source Serif 4',Georgia,serif;font-size:20px;font-weight:700;
            line-height:1.3;margin:8px 0 10px}
  .cardn p{font-size:15px;line-height:1.6;color:var(--azul);margin:0}
  /* O fecho da garantia: a conta dos 7 dias contra o calendario da prova. Separado por
     um filete porque e argumento, e o paragrafo acima e a regra. */
  .cardn p.gfecho{margin-top:14px;padding-top:12px;border-top:1px solid rgba(243,238,228,.22);
                  font-size:14px;color:var(--gold)}
  .grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}

  /* ---- rota em 5 etapas (04/08) ---- */
  .rota{display:flex;flex-direction:column;gap:12px}
  .rota .step{background:var(--card);border:1px solid var(--line);border-radius:12px;
             padding:20px 24px;display:flex;gap:18px;align-items:flex-start}
  .rota .step .n{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--navy);
                 color:var(--gold);display:flex;align-items:center;justify-content:center;
                 font-size:16px;font-weight:700}
  .rota .step .tt{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .rota .step .tt b{font-family:'Source Serif 4',Georgia,serif;font-size:19px;font-weight:700}
  .rota .step .tt i{font-style:normal;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
                    color:var(--sec);font-weight:700}
  .rota .step p{font-size:15px;line-height:1.55;color:var(--sec);margin:6px 0 0}

  /* ---- quadrante dos 4 perfis (04/08) ---- */
  .quad{background:var(--card);border:1px solid var(--line);border-radius:12px;
       padding:22px 24px;display:flex;flex-direction:column;gap:10px}
  .quad .ax{font-family:'Source Sans 3',sans-serif;font-size:11px;letter-spacing:1.5px;
           text-transform:uppercase;color:var(--sec);font-weight:700}
  .quad .ax.right{text-align:right}
  .quad .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .quad .cell{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .quad .cell b{display:block;font-family:'Source Serif 4',Georgia,serif;font-size:17px;font-weight:700}
  .quad .cell p{font-size:13px;line-height:1.5;color:var(--sec);margin-top:6px}
  .quad .cell.green{background:#EAF3EA;border-color:#4E7A4E}
  .quad .cell.here{background:#FBEDE2;border:2px solid var(--ocre2)}
  /* No celular as duas colunas ficam com 145 px, e 36 px disso é padding: sobram 109 px
     para um título serifado de 17 px. "Pronta de verdade" saía em TRÊS linhas e "Sabe
     mas trava" também, o que faz o quadrante, que é o único gráfico da página, parecer
     quebrado justo onde ele deveria ser lido de relance. Não dá para empilhar as
     células: um quadrante empilhado deixa de ser um quadrante. Então aperta o padrão e
     a tipografia só onde o espaço aperta. */
  @media (max-width:420px){
    .quad .cell{padding:12px 13px}
    .quad .cell b{font-size:15px}
    .quad .cell p{font-size:12.5px;margin-top:5px}
  }
  .quad .cell .badge{display:inline-block;background:var(--ocre2);color:#fff;font-size:10px;
                     font-weight:700;letter-spacing:1.5px;padding:3px 8px;border-radius:4px;
                     margin-left:6px;white-space:nowrap;vertical-align:middle}

  /* ---- provas de tela (04/08) ----
     Até aqui a única imagem da página era o rosto de quem assina: a oferta listava
     seis entregas e não mostrava nenhuma delas. São prints da ferramenta real, e o
     alinhamento ao topo é de propósito — as três têm alturas diferentes e forçar a
     mesma altura cortaria justamente o miolo que serve de prova. */
  .provas{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
          gap:18px;margin-top:18px;align-items:start}
  .provas figure{margin:0}
  /* video entra na mesma regra da imagem: a figura do meio nao pode ter moldura
     diferente das outras duas so por ser video. */
  .provas img,.provas video{display:block;width:100%;height:auto;border:1px solid var(--line);
              border-radius:10px;background:var(--card)}
  .provas figcaption{font-size:13px;line-height:1.5;color:var(--sec);margin-top:9px}
  .provas figcaption b{color:var(--ink);font-weight:600}
  .provas-nota{font-size:12.5px;line-height:1.5;color:var(--muted);margin-top:12px}

  /* ---- onde cedeu ---- */
  .cardn.cedeu{display:flex;flex-direction:column;gap:4px}
  .cardn .cnum{font-family:'Source Serif 4',Georgia,serif;font-size:38px;font-weight:700;
               line-height:1;color:var(--gold)}
  .cardn .cnum span{font-size:20px;font-weight:400;color:var(--azul)}
  .cardn .clb{font-family:'Source Sans 3',sans-serif;font-size:11px;letter-spacing:1.5px;
              text-transform:uppercase;color:var(--azul)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{background:var(--card);border:1px solid var(--line);border-radius:999px;
        padding:6px 14px;font-size:14px;font-weight:600;color:var(--ink)}
  .chip.fraco{font-weight:400;color:var(--sec)}
  .chip.fraco b{color:var(--ink)}
  .riscado .ri{font-size:16px;line-height:1.5;color:var(--muted);text-decoration:line-through;
               padding:7px 0;border-top:1px solid var(--line)}
  .riscado .ri:first-child{border-top:none;padding-top:0}
  .riscado .ripe{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
                 font-size:13px;line-height:1.55;color:var(--sec)}

  /* ---- bônus ---- */
  .bonus{background:var(--navy);border-radius:12px;padding:24px 26px;color:var(--paper)}
  .btopo{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .btopo .bk{font-family:'Source Sans 3',sans-serif;font-size:12px;font-weight:700;
             letter-spacing:2.5px;text-transform:uppercase;color:var(--gold)}
  .bdias{background:var(--ocre2);color:#fff;font-size:12px;font-weight:700;padding:5px 12px;
         border-radius:4px;white-space:nowrap}
  .bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:16px}
  /* Cartão branco sobre o container navy, não translúcido-sobre-navy: a versão
     anterior (rgba(247,244,238,.07) em cima de #14304A) lia como "tudo azul" —
     baixo contraste entre título dourado e fundo quase-navy. Branco isola cada
     cartão e devolve contraste de verdade ao título e ao corpo do texto. */
  .bcard{background:#fff;border:1px solid rgba(255,255,255,.15);
         border-radius:10px;padding:14px 16px}
  .bcard .bh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .bcard .bh b{font-family:'Source Serif 4',Georgia,serif;font-size:17px;color:var(--navy)}
  .bcard .bh i{font-style:normal;font-size:12px;color:var(--sec)}
  .bcard p{font-size:14px;line-height:1.55;color:var(--ink);margin-top:8px}
  .bpe{margin-top:14px;font-size:13px;line-height:1.6;color:rgba(191,220,238,.8)}

  /* ---- preço ---- */
  .preco{background:var(--card);border:2px solid var(--gold);border-radius:14px;
         padding:32px 26px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
  .preco .v{font-family:'Source Serif 4',Georgia,serif;font-size:46px;font-weight:700;line-height:1}
  .preco .v span{font-family:'Source Sans 3',sans-serif;font-size:15px;font-weight:400;color:var(--sec)}
  .micro2{font-size:13px;color:var(--sec)}
  .selo2{border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:13px;color:var(--sec)}

  /* ---- por que hoje (04/08) ----
     Fica antes do preço, não depois: é o último empurrão antes do CTA, não uma
     justificativa depois do clique. A régua é calendário, nunca escassez de vaga
     nem preço que sobe — o preço é dito igual nos três cartões: continua R$ 47.
     Cartão navy translúcido, igual ao bloco de bônus: é a mesma família visual do
     handoff (item 10 do README), navy #14304A com sub-cartões em rgba(247,244,238,.07). */
  .hoje{background:var(--navy);border-radius:12px;padding:24px 26px;color:var(--paper)}
  .hoje .hk{font-family:'Source Sans 3',sans-serif;font-size:12px;font-weight:700;
            letter-spacing:2.5px;text-transform:uppercase;color:var(--gold)}
  .hoje .hp{font-size:16px;line-height:1.6;color:var(--azul);margin-top:12px}
  .hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:16px}
  /* Mesmo ajuste de contraste do .bcard: branco sobre navy, não translúcido. */
  .hcard{background:#fff;border:1px solid rgba(255,255,255,.15);
         border-radius:10px;padding:16px 18px}
  .hcard b{display:block;font-family:'Source Serif 4',Georgia,serif;font-size:22px;font-weight:700;color:var(--navy)}
  .hcard p{font-size:14px;line-height:1.5;color:var(--sec);margin-top:6px}

  /* ---- objeção de dinheiro (04/08) ----
     Fica DEPOIS do preço, de propósito: quem já viu o valor e travou é quem
     precisa desta saída, não quem ainda não chegou lá. Borda tracejada marca
     que é conversa, não mais um argumento de venda. */
  .objecao{background:var(--card);border:1px dashed var(--ocre);border-radius:12px;
           padding:22px 24px;text-align:left}
  .objecao h3{font-family:'Source Serif 4',Georgia,serif;font-size:20px;font-weight:700}
  .objecao>p{font-size:15px;line-height:1.6;color:var(--ink);margin-top:10px}
  .objecao ul{list-style:none;margin-top:12px;display:flex;flex-direction:column;gap:9px}
  .objecao li{font-size:15px;line-height:1.55;color:var(--ink)}
  .objecao li b{color:var(--ink)}
  .objecao a.wa{display:inline-block;margin-top:12px;font-size:14px;font-weight:700;color:var(--ink)}
  .objecao a.wa:hover{color:var(--ocre)}

     que nenhum JS emite mais (só gabarito(), que usa a definição de .gab lá em
     cima, no bloco da página de vendas v2), e por vir depois no CSS vencia por
     ordem — o cartão da questão comentada estava com o padding e as cores da
     versão de 02/08, não do handoff atual. */

     para dar curiosidade; só a RESPOSTA é rasurada. */
  .lockbox{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:18px;background:var(--card)}
  .lockbox .head{font-family:'Hanken Grotesk',sans-serif;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);padding:14px 20px 4px}

  /* .obs, .obs.ochre/.green, .deps e .dep2* saíram daqui em 04/08/2026: são do
     resultado v3 (body.res), que não existe mais em lugar nenhum do JS — mas os
     nomes de classe são os MESMOS que a página de vendas atual usa (body.vendas),
     e por virem depois no CSS, venciam por ordem e pisavam no visual novo (o
     .dep2 .asp virava var(--ocre2) em vez do dourado do handoff, por exemplo).
     Definição real de .obs/.deps/.dep2 está lá em cima, no bloco da página de
     vendas v2. Resto deste bloco (.vid etc.) continua em uso, então não sai. */
  .vid{position:relative;width:min(300px,78%);margin:0 auto;aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:var(--navy)}
  .vid video{width:100%;height:100%;object-fit:cover;display:block}
  .vidleg{font-family:'Hanken Grotesk',sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:10px}
  .autor2{display:flex;align-items:flex-start;gap:16px}
  .autor2 img{width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:50% 22%;flex-shrink:0;border:2px solid var(--line)}
  .autor2 .k{font-family:'Hanken Grotesk',sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .autor2 p{font-size:15px;line-height:1.55;color:var(--muted2);text-wrap:pretty}
  .gar2{border-top:1px solid var(--line);margin-top:20px;padding-top:18px;font-size:14.5px;line-height:1.55;color:var(--muted2);text-wrap:pretty}
  .gar2 b{color:var(--green)}
  .ofim{margin-top:44px;background:var(--navy);border-radius:20px;padding:30px 24px;text-align:center}
  .ofim .k{font-family:'Hanken Grotesk',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ocre2);margin-bottom:12px}
  .ofim h3{font-family:'Spectral',serif;font-weight:600;font-size:clamp(23px,6vw,29px);line-height:1.16;color:#fff;margin-bottom:14px;text-wrap:pretty}
  .ofim p{font-size:15px;line-height:1.6;color:#C9C1B4;margin-bottom:22px;text-wrap:pretty}
  .ofim .rbtn{box-shadow:0 14px 30px -14px rgba(0,0,0,.8)}
  .ofim .rbtn:hover{background:var(--ocre2)}
  .ofim .rmicro{color:#E7CFA8;margin-top:12px}
  .selo{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:11px 14px;border:1px solid #2C3B48;border-radius:11px;background:#1B2934}
  .selo svg{flex-shrink:0}
  .selo span{font-size:13px;line-height:1.4;color:#C9C1B4;text-align:left}
  .selo b{color:#7FB99A}
  .upsell{display:inline-block;margin-top:18px;font-size:13.5px;color:#C9C1B4;text-decoration:underline}
  .upsell:hover{color:#fff}
  .rfoot{margin-top:28px;font-size:11.5px;line-height:1.5;color:var(--muted);text-align:center}
  /* Barra fixa de compra. Só aparece depois de 1,2 tela de rolagem: antes disso o
     primeiro CTA ainda está visível e a barra seria redundante e agressiva. */
  .sticky{position:fixed;left:0;right:0;bottom:0;background:rgba(243,238,228,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:20;transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.7,.3,1)}
  .sticky.on{transform:none}
  .sticky .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .sticky .t{flex:1;min-width:0}
  .sticky .t .a{font-size:14px;font-weight:600;line-height:1.25}
  .sticky .t .b{font-family:'Hanken Grotesk',sans-serif;font-size:11px;color:var(--muted)}
  .sticky a{background:var(--ocre);color:#fff;border-radius:11px;padding:14px 20px;font-size:15.5px;font-weight:600;text-decoration:none;white-space:nowrap}
  .sticky a:hover{background:#8c4d18;color:#fff}
  @media (prefers-reduced-motion: reduce){ .sticky{transition:none} }
</style>

<body>
<div class="wrap">
  <div class="brand">
    <span class="logo"><svg width="28" height="28" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#15212B"/><g stroke="#F3EEE4" stroke-width="2.4" fill="none"><circle cx="16" cy="16" r="7.2"/><path d="M16 4.5v4M16 23.5v4M4.5 16h4M23.5 16h4"/></g><circle cx="16" cy="16" r="3" fill="#C77A2B"/></svg></span>
    <span class="word">Só o que Cai</span>
    <span class="tag">1ª fase · OAB</span>
  </div>
  <div id="app"></div>
  <!-- O aviso de não vinculação existia na oferta.html e na plano-completo.html e
       faltava justamente aqui, que é a página que recebe todo o tráfego pago. -->
  <div class="foot">Mini-diagnóstico gratuito. Não é vinculado à FGV nem à OAB. Seus dados não são vendidos.</div>
</div>

<script>
  // ===== CONFIGURAR =====
  var CHECKOUT_URL = "https://pay.hotmart.com/B106546831I?checkoutMode=10"; // diagnóstico completo R$47 + Order Bump Kit Reta Final
  /* O checkout do Plano Completo (R$127) NÃO mora aqui, e já saiu duas vezes.
     03/08: saiu porque esta página vende UMA coisa, o R$47. O R$127 é upsell
            pós-compra na Hotmart, onde o compromisso está no pico.
     07/08: voltou por algumas horas, com o argumento de que a venda espontânea de
            R$170,90 daquele dia provava demanda de subir de tier, e o líquido do
            Completo (R$113,43 contra R$41,35) pagaria bem. Foi retirado no mesmo dia,
            por decisão do Gustavo.
     Antes de propor pela terceira vez, o que a tentativa de 07/08 ensinou: mesmo com a
     moldura aditiva ("se você quiser as 17 matérias") e posicionado depois do preço,
     o bloco criou uma fila de TRÊS ofertas seguidas (R$47, Kit sem preço, R$127) e pôs
     um item sem preço entre dois com preço. O ganho por unidade era real; o custo era
     transformar o momento da decisão num cardápio. Está no histórico do git, em
     7538d99 e 96a154a, com o texto pronto, se um dia houver número que justifique. */
  // Para onde enviar os leads (nome/e-mail/WhatsApp). Cole aqui um endpoint de formulário
  // (ex.: Formspree, um Apps Script do Google, ou a API da sua ferramenta de e-mail).
  // Enquanto estiver vazio, o lead é só guardado no navegador (localStorage) e nada é perdido,
  // mas você precisa ligar isto para receber os contatos de verdade.
  var CAPTURE_URL = "https://formspree.io/f/mlgyzdwj"; // Formspree: so o aviso por e-mail
  var BASE_URL = "https://app.sooquecai.online/api/lead"; // fonte de verdade do lead
  // Marca na linha do lead que ele clicou em comprar. Em 02/08/2026 havia 29 cliques
  // em comprar e zero venda, e nenhuma forma de saber QUEM clicou: o pixel só conta.
  var CLIQUE_URL = "https://app.sooquecai.online/api/clique";
  // Devolve o diagnostico de quem volta por link, quando a memoria local nao
  // existe (voltou por outro navegador). Ver telaReencontro().
  var RESULTADO_URL = "https://app.sooquecai.online/api/resultado";
  // ======================

  // Id da linha do lead no banco, devolvido por /api/lead. Usado para (a) mandar
  // sck=<id> no checkout da Hotmart, fechando lead -> clique -> venda sem depender
  // de casar e-mail, e (b) marcar o clique em comprar. Fica null se a gravação
  // falhar; nesse caso a página funciona igual, só sem rastreio.
  var LEAD_ID = null;

  /* QUEM VOLTOU (07/08/2026). Medido em 253 leads desde o marco zero: os 29 cliques em
     comprar aconteceram TODOS entre 0 e 15 minutos do lead, e 28 dos 29 foram clique
     único. Ou seja, ninguém que sai desta página volta e clica. A persistência do
     resultado subiu em 06/08 e resolveu metade do problema (quem volta reencontra o
     próprio diagnóstico em vez de um teste em branco), mas a outra metade ficou: a
     segunda visita recebia a peça IDÊNTICA à da primeira, com 20 telas de celular até
     o botão de compra. Na primeira visita a pessoa paga esse pedágio com curiosidade;
     na segunda ela não tem com o que pagar.
     VOLTOU troca só o cartão da tela 2 (o .vresumo, que é navegação e não argumento).
     O resto da página continua igual e continua rolável para quem quiser reler. */
  var VOLTOU = false;
  var VOLTOU_QUANDO = null;

  // Nome do produto. Em um lugar só porque ele aparece no hero, no resumo, na oferta,
  // na barra fixa e no FAQ — e já mudou três vezes.
  // 03/08: era "diagnóstico completo", que vendia o mesmo substantivo que a pessoa
  //        acabou de consumir de graça.
  // 03/08: virou "Plano de Recuperação da 1ª Fase", que resolvia isso mas lia como curso
  //        e jogava fora o diferencial, que é o diagnóstico.
  // 04/08: "Diagnóstico Completo + Mapa da Aprovação" (handoff). Mantém a continuidade
  //        com o mini-diagnóstico e nomeia o que vem depois dele.
  // 05/08: volta a ser só "Mapa da Aprovação", nome já atualizado na Hotmart também.
  // ATENÇÃO: o nome do produto na Hotmart tem que acompanhar, senão a pessoa clica em
  // comprar e cai num checkout com outro nome, no exato momento do cartão.
  var PRODUTO = 'Mapa da Aprovação';

  // Parcelamento real do checkout, informado pelo Gustavo em 02/08/2026.
  // ATENÇÃO ao escrever qualquer texto com isso: 6 x 8,82 = R$52,92, ou seja, o
  // parcelado TEM juros. Nunca escrever "sem juros" ao lado. Substituiu a divisão por
  // dia, que era um número derivado por retórica; este é uma opção de pagamento de
  // verdade e faz o mesmo trabalho de deixar o valor pequeno.
  // (Declarados AQUI, antes do FAQ, desde 05/08/2026: o FAQ concatena PARCELA na
  // carga do script, e com a declaração lá embaixo a resposta da objeção de
  // dinheiro imprimia "Tem: undefined no cartão".)
  var PARCELA='6x de R$8,82';
  // 6 x 8,82. Escrito na página de propósito: esconder o total é o que faz o leitor
  // desconfiar do parcelado, e mostrar empurra para o Pix.
  var TOTAL_PARCELADO='R$52,92';

  // FAQ. Regra: cada pergunta é uma dúvida OPERACIONAL que trava a compra. Nenhuma
  // repete argumento já feito na página — isso seria responder pela quinta vez uma
  // pergunta que já tem dono, que é o problema que o inventário existe para impedir.
  //
  // 05/08/2026: lista voltou a ser as 14 perguntas exatas do handoff (mesma ordem),
  // a pedido. As RESPOSTAS não são cópia cega: onde o handoff cita fato que não é
  // mais verdade nesta página, a resposta foi reescrita para o fato real —
  //   - "cronometradas" não existe: o diagnóstico pago não tem cronômetro.
  //   - PARCELA/TOTAL_PARCELADO no lugar de "6x de R$8,82" hardcoded.
  // O upsell do Plano Completo (R$127) tinha saído da página em 03/08, mas voltou em
  // 05/08: um comentário anterior achava que as 17 matérias já vinham todas no R$47,
  // e a tabela real de entregas (conferida contra a área do aluno) mostra que não —
  // o R$47 é só o Diagnóstico, com as 6 matérias do núcleo duro. As perguntas "eu
  // estudo só o que cai mesmo?" e "e as outras 11 matérias?" respondem com o fato
  // certo, igual ao handoff original.
  var FAQ = [
    { q:'Como funciona, na prática?',
      a:'São cinco etapas, na ordem, dentro da área do aluno no navegador. Primeiro você responde 24 questões (10 a 15 minutos) mais 7 perguntas sobre a sua hora de prova. Na hora que termina, sai o seu Relatório dos Dois Eixos: onde você está, o placar em cada matéria do núcleo duro e as prescrições nomeando as suas matérias fracas e os temas exatos onde perdeu ponto. Aí você usa as fichas dessas matérias, mede com os simulados e fecha com a folha de tática de prova. Cada etapa só existe porque a anterior te diz o que fazer nela.' },
    { q:'Eu estudo só o que cai mesmo? Só os temas mais cobrados?',
      a:'É a proposta. As fichas cobrem as 6 matérias do núcleo duro, que sozinhas valem 70% da prova, e o Relatório te diz quais dessas 6 são as suas fracas. Você estuda essas primeiro, não uma lista genérica de "mais cobrados".' },
    // 07/08/2026. É a primeira pergunta do repetente e a página não respondia em lugar
    // nenhum: ele já resolveu as provas recentes e sabe que questão inventada sem
    // critério não vale nada. A resposta é o que está escrito no cabeçalho de
    // assets/banco-de-questoes.js ("questões ORIGINAIS, redigidas a partir de lei seca,
    // súmulas e entendimentos consolidados; NÃO são cópia da FGV", revisão jurídica de
    // 04/07/2026) — não é copy, é o fato. Sem número de questões aqui de propósito: o
    // banco soma todos os planos, e o R$47 não entrega o banco inteiro.
    { q:'As questões são de exames anteriores da FGV?',
      a:'Não, são inéditas. Cada uma é escrita a partir de lei seca, súmula e entendimento consolidado, no padrão com que a banca cobra, e revisada contra as fontes primárias. Prova antiga tem gabarito circulando em qualquer grupo, e quem já prestou costuma ter resolvido as recentes: refazer isso não mede mais nada. O que se aproveita da FGV é a forma de montar a questão, e é justamente isso que o Guia de leitura ensina a reconhecer.' },
    { q:'Isto é um curso de OAB?',
      a:'Não, e essa é a diferença. Não tem vídeoaula para assistir, nem aula com horário, nem mensalidade. O que você compra é a direção: o exame que descobre onde o ponto está vazando, mais os materiais para tapar exatamente esses vazamentos. Você pode continuar no curso que já faz: o Mapa diz em que ordem usar o tempo.' },
    { q:'Preciso saber tudo para passar?',
      a:'Não. Você precisa de 40 acertos em 80. Metade da prova pode dar errado e você ainda passa a 1ª fase. Todo o material existe para te levar a essa linha com o menor esforço possível.' },
    { q:'Quanto tempo leva?',
      a:'Cerca de 40 minutos entre as 24 questões e as 7 perguntas de comportamento. Você pode parar e voltar depois: fica salvo de onde parou. O Relatório sai na hora que você termina.' },
    { q:'Não tenho os R$ 47 hoje. Tem outra forma?',
      a:'Tem: '+PARCELA+' no cartão (menos de nove reais por mês, com acesso liberado na hora). No parcelado você recebe exatamente a mesma coisa, liberada no mesmo minuto.' },
    { q:'Quais são as formas de pagamento?',
      a:'Pix e cartão de crédito em até 6x. O acesso chega assim que o pagamento é confirmado, em minutos.' },
    // Duas dúvidas operacionais que travavam a compra e não tinham resposta na página
    // (06/08/2026). Ambas conferidas contra o código, não escritas de memória: o fluxo
    // de entrada está em acesso.html e api/entrar.js (sem senha, e-mail da compra,
    // LIMITE_DISPOSITIVOS = 3) e o prazo de acesso vem do webhook (365 dias).
    { q:'Como o acesso chega depois que eu pago?',
      a:'Assim que o pagamento é confirmado, você recebe a confirmação e entra em app.sooquecai.online com o mesmo e-mail que usou na compra. Não tem senha para criar nem para lembrar: o sistema confere o e-mail e libera na hora. Dá para usar em até 3 aparelhos, e o acesso vale por 12 meses.' },
    { q:'Vale para o Exame de setembro ou para o próximo?',
      a:'Para os dois. O material trata do que se repete em toda 1ª fase, as 6 matérias do núcleo duro e a tática de prova, e não de uma edição específica. Como o acesso vale 12 meses, quem presta em setembro usa agora e quem vai prestar em janeiro tem o tempo inteiro de preparação pela frente.' },
    // "Já estudo com outro curso. Isso substitui?" saiu daqui em 07/08/2026 e virou
    // cartão dentro da seção da oferta, logo depois de stackOferta(). É a objeção mais
    // comum deste público e, aqui, ela era a 11ª de 17, fechada, em 14.314 px, isto é,
    // depois do último botão de compra. Regra do inventário: uma pergunta, um bloco.
    { q:'E as outras 11 matérias, fora do núcleo duro?',
      a:'O diagnóstico e as fichas deste material cobrem as 6 matérias do núcleo duro, que são as de maior peso, e o Relatório avisa isso com clareza: ele mediu essas 6, a prova cobra 17. Se depois você quiser as fichas das outras 11, existe o Plano Completo. Mas a ordem certa é começar pelas que mais valem ponto.' },
    { q:'Sou iniciante / faz tempo que parei. Vale para mim?',
      a:'Vale, e costuma valer mais: quanto menos claro está o que falta, mais tempo se perde estudando na ordem errada. O exame mede de onde você parte, sem exigir preparo prévio.' },
    { q:'Posso refazer o diagnóstico depois?',
      a:'Pode, e é recomendado. Depois de estudar as fichas e fazer os simulados, você refaz e vê o seu ponto se mover no gráfico. É a forma mais direta de saber se o esforço virou ponto.' },
    { q:'Funciona no celular?',
      a:'Sim. Roda no navegador, sem instalar nada: questões, fichas e simulados.' },
    { q:'Por quanto tempo tenho acesso?',
      a:'12 meses, com pagamento único. Não é assinatura e não renova sozinho.' },
    { q:'E se eu não gostar?',
      a:'Você tem 7 dias para pedir reembolso, sem perguntas. Dá para usar o material inteiro antes de decidir.' }
  ];

  // ===== VARIANTES DA ENTRADA =====
  // Medido em 03/08/2026 sobre 124 leads: 45% de quem chega NUNCA reprovou (21%
  // ainda na faculdade, 19% formado esperando a primeira prova, 5% curiosidade).
  // Para essas pessoas a entrada "Faltaram duas questões" descreve uma experiência
  // que elas não tiveram — e a travessia da ponte despenca: 42% em quem reprovou
  // duas ou mais vezes contra 15% em quem vai fazer a primeira prova.
  //
  // Quem escolhe a entrada é o ANÚNCIO, pelo parâmetro ?v=, não a página. O
  // casamento anúncio -> entrada é feito na origem: quem comprou a mídia já sabe
  // para quem mirou, então não custa nem um clique nem uma pergunta a mais para a
  // pessoa. Perguntar o momento antes do teste seria um degrau novo no ponto do
  // funil onde ela ainda não investiu nada, que é o pior lugar para pedir algo.
  //
  // SEM PARÂMETRO, A PÁGINA NÃO MUDA. 'repete' segue sendo o padrão: é a entrada
  // já provada no público que mais converte e que é 44% da base. Trocar o padrão
  // por uma headline neutra seria apostar o que funciona para ganhar o que ainda
  // não foi testado.
  var VARIANTES = {
    // Padrão. Quem já reprovou, e chegou perto: a dor é a margem.
    repete: {
      h1: 'Faltaram <em>duas questões</em>. E ninguém te diz quais.',
      lead: '38, 39, e são mais quatro meses. Raramente é a matéria toda: ou a banca decidiu tudo numa palavra trocada que você não viu, ou você sabia, travou e mudou a resposta certa. Este mini-diagnóstico mostra qual dos dois é o seu.'
    },
    // Formado, primeira prova. Não tem margem para doer: nunca teve nota. A dor é a
    // AUSÊNCIA de referência — estudou meses e não tem como saber se foi bastante.
    // O contraste de tempo (quatro meses x quatro minutos) é o que a margem faz na
    // outra entrada: transforma uma angústia difusa em uma pergunta respondível hoje.
    primeira: {
      h1: 'Você estudou meses. E não tem como saber se foi <em>o suficiente</em>.',
      lead: 'É a primeira vez: não existe nota anterior, não existe comparação, não existe onde olhar. A prova responde isso em quatro meses. Este mini-diagnóstico responde em quatro minutos, enquanto ainda dá tempo de corrigir.'
    },
    // Ainda na faculdade. Tem a única coisa que os outros não têm — tempo — e é
    // exatamente isso que a entrada devolve para ela. O que falta não é prazo, é a
    // lista do que corrigir dentro do prazo.
    faculdade: {
      h1: 'Dá para saber <em>hoje</em> se você passaria na 1ª fase.',
      lead: 'Você ainda está na faculdade, então tem a única coisa que quem já reprovou não tem: tempo de corrigir. O que quase ninguém tem é a lista do que corrigir. Sete questões, quatro minutos, e você sai com a sua.'
    },
    // Escrita pelo Gustavo em 03/08/2026, e é a única que resolve os 45% sem escolher
    // um público: em vez de nomear QUEM é a pessoa (reprovou, é calouro, está na
    // faculdade), nomeia o ERRO DE DIAGNÓSTICO — "você pode estar corrigindo o
    // problema errado". Isso vale para quem já prestou e para quem nunca prestou.
    //
    // Nota de histórico, porque isto já foi tentado e desfeito: a entrada abria pelos
    // dois eixos e foi trocada pela margem ("faltaram duas questões") porque o funil
    // dizia três coisas diferentes em três degraus — o anúncio prometia a margem, a
    // entrada prometia os eixos, o veredito voltava para a margem. O que mudou desde
    // então é que a tela de resultado foi partida em duas e hoje ENTREGA os eixos.
    // Então esta entrada promete o que o produto entrega, o que a anterior não fazia.
    // O desalinhamento que sobra é anúncio -> entrada, e esse a gente controla.
    //
    // O único parágrafo a mais do funil inteiro está aqui (lead2). Ele fica porque
    // carrega a aposta: sem "qualquer estratégia pode estar te levando na direção
    // errada", o texto informa mas não cobra decisão nenhuma.
    problema: {
      h1: 'Você sabe <em>por que</em> está perdendo pontos na 1ª fase?',
      lead: 'A maioria dos candidatos tenta corrigir o problema errado. Uns estudam cada vez mais, quando o que tira ponto é o nervosismo, a pressão da prova e a forma como decidem. Outros culpam a ansiedade, a FGV ou o tempo, quando ainda falta dominar o conteúdo.',
      lead2: 'Enquanto você não souber qual é o seu caso, qualquer estratégia pode estar te levando na direção errada. Este mini-diagnóstico identifica o que realmente está tirando seus pontos.'
    }
  };

  // Lido uma vez, no carregamento. Valor desconhecido ou ausente cai no PADRÃO.
  //
  // O padrão virou 'problema' em 04/08/2026. Era 'repete', e por um motivo que valia
  // enquanto a página de resultado era a antiga: não mudar, de uma vez, o que 100% do
  // tráfego pago vê. Com a página unificada no ar esse motivo se inverteu — 'repete'
  // abre prometendo a margem ("faltaram duas questões") e o resultado entrega dois
  // fatores e qual pesa mais. Duas histórias no mesmo funil, que é exatamente a

  var PENDENTES = [];
  function enfileirar(fn){ if(PENDENTES.length<20) PENDENTES.push(fn); }
  function drenarPendentes(){

  var CONTENT = [
    {mat:'Ética', fatia:'8 das 80 questões, a maior fatia da prova', dif:true, q:'Um militar da ativa foi aprovado no Exame de Ordem. Sobre o exercício da advocacia, ele:', exp:'<b>Por que a C é a certa:</b> militar da ativa é caso de incompatibilidade, não de impedimento (art. 28, V, do Estatuto da Advocacia). A diferença cai muito: impedimento proíbe advogar contra certas partes, incompatibilidade proíbe advogar em qualquer hipótese, inclusive em causa própria e fora do horário de serviço.', o:['Pode advogar livremente, desde que fora do horário de serviço.','Está impedido: só não pode advogar contra a Fazenda Pública que o remunera.','Está incompatibilizado: não pode exercer a advocacia enquanto estiver na ativa, nem em causa própria.','Pode advogar apenas em causas da Justiça Militar.'], c:2},

    {mat:'Civil', fatia:'7 das 80 questões', dif:true, q:'Sobre prescrição e decadência, é correto que:', exp:'<b>Por que a B é a certa:</b> violado o direito, nasce a pretensão, e é ela que a prescrição extingue (art. 189 do Código Civil). O direito em si continua existindo, tanto que a dívida prescrita paga não se repete. A decadência é outra coisa: atinge o próprio direito potestativo, aquele que se exerce por prazo certo.', o:['A prescrição atinge o próprio direito.','A prescrição extingue a pretensão.','A decadência extingue a pretensão.','Prescrição e decadência são sinônimos.'], c:1},
    {mat:'Processo Civil', fatia:'6 a 7 das 80 questões', dif:true, q:'Publicada sentença omissa quanto a um dos pedidos, General Cargas opôs embargos de declaração. Quanto ao prazo dos demais recursos:', exp:'<b>Por que a D é a certa:</b> os embargos de declaração <b>interrompem</b> o prazo recursal para as duas partes, e interromper significa que o prazo recomeça do zero depois do julgamento (CPC, arts. 1.023 e 1.026). A alternativa A troca interromper por suspender, que devolveria só o saldo. Essa troca é uma das que mais derruba gente, e derruba advogado também: é perda de prazo real.', o:['Fica suspenso, voltando a correr pelo restante após o julgamento.','Continua correndo, pois os embargos não interferem em outros prazos.','Fica suspenso apenas para a parte embargante.','Fica interrompido para ambas as partes, reiniciando por inteiro após a publicação do julgamento dos embargos.'], c:3},
    {mat:'Penal', fatia:'5 a 6 das 80 questões', dif:true, q:'Criado em comunidade isolada onde a prática era tida como lícita, Josué praticou conduta típica sem qualquer possibilidade de conhecer sua ilicitude, o que ficou provado. Josué:', exp:'<b>Por que a A é a certa:</b> erro de proibição inevitável isenta de pena; se fosse evitável, apenas diminuiria de um sexto a um terço (CP, art. 21). O erro clássico está na D: erro de proibição atua na <b>culpabilidade</b> e o dolo permanece inteiro. Quem exclui o dolo está confundindo com erro de tipo (art. 20), que é outra figura.', o:['Fica isento de pena, pois o erro de proibição inevitável exclui a culpabilidade.','Responde pelo crime com pena reduzida de um sexto a um terço.','Responde normalmente, pois ninguém se escusa de cumprir a lei.','Tem excluído o dolo, respondendo por culpa.'], c:0},
    {mat:'Processo Penal', fatia:'5 a 6 das 80 questões', dif:true, q:'Vítima de crime de ação penal pública condicionada, Sula ofereceu representação, mas se arrependeu. Quanto à retratação:', exp:'<b>Por que a D é a certa:</b> a representação só se torna irretratável <b>depois de oferecida a denúncia</b> (CPP, art. 25). Antes desse marco a vítima pode se retratar validamente. A alternativa A troca "denúncia" por "boletim de ocorrência" e a B por "trânsito em julgado". Um marco temporal trocado e a questão inteira cai.', o:['É vedada após o registro do boletim de ocorrência.','É possível a qualquer tempo, até o trânsito em julgado.','Depende de homologação judicial com oitiva do investigado.','É admitida somente até o oferecimento da denúncia.'], c:3},

  //   ansPrim[i] a PRIMEIRA alternativa marcada, que é o palpite antes de pensar demais
  //   trocas[i]  quantas vezes trocou depois da primeira
  // ans[i] continua sendo a resposta VALENDO e times[i] o instante da DECISÃO (a última
  // seleção, não o clique em confirmar): assim tudo que já lia esses dois continua lendo
  // a mesma coisa.
  var S = { screen:'intro', ci:0, ans:{}, times:{}, estourou:{}, fora:{}, bi:0, beh:{},
            sel:{}, selT:{}, ansPrim:{}, trocas:{},
            nome:'', email:'', tel:'', momento:'' };

  // Em que ponto da caminhada a pessoa está. Serve para saber quem o anúncio traz e
  // para calibrar a leitura do resultado. Uma escolha só, obrigatória.
  //
  // Refeito em 03/08/2026. Duas mudanças, e a segunda é a que importa:
  //
  // 1. "Ainda estou na faculdade" e "Já me formei e vou fazer a minha primeira prova"
  //    viraram uma opção só. Para este produto os dois estão no mesmo estado — nunca
  //    prestaram, logo não têm nota, não têm comparação e não sabem onde perdem ponto.

  //    n=11 e n=13 isso é ruído, não diferença.

  // 2. A reprovação passou a ser declarada POR FASE. É a pergunta comercialmente
  //    decisiva e a página não fazia: quem parou na 2ª fase JÁ PASSOU na 1ª, e este
  //    diagnóstico é inteiro sobre a 1ª. Vender a ele é vender remédio para uma doença

  // Desliga relógio e ouvintes de aba. Chamada em toda saída da Parte 1, senão o
  // ouvinte da questão anterior continua vivo e debita tempo na questão errada.
  function pararRelogio(){
    if(window._clk){ clearInterval(window._clk); window._clk=null; }
    if(window._vis){ document.removeEventListener('visibilitychange', window._vis); window._vis=null; }
    if(window._sai){ window.removeEventListener('blur', window._sai); window._sai=null; }

  function content(){

    app.innerHTML =
      '<div class="timer" id="tmr">'+
        '<div class="prog7">'+dots+'</div>'+

    // responde com 40 segundos novos. O segundo é novo: sem confirmar, o "voltar" seria

    // exatamente o clique que acabou de ser removido pela porta da frente.

    S.qStart=Date.now();
    S.qGasto=0;          // segundos debitados a mais por ausência (a 2ª contagem do dobro)

    // O tempo consumido SEMPRE sai de Date.now(), nunca de acumulador de tique.

    // por tique congelaria justamente para quem saiu da aba para pesquisar: a defesa
    // viraria a brecha. O setInterval abaixo só pinta a tela.
    function consumido(){ return (Date.now()-S.qStart)/1000 + S.qGasto; }

    function sair(){ if(S.foraDesde==null) S.foraDesde=Date.now(); }
    function voltar(){
      if(S.foraDesde==null) return;
      var ausente=(Date.now()-S.foraDesde)/1000; S.foraDesde=null;
      // Fora da aba o relógio corre em dobro. O Date.now() já contou a primeira vez;
      // aqui se debita a segunda.
      S.fora[i]+=ausente; S.qGasto+=ausente;
      pintar();

    function pintar(){
      var el=document.getElementById('clk'), bar=document.getElementById('clkbar'), box=document.getElementById('tmr');

      var resta=Math.max(0, LIMITE-consumido());
      el.textContent=Math.ceil(resta);
      if(bar) bar.style.transform='scaleX('+(resta/LIMITE)+')';
      if(box){ if(resta<=10) box.classList.add('urgente'); else box.classList.remove('urgente'); }
      if(resta<=0) estourar();

    // O tempo acabou sem marcação, que agora é o único jeito de estourar: marcar
    // encerra a questão na hora. Enquanto existia o botão de confirmar, dava para ter
    // decidido e não ter apertado a tempo, e esse caso precisava de tratamento próprio
    // para não punir no eixo de pressão quem decidiu em 5 segundos.
    function estourar(){
      if(encerrada) return;
      fechar();
      S.estourou[i]=true;
      S.times[i]=LIMITE;
      S.ans[i]=null;               // não respondeu: não é a mesma coisa que errar
      avancar();
    }

    window._vis=function(){ if(document.hidden) sair(); else voltar(); };
    window._sai=sair; window._volta=voltar;
    document.addEventListener('visibilitychange', window._vis);
    window.addEventListener('blur', window._sai);
    window.addEventListener('focus', window._volta);
    window._clk=setInterval(pintar,200);
    pintar();

    // Marcar ENCERRA a questão e avança. O relógio para no clique, e o instante
    // registrado é o do clique, que aqui é o mesmo da decisão — antes havia distância
    // entre decidir e apertar o botão, e era ela que S.selT existia para preservar.
    //
    // Custo assumido: morre a medição de troca de resposta (trocas, trocou_certa_errada,
    // trocou_errada_certa) e ansPrim passa a ser sempre igual a ans. Ela tinha sido
    // criada horas antes, em 03/08/2026, para enxergar "sabia, travou e mudou a resposta
    // certa". O sinal continua existindo na prova real; esta página é que deixa de vê-lo,
    // em troca de sete cliques a menos. Os campos seguem sendo enviados, sempre em zero,
    // para não quebrar o contrato com /api/lead nem com as colunas já criadas.
    var opts = app.querySelectorAll('.opt');
    Array.prototype.forEach.call(opts, function(b){
      b.onclick = function(){
        if(encerrada) return;
        fechar();
        var j = parseInt(b.getAttribute('data-j'),10);
        S.sel[i]=j;
        S.ansPrim[i]=j;
        S.trocas[i]=0;
        S.selT[i]=Math.max(1, Math.min(LIMITE, Math.round(consumido())));
        S.estourou[i]=false;
        S.ans[i]=j;
        S.times[i]=S.selT[i];
        Array.prototype.forEach.call(opts, function(o){ o.classList.remove('sel'); });
        b.classList.add('sel');
        // O respiro existe para a marcação aparecer antes de a tela trocar. Sem ele o
        // clique some no mesmo quadro e a pessoa não vê o que marcou.
        setTimeout(avancar, 160);
      };
    });
  }

  function behavior(){
    pararRelogio();
    var i=S.bi, sel=S.beh[i], B=BEHAVIOR[i];
    app.innerHTML =
      '<div class="prog">Parte 2 · situação '+(i+1)+' de '+BEHAVIOR.length+'</div>'+
      '<div class="qbox"><div class="qmat">No dia a dia</div><div class="qtext">'+esc(B.q)+'</div>'+
      B.o.map(function(op,j){ return '<button class="opt'+(sel===j?' sel':'')+'" data-j="'+j+'">'+esc(op[0])+'</button>'; }).join('')+
      '</div>'+
      // O "Voltar" só anda dentro da Parte 2. Voltar para a Parte 1 daria 40 segundos
      // novos numa questão já vencida, que é a mesma brecha do voltar da Parte 1.
      (i>0?'<button class="back" id="back">Voltar</button>':'');
    Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(b){
      b.onclick = function(){
        S.beh[i] = parseInt(b.getAttribute('data-j'),10);
        setTimeout(function(){
          if(i+1<BEHAVIOR.length){ S.bi=i+1; render(); }
          // Chegou no formulário: é o último degrau antes do lead, e a distância entre
          // este evento e o `Lead` do pixel é o custo real dos quatro campos obrigatórios.
          else { marcarPixel('ChegouFormulario'); S.screen='form'; render(); }
          window.scrollTo(0,0);
        }, 160);
      };
    });
    if(i>0) document.getElementById('back').onclick = function(){ S.bi=i-1; render(); };
  }

  function form(){
    app.innerHTML =
      // "Pra onde mando o seu resultado" prometia envio e o resultado aparece na tela,
      // não é mandado. Promessa que não se cumpre no segundo seguinte custa confiança
      // justamente no degrau em que se pede o telefone. E saiu o "mapa": ninguém no
      // primeiro contato sabe o que é isso.
      '<div class="prog">Terminou</div>'+
      '<h1 style="font-size:23px">Seu resultado está pronto.</h1>'+
      '<p class="lead" style="margin-bottom:18px">Só falta saber quem é você. Ele aparece na próxima tela.</p>'+
      '<div class="field"><label>Onde você está hoje</label>'+
        MOMENTO.map(function(op){ return '<button class="opt'+(S.momento===op?' sel':'')+'" data-m="'+esc(op)+'">'+esc(op)+'</button>'; }).join('')+
      '</div>'+
      '<div class="field"><label>Seu nome</label><input id="f_nome" type="text" placeholder="Como você se chama" value="'+esc(S.nome)+'"></div>'+
      '<div class="field"><label>Seu WhatsApp (com DDD)</label><input id="f_tel" type="tel" inputmode="numeric" placeholder="(00) 00000-0000" value="'+esc(S.tel)+'"></div>'+
      // E-mail virou OBRIGATÓRIO em 02/08/2026, a pedido do Gustavo: metade das linhas
      // do Formspree chegava sem e-mail, e sem ele não existe contato que não dependa
      // do WhatsApp. Custo assumido: campo obrigatório a mais derruba envio de formulário.
      '<div class="field"><label>Seu e-mail</label><input id="f_email" type="email" inputmode="email" autocomplete="email" placeholder="seu@email.com" value="'+esc(S.email)+'"></div>'+
      '<button class="btn full" id="see">Ver o meu resultado</button>'+
      '<div class="small">É grátis e sem spam. Você pode sair quando quiser.</div>';
    // Marcar a opção NÃO re-renderiza o formulário. Antes chamava render(), que refazia a
    // tela inteira e jogava a rolagem para o topo no celular, no último degrau antes do
    // lead. Aqui só troca a classe.
    var opts=app.querySelectorAll('.opt');
    Array.prototype.forEach.call(opts, function(b){
      b.onclick = function(){
        S.momento = b.getAttribute('data-m');
        Array.prototype.forEach.call(opts, function(x){ x.classList.remove('sel'); });
        b.classList.add('sel');
      };
    });
    document.getElementById('see').onclick = function(){
      var nome=document.getElementById('f_nome').value.trim();
      var email=document.getElementById('f_email').value.trim();
      var tel=document.getElementById('f_tel').value.trim();
      var digits=tel.replace(/\D/g,'');
      if(!S.momento){ alert('Marque onde você está hoje para ver o resultado.'); return; }
      if(!nome || digits.length<10){ alert('Preencha o nome e um WhatsApp válido com DDD para ver o resultado.'); return; }
      // Aconteceu de verdade em 03/08: a pessoa colou o e-mail no campo do nome, e o
      // WhatsApp saiu "Oi, luissilva@uni9.edu.br!". Barrar aqui é mais barato do que
      // consertar a mensagem depois de enviada.
      if(nome.indexOf('@')>=0){ alert('No campo do nome, escreva só o seu nome. O e-mail vai no campo de baixo.'); return; }
      if(!email){ alert('Preencha o seu e-mail para ver o resultado.'); return; }
      if(!/.+@.+\..+/.test(email)){ alert('O e-mail parece inválido. Confira antes de continuar.'); return; }
      S.nome=nome; S.email=email; S.tel=tel;
      // saveLead() dispara a gravação AGORA e a tela de apuração corre em paralelo:
      // o tempo da barra é o tempo que o banco tem para devolver o id do lead.
      saveLead();
      S.screen='loading'; render(); window.scrollTo(0,0);
    };
  }

  // Apuração. Três passos, todos verdadeiros: é isso que compute() e quadrant() fazem,
  // nesta ordem. A barra é honesta quanto ao que descreve, e o tempo dela não é enfeite:
  // é a janela em que o /api/lead devolve o id que monta o sck= no checkout.
  function carregando(){
    pararRelogio();
    var PASSOS=[
      ['Somando o que você acertou', 34],
      ['Cruzando o tempo de cada resposta', 71],
      ['Montando o seu resultado', 95]
    ];
    var MIN=2700;    // piso: abaixo disso não dá tempo de ler os três passos
    var MAX=4200;    // teto: nunca segurar mais que isso, mesmo sem id do banco
    app.innerHTML =
      '<div class="load">'+
        '<svg class="mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+
          '<rect width="32" height="32" rx="8" fill="#15212B"/>'+
          '<g stroke="#F3EEE4" stroke-width="2.4" fill="none"><circle cx="16" cy="16" r="7.2"/>'+
          '<path d="M16 4.5v4M16 23.5v4M4.5 16h4M23.5 16h4"/></g>'+
          '<circle cx="16" cy="16" r="3" fill="#C77A2B"/></svg>'+
        '<div class="st" id="ldst" role="status" aria-live="polite">'+esc(PASSOS[0][0])+'</div>'+
        '<div class="tr"><i id="ldbar"></i></div>'+
        '<div class="pe">Gerando o seu resultado personalizado</div>'+
      '</div>';

    var st=document.getElementById('ldst'), bar=document.getElementById('ldbar');
    var t0=Date.now(), i=0;
    setTimeout(function(){ if(bar) bar.style.width=PASSOS[0][1]+'%'; }, 60);

    function passo(){
      i++;
      if(i<PASSOS.length){
        if(st){
          st.classList.add('sai');
          setTimeout(function(){ st.textContent=PASSOS[i][0]; st.classList.remove('sai'); }, 220);
        }
        if(bar) bar.style.width=PASSOS[i][1]+'%';
        setTimeout(passo, 900);
      } else {
        entregar();
      }
    }
    setTimeout(passo, 900);

    // Só entrega quando o piso de tempo passou. Se o id do lead ainda não chegou,
    // espera mais um pouco, até o teto, e vai assim mesmo: a página nunca trava
    // esperando rede.
    function entregar(){
      var passou=Date.now()-t0;
      if(passou<MIN) return setTimeout(entregar, MIN-passou);
      if(LEAD_ID===null && passou<MAX) return setTimeout(entregar, 250);
      if(bar) bar.style.width='100%';
      setTimeout(function(){
        if(S.screen!=='loading') return;   // guarda contra entrega dupla
        S.screen='result';
        // Guarda o resultado ANTES do render: se a pessoa fechar a aba no meio da
        // leitura, a memoria ja existe e o link da mensagem vai encontrar algo.
        guardarResultado();
        render(); window.scrollTo(0,0);
      }, 260);
    }
  }

  // Matérias em que o ponto foi embora, na ordem em que apareceram, com a contagem
  // quando foi mais de uma ("Civil (2)"). Extraída de saveLead em 07/08/2026 porque a
  // memória local passou a precisar do mesmo dado, para a página do Plano Completo
  // poder dizer em que matéria a pessoa vazou ponto. Duas cópias deste laço
  // divergiriam na primeira vez que CONTENT mudasse de ordem.
  function materiasErradas(){
    var conta = {}, ordem = [];
    CONTENT.forEach(function(qq,i){
      if(S.ans[i]!==qq.c){ if(!conta[qq.mat]){ conta[qq.mat]=0; ordem.push(qq.mat); } conta[qq.mat]++; }
    });
    return ordem.map(function(m){ return conta[m]>1 ? m+' ('+conta[m]+')' : m; });
  }

  function saveLead(){
    var lead={ nome:S.nome, email:S.email, tel:S.tel, momento:S.momento, ans:S.ans, beh:S.beh, ts:new Date().toISOString() };
    try{ var all=JSON.parse(localStorage.getItem('soqc_leads')||'[]'); all.push(lead); localStorage.setItem('soqc_leads', JSON.stringify(all)); }catch(e){}

    // O mesmo resultado que a pessoa vê vai junto no e-mail do lead. Sem isso
    // chega só um nome e um telefone, e não dá para saber quem o anúncio trouxe.
    var R = compute();
    var Q = quadrant(R.X, R.Y, R);
    var erradas = materiasErradas();
    var tsoma = 0, tn = 0;
    CONTENT.forEach(function(_,i){ if(S.times[i]!=null){ tsoma += S.times[i]; tn++; } });

    // Mediana, a mesma que alimenta o eixo de pressão: o número gravado na base
    // tem que ser o mesmo que a pessoa viu na tela, senão a análise não fecha.
    var tmed = tempoMedio();
    var errouEm = erradas.length ? erradas.join(', ') : 'nenhuma';
    var q = new URLSearchParams(location.search);

    // Marca o Lead no pixel. Só roda depois que o lead foi guardado de verdade:
    // disparar antes faz a Meta contar gente que a gente perdeu no caminho.
    function marcarPixel(){
      if(typeof fbq==='undefined') return;
      try{
        // Advanced matching: melhora o EMQ do pixel (a Meta faz o hash sozinha).
        var am={};
        if(S.email) am.em=S.email.trim().toLowerCase();
        var d=S.tel.replace(/\D/g,''); if(d) am.ph='55'+d;
        fbq('init','1024990753668044',am);
        fbq('track','Lead');
      }catch(e){}
    }

    // O payload completo fica numa variável porque o retry precisa mandar O MESMO.
    // Até 02/08/2026 o retry mandava 4 dos 14 campos, e quem caísse nele virava uma
    // linha cega: sem placar, sem eixos, sem matéria errada, sem origem.
    // utm_source, utm_medium e fbclid entraram no mesmo dia. Sem fbclid não existe
    // caminho para ligar a linha do banco ao criativo que trouxe a pessoa.
    var TR = trocasResumo();
    var payload = {
      nome:S.nome, telefone:S.tel, email:S.email, momento:S.momento,
      acertos:R.c, total_questoes:CONTENT.length,
      eixo_conteudo:R.X, eixo_pressao:R.Y, perfil:Q.lab,
      errou_em:errouEm, tempo_medio:tmed,
      // Trocas de resposta. Vão para o banco antes de virarem copy: primeiro é preciso
      // saber se o comportamento existe nesta base e com que frequência. Escrever a
      // página em cima de uma coisa que acontece em 3% dos casos seria escrever no vazio.
      trocas:TR.trocas, trocou_certa_errada:TR.perdeu, trocou_errada_certa:TR.salvou,
      // 04/08: os três componentes medidos do eixo de execução, um a um, e os tempos
      // questão a questão. Não é curiosidade: o CORTE_Y=84 foi posto por estimativa
      // porque o eixo antigo era outra conta e os tempos individuais nunca foram
      // gravados. Sem estas quatro colunas, a próxima calibragem seria outro palpite.
      // 'tempos' é o que permite recalcular o eixo inteiro de novo, sobre a base real,
      // sem precisar de mais um mês de tráfego a cada vez que uma faixa mudar.
      eixo_ritmo:R.rit, eixo_constancia:R.cons, eixo_resistencia:R.res,
      tempos: CONTENT.map(function(_,i){ return S.times[i]!=null? S.times[i] : null; }).join(','),
      // Qual entrada esta pessoa leu. Sem isto, variante só daria para inferir pelo
      // utm_content do anúncio, e link compartilhado ou tráfego orgânico ficariam
      // fora da conta. É o campo que responde "a entrada nova converte melhor?".
      variante:VARIANTE,
      utm_campaign:q.get('utm_campaign'), utm_content:q.get('utm_content'),
      utm_source:q.get('utm_source'), utm_medium:q.get('utm_medium'),
      fbclid:q.get('fbclid'),
      referrer:document.referrer || null
    };

    // Guarda o id devolvido. Chega depois do render do resultado, e tudo bem: quem
    // usa o id é o clique no botão de comprar, que só acontece depois de ler a página.
    function guardarId(resp){
      return resp.json().then(function(j){
        if(j && j.id){
          LEAD_ID=j.id; drenarPendentes();
          // Regrava a memória agora que o id existe. Sem isto, quem estivesse em rede
          // ruim ficava com memória sem lead id: entregar() tem teto de espera e
          // renderiza assim mesmo, e a gravação de lá guardava lead:null para sempre.
          // Memória sem id é upsell sem instrumentação e sem sck (07/08/2026).
          if(S.screen==='result') guardarResultado();
        }
        return true;
      }).catch(function(){ return true; });
    }

    // 1) Base própria (Supabase, via /api/lead na Vercel). É a fonte de verdade:
    //    não tem teto mensal e permite cruzar lead contra venda depois.
    var naBase = fetch(BASE_URL, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    }).then(function(r){ return r.ok ? guardarId(r) : false; }).catch(function(){ return false; });

    // 2) Formspree segue como aviso por e-mail, em paralelo. Se um falhar, o outro salva.
    var noEmail = CAPTURE_URL ? fetch(CAPTURE_URL,{
      method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify({ nome:S.nome, email:S.email, telefone:S.tel, momento:S.momento,
        acertos: R.c + ' de ' + CONTENT.length,
        eixo_conteudo: R.X + '%',
        eixo_pressao: R.Y + '%',
        perfil: Q.lab,
        errou_em: errouEm,
        tempo_medio: tmed != null ? tmed + 's por questão' : 'sem registro',
        quando:lead.ts, _subject:'Novo lead do mini-diagnostico Só o que Cai' })
    }).then(function(r){ return r.ok; }).catch(function(){ return false; }) : Promise.resolve(false);

    Promise.all([naBase, noEmail]).then(function(ok){
      if(ok[0] || ok[1]) return marcarPixel();
      // Os dois falharam: tenta a base mais uma vez antes de desistir, com o payload
      // INTEIRO. Mandar meia dúzia de campos aqui era transformar a falha de rede
      // numa perda permanente de dado.
      return fetch(BASE_URL, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      }).then(function(r){ if(r.ok){ guardarId(r); marcarPixel(); } }).catch(function(){});
    });
  }

  // Lê um cookie do navegador. _fbp e _fbc são os identificadores que a própria
  // Meta grava (o segundo só existe se a pessoa veio de um anúncio). Vão crus para
  // o servidor: sem eles, a correspondência do evento cai bastante.
  function lerCookie(nome){
    try{
      var m = document.cookie.match(new RegExp('(^|;\\s*)' + nome + '=([^;]*)'));
      return m ? decodeURIComponent(m[2]) : null;
    }catch(e){ return null; }
  }

  // Registra no banco que a pessoa pediu para comprar, e QUAL botão ela usou.
  // sendBeacon porque aqui existe navegação de verdade: um fetch normal é cancelado
  // quando a aba sai para o checkout da Hotmart. Falhar aqui não pode, em hipótese
  // nenhuma, atrapalhar a ida para o checkout, então tudo vai dentro de try.
  //
  // `extras` só vem preenchido no clique em que o pixel disparou o InitiateCheckout.
  // É ele que autoriza o servidor a mandar o mesmo evento pela Conversions API, com
  // o mesmo id — os dois lados contam como um evento só.
  function marcarClique(botao, oferta, extras){
    if(!LEAD_ID){ return enfileirar(function(){ marcarClique(botao, oferta, extras); }); }
    try{
      var dados={ lead_id:LEAD_ID, botao:botao, oferta:String(oferta) };
      if(extras){
        dados.ic_event_id = extras.ic_event_id;
        if(extras.fbp) dados.fbp = extras.fbp;
        if(extras.fbc) dados.fbc = extras.fbc;
      }
      var corpo=JSON.stringify(dados);
      if(navigator.sendBeacon){
        navigator.sendBeacon(CLIQUE_URL, new Blob([corpo], {type:'text/plain;charset=UTF-8'}));
      } else {
        fetch(CLIQUE_URL, {method:'POST', headers:{'Content-Type':'text/plain'},
                           body:corpo, keepalive:true}).catch(function(){});
      }
    }catch(e){}
  }

  // Registra que a pessoa atravessou a PONTE, isto é, pediu para ver a oferta.
  // Aqui não há navegação para fora (é troca de tela na mesma página), então um
  // fetch normal basta; sendBeacon fica como caminho principal só por simetria com
  // marcarClique e porque é mais barato para o navegador. Falhar não pode afetar
  // nada: a troca de tela acontece independentemente do resultado.
  // ===== FUNIL PRÉ-LEAD (06/08/2026) =====
  // marcarPasso() só serve DEPOIS que o lead existe: sem LEAD_ID ele enfileira, e quem
  // abandona antes do formulário nunca chega a ter id, então some da medição. Era o
  // único degrau do funil sem número nenhum: quantos chegam na página e não começam o
  // teste, e em que questão desistem os que começam.
  //
  // Vai pelo pixel, não pelo banco, de propósito: o pré-lead não tem chave para costurar
  // com `leads`, e criar tabela/endpoint anônimo custaria migração em produção (gated) e
  // uma função serverless (são 10 de 12 no plano). O pixel responde a pergunta que
  // importa aqui, que é TAXA por campanha, e o Events Manager já quebra por anúncio.
  //
  // Três eventos por sessão, não um por questão: `QuizProgresso` leva a questão como
  // parâmetro, então a curva de abandono sai da distribuição do mesmo evento em vez de
  // sete nomes diferentes poluindo o dataset.
  //
  // ATENÇÃO ao ler: estes eventos NÃO são venda e não entram em nenhuma conta de CAC.
  // A régua de venda continua sendo linha em `compradores`, no Supabase.
  function marcarPixel(evento, dados){
    try{ if(window.fbq) fbq('trackCustom', evento, dados||{}); }catch(e){}
  }

  function marcarPasso(passo){
    if(!LEAD_ID){ return enfileirar(function(){ marcarPasso(passo); }); }
    try{
      var corpo=JSON.stringify({ lead_id:LEAD_ID, passo:passo });
      if(navigator.sendBeacon){
        navigator.sendBeacon(CLIQUE_URL, new Blob([corpo], {type:'text/plain;charset=UTF-8'}));
      } else {
        fetch(CLIQUE_URL, {method:'POST', headers:{'Content-Type':'text/plain'},
                           body:corpo, keepalive:true}).catch(function(){});
      }
    }catch(e){}
  }

  // ===== EIXO DE PRESSÃO =====
  // Refeito em 02/08/2026. A versão anterior era 70% relógio + 30% autorrelato, e o 100
  // continuava fácil por dois motivos: o autorrelato tem uma alternativa obviamente
