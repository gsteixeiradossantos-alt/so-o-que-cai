<style>
  :root{
    --paper:#F3EEE4; --card:#FBF9F4; --ink:#231F1A; --muted2:#574F45; --muted:#8A8378;
    --line:#E4DBC9; --navy:#15212B; --ocre:#A65D1E; --ocre2:#C77A2B; --green:#3A7A5C;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--paper);color:var(--ink);font-family:'Hanken Grotesk',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}

  .clock{display:inline-flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;font-size:11px;color:var(--muted2)}
  .clock i{width:7px;height:7px;border-radius:50%;background:var(--ocre);animation:pulse 1s infinite}

  .qbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px}
  .qmat{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ocre);margin-bottom:8px}
  .qtext{font-size:18px;font-weight:500;line-height:1.4;margin-bottom:18px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--navy);color:#fff;border:none;border-radius:12px;padding:14px 22px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;transition:.15s}

  .foot{margin-top:28px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5}

  .gab .k{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin-bottom:8px}
  .gab .q{font-size:15px;font-weight:500;margin-bottom:10px}

  .gab .alt.sua{border-color:#D9A05B;background:#FBF1E6}

  .gab .exp b{color:var(--ink)}
  /* bloco trancado (teaser do diagnóstico completo): o TÓPICO fica legível
     para dar curiosidade; só a RESPOSTA é rasurada. */
  .lockbox{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:18px;background:var(--card)}
  .lockbox .head{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);padding:14px 20px 4px}
  .lockbox .inner{padding:6px 20px 16px}
  .lockbox .row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line)}
  .lockbox .row:last-child{border-bottom:none}
  .lockbox .row .t{color:var(--ink)}
  /* O que as 5 questões já mostraram sai legível e verdadeiro. O que depende das

     para comparar com o do colega. */
  .lockbox .val{color:var(--ink);white-space:nowrap;font-weight:600;font-size:13.5px;text-align:right}
  .lockbox .val.trava{display:inline-block;width:88px;height:10px;border-radius:5px;background:var(--muted2);opacity:.3;font-size:0}
  .lockbox .cta{font-size:12px;color:var(--muted);padding:0 20px 14px}
</style>

<script>
  // ===== CONFIGURAR =====
  var CHECKOUT_URL = "https://pay.hotmart.com/B106546831I?checkoutMode=10"; // diagnóstico completo R$47 + Order Bump Kit Reta Final
  var CHECKOUT_COMPLETO = "https://pay.hotmart.com/O106944368L?checkoutMode=10"; // Plano Completo R$127 (inclui o diagnóstico)
  // Para onde enviar os leads (nome/e-mail/WhatsApp). Cole aqui um endpoint de formulário
  // (ex.: Formspree, um Apps Script do Google, ou a API da sua ferramenta de e-mail).
  // Enquanto estiver vazio, o lead é só guardado no navegador (localStorage) e nada é perdido,

  var BASE_URL = "https://so-o-que-cai-app.vercel.app/api/lead"; // fonte de verdade do lead
  // ======================

  // 5 questões de conteúdo (3 do padrão da prova + 2 DIFÍCEIS de Ética, para o
  // resultado ter erro de verdade para mostrar) + 3 cenários psicotécnicos.
  // 'fatia' = peso real da matéria na prova, usado no bloco "o que o erro custa".
  var CONTENT = [
    {mat:'Ética', fatia:'8 das 80 questões, a maior fatia da prova', q:'Sobre o sigilo profissional do advogado, é correto afirmar que:', exp:'<b>Por que a B é a certa:</b> o sigilo profissional é, ao mesmo tempo, direito e dever do advogado, e alcança os fatos de que ele toma conhecimento no exercício da profissão (Código de Ética e Disciplina da OAB, arts. 35 a 37). As outras caem uma a uma: o sigilo não cede por simples pedido do cliente nem de terceiro, e cobre também fatos anteriores ao mandato, quando conhecidos em razão do ofício.', o:['Cede sempre que o cliente pedir.','É direito e dever do advogado e abrange os fatos de que tome conhecimento no exercício da profissão.','Não se aplica a fatos anteriores ao mandato.','Pode ser quebrado a pedido de terceiros interessados.'], c:1},
    {mat:'Constitucional', fatia:'6 a 7 das 80 questões', q:'O habeas corpus é cabível quando:', exp:'<b>Por que a A é a certa:</b> o habeas corpus protege a liberdade de locomoção contra ilegalidade ou abuso de poder (art. 5º, LXVIII, da Constituição). As outras três são os remédios vizinhos, e a banca vive trocando um pelo outro: direito líquido e certo não amparado por HC é mandado de segurança, conhecimento de informações pessoais é habeas data, e falta de norma regulamentadora é mandado de injunção.', o:['Há ilegalidade ou abuso de poder com coação à liberdade de locomoção.','Se busca proteger direito líquido e certo não amparado por HC.','Se busca conhecimento de informações pessoais do impetrante.','Falta norma regulamentadora que inviabilize um direito.'], c:0},
    {mat:'Civil', fatia:'7 das 80 questões', q:'Sobre prescrição e decadência, é correto que:', exp:'<b>Por que a B é a certa:</b> violado o direito, nasce a pretensão, e é ela que a prescrição extingue (art. 189 do Código Civil). O direito em si continua existindo, tanto que a dívida prescrita paga não se repete. A decadência é outra coisa: atinge o próprio direito potestativo, aquele que se exerce por prazo certo.', o:['A prescrição atinge o próprio direito.','A prescrição extingue a pretensão.','A decadência extingue a pretensão.','Prescrição e decadência são sinônimos.'], c:1},
    {mat:'Ética', fatia:'8 das 80 questões, a maior fatia da prova', dif:true, q:'Um militar da ativa foi aprovado no Exame de Ordem. Sobre o exercício da advocacia, ele:', exp:'<b>Por que a C é a certa:</b> militar da ativa é caso de incompatibilidade, não de impedimento (art. 28, V, do Estatuto da Advocacia). A diferença cai muito: impedimento proíbe advogar contra certas partes, incompatibilidade proíbe advogar em qualquer hipótese, inclusive em causa própria e fora do horário de serviço.', o:['Pode advogar livremente, desde que fora do horário de serviço.','Está impedido: só não pode advogar contra a Fazenda Pública que o remunera.','Está incompatibilizado: não pode exercer a advocacia enquanto estiver na ativa, nem em causa própria.','Pode advogar apenas em causas da Justiça Militar.'], c:2},
    {mat:'Ética', fatia:'8 das 80 questões, a maior fatia da prova', dif:true, q:'No contrato de honorários com cláusula quota litis (percentual sobre o resultado da causa), é correto que:', exp:'<b>Por que a C é a certa:</b> a cláusula quota litis é permitida, mas com trava: somados aos honorários de sucumbência, os honorários não podem superar as vantagens que o cliente obteve na causa. Por isso a A erra ao proibir de vez e a B erra ao autorizar que o advogado leve mais que o cliente. E o contrato escrito é exigido, não dispensado.', o:['É vedado em qualquer hipótese pelo Código de Ética.','Os honorários podem superar as vantagens obtidas pelo cliente, se houver pacto expresso.','Os honorários, somados aos de sucumbência, não podem ser superiores às vantagens advindas em favor do cliente.','Dispensa contrato escrito, por decorrer do êxito.'], c:2}
  ];
  // Parte 2: psicotécnico indireto. Cenários de OUTRO domínio (trânsito, prazo,
  // memória em público) que revelam congelamento/afobação/controle sem perguntar
  // "você é ansioso?" — ninguém se declara ansioso. Cada opção carrega a pontuação.
  // 'leit' = leitura do resultado por pontuação (0/1/2): traduz o cenário de
  // volta para a prova, sem rotular ninguém de "ansioso" — mostra o comportamento.
  var BEHAVIOR = [
    {q:'Você está dirigindo num trevo desconhecido, o GPS trava e os carros atrás começam a buzinar. O que acontece primeiro?',
     o:[['Sigo por qualquer saída, só para não ficar parado ali',1],['Dou uma travada de alguns segundos antes de conseguir decidir',0],['Encosto onde dá e decido o caminho com calma',2]],
     leit:{0:'No trevo, você travou antes de decidir. Na prova, esse é o perfil que dá branco numa questão difícil e perde o ritmo nas três seguintes.',1:'No trevo, você seguiu por qualquer saída para escapar da pressão. Na prova, é quem marca sem reler o enunciado e cai na pegadinha.',2:'No trevo, você parou e escolheu com calma: você decide bem debaixo de buzina.'}},
    {q:'Faltando 20 minutos para entregar algo importante, você percebe um erro numa parte que já estava pronta.',
     o:[['Corrijo o essencial e entrego no prazo',2],['Tento refazer tudo e por pouco não estouro o prazo',0],['Entrego como está e passo o resto do dia remoendo',1]],
     leit:{0:'Com o prazo estourando, você tentou refazer tudo. Na prova, é quem empaca numa questão e chega sem tempo nas dez últimas.',1:'Você entregou, mas ficou remoendo. Na prova, é quem carrega a questão anterior na cabeça e erra a seguinte por distração.',2:'Com o prazo apertado, você priorizou e entregou: sua gestão de tempo funciona sob pressão.'}},
    {q:'Na frente de outras pessoas, te pedem um dado que você sabe de cor.',
     o:[['Vem na hora, normal',2],['Às vezes dá branco na hora, e a resposta aparece depois, sozinho',0],['Peço um segundo e a resposta vem',1]],
     leit:{0:'O dado que você sabe de cor não saiu na hora, na frente dos outros. É o branco clássico: o problema não é saber, é acessar sob observação. E a prova inteira é sob observação.',1:'Você pediu um segundo e a resposta veio: você acessa a memória sob pressão, pagando um pequeno preço em tempo.',2:'A resposta veio na hora, mesmo com plateia: memória estável sob observação.'}}
  ];

  var S = { screen:'intro', ci:0, ans:{}, times:{}, bi:0, beh:{}, nome:'', email:'', tel:'', momento:'' };

  // Em que ponto da caminhada a pessoa está. Serve para saber quem o anúncio traz
  // (bacharel de primeira prova, reprovado, quem ainda está na faculdade) e para
  // calibrar a leitura do resultado. Uma escolha só, obrigatória.
  var MOMENTO = [
    'Ainda estou na faculdade',
    'Já me formei e vou fazer a minha primeira prova',
    'Já fiz a prova uma vez e não passei',
    'Já fiz duas ou mais vezes e não passei',
    'Só estou olhando, por curiosidade'
  ];
  var app = document.getElementById('app');
  var esc = function(s){ return String(s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); };

  function render(){
    if(S.screen==='intro') return intro();
    if(S.screen==='content') return content();
    if(S.screen==='behavior') return behavior();
    if(S.screen==='form') return form();
    if(S.screen==='result') return result();
  }

  function intro(){
    app.innerHTML =
      '<h1>Em 3 minutos, descubra <em>onde</em> você perde ponto na 1ª fase.</h1>'+
      '<p class="lead">Existem dois jeitos de reprovar: não saber a matéria, e saber e travar na hora. Este mini-diagnóstico separa os dois e te diz qual está te derrubando.</p>'+
      '<p class="lead" style="margin-bottom:22px">São 5 questões do que mais cai, com o relógio correndo como na prova, e 3 situações rápidas do dia a dia. No fim, seu resultado na tela.</p>'+
      '<button class="btn full" id="go">Começar o mini-diagnóstico</button>';
    document.getElementById('go').onclick = function(){ S.screen='content'; render(); window.scrollTo(0,0); };
  }

  function content(){
    var i=S.ci, Q=CONTENT[i];
    var sel = S.ans[i];
    app.innerHTML =
      '<div class="prog"><span>Parte 1 · questão '+(i+1)+' de '+CONTENT.length+'</span><span class="clock"><i></i><span id="clk">0s</span></span></div>'+
      '<div class="qbox"><div class="qmat">'+esc(Q.mat)+'</div><div class="qtext">'+esc(Q.q)+'</div>'+
      Q.o.map(function(op,j){ return '<button class="opt'+(sel===j?' sel':'')+'" data-j="'+j+'">'+esc(op)+'</button>'; }).join('')+
      '</div>'+
      (i>0?'<button class="back" id="back">Voltar</button>':'');
    // Cronômetro: mede o tempo real de decisão por questão. Voltar reinicia a contagem.
    S.qStart=Date.now();
    if(window._clk) clearInterval(window._clk);
    window._clk=setInterval(function(){ var el=document.getElementById('clk'); if(el) el.textContent=Math.floor((Date.now()-S.qStart)/1000)+'s'; },250);
    Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(b){
      b.onclick = function(){
        S.ans[i] = parseInt(b.getAttribute('data-j'),10);
        S.times[i] = Math.max(1, Math.round((Date.now()-S.qStart)/1000));
        setTimeout(function(){
          if(i+1<CONTENT.length){ S.ci=i+1; } else { S.screen='behavior'; S.bi=0; }
          render(); window.scrollTo(0,0);
        }, 160);
      };
    });
    if(i>0) document.getElementById('back').onclick = function(){ S.ci=i-1; render(); };
  }

  function behavior(){
    if(window._clk){ clearInterval(window._clk); window._clk=null; }
    var i=S.bi, sel=S.beh[i], B=BEHAVIOR[i];
    app.innerHTML =
      '<div class="prog">Parte 2 · situação '+(i+1)+' de '+BEHAVIOR.length+'</div>'+
      '<div class="qbox"><div class="qmat">No dia a dia</div><div class="qtext">'+esc(B.q)+'</div>'+
      B.o.map(function(op,j){ return '<button class="opt'+(sel===j?' sel':'')+'" data-j="'+j+'">'+esc(op[0])+'</button>'; }).join('')+
      '</div><button class="back" id="back">Voltar</button>';
    Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(b){
      b.onclick = function(){
        S.beh[i] = parseInt(b.getAttribute('data-j'),10);
        setTimeout(function(){
          if(i+1<BEHAVIOR.length){ S.bi=i+1; render(); }
          else { S.screen='form'; render(); }
          window.scrollTo(0,0);
        }, 160);
      };
    });
    document.getElementById('back').onclick = function(){
      if(i>0){ S.bi=i-1; render(); } else { S.screen='content'; S.ci=CONTENT.length-1; render(); }
    };
  }

  function form(){
    app.innerHTML =
      '<div class="prog">Quase lá</div>'+
      '<h1 style="font-size:23px">Pra onde mando o seu resultado?</h1>'+
      '<p class="lead" style="margin-bottom:18px">O seu mapa aparece já na próxima tela.</p>'+
      '<div class="field"><label>Onde você está hoje</label>'+
        MOMENTO.map(function(op){ return '<button class="opt'+(S.momento===op?' sel':'')+'" data-m="'+esc(op)+'">'+esc(op)+'</button>'; }).join('')+
      '</div>'+
      '<div class="field"><label>Seu nome</label><input id="f_nome" type="text" placeholder="Como você se chama" value="'+esc(S.nome)+'"></div>'+
      '<div class="field"><label>Seu WhatsApp (com DDD)</label><input id="f_tel" type="tel" inputmode="numeric" placeholder="(00) 00000-0000" value="'+esc(S.tel)+'"></div>'+
      '<div class="field"><label>Seu e-mail (opcional)</label><input id="f_email" type="email" placeholder="seu@email.com" value="'+esc(S.email)+'"></div>'+
      '<button class="btn full" id="see">Ver o meu resultado</button>'+
      '<div class="small">É grátis e sem spam. Você pode sair quando quiser.</div>';
    Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(b){
      b.onclick = function(){
        S.momento = b.getAttribute('data-m');
        S.nome = document.getElementById('f_nome').value;
        S.tel = document.getElementById('f_tel').value;
        S.email = document.getElementById('f_email').value;
        render();
      };
    });
    document.getElementById('see').onclick = function(){
      var nome=document.getElementById('f_nome').value.trim();
      var email=document.getElementById('f_email').value.trim();
      var tel=document.getElementById('f_tel').value.trim();
      var digits=tel.replace(/\D/g,'');
      if(!S.momento){ alert('Marque onde você está hoje para ver o resultado.'); return; }
      if(!nome || digits.length<10){ alert('Preencha o nome e um WhatsApp válido com DDD para ver o resultado.'); return; }
      if(email && !/.+@.+\..+/.test(email)){ alert('O e-mail parece inválido — corrija ou deixe em branco.'); return; }
      S.nome=nome; S.email=email; S.tel=tel;
      saveLead();
      S.screen='result'; render(); window.scrollTo(0,0);
    };
  }

  function saveLead(){
    var lead={ nome:S.nome, email:S.email, tel:S.tel, momento:S.momento, ans:S.ans, beh:S.beh, ts:new Date().toISOString() };
    try{ var all=JSON.parse(localStorage.getItem('soqc_leads')||'[]'); all.push(lead); localStorage.setItem('soqc_leads', JSON.stringify(all)); }catch(e){}

    // O mesmo resultado que a pessoa vê vai junto no e-mail do lead. Sem isso
    // chega só um nome e um telefone, e não dá para saber quem o anúncio trouxe.
    var R = compute();
    var Q = quadrant(R.X, R.Y);
    var conta = {}, ordem = [];
    CONTENT.forEach(function(qq,i){
      if(S.ans[i]!==qq.c){ if(!conta[qq.mat]){ conta[qq.mat]=0; ordem.push(qq.mat); } conta[qq.mat]++; }
    });
    var erradas = ordem.map(function(m){ return conta[m]>1 ? m+' ('+conta[m]+')' : m; });
    var tsoma = 0, tn = 0;
    CONTENT.forEach(function(_,i){ if(S.times[i]!=null){ tsoma += S.times[i]; tn++; } });

    var tmed = tn ? Math.round(tsoma/tn) : null;
    var errouEm = erradas.length ? erradas.join(', ') : 'nenhuma';
    var q = new URLSearchParams(location.search);

    // Marca o Lead no pixel. Só roda depois que o lead foi guardado de verdade:
    // disparar antes faz a Meta contar gente que a gente perdeu no caminho.
    function marcarPixel(){
      if(typeof fbq==='undefined') return;
      try{
        // Advanced matching: melhora o EMQ do pixel (a Meta faz o hash sozinha).
        var am={};
        if(S.email) am.em=S.email.trim().toLowerCase();
        var d=S.tel.replace(/\D/g,''); if(d) am.ph='55'+d;
        fbq('init','1024990753668044',am);
        fbq('track','Lead');
      }catch(e){}
    }

    // 1) Base própria (Supabase, via /api/lead na Vercel). É a fonte de verdade:
    //    não tem teto mensal e permite cruzar lead contra venda depois.
    var naBase = fetch(BASE_URL, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        nome:S.nome, telefone:S.tel, email:S.email, momento:S.momento,
        acertos:R.c, total_questoes:CONTENT.length,
        eixo_conteudo:R.X, eixo_pressao:R.Y, perfil:Q.lab,
        errou_em:errouEm, tempo_medio:tmed,
        utm_campaign:q.get('utm_campaign'), utm_content:q.get('utm_content'),
        referrer:document.referrer || null
      })
    }).then(function(r){ return r.ok; }).catch(function(){ return false; });

    // 2) Formspree segue como aviso por e-mail, em paralelo. Se um falhar, o outro salva.
    var noEmail = CAPTURE_URL ? fetch(CAPTURE_URL,{
      method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify({ nome:S.nome, email:S.email, telefone:S.tel, momento:S.momento,
        acertos: R.c + ' de ' + CONTENT.length,
        eixo_conteudo: R.X + '%',
        eixo_pressao: R.Y + '%',
        perfil: Q.lab,
        errou_em: errouEm,
        tempo_medio: tmed != null ? tmed + 's por questão' : 'sem registro',
        quando:lead.ts, _subject:'Novo lead do mini-diagnostico Só o que Cai' })
    }).then(function(r){ return r.ok; }).catch(function(){ return false; }) : Promise.resolve(false);

    Promise.all([naBase, noEmail]).then(function(ok){
      if(ok[0] || ok[1]) return marcarPixel();
      // Os dois falharam: tenta a base mais uma vez antes de desistir.
      return fetch(BASE_URL, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ nome:S.nome, telefone:S.tel, email:S.email, momento:S.momento })
      }).then(function(r){ if(r.ok) marcarPixel(); }).catch(function(){});
    });
  }

  function compute(){
    var c=0; CONTENT.forEach(function(Q,i){ if(S.ans[i]===Q.c) c++; });
    var X=Math.round(c/CONTENT.length*100);
    var bp=0; BEHAVIOR.forEach(function(B,i){ bp += (S.beh[i]!=null?B.o[S.beh[i]][1]:0); });
    var Y=Math.round(bp/(BEHAVIOR.length*2)*100);
    return {X:X,Y:Y,c:c};
  }
  function quadrant(X,Y){
    var hiX=X>=50, hiY=Y>=50;
    if(hiX&&hiY) return {cls:'green',lab:'Você chega bem nos dois',txt:'Você foi bem na amostra, e isso é um sinal, não um veredito: acertar 5 questões não aprova ninguém. A OAB reprova quem acerta as fáceis e sangra nas matérias de peso. O diagnóstico mostra se esse resultado se sustenta em 24 questões, nas 6 matérias que decidem a prova.'};
    if(hiX&&!hiY) return {cls:'ochre',lab:'Você sabe, mas trava',txt:'O conteúdo não parece ser o seu maior problema. O que te derruba é o desempenho na hora: tempo, travada, insegurança. Isso se trata com tática de prova, não com mais matéria.'};
    if(!hiX&&hiY) return {cls:'mixed',lab:'Falta conteúdo',txt:'Você se segura bem na prova, mas ainda tem lacuna de conteúdo. O caminho é focar nas matérias certas, começando pelas de maior peso, sem se perder no que quase não cai.'};
    return {cls:'mixed',lab:'Conteúdo e tática',txt:'Você está perdendo ponto nos dois lados. A boa notícia: dá para atacar os dois com método, começando pelo conteúdo de maior peso e trabalhando a tática em paralelo.'};
  }

  // Matérias em que a pessoa errou, na ordem em que apareceram, sem repetir.
  function materiasErradas(){
    var out=[];
    CONTENT.forEach(function(qq,i){ if(S.ans[i]!==qq.c && out.indexOf(qq.mat)<0) out.push(qq.mat); });
    return out;
  }

  // O bloco do que ainda está trancado. Regra: o que as 5 questões já mostraram
  // sai legível e verdadeiro; o que depende das 24 sai como barra opaca, sem
  // número por baixo. Valor fixo que parece calculado destrói a credibilidade
  // no primeiro print comparado entre duas pessoas.
  function lockbox(forte){
    var err=materiasErradas();
    function real(t,v){ return '<div class="row"><span class="t">'+t+'</span><span class="val">'+esc(v)+'</span></div>'; }
    function trava(t){ return '<div class="row"><span class="t">'+t+'</span><span class="val trava"></span></div>'; }
    var linhas = err.length
      ? real('Onde você tropeçou nestas 5', err.join(', '))
      : real('Onde você tropeçou nestas 5', 'em nenhuma');
    linhas += forte
      ? trava('Se este placar se sustenta em 24 questões')+
        trava('A matéria do núcleo em que você ainda oscila')+
        trava('Sua margem para o dia da prova')
      : trava('Sua porcentagem em cada uma das 6 matérias do núcleo')+
        trava('Se o que te derruba é conteúdo ou pressão, matéria por matéria')+
        trava('Por onde começar a estudar amanhã');
    return '<div class="lockbox">'+
      '<div class="head">O que o diagnóstico completo revela sobre você</div>'+
      '<div class="inner">'+linhas+'</div>'+
      '<div class="cta">A primeira linha saiu das suas 5 respostas. O resto depende das 24, e sai na hora, com o seu nome.</div>'+
    '</div>';
  }

  function gabarito(){
    // A demo do produto: UMA questão corrigida no formato do relatório pago.
    // Mostra a PRIMEIRA que a pessoa errou: é mais útil para ela, e faz a amostra
    // variar sozinha. Corrigir sempre a mesma questão vira atalho de grupo de
    // WhatsApp e a demo perde a graça para todo mundo que chega depois.
    var idx=0;
    for(var k=0;k<CONTENT.length;k++){ if(S.ans[k]!==CONTENT[k].c){ idx=k; break; } }
    // Acertou todas: sorteia, para não repetir a mesma em todo mundo.
    if(S.ans[idx]===CONTENT[idx].c) idx=Math.floor(Math.random()*CONTENT.length);
    var Q=CONTENT[idx], sua=S.ans[idx];
    var alts=Q.o.map(function(op,j){
      var cls='alt'+(j===Q.c?' certa':'')+(j===sua&&sua!==Q.c?' sua':'');
      var pre=String.fromCharCode(65+j)+') ';
      var suf=(j===Q.c?' — correta':(j===sua?' — a sua resposta':''));
      return '<div class="'+cls+'">'+pre+esc(op)+suf+'</div>';
    }).join('');
    return '<div class="gab"><div class="k">Gabarito comentado · amostra do relatório</div>'+
      '<div class="q">'+esc(Q.mat)+' · '+esc(Q.q)+'</div>'+alts+
      '<div class="exp">'+Q.exp+' <b>No diagnóstico completo, cada uma das 24 questões vem com um comentário assim.</b></div></div>';
  }

  function pressao(){
    // Devolve a leitura dos 3 cenários psicotécnicos e a ponte para o produto:
    // o R$47 inclui o raio-x de pressão e a folha de tática de prova.
    var scores=[], linhas='';
    BEHAVIOR.forEach(function(B,i){
      var sel=S.beh[i]; if(sel==null) return;
      var sc=B.o[sel][1]; scores.push(sc);
      linhas+='<p style="margin-bottom:6px">'+esc(B.leit[sc])+'</p>';
    });
    if(!scores.length) return '';
    var tem0=scores.indexOf(0)>=0, tem1=scores.indexOf(1)>=0;
    var cls=tem0?'ochre':(tem1?'mixed':'green');
    var ponte;
    if(tem0||tem1){
      ponte='<p><b>O que o diagnóstico faz com isso:</b> o raio-x de pressão mostra em que ponto das 24 questões o seu rendimento cai, e a folha de tática de prova monta a ordem das três passadas para o seu perfil. Nervosismo não se resolve com mais matéria; se resolve com método na hora da prova.'+(tem0?' E no Plano Completo existe ainda o módulo Cabeça para a prova, feito exatamente para quem trava.':'')+'</p>';
    } else {
      ponte='<p><b>O que o diagnóstico faz com isso:</b> confirma se esse controle se sustenta por 24 questões seguidas, e a folha de tática de prova transforma esse sangue frio em pontos.</p>';
    }
    return '<div class="verdict '+cls+'"><div class="k">Como você funcionou sob pressão</div>'+linhas+ponte+'</div>';
  }

  function tempo(){
    // O relógio é o sensor que a pessoa não controla. Três sinais, por prioridade:
    // erro rápido (convicção errada), hesitação máxima, ritmo lento demais.
    var ts=[]; CONTENT.forEach(function(_,i){ if(S.times[i]!=null) ts.push({i:i,t:S.times[i]}); });
    if(ts.length<CONTENT.length) return '';
    var soma=0; ts.forEach(function(x){ soma+=x.t; });
    var avg=soma/ts.length;
    var lin=[], ruim=false;
    var rapErr=null;
    ts.forEach(function(x){ if(S.ans[x.i]!==CONTENT[x.i].c && x.t<=Math.max(15,avg*0.6) && (rapErr===null||x.t<rapErr.t)) rapErr=x; });
    if(rapErr){ ruim=true; lin.push('Você errou a questão de <b>'+esc(CONTENT[rapErr.i].mat)+'</b> em '+rapErr.t+' segundos, sem hesitar. Erro com convicção é o mais caro da prova: você não desconfia dele, não revisa, e ele passa.'); }
    var mx=ts[0]; ts.forEach(function(x){ if(x.t>mx.t) mx=x; });
    if(mx.t>=40 && mx.t>=2*avg){
      ruim=true;
      var acertou=S.ans[mx.i]===CONTENT[mx.i].c;
      lin.push('Onde você mais parou: <b>'+esc(CONTENT[mx.i].mat)+'</b>, '+mx.t+' segundos'+(acertou?'. Acertou, mas hesitou: conteúdo mal assentado hesita antes de acertar, e na prova a hesitação cobra em tempo.':', e ainda saiu errada.'));
    }
    if(avg>=120){ ruim=true; lin.push('Ritmo médio de '+Math.round(avg)+' segundos em questões curtas. Na prova são 80 seguidas, com enunciados bem mais longos: esse ritmo cobra pedágio nas dez últimas.'); }
    if(!lin.length) lin.push('Ritmo firme: você decidiu em média em '+Math.round(avg)+' segundos e não hesitou além da conta em nenhuma.');
    var corpo=''; lin.forEach(function(l){ corpo+='<p style="margin-bottom:6px">'+l+'</p>'; });
    return '<div class="verdict '+(ruim?'ochre':'green')+'"><div class="k">O que o relógio mostrou</div>'+corpo+
      '<p>O raio-x de pressão do diagnóstico completo cronometra as 24 questões e mostra em que ponto o seu rendimento cai.</p></div>';
  }

  function custoErros(){
    // Converte cada erro em preço real na prova: "errou Ética, que são 8 das 80".
    // É o argumento de fato, não de opinião. Sem erro, não aparece.
    var erradas=[]; CONTENT.forEach(function(Q,i){ if(S.ans[i]!==Q.c) erradas.push(Q); });
    if(!erradas.length) return '';
    var mats={}; erradas.forEach(function(Q){ if(!mats[Q.mat]) mats[Q.mat]=Q; });
    var linhas=Object.keys(mats).map(function(m){
      return '<p style="margin-bottom:6px">Você errou <b>'+esc(m)+'</b>. '+esc(m)+' são '+esc(mats[m].fatia)+'. Errar aí no dia custa mais do que em quase qualquer outro lugar.</p>';
    }).join('');
    return '<div class="verdict ochre"><div class="k">O que esses erros custam na prova real</div>'+linhas+
      '<p>Foi assim numa amostra pequena. O diagnóstico completo mede isso em 24 questões e mostra o tamanho real de cada buraco.</p></div>';
  }

  function result(){
    var r=compute(), q=quadrant(r.X,r.Y);
    var nome=esc((S.nome.split(' ')[0])||'você');
    var left=Math.max(10,Math.min(90,r.X)), top=Math.max(10,Math.min(90,100-r.Y));
    // Checkout pré-preenchido com o que a pessoa já digitou: ela não encara
    // o formulário vazio de novo (é onde o funil perde gente).
    var digits=S.tel.replace(/\D/g,'');
    var fill='&name='+encodeURIComponent(S.nome)+
      (S.email?'&email='+encodeURIComponent(S.email):'')+
      (digits?'&phoneNumber='+encodeURIComponent(digits):'');
    var buyUrl=CHECKOUT_URL+fill, buyUrlC=CHECKOUT_COMPLETO+fill;
    // Quem chega forte (quadrante verde) não compra "descobrir fraqueza":
    // recebe o Plano Completo como oferta principal. Os demais, o R$47.
    var forte=(q.cls==='green');
    app.innerHTML =
      '<div class="prog">Seu resultado</div>'+
      '<h1 style="font-size:24px">'+nome+', aqui está o seu sinal.</h1>'+
      '<p class="lead" style="margin-bottom:6px">Você acertou <b>'+r.c+' de '+CONTENT.length+'</b> na parte de conteúdo.</p>'+
      '<p class="lead" style="margin-bottom:16px">Dois eixos, medidos separados: o quanto você domina o conteúdo que cai, e o quanto você se segura na hora da prova. Com '+CONTENT.length+' questões dá para ver um sinal, não um mapa.</p>'+
      '<div class="plot"><div class="vline"></div><div class="hline"></div>'+
        '<div class="ql tr">Pronto de verdade</div><div class="ql br">Sabe, mas trava</div>'+
        '<div class="ql tl">Falta conteúdo</div><div class="ql bl">Conteúdo e tática</div>'+
        '<div class="you" style="left:'+left+'%;top:'+top+'%"><div class="dot"></div></div>'+
      '</div>'+
      '<div class="verdict '+q.cls+'"><div class="k">Onde você está</div><h2>'+q.lab+'</h2><p>'+q.txt+'</p></div>'+
      pressao()+
      tempo()+
      custoErros()+
      gabarito()+
      lockbox(forte)+
      (forte
        ? '<div class="offer">'+
            '<h3>Você não precisa descobrir fraqueza. Precisa de amplitude.</h3>'+
            '<p><b>Quem reprova com esse perfil quase nunca reprova por despreparo. Reprova por subestimar o que ainda não testou.</b></p>'+
            '<p>Quem chega forte no núcleo raramente reprova por ele. Reprova pelas 11 matérias de fora, pelo ritmo nas 80 questões e pelo detalhe que só aparece sob pressão.</p>'+
            '<p>O Plano Completo cobre esse resto do caminho: o diagnóstico de 24 questões para confirmar se este resultado se sustenta, as fichas das 17 disciplinas, dois simulados completos de 80 questões e o cronograma dia a dia até a prova.</p>'+
            '<a class="btn full" href="'+buyUrlC+'" id="buy" data-v="127">Quero o Plano Completo</a>'+
            '<div class="price">R$ 127 · pagamento único · Pix ou cartão · 7 dias de garantia</div>'+
            '<a class="alt" href="'+buyUrl+'" id="buy2" data-v="47">Prefere começar só pelo raio-x? Diagnóstico por R$ 47</a>'+
          '</div>'
        : '<div class="offer">'+
            '<h3>Esse foi só o raio-x de 5 questões. A prova tem 80.</h3>'+
            '<p>O jeito mais comum de reprovar de novo é estudar no escuro: semanas inteiras na matéria que você já sabe, enquanto a que te derruba segue intocada.</p>'+
            '<p>O diagnóstico completo acende a luz. 24 questões depois, você sabe a sua porcentagem em cada matéria do núcleo, qual delas te derruba, se o seu problema é conteúdo ou pressão, e por onde começar amanhã. E leva junto o kit para agir: fichas do que mais cai, folha de tática para o seu perfil e simulados para medir se está subindo.</p>'+
            '<a class="btn full" href="'+buyUrl+'" id="buy" data-v="47">Quero meu diagnóstico completo</a>'+
            '<div class="price">R$ 47 · pagamento único · Pix ou cartão · 7 dias de garantia</div>'+
            '<a class="alt" href="'+buyUrlC+'" id="buy2" data-v="127">Quer o pacote inteiro de uma vez? Plano Completo por R$ 127</a>'+
          '</div>')+
      // Quem chegou frio precisa ver que tem gente por trás disso, e não uma URL
      // genérica. Vai depois da oferta, para não competir com ela.
      '<div class="autor">'+
        '<img src="assets/gustavo.webp" alt="Gustavo" width="48" height="48">'+
        '<p>Quem fez isto é o <b>Gustavo, advogado</b>. Passei pela 1ª fase enchendo a mesa de apostila e quase me enrolei, não por não saber, mas por gastar as poucas horas que tinha na matéria errada. O Só o que Cai faz essa separação em 20 minutos.</p>'+
      '</div>'+
      '<div class="center"><button class="back mini" id="redo">Refazer o teste</button></div>';
    ['buy','buy2'].forEach(function(id){
      var el=document.getElementById(id);
      if(el) el.onclick=function(){ if(typeof fbq!=='undefined'){ try{ fbq('track','InitiateCheckout',{value:parseInt(el.getAttribute('data-v'),10),currency:'BRL'}); }catch(e){} } };
    });
    document.getElementById('redo').onclick=function(){ // times:{} tem que voltar aqui. Sem ele, S.times fica undefined e a primeira
// resposta estoura em S.times[i], deixando o quiz morto na questao 1.
S={ screen:'intro', ci:0, ans:{}, times:{}, bi:0, beh:{}, nome:S.nome, email:S.email, tel:S.tel, momento:S.momento }; render(); window.scrollTo(0,0); };
  }

  render();
</script>
</body>
</html>
