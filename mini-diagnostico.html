<style>
  :root{
    --paper:#F3EEE4; --card:#FBF9F4; --ink:#231F1A; --muted2:#574F45; --muted:#8A8378;
    --line:#E4DBC9; --navy:#15212B; --ocre:#A65D1E; --ocre2:#C77A2B; --green:#3A7A5C;
    --red:#C0271A; --red2:#E8B4AE; --red3:#8E1A10;
  }
  *{box-sizing:border-box;margin:0}
  body{background:var(--paper);color:var(--ink);font-family:'Hanken Grotesk',sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto;padding:40px 22px 64px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
  .logo{display:flex;align-items:center}
  .logo svg{display:block;border-radius:8px}
  .word{font-family:'Spectral',serif;font-weight:600;font-size:21px}
  .tag{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  h1{font-family:'Spectral',serif;font-weight:600;font-size:27px;line-height:1.18;letter-spacing:-.01em;margin-bottom:12px}
  h1 em{font-style:italic;color:var(--ocre)}
  .lead{font-size:16px;color:var(--muted2);margin-bottom:8px}
  .prog{font-family:'Space Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
  .clock{display:inline-flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;font-size:11px;color:var(--muted2)}
  .clock i{width:7px;height:7px;border-radius:50%;background:var(--ocre);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
  /* Cronômetro regressivo. Era um relógio crescente de 11px escondido na barra de
     progresso: sumia na tela. Agora é o elemento mais visível da questão, porque a
     pressão do relógio é metade do que este teste mede. */
  .timer{text-align:center;margin-bottom:16px}
  .timer .num{font-family:'Space Mono',monospace;font-weight:700;font-size:40px;line-height:1;
    color:var(--red);font-variant-numeric:tabular-nums;display:inline-block;
    transition:transform .18s ease}
  .timer .bar{height:6px;border-radius:3px;background:var(--red2);overflow:hidden;margin-top:10px}
  .timer .bar i{display:block;height:100%;background:var(--red);border-radius:3px;
    width:100%;transform-origin:left center}
  /* Últimos 10s. Escala por transform e NÃO por font-size, para não empurrar o layout
     e fazer a questão pular embaixo do dedo da pessoa.
     Batida própria, e não o @keyframes pulse do pontinho: aquele vai a opacidade .2,
     e num número de 40px isso lê como "apagando", que é o oposto de urgência. Aqui a
     opacidade fica cheia e quem pulsa é a escala, como batimento. */
  @keyframes tictac{0%,100%{transform:scale(1.08)}50%{transform:scale(1.26)}}
  .timer.urgente .num{transform:scale(1.15);animation:tictac .9s infinite}
  .timer.urgente .bar i{background:var(--red3)}
  .timer .rule{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--muted);margin-top:8px}
  /* Progresso. Antes era uma linha cinza de 9,5px embaixo de um número vermelho de 40px:
     sumia. Só que saber que falta pouco é justamente o que segura quem cansa na quinta
     questão, e quem desiste no meio não vira lead. Os sete traços dizem isso sem texto. */
  /* Bloco de confiança. O lead do funil B vem do anúncio direto para o quiz e NUNCA
     passa pela landing: ele clica em pagar sem ter visto depoimento, garantia nem quem
     está por trás. Tudo isso já existe, a um bloco de distância, e não estava sendo
     trazido. Vai ANTES da oferta, porque confiança vem antes do pedido de dinheiro. */
  .confia{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:20px}
  .confia .autor{margin-top:0;background:none;border:none;padding:0;border-radius:0}
  .confia .dep{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted2);line-height:1.55}
  .confia .dep .quem{display:block;margin-top:7px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .confia .gar{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted2);line-height:1.55}
  .confia .gar b{color:var(--green)}
  /* Tabela de custo, duas colunas. A esquerda é longa e cara, a direita é curta e barata:
     a assimetria é o argumento, e ela lê num segundo, o que nenhum parágrafo consegue. */
  .custo{margin-top:16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .custo .lin{display:grid;grid-template-columns:1fr 1fr}
  .custo .lin+.lin{border-top:1px solid var(--line)}
  .custo .lin>div{padding:11px 13px;font-size:13.5px;line-height:1.42}
  .custo .lin>div:first-child{border-right:1px solid var(--line);color:var(--muted2)}
  .custo .lin>div:last-child{color:var(--ink);font-weight:500}
  .custo .cab>div{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.08em;
    text-transform:uppercase;padding:9px 13px;font-weight:700}
  .custo .cab>div:first-child{background:#F7E8E5;color:var(--red3)}
  .custo .cab>div:last-child{background:#E9F1EA;color:var(--green)}
  /* CTA enxuto logo depois do veredito. O preço só aparecia no 6º bloco de 7. */
  .ctaslim{margin:18px 0 6px}
  .ctaslim .price{font-family:'Space Mono',monospace;font-size:11.5px;color:var(--muted);margin-top:8px;text-align:center}
  .timer .prog7{display:flex;gap:4px;justify-content:center;margin-bottom:9px}
  .timer .prog7 i{width:18px;height:3px;border-radius:2px;background:var(--line)}
  .timer .prog7 i.ok{background:var(--ink)}
  .timer .conta{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.07em;
    text-transform:uppercase;color:var(--ink);margin-bottom:6px}
  /* Cor sozinha não pode carregar o sinal, por daltonismo: o tamanho, a barra drenando
     e o próprio número já carregam em paralelo. Aqui só se desliga o movimento. */
  @media (prefers-reduced-motion: reduce){
    .timer.urgente .num{animation:none}
    .clock i{animation:none}
  }
  .qbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px}
  .qmat{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ocre);margin-bottom:8px}
  .qtext{font-size:18px;font-weight:500;line-height:1.4;margin-bottom:18px}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:9px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;transition:.12s}
  .opt:hover{border-color:var(--ocre2)}
  .opt.sel{border-color:var(--ocre);background:#FBF1E6}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--navy);color:#fff;border:none;border-radius:12px;padding:14px 22px;font:inherit;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;transition:.15s}
  .btn:hover{background:#0d161d}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .btn.full{width:100%}
  .back{background:none;border:none;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;margin-top:14px;padding:4px}
  .autor{display:flex;align-items:flex-start;gap:13px;margin-top:20px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px}
  .autor img{border-radius:50%;flex-shrink:0;object-fit:cover}
  .autor p{font-size:13.5px;color:var(--muted2);line-height:1.5}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:13.5px;color:var(--muted2);margin-bottom:5px}
  .field input{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;font:inherit;font-size:16px;color:var(--ink)}
  .field input:focus{outline:none;border-color:var(--ocre)}
  .small{font-size:12.5px;color:var(--muted);margin-top:10px}
  /* resultado */
  .verdict{border-radius:16px;padding:20px;margin:6px 0 18px;border:1px solid var(--line)}
  .verdict.ochre{background:#FBF1E6;border-color:#E7CFA8}
  .verdict.mixed{background:#F1ECE0}
  .verdict.green{background:#E9F1EA;border-color:#BFD8C4}
  .verdict .k{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);margin-bottom:6px}
  .verdict h2{font-family:'Spectral',serif;font-weight:600;font-size:22px;margin-bottom:8px}
  .verdict p{font-size:15px;color:var(--muted2)}
  .plot{position:relative;width:100%;max-width:280px;margin:0 auto 18px;aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:14px}
  .plot .vline,.plot .hline{position:absolute;background:var(--line)}
  .plot .vline{left:50%;top:8%;bottom:8%;width:1.5px}
  .plot .hline{top:50%;left:8%;right:8%;height:1.5px}
  .plot .ql{position:absolute;font-size:9.5px;color:var(--muted);font-family:'Space Mono',monospace;letter-spacing:.03em;max-width:42%}
  .plot .tl{top:8px;left:10px}.plot .tr{top:8px;right:10px;text-align:right}
  .plot .bl{bottom:8px;left:10px}.plot .br{bottom:8px;right:10px;text-align:right}
  .plot .you{position:absolute;transform:translate(-50%,-50%)}
  .plot .dot{width:15px;height:15px;border-radius:50%;background:var(--ocre);box-shadow:0 0 0 5px rgba(166,93,30,.18)}
  .plot .ylab{font-size:9.5px}
  .center{text-align:center}
  .offer{background:var(--navy);color:#fff;border-radius:16px;padding:24px 20px;margin-top:8px;text-align:center}
  .offer h3{font-family:'Spectral',serif;font-weight:600;font-size:21px;margin-bottom:8px;color:#fff}
  .offer p{font-size:14.5px;color:#C9C1B4;margin-bottom:16px}
  .offer .price{font-family:'Space Mono',monospace;font-size:13px;color:#E7CFA8;margin-top:12px}
  .offer .btn{background:var(--ocre);}
  .offer .btn:hover{background:#8c4d18}
  .offer .alt{display:inline-block;margin-top:14px;font-size:13px;color:#C9C1B4;text-decoration:underline;cursor:pointer}
  .offer .alt:hover{color:#fff}
  .foot{margin-top:28px;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5}
  /* gabarito comentado (amostra do relatório pago) */
  .gab{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:0 0 18px}
  .gab .k{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin-bottom:8px}
  .gab .q{font-size:15px;font-weight:500;margin-bottom:10px}
  .gab .alt{font-size:14px;padding:9px 11px;border-radius:9px;margin-bottom:6px;border:1px solid var(--line);color:var(--muted2)}
  .gab .alt.certa{background:#E9F1EA;border-color:#BFD8C4;color:var(--ink);font-weight:500}
  .gab .alt.sua{border-color:#D9A05B;background:#FBF1E6}
  .gab .exp{font-size:14px;color:var(--muted2);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .gab .exp b{color:var(--ink)}
  /* bloco trancado (teaser do diagnóstico completo): o TÓPICO fica legível
     para dar curiosidade; só a RESPOSTA é rasurada. */
  .lockbox{border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:18px;background:var(--card)}
  .lockbox .head{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);padding:14px 20px 4px}
  .lockbox .inner{padding:6px 20px 16px}
  .lockbox .row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line)}
  .lockbox .row:last-child{border-bottom:none}
  .lockbox .row .t{color:var(--ink)}
  /* O que as 5 questões já mostraram sai legível e verdadeiro. O que depende das
     24 vira barra opaca: sem texto por baixo, não há valor falso nem screenshot
     para comparar com o do colega. */
  .lockbox .val{color:var(--ink);white-space:nowrap;font-weight:600;font-size:13.5px;text-align:right}
  .lockbox .val.trava{display:inline-block;width:88px;height:10px;border-radius:5px;background:var(--muted2);opacity:.3;font-size:0}
  .lockbox .cta{font-size:12px;color:var(--muted);padding:0 20px 14px}
  /* ===== Resultado v3 (02/08/2026) · layout de página de vendas =====
     Vem do handoff de design "Pagina de Venda - Resultado". Regra do ritmo: a página
     inteira é papel, com EXATAMENTE dois blocos navy (o hero e a oferta final). Cada
     navy é um momento; três seriam ruído. O texto e a ordem dos argumentos não mudaram:
     mudou onde cada um respira. A tela de resultado sai do .wrap (que é estreito e tem
     padding) para o hero poder sangrar de borda a borda. ===== */
  body.res .wrap{max-width:none;margin:0;padding:0}
  body.res .wrap>.brand{display:none}
  body.res .wrap>.foot{display:none}
  body.res{padding-bottom:96px}

  .rkick{font-family:'Space Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ocre2);margin-bottom:14px}
  .rh1{font-family:'Spectral',serif;font-weight:600;font-size:clamp(30px,8vw,42px);line-height:1.08;letter-spacing:-.022em;color:#fff;margin-bottom:14px;text-wrap:pretty}
  .rh1 em{font-style:italic;color:#E7A85B}
  .rlead{font-size:16.5px;line-height:1.6;color:#C9C1B4;margin-bottom:26px;max-width:44ch;text-wrap:pretty}
  .rlead b{color:#fff}
  .bars{display:flex;flex-direction:column;gap:16px;padding:20px 18px;border:1px solid #2C3B48;border-radius:16px;background:#1B2934}
  .bars .b{display:flex;flex-direction:column;gap:7px}
  .bars .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .bars .hd span:first-child{font-size:13.5px;color:#C9C1B4}
  .bars .v{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .bars .v.ok{color:#7FB99A}
  .bars .v.no{color:#E7A85B}

  .bars .b:nth-child(2) .tr i{animation-delay:.15s}

  @media (prefers-reduced-motion: reduce){ .bars .tr i{animation:none} }
  .rbody{max-width:600px;margin:0 auto;padding:0 22px}

<body>
<div class="wrap">
  <div class="brand">
    <span class="logo"><svg width="28" height="28" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#15212B"/><g stroke="#F3EEE4" stroke-width="2.4" fill="none"><circle cx="16" cy="16" r="7.2"/><path d="M16 4.5v4M16 23.5v4M4.5 16h4M23.5 16h4"/></g><circle cx="16" cy="16" r="3" fill="#C77A2B"/></svg></span>
    <span class="word">Só o que Cai</span>
    <span class="tag">1ª fase · OAB</span>
  </div>
  <div id="app"></div>
  <div class="foot">Mini-diagnóstico gratuito. Não promete aprovação: mostra direção. Seus dados não são vendidos.</div>
</div>

<script>
  // ===== CONFIGURAR =====
  var CHECKOUT_URL = "https://pay.hotmart.com/B106546831I?checkoutMode=10"; // diagnóstico completo R$47 + Order Bump Kit Reta Final
  var CHECKOUT_COMPLETO = "https://pay.hotmart.com/O106944368L?checkoutMode=10"; // Plano Completo R$127 (inclui o diagnóstico)
  // Para onde enviar os leads (nome/e-mail/WhatsApp). Cole aqui um endpoint de formulário
  // (ex.: Formspree, um Apps Script do Google, ou a API da sua ferramenta de e-mail).
  // Enquanto estiver vazio, o lead é só guardado no navegador (localStorage) e nada é perdido,
  // mas você precisa ligar isto para receber os contatos de verdade.
  var CAPTURE_URL = "https://formspree.io/f/mlgyzdwj"; // Formspree: so o aviso por e-mail
  var BASE_URL = "https://so-o-que-cai-app.vercel.app/api/lead"; // fonte de verdade do lead
  // ======================

  // 7 questões de conteúdo, TODAS difíceis, uma por matéria do núcleo duro
  // (Ética entra duas vezes porque é a maior fatia da prova) + 3 cenários
  // psicotécnicos.
  // Por que só difíceis: com questão de padrão médio todo mundo acertava 3 de 5,
  // batia o corte e recebia "chega bem nos dois". Em 02/08/2026, 9 de 9 pessoas
  // caíram no mesmo quadrante verde, incluindo quem já reprovou duas vezes. Uma
  // amostra que não consegue reprovar ninguém não mede nada e ainda alivia quem
  // deveria sair incomodado.
  // Critério de escolha, e agora é um só: TODAS são pegadinha de troca de palavra,
  // aquelas em que uma palavra vira o sentido inteiro. Saíram as que dependiam de
  // norma recente (EC 131/2023 e pacote anticrime), porque ali o erro é material
  // desatualizado, não a distinção que separa quem sabe de quem decorou.
  // O mapa das palavras: incompatibilidade x impedimento · voto direto x obrigatório ·
  // pretensão x direito · interrompe x suspende · culpabilidade x dolo · depois x antes
  // da denúncia · mesmo autorizado pelo cliente.
  // As questões vindas do banco do produto foram revisadas contra fontes primárias
  // em 04/07/2026. Cada 'exp' NOMEIA a palavra trocada, porque é ela que vende.
  // 'fatia' = peso aproximado da matéria na prova.
  var CONTENT = [
    {mat:'Ética', fatia:'8 das 80 questões, a maior fatia da prova', dif:true, q:'Um militar da ativa foi aprovado no Exame de Ordem. Sobre o exercício da advocacia, ele:', exp:'<b>Por que a C é a certa:</b> militar da ativa é caso de incompatibilidade, não de impedimento (art. 28, V, do Estatuto da Advocacia). A diferença cai muito: impedimento proíbe advogar contra certas partes, incompatibilidade proíbe advogar em qualquer hipótese, inclusive em causa própria e fora do horário de serviço.', o:['Pode advogar livremente, desde que fora do horário de serviço.','Está impedido: só não pode advogar contra a Fazenda Pública que o remunera.','Está incompatibilizado: não pode exercer a advocacia enquanto estiver na ativa, nem em causa própria.','Pode advogar apenas em causas da Justiça Militar.'], c:2},
    {mat:'Constitucional', fatia:'6 a 7 das 80 questões', dif:true, q:'Proposta de emenda constitucional pretende tornar o voto facultativo no Brasil. A proposta:', exp:'<b>Por que a C é a certa:</b> a cláusula pétrea do art. 60, § 4º, II, protege o voto <b>direto, secreto, universal e periódico</b>. A obrigatoriedade não está nessa lista: ela mora no art. 14, § 1º, e pode ser suprimida por emenda. A alternativa A troca uma palavra da lista por outra que não está nela, e é só isso que separa quem sabe de quem decorou.', o:['É inconstitucional, pois o voto obrigatório é cláusula pétrea.','É inconstitucional, pois matéria eleitoral não admite emenda.','É constitucional, pois a cláusula pétrea protege o voto direto, secreto, universal e periódico, e não a sua obrigatoriedade.','Só seria válida se aprovada também por referendo popular.'], c:2},
    {mat:'Civil', fatia:'7 das 80 questões', dif:true, q:'Sobre prescrição e decadência, é correto que:', exp:'<b>Por que a B é a certa:</b> violado o direito, nasce a pretensão, e é ela que a prescrição extingue (art. 189 do Código Civil). O direito em si continua existindo, tanto que a dívida prescrita paga não se repete. A decadência é outra coisa: atinge o próprio direito potestativo, aquele que se exerce por prazo certo.', o:['A prescrição atinge o próprio direito.','A prescrição extingue a pretensão.','A decadência extingue a pretensão.','Prescrição e decadência são sinônimos.'], c:1},
    {mat:'Processo Civil', fatia:'6 a 7 das 80 questões', dif:true, q:'Publicada sentença omissa quanto a um dos pedidos, General Cargas opôs embargos de declaração. Quanto ao prazo dos demais recursos:', exp:'<b>Por que a D é a certa:</b> os embargos de declaração <b>interrompem</b> o prazo recursal para as duas partes, e interromper significa que o prazo recomeça do zero depois do julgamento (CPC, arts. 1.023 e 1.026). A alternativa A troca interromper por suspender, que devolveria só o saldo. Essa troca é uma das que mais derruba gente, e derruba advogado também: é perda de prazo real.', o:['Fica suspenso, voltando a correr pelo restante após o julgamento.','Continua correndo, pois os embargos não interferem em outros prazos.','Fica suspenso apenas para a parte embargante.','Fica interrompido para ambas as partes, reiniciando por inteiro após a publicação do julgamento dos embargos.'], c:3},
    {mat:'Penal', fatia:'5 a 6 das 80 questões', dif:true, q:'Criado em comunidade isolada onde a prática era tida como lícita, Josué praticou conduta típica sem qualquer possibilidade de conhecer sua ilicitude, o que ficou provado. Josué:', exp:'<b>Por que a A é a certa:</b> erro de proibição inevitável isenta de pena; se fosse evitável, apenas diminuiria de um sexto a um terço (CP, art. 21). O erro clássico está na D: erro de proibição atua na <b>culpabilidade</b> e o dolo permanece inteiro. Quem exclui o dolo está confundindo com erro de tipo (art. 20), que é outra figura.', o:['Fica isento de pena, pois o erro de proibição inevitável exclui a culpabilidade.','Responde pelo crime com pena reduzida de um sexto a um terço.','Responde normalmente, pois ninguém se escusa de cumprir a lei.','Tem excluído o dolo, respondendo por culpa.'], c:0},
    {mat:'Processo Penal', fatia:'5 a 6 das 80 questões', dif:true, q:'Vítima de crime de ação penal pública condicionada, Sula ofereceu representação, mas se arrependeu. Quanto à retratação:', exp:'<b>Por que a D é a certa:</b> a representação só se torna irretratável <b>depois de oferecida a denúncia</b> (CPP, art. 25). Antes desse marco a vítima pode se retratar validamente. A alternativa A troca "denúncia" por "boletim de ocorrência" e a B por "trânsito em julgado". Um marco temporal trocado e a questão inteira cai.', o:['É vedada após o registro do boletim de ocorrência.','É possível a qualquer tempo, até o trânsito em julgado.','Depende de homologação judicial com oitiva do investigado.','É admitida somente até o oferecimento da denúncia.'], c:3},
    {mat:'Ética', fatia:'8 das 80 questões, a maior fatia da prova', dif:true, q:'Em ação penal contra Túlio, seu ex-cliente, o advogado Fábio é arrolado como testemunha. Túlio, interessado no depoimento, autoriza expressamente que Fábio revele o que souber. Fábio:', exp:'<b>Por que a D é a certa:</b> o advogado pode recusar-se a depor sobre fato ligado a quem foi seu cliente <b>mesmo autorizado</b> por ele (EOAB, art. 7º, XIX; CED, art. 38). A palavra que derruba é "autoriza": o sigilo é dever do profissional, não disposição do cliente, então a autorização não libera coisa alguma.', o:['Deve depor, pois a autorização do cliente afasta o dever de sigilo.','Deve depor, pois o sigilo não alcança processos de natureza penal.','Só pode recusar o depoimento se demonstrar prejuízo próprio.','Pode recusar-se a depor sobre fatos ligados ao antigo patrocínio, mesmo com a autorização do cliente.'], c:3}
  ];
  // Parte 2: psicotécnico indireto. Cenários de OUTRO domínio (trânsito, prazo,
  // memória em público) que revelam congelamento/afobação/controle sem perguntar
  // "você é ansioso?" — ninguém se declara ansioso. Cada opção carrega a pontuação.
  // 'leit' = leitura do resultado por pontuação (0/1/2): traduz o cenário de
  // volta para a prova, sem rotular ninguém de "ansioso" — mostra o comportamento.
  var BEHAVIOR = [
    {q:'Você está dirigindo num trevo desconhecido, o GPS trava e os carros atrás começam a buzinar. O que acontece primeiro?',
     o:[['Sigo por qualquer saída, só para não ficar parado ali',1],['Dou uma travada de alguns segundos antes de conseguir decidir',0],['Encosto onde dá e decido o caminho com calma',2]],
     leit:{0:'No trevo, você travou antes de decidir. Na prova, esse é o perfil que dá branco numa questão difícil e perde o ritmo nas três seguintes.',1:'No trevo, você seguiu por qualquer saída para escapar da pressão. Na prova, é quem marca sem reler o enunciado e cai na alternativa que parece certa.',2:'No trevo, você parou e escolheu com calma: você decide bem debaixo de buzina.'}},
    {q:'Faltando 20 minutos para entregar algo importante, você percebe um erro numa parte que já estava pronta.',
     o:[['Corrijo o essencial e entrego no prazo',2],['Tento refazer tudo e por pouco não estouro o prazo',0],['Entrego como está e passo o resto do dia remoendo',1]],
     leit:{0:'Com o prazo estourando, você tentou refazer tudo. Na prova, é quem empaca numa questão e chega sem tempo nas dez últimas.',1:'Você entregou, mas ficou remoendo. Na prova, é quem carrega a questão anterior na cabeça e erra a seguinte por distração.',2:'Com o prazo apertado, você priorizou e entregou: sua gestão de tempo funciona sob pressão.'}},
    {q:'Na frente de outras pessoas, te pedem um dado que você sabe de cor.',
     o:[['Vem na hora, normal',2],['Às vezes dá branco na hora, e a resposta aparece depois, sozinho',0],['Peço um segundo e a resposta vem',1]],
     leit:{0:'O dado que você sabe de cor não saiu na hora, na frente dos outros. É o branco clássico: o problema não é saber, é acessar sob observação. E a prova inteira é sob observação.',1:'Você pediu um segundo e a resposta veio: você acessa a memória sob pressão, pagando um pequeno preço em tempo.',2:'A resposta veio na hora, mesmo com plateia: memória estável sob observação.'}}
  ];

  // Segundos por questão. Único lugar para mexer. 40 porque ler quatro alternativas
  // de pegadinha com atenção consome 25 a 30, e o que sobra é a hesitação, que é
  // justamente o que este teste quer medir.
  var LIMITE = 40;

  var S = { screen:'intro', ci:0, ans:{}, times:{}, estourou:{}, fora:{}, bi:0, beh:{},
            nome:'', email:'', tel:'', momento:'' };

  // Em que ponto da caminhada a pessoa está. Serve para saber quem o anúncio traz
  // (bacharel de primeira prova, reprovado, quem ainda está na faculdade) e para
  // calibrar a leitura do resultado. Uma escolha só, obrigatória.
  var MOMENTO = [
    'Ainda estou na faculdade',
    'Já me formei e vou fazer a minha primeira prova',
    'Já fiz a prova uma vez e não passei',
    'Já fiz duas ou mais vezes e não passei',
    'Só estou olhando, por curiosidade'
  ];
  var app = document.getElementById('app');
  var esc = function(s){ return String(s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); };

  function render(){
    if(S.screen==='intro') return intro();
    if(S.screen==='content') return content();
    if(S.screen==='behavior') return behavior();
    if(S.screen==='form') return form();
    if(S.screen==='result') return result();
  }

  function intro(){
    app.innerHTML =
      '<h1>Em 4 minutos, descubra <em>onde</em> você perde ponto na 1ª fase.</h1>'+
      '<p class="lead">Existem dois jeitos de reprovar: não saber a matéria, e saber e travar na hora. Este mini-diagnóstico separa os dois e te diz qual está te derrubando.</p>'+
      // A regra aparece uma vez, seca, e SÓ a regra. A versão anterior empilhava sete
      // informações antes do botão, todas de restrição, no exato segundo em que a pessoa
      // decide se começa. Saiu também o "todas são pegadinha": tempo é regra de jogo e
      // precisa ser anunciado, dificuldade é o teste, e teste não se anuncia, senão a
      // pessoa sai com a desculpa pronta de que errou porque era pegadinha.
      // A página não explica e não defende o relógio: justificar abre a porta para
      // "na prova eu teria mais tempo", que anula a dor.
      '<p class="lead" style="margin-bottom:22px">São '+CONTENT.length+' questões, uma de cada matéria que decide a prova. <b style="color:var(--red)">Você tem '+LIMITE+' segundos em cada uma</b>: passou o tempo, a questão passa. Fora desta aba, o relógio corre em dobro.</p>'+
      '<button class="btn full" id="go">Começar o mini-diagnóstico</button>';
    document.getElementById('go').onclick = function(){ S.screen='content'; render(); window.scrollTo(0,0); };
  }

  // Desliga relógio e ouvintes de aba. Chamada em toda saída da Parte 1, senão o
  // ouvinte da questão anterior continua vivo e debita tempo na questão errada.
  function pararRelogio(){
    if(window._clk){ clearInterval(window._clk); window._clk=null; }
    if(window._vis){ document.removeEventListener('visibilitychange', window._vis); window._vis=null; }
    if(window._sai){ window.removeEventListener('blur', window._sai); window._sai=null; }
    if(window._volta){ window.removeEventListener('focus', window._volta); window._volta=null; }
  }

  function content(){
    pararRelogio();
    var i=S.ci, Q=CONTENT[i];
    var dots=''; for(var d=0;d<CONTENT.length;d++) dots+='<i class="'+(d<=i?'ok':'')+'"></i>';
    app.innerHTML =
      '<div class="timer" id="tmr">'+
        '<div class="prog7">'+dots+'</div>'+
        '<div class="conta">Questão '+(i+1)+' de '+CONTENT.length+'</div>'+
        '<div class="num" id="clk">'+LIMITE+'</div>'+
        '<div class="bar"><i id="clkbar"></i></div>'+
        '<div class="rule">'+esc(Q.mat)+'</div>'+
      '</div>'+
      '<div class="qbox"><div class="qtext">'+esc(Q.q)+'</div>'+
      Q.o.map(function(op,j){ return '<button class="opt" data-j="'+j+'">'+esc(op)+'</button>'; }).join('')+
      '</div>';
    // NÃO existe "Voltar" na Parte 1. Com questão cronometrada, voltar seria a brecha:
    // deixa estourar, volta e responde com 40 segundos novos.

    S.qStart=Date.now();
    S.qGasto=0;          // segundos debitados a mais por ausência (a 2ª contagem do dobro)
    S.foraDesde=null;
    if(S.fora[i]==null) S.fora[i]=0;
    var encerrada=false;

    // O tempo consumido SEMPRE sai de Date.now(), nunca de acumulador de tique.
    // Navegador de celular suspende setInterval em aba de fundo, então um contador
    // por tique congelaria justamente para quem saiu da aba para pesquisar: a defesa
    // viraria a brecha. O setInterval abaixo só pinta a tela.
    function consumido(){ return (Date.now()-S.qStart)/1000 + S.qGasto; }

    function sair(){ if(S.foraDesde==null) S.foraDesde=Date.now(); }
    function voltar(){
      if(S.foraDesde==null) return;
      var ausente=(Date.now()-S.foraDesde)/1000; S.foraDesde=null;
      // Fora da aba o relógio corre em dobro. O Date.now() já contou a primeira vez;
      // aqui se debita a segunda.
      S.fora[i]+=ausente; S.qGasto+=ausente;
      pintar();
    }

    function pintar(){
      var el=document.getElementById('clk'), bar=document.getElementById('clkbar'), box=document.getElementById('tmr');
      if(!el) return;
      var resta=Math.max(0, LIMITE-consumido());
      el.textContent=Math.ceil(resta);
      if(bar) bar.style.transform='scaleX('+(resta/LIMITE)+')';
      if(box){ if(resta<=10) box.classList.add('urgente'); else box.classList.remove('urgente'); }
      if(resta<=0) estourar();
    }

    function fechar(){ encerrada=true; pararRelogio(); }

    function avancar(){
      if(i+1<CONTENT.length){ S.ci=i+1; } else { S.screen='behavior'; S.bi=0; }
      render(); window.scrollTo(0,0);
    }

    function estourar(){
      if(encerrada) return;
      fechar();
      S.estourou[i]=true;
      S.times[i]=LIMITE;
      S.ans[i]=null;               // não respondeu: não é a mesma coisa que errar
      avancar();
    }

    window._vis=function(){ if(document.hidden) sair(); else voltar(); };
    window._sai=sair; window._volta=voltar;
    document.addEventListener('visibilitychange', window._vis);
    window.addEventListener('blur', window._sai);
    window.addEventListener('focus', window._volta);
    window._clk=setInterval(pintar,200);
    pintar();

    Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(b){
      b.onclick = function(){
        if(encerrada) return;
        fechar();
        b.classList.add('sel');
        S.ans[i]=parseInt(b.getAttribute('data-j'),10);
        S.times[i]=Math.max(1, Math.min(LIMITE, Math.round(consumido())));
        setTimeout(avancar, 160);
      };
    });
  }

  function behavior(){
    pararRelogio();
    var i=S.bi, sel=S.beh[i], B=BEHAVIOR[i];
    app.innerHTML =

      // O "Voltar" só anda dentro da Parte 2. Voltar para a Parte 1 daria 40 segundos
      // novos numa questão já vencida, que é a mesma brecha do voltar da Parte 1.

    Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(b){
      b.onclick = function(){

          else { S.screen='form'; render(); }
          window.scrollTo(0,0);
        }, 160);
      };
    });
    if(i>0) document.getElementById('back').onclick = function(){ S.bi=i-1; render(); };
  }

  function form(){

      // "Pra onde mando o seu resultado" prometia envio e o resultado aparece na tela,

      // E-mail virou OBRIGATÓRIO em 02/08/2026, a pedido do Gustavo: metade das linhas

      '<button class="btn full" id="see">Ver o meu resultado</button>'+

    // Marcar a opção NÃO re-renderiza o formulário. Antes chamava render(), que refazia a

    var opts=app.querySelectorAll('.opt');
    Array.prototype.forEach.call(opts, function(b){
      b.onclick = function(){
