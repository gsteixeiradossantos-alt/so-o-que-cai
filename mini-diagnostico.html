        '<div class="rsec"><div class="rkk">Diagnóstico completo</div>'+
          '<h3 class="rh3">O que ainda está fechado para você</h3>'+lockbox()+'</div>'+

        // A ponte. Fecha o diagnóstico e entrega o leitor para a tela de oferta, sem
        // preço nenhum até aqui. O pull-quote do momento (L.ponto) desceu para cá: era
        // pull-quote solto no meio e virou o último argumento antes do pedido.
        (L? '<div class="pull"><p>'+esc(L.ponto)+'</p></div>' : '')+
        '<div class="ponte">'+
          '<div class="k">O que fazer com isso</div>'+
          '<h3>'+esc(L? L.titulo : 'Trocar suposição por número')+'</h3>'+
          // A ponte é o degrau mais delicado da página inteira, porque é onde um
          // diagnóstico gratuito vira uma oferta paga. Duas regras que ela não pode
          // quebrar, e que já custaram propostas descartadas de duas revisões:
          //
          // 1. O PREÇO É ANUNCIADO AQUI. Sugeriram tirar, para "despertar curiosidade".
          //    Tirar transformaria o clique em isca: a pessoa clicaria esperando mais
          //    diagnóstico grátis e cairia numa página de venda. Este público é 67% de
          //    gente que já reprovou e que desconfia de curso por experiência própria.
          //    Ele pune isso mais do que pune preço.
          // 2. O BOTÃO NÃO PODE PROMETER CONTINUAÇÃO GRATUITA. Por isso saíram "Ver o
          //    restante do diagnóstico" e "Ver o que faltou neste diagnóstico": as duas
          //    leem como sobra do teste que ela acabou de fazer, o que é a mesma isca
          //    dita de outro jeito.
          //
          // "Ver o diagnóstico completo" nomeia o produto de propósito. Perde algum
          // clique e não surpreende ninguém do outro lado, que é a troca certa aqui.
          // A curiosidade fica no que a frase NÃO diz: o que essas 7 não alcançam.
          '<p>Você já descobriu onde está o problema. O que estas '+CONTENT.length+' questões não alcançam está no diagnóstico completo, e o preço está lá também.</p>'+
          '<a class="rbtn" href="#" id="versol" style="margin-top:0">Ver o diagnóstico completo</a>'+
        '</div>'+

        '<div class="rfoot">Não é vinculado à FGV nem à OAB. Não promete aprovação: mostra direção. Seus dados não são vendidos.</div>'+
      '</div>';

    app.innerHTML = html;
    var vs=document.getElementById('versol');
    if(vs) vs.onclick=function(e){
      e.preventDefault();
      S.screen='solucao'; render(); window.scrollTo(0,0);
    };
  }

  // ===== TELA 2: SOLUÇÃO =====
  // A oferta. Só chega aqui quem pediu, clicando em "Ver minha solução". Esse clique é
  // um degrau novo de funil: antes, Lead e "leu a oferta" eram o mesmo evento, e não
  // dava para separar quem leu o diagnóstico e foi embora de quem leu a oferta e não
  // comprou. São dois problemas diferentes e pedem remédios diferentes.
  function solucao(){
    var C=ctx(), r=C.r, q=C.q, L=C.L, forte=C.forte;
    var tc=tabelaCusto(C.semFalhaDeMateria);
    // O título desta seção era L.titulo, o MESMO que fecha a tela anterior na ponte.
    // A pessoa clicava em "Ver minha solução" e a primeira linha do outro lado era a
    // frase que ela acabou de ler. A tela nova começava parada. Aqui ela avança: o
    // título da ponte é o que a PESSOA precisa fazer, este é o que o PRODUTO faz.
    var tituloSol = C.semFalhaDeMateria
      ? 'As 24 questões que medem o que estas '+CONTENT.length+' não alcançam'
      : 'As 24 questões que dão nome ao que estas '+CONTENT.length+' só apontaram';
    // A tela de oferta abria descrevendo o produto. As duas revisoes independentes
    // apontaram o mesmo: a oferta tem que REACENDER o problema antes de virar catalogo,
    // senao ela le como pagina de vendas generica colada num diagnostico.
    // Esta linha entra ANTES do titulo e devolve a pessoa para a pergunta que ficou.
    var reacende = C.semFalhaDeMateria
      ? 'Você acabou de descobrir que a matéria não é o que te derruba. Falta o resto da resposta: em que ponto o seu rendimento cede, e o que fazer com isso no dia da prova.'
      : 'Você acabou de descobrir que perdeu ponto por matéria. Falta o resto da resposta: quais matérias são, quanto falta em cada uma, e por onde começar amanhã.';

    document.body.className='res';

    // Reancora POR QUE ela está vendo uma oferta: o diagnóstico dela, em uma linha.
    var html =
      '<div class="rrecap"><div class="in">'+
        '<div class="k">'+C.nome+' · seu diagnóstico</div>'+
        '<div class="h">'+C.h1+'</div>'+
      '</div></div>'+

      '<div class="rbody">'+
        (L? '<div class="rsec" style="margin-top:34px"><div class="rkk">O que corrige</div>'+
            '<p class="rp forte" style="margin-bottom:20px">'+esc(reacende)+'</p>'+
            '<h3 class="rh3">'+esc(tituloSol)+'</h3>'+
            '<p class="rp">'+esc(L.texto)+'</p>'+tc+stackOferta()+bonusKit()+
            '<a class="rbtn" href="'+C.buyUrl+'" id="buy0" data-v="47">Quero o diagnóstico completo</a>'+
            C.PAGA+'<div class="rmicro">'+C.MICRO+'</div></div>'
          : '<div class="rsec" style="margin-top:34px">'+tc+stackOferta()+bonusKit()+
            '<a class="rbtn" href="'+C.buyUrl+'" id="buy0" data-v="47">Quero o diagnóstico completo</a>'+
            C.PAGA+'<div class="rmicro">'+C.MICRO+'</div></div>')+

        '<div class="rsec"><div class="rkk">Quem já fez</div>'+
          '<h3 class="rh3">Três pessoas que estavam onde você está agora</h3>'+depoimentos()+'</div>'+

        '<div class="rsec"><div class="rkk">Direto do criador</div>'+
          // O título é o antecedente do "Pensando nisso" com que o vídeo abre: ele
          // fornece o "isso". Escolhido para valer nos cinco desfechos (inclusive para
          // quem gabaritou) e por repetir a tese das duas barras do topo.
          // O título termina no meio da frase de propósito: o vídeo abre com "Pensando
          // nisso" e completa. A repetição das duas palavras é o que costura os dois,
          // então o parágrafo de apoio saiu daqui para não separar um do outro.
          // O título era "saber a matéria e saber fazer a prova são duas coisas
          // diferentes", ou seja, a tese dos dois eixos anunciada como promessa, no meio
          // de uma página cuja promessa passou a ser a margem.
          // O vídeo NÃO mudou e não precisava: ele explica os dois eixos, e isso agora é
          // MECANISMO, que é exatamente o que cabe neste ponto, depois de a oferta já ter
          // sido feita. Só o antecedente mudou, e continua terminando no meio da frase
          // porque o vídeo abre falando "pensando nisso".
          '<h3 class="rh3" style="margin-bottom:18px">Duas questões decidem a prova, e elas não se perdem sempre pelo mesmo motivo. E, pensando nisso...</h3>'+
          // 02/08: era o anúncio inteiro do R$350, que abre apresentando o problema
          // ("essa carteira custou 350 reais") para quem nunca ouviu falar do produto.
          // Aqui a pessoa acabou de fazer o teste: recomeçar do zero joga a temperatura
          // para trás e revende o que a página já entregou. Trocado pelo trecho do V5 em
          // que ele explica o PRODUTO, e que ainda reforça os dois eixos que as barras
          // do topo acabaram de mostrar ("são coisas diferentes, então remédios
          // diferentes"). O anúncio usa outro corte, de outro vídeo: ninguém vê repetido.
          // preload="none": o arquivo não sai do ar antes de a pessoa pedir.
          '<div class="vid"><video controls playsinline preload="none" poster="assets/video/diagnostico-explicado.jpg">'+
            '<source src="assets/video/diagnostico-explicado.mp4" type="video/mp4">'+
          '</video></div>'+
          '<div class="vidleg">Vídeo · 28 segundos · com som</div></div>'+

        '<div class="rsec">'+
          '<div class="autor2"><img src="assets/gustavo.webp" alt="Gustavo, advogado" width="76" height="76" loading="lazy">'+
            '<div><div class="k">Quem fez isto</div>'+
            '<p><b>Gustavo, advogado.</b> Passei pela 1ª fase enchendo a mesa de apostila e quase me enrolei, não por não saber, mas por gastar as poucas horas que tinha na matéria errada.</p></div>'+
          '</div>'+
          '<div class="gar2"><b>7 dias de garantia.</b> Faça o diagnóstico inteiro. Se você não achar que valeu, é só pedir: eu devolvo, sem discussão. O risco é meu, não seu.</div>'+
        '</div>'+

        '<div class="ofim">'+
          '<div class="k">Última coisa</div>'+
          (forte
            // Para quem acertou tudo o pedido continua sendo o MENOR (R$47), e o
            // argumento é o único honesto que existe: sete questões não acharem nada
            // não é o mesmo que não existir nada.
            ? '<h3>Sete questões não acharam nada.<br>Vinte e quatro podem.</h3>'+
              '<p>Com uma questão por matéria, tudo o que dá para afirmar é que naquela você acertou. O diagnóstico completo mede 24, cronometradas, nas mesmas 6 matérias. Você quer entrar na prova com essa dúvida em aberto, ou prefere fechá-la em 20 minutos?</p>'
            // Este bloco repetia, quase palavra por palavra, o argumento do "estudar no
            // escuro" que já aparece no parágrafo de abertura e no pull-quote da tela 1.
            // Terceira vez do mesmo argumento não convence mais ninguém. Trocado pelo
            // calendário, que é o único argumento REAL de urgência que este produto tem
            // e que hoje só aparecia escondido no rodapé do bônus.
            : (diasParaProva()
              // O calendário fica no título, que é onde o relógio pesa. O parágrafo
              // parou de explicar o produto: no último bloco antes do último botão,
              // descrever entregável é voltar atrás. Agora ele põe a decisão binária na
              // mesa, que é a única coisa que aquele lugar da página precisa fazer.
              ? '<h3>A prova é '+porExtenso(DATA_PROVA)+'.<br>Faltam '+diasParaProva()+' dias de estudo.</h3>'+
                '<p>Você já sabe que o problema existe. A decisão agora é uma só: continuar estudando no escuro, ou descobrir hoje exatamente o que corrigir antes da próxima prova.</p>'
              : '<h3>Esse foi o raio-x de '+CONTENT.length+' questões.<br>A prova tem 80.</h3>'+
                '<p>A única decisão que importa é em quais matérias as suas horas de estudo vão cair. O diagnóstico completo devolve o número de cada uma.</p>'))+
          '<a class="rbtn" href="'+C.buyUrl+'" id="buy" data-v="47">Quero meu diagnóstico completo</a>'+
          C.PAGA+'<div class="rmicro">Com o Guia da FGV e o Kit Reta Final juntos, para quem entrar hoje, '+hojeExtenso()+'<br>'+C.MICRO_FIM+'</div>'+
          '<div class="selo">'+
            '<svg width="17" height="17" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 1.5l6 2.4v4.2c0 3.6-2.5 6.3-6 8.4-3.5-2.1-6-4.8-6-8.4V3.9L9 1.5z" fill="none" stroke="#7FB99A" stroke-width="1.5" stroke-linejoin="round"/><path d="M6.2 9l2 2 3.6-3.8" stroke="#7FB99A" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>'+
            // Reescrito para liderar pelo CONTROLE, não pela política. É o mesmo fato,
            // mas quem acabou de sair de um diagnóstico gratuito resiste menos quando a
            // frase devolve a decisão para depois de ver, em vez de pedir a decisão
            // agora. A garantia já era isso; só não estava dita assim.
            '<span>Faça o diagnóstico inteiro primeiro. <b>Só depois você decide se valeu:</b> são 7 dias para pedir de volta, sem perguntas.</span>'+
          '</div>'+
          '<a class="upsell" href="'+C.buyUrlC+'" id="buy2" data-v="127">Quer o pacote inteiro de uma vez? Plano Completo por R$ 127</a>'+
        '</div>'+

        '<div class="rfoot">Não é vinculado à FGV nem à OAB. Não promete aprovação: mostra direção. Seus dados não são vendidos.</div>'+
      '</div>'+

      '<div class="sticky" id="stk"><div class="in">'+
        '<div class="t"><div class="a">Diagnóstico completo</div><div class="b">R$ 47 no Pix · ou '+PARCELA+'</div></div>'+
        '<a href="'+C.buyUrl+'" id="buy3" data-v="47">Quero agora</a>'+
      '</div></div>';

    app.innerHTML = html;
    ligarCompra();
    ligarBarraFixa();

    // Marca que a pessoa PEDIU a oferta. É o degrau que faltava entre Lead e
    // InitiateCheckout: sem ele não dava para separar quem largou no diagnóstico de
    // quem leu a oferta inteira e não comprou, que são problemas diferentes. Também
    // vira público de remarketing: "pediu a solução e não comprou".
    if(typeof fbq!=='undefined'){
      try{ fbq('track','ViewContent',{content_name:'solucao',value:47,currency:'BRL'}); }catch(e){}
    }
  }

  render();
</script>
</body>
</html>
