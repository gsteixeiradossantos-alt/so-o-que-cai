  // amostra que não consegue reprovar ninguém não mede nada e ainda alivia quem
  // deveria sair incomodado.
  // Critério de escolha, e agora é um só: TODAS são pegadinha de troca de palavra,
  // aquelas em que uma palavra vira o sentido inteiro. Saíram as que dependiam de
  // norma recente (EC 131/2023 e pacote anticrime), porque ali o erro é material
  // desatualizado, não a distinção que separa quem sabe de quem decorou.
  // O mapa das palavras: incompatibilidade x impedimento · voto direto x obrigatório ·
  // pretensão x direito · interrompe x suspende · culpabilidade x dolo · depois x antes
  // da denúncia · mesmo autorizado pelo cliente.
  // As questões vindas do banco do produto foram revisadas contra fontes primárias
  // em 04/07/2026. Cada 'exp' NOMEIA a palavra trocada, porque é ela que vende.
  // 'fatia' = peso aproximado da matéria na prova.
  var CONTENT = [
    {mat:'Ética', fatia:'8 das 80 questões, a maior fatia da prova', dif:true, q:'Um militar da ativa foi aprovado no Exame de Ordem. Sobre o exercício da advocacia, ele:', exp:'<b>Por que a C é a certa:</b> militar da ativa é caso de incompatibilidade, não de impedimento (art. 28, V, do Estatuto da Advocacia). A diferença cai muito: impedimento proíbe advogar contra certas partes, incompatibilidade proíbe advogar em qualquer hipótese, inclusive em causa própria e fora do horário de serviço.', o:['Pode advogar livremente, desde que fora do horário de serviço.','Está impedido: só não pode advogar contra a Fazenda Pública que o remunera.','Está incompatibilizado: não pode exercer a advocacia enquanto estiver na ativa, nem em causa própria.','Pode advogar apenas em causas da Justiça Militar.'], c:2},
    {mat:'Constitucional', fatia:'6 a 7 das 80 questões', dif:true, q:'Proposta de emenda constitucional pretende tornar o voto facultativo no Brasil. A proposta:', exp:'<b>Por que a C é a certa:</b> a cláusula pétrea do art. 60, § 4º, II, protege o voto <b>direto, secreto, universal e periódico</b>. A obrigatoriedade não está nessa lista: ela mora no art. 14, § 1º, e pode ser suprimida por emenda. A alternativa A troca uma palavra da lista por outra que não está nela, e é só isso que separa quem sabe de quem decorou.', o:['É inconstitucional, pois o voto obrigatório é cláusula pétrea.','É inconstitucional, pois matéria eleitoral não admite emenda.','É constitucional, pois a cláusula pétrea protege o voto direto, secreto, universal e periódico, e não a sua obrigatoriedade.','Só seria válida se aprovada também por referendo popular.'], c:2},
    {mat:'Civil', fatia:'7 das 80 questões', dif:true, q:'Sobre prescrição e decadência, é correto que:', exp:'<b>Por que a B é a certa:</b> violado o direito, nasce a pretensão, e é ela que a prescrição extingue (art. 189 do Código Civil). O direito em si continua existindo, tanto que a dívida prescrita paga não se repete. A decadência é outra coisa: atinge o próprio direito potestativo, aquele que se exerce por prazo certo.', o:['A prescrição atinge o próprio direito.','A prescrição extingue a pretensão.','A decadência extingue a pretensão.','Prescrição e decadência são sinônimos.'], c:1},
    {mat:'Processo Civil', fatia:'6 a 7 das 80 questões', dif:true, q:'Publicada sentença omissa quanto a um dos pedidos, General Cargas opôs embargos de declaração. Quanto ao prazo dos demais recursos:', exp:'<b>Por que a D é a certa:</b> os embargos de declaração <b>interrompem</b> o prazo recursal para as duas partes, e interromper significa que o prazo recomeça do zero depois do julgamento (CPC, arts. 1.023 e 1.026). A alternativa A troca interromper por suspender, que devolveria só o saldo. Essa troca é uma das que mais derruba gente, e derruba advogado também: é perda de prazo real.', o:['Fica suspenso, voltando a correr pelo restante após o julgamento.','Continua correndo, pois os embargos não interferem em outros prazos.','Fica suspenso apenas para a parte embargante.','Fica interrompido para ambas as partes, reiniciando por inteiro após a publicação do julgamento dos embargos.'], c:3},
    {mat:'Penal', fatia:'5 a 6 das 80 questões', dif:true, q:'Criado em comunidade isolada onde a prática era tida como lícita, Josué praticou conduta típica sem qualquer possibilidade de conhecer sua ilicitude, o que ficou provado. Josué:', exp:'<b>Por que a A é a certa:</b> erro de proibição inevitável isenta de pena; se fosse evitável, apenas diminuiria de um sexto a um terço (CP, art. 21). O erro clássico está na D: erro de proibição atua na <b>culpabilidade</b> e o dolo permanece inteiro. Quem exclui o dolo está confundindo com erro de tipo (art. 20), que é outra figura.', o:['Fica isento de pena, pois o erro de proibição inevitável exclui a culpabilidade.','Responde pelo crime com pena reduzida de um sexto a um terço.','Responde normalmente, pois ninguém se escusa de cumprir a lei.','Tem excluído o dolo, respondendo por culpa.'], c:0},
    {mat:'Processo Penal', fatia:'5 a 6 das 80 questões', dif:true, q:'Vítima de crime de ação penal pública condicionada, Sula ofereceu representação, mas se arrependeu. Quanto à retratação:', exp:'<b>Por que a D é a certa:</b> a representação só se torna irretratável <b>depois de oferecida a denúncia</b> (CPP, art. 25). Antes desse marco a vítima pode se retratar validamente. A alternativa A troca "denúncia" por "boletim de ocorrência" e a B por "trânsito em julgado". Um marco temporal trocado e a questão inteira cai.', o:['É vedada após o registro do boletim de ocorrência.','É possível a qualquer tempo, até o trânsito em julgado.','Depende de homologação judicial com oitiva do investigado.','É admitida somente até o oferecimento da denúncia.'], c:3},
    {mat:'Ética', fatia:'8 das 80 questões, a maior fatia da prova', dif:true, q:'Em ação penal contra Túlio, seu ex-cliente, o advogado Fábio é arrolado como testemunha. Túlio, interessado no depoimento, autoriza expressamente que Fábio revele o que souber. Fábio:', exp:'<b>Por que a D é a certa:</b> o advogado pode recusar-se a depor sobre fato ligado a quem foi seu cliente <b>mesmo autorizado</b> por ele (EOAB, art. 7º, XIX; CED, art. 38). A palavra que derruba é "autoriza": o sigilo é dever do profissional, não disposição do cliente, então a autorização não libera coisa alguma.', o:['Deve depor, pois a autorização do cliente afasta o dever de sigilo.','Deve depor, pois o sigilo não alcança processos de natureza penal.','Só pode recusar o depoimento se demonstrar prejuízo próprio.','Pode recusar-se a depor sobre fatos ligados ao antigo patrocínio, mesmo com a autorização do cliente.'], c:3}
  ];
  // Parte 2: psicotécnico indireto. Cenários de OUTRO domínio (trânsito, prazo,
  // memória em público) que revelam congelamento/afobação/controle sem perguntar
  // "você é ansioso?" — ninguém se declara ansioso. Cada opção carrega a pontuação.
  // 'leit' = leitura do resultado por pontuação (0/1/2): traduz o cenário de
  // volta para a prova, sem rotular ninguém de "ansioso" — mostra o comportamento.
  var BEHAVIOR = [
    {q:'Você está dirigindo num trevo desconhecido, o GPS trava e os carros atrás começam a buzinar. O que acontece primeiro?',
     o:[['Sigo por qualquer saída, só para não ficar parado ali',1],['Dou uma travada de alguns segundos antes de conseguir decidir',0],['Encosto onde dá e decido o caminho com calma',2]],
     leit:{0:'No trevo, você travou antes de decidir. Na prova, esse é o perfil que dá branco numa questão difícil e perde o ritmo nas três seguintes.',1:'No trevo, você seguiu por qualquer saída para escapar da pressão. Na prova, é quem marca sem reler o enunciado e cai na alternativa que parece certa.',2:'No trevo, você parou e escolheu com calma: você decide bem debaixo de buzina.'}},
    {q:'Faltando 20 minutos para entregar algo importante, você percebe um erro numa parte que já estava pronta.',
     o:[['Corrijo o essencial e entrego no prazo',2],['Tento refazer tudo e por pouco não estouro o prazo',0],['Entrego como está e passo o resto do dia remoendo',1]],
     leit:{0:'Com o prazo estourando, você tentou refazer tudo. Na prova, é quem empaca numa questão e chega sem tempo nas dez últimas.',1:'Você entregou, mas ficou remoendo. Na prova, é quem carrega a questão anterior na cabeça e erra a seguinte por distração.',2:'Com o prazo apertado, você priorizou e entregou: sua gestão de tempo funciona sob pressão.'}},
    {q:'Na frente de outras pessoas, te pedem um dado que você sabe de cor.',
     o:[['Vem na hora, normal',2],['Às vezes dá branco na hora, e a resposta aparece depois, sozinho',0],['Peço um segundo e a resposta vem',1]],
     leit:{0:'O dado que você sabe de cor não saiu na hora, na frente dos outros. É o branco clássico: o problema não é saber, é acessar sob observação. E a prova inteira é sob observação.',1:'Você pediu um segundo e a resposta veio: você acessa a memória sob pressão, pagando um pequeno preço em tempo.',2:'A resposta veio na hora, mesmo com plateia: memória estável sob observação.'}}
  ];

  // Segundos por questão. Único lugar para mexer. 40 porque ler quatro alternativas
  // de pegadinha com atenção consome 25 a 30, e o que sobra é a hesitação, que é
  // justamente o que este teste quer medir.
  var LIMITE = 40;

  var S = { screen:'intro', ci:0, ans:{}, times:{}, estourou:{}, fora:{}, bi:0, beh:{},
            nome:'', email:'', tel:'', momento:'' };

  // Em que ponto da caminhada a pessoa está. Serve para saber quem o anúncio traz
  // (bacharel de primeira prova, reprovado, quem ainda está na faculdade) e para
  // calibrar a leitura do resultado. Uma escolha só, obrigatória.
  var MOMENTO = [
    'Ainda estou na faculdade',
    'Já me formei e vou fazer a minha primeira prova',
    'Já fiz a prova uma vez e não passei',
    'Já fiz duas ou mais vezes e não passei',
    'Só estou olhando, por curiosidade'
  ];
  var app = document.getElementById('app');
  var esc = function(s){ return String(s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); };

  function render(){
    if(S.screen==='intro') return intro();
    if(S.screen==='content') return content();
    if(S.screen==='behavior') return behavior();
    if(S.screen==='form') return form();
    if(S.screen==='loading') return carregando();
    if(S.screen==='result') return result();
    if(S.screen==='solucao') return solucao();
  }

  function intro(){
    app.innerHTML =
      // A entrada dizia "existem dois jeitos de reprovar: não saber a matéria, e saber e
      // travar na hora". Era a tese dos dois eixos, e ela criava um funil que dizia três
      // coisas diferentes em três degraus: o anúncio prometia a margem, a entrada
      // prometia os eixos, o veredito voltava para a margem.
      // Agora a entrada abre pela margem, com os dois culpados nomeados. Os eixos
      // continuam sendo o que o teste MEDE, mas param de ser o que a página PROMETE.
      // Os dois culpados vieram da varredura de relatos reais: "a FGV ama a
      // literalidade" e "tava com tanto medo de errar que acabei errando mais".
      '<h1>Faltaram <em>duas questões</em>. E ninguém te diz quais.</h1>'+
      '<p class="lead">38, 39, e são mais quatro meses. Raramente é a matéria toda: ou a banca decidiu tudo numa palavra trocada que você não viu, ou você sabia, travou e mudou a resposta certa. Este mini-diagnóstico mostra qual dos dois é o seu.</p>'+
      // A regra aparece uma vez, seca, e SÓ a regra. A versão anterior empilhava sete
      // informações antes do botão, todas de restrição, no exato segundo em que a pessoa
      // decide se começa. Saiu também o "todas são pegadinha": tempo é regra de jogo e
      // precisa ser anunciado, dificuldade é o teste, e teste não se anuncia, senão a
      // pessoa sai com a desculpa pronta de que errou porque era pegadinha.
      // A página não explica e não defende o relógio: justificar abre a porta para
      // "na prova eu teria mais tempo", que anula a dor.
      // O tamanho anunciado passou a ser o tamanho real em 02/08/2026. Dizia "São 7
      // questões" e vinham 7 questões, 3 situações e um cadastro: o ponto em que a
      // pessoa acha que terminou é o degrau anterior à captura, e descobrir ali que
      // falta mais é o pior lugar possível para quebrar um combinado.
      '<p class="lead" style="margin-bottom:22px">São '+CONTENT.length+' questões, uma de cada matéria que decide a prova, e depois '+BEHAVIOR.length+' situações rápidas do dia a dia. <b style="color:var(--red)">Você tem '+LIMITE+' segundos em cada questão</b>: passou o tempo, a questão passa. Fora desta aba, o relógio corre em dobro.</p>'+
      '<button class="btn full" id="go">Começar o mini-diagnóstico</button>';
    document.getElementById('go').onclick = function(){ S.screen='content'; render(); window.scrollTo(0,0); };
  }

  // Desliga relógio e ouvintes de aba. Chamada em toda saída da Parte 1, senão o
  // ouvinte da questão anterior continua vivo e debita tempo na questão errada.
  function pararRelogio(){
    if(window._clk){ clearInterval(window._clk); window._clk=null; }
    if(window._vis){ document.removeEventListener('visibilitychange', window._vis); window._vis=null; }
    if(window._sai){ window.removeEventListener('blur', window._sai); window._sai=null; }
    if(window._volta){ window.removeEventListener('focus', window._volta); window._volta=null; }
  }

  function content(){
    pararRelogio();
    var i=S.ci, Q=CONTENT[i];
    var dots=''; for(var d=0;d<CONTENT.length;d++) dots+='<i class="'+(d<=i?'ok':'')+'"></i>';
    app.innerHTML =
      '<div class="timer" id="tmr">'+
        '<div class="prog7">'+dots+'</div>'+
        '<div class="conta">Questão '+(i+1)+' de '+CONTENT.length+'</div>'+
        '<div class="num" id="clk">'+LIMITE+'</div>'+
        '<div class="bar"><i id="clkbar"></i></div>'+
        '<div class="rule">'+esc(Q.mat)+'</div>'+
      '</div>'+
      '<div class="qbox"><div class="qtext">'+esc(Q.q)+'</div>'+
      Q.o.map(function(op,j){ return '<button class="opt" data-j="'+j+'">'+esc(op)+'</button>'; }).join('')+
      '</div>';
    // NÃO existe "Voltar" na Parte 1. Com questão cronometrada, voltar seria a brecha:
    // deixa estourar, volta e responde com 40 segundos novos.

    S.qStart=Date.now();
    S.qGasto=0;          // segundos debitados a mais por ausência (a 2ª contagem do dobro)
    S.foraDesde=null;
    if(S.fora[i]==null) S.fora[i]=0;
    var encerrada=false;

    // O tempo consumido SEMPRE sai de Date.now(), nunca de acumulador de tique.
    // Navegador de celular suspende setInterval em aba de fundo, então um contador
    // por tique congelaria justamente para quem saiu da aba para pesquisar: a defesa
    // viraria a brecha. O setInterval abaixo só pinta a tela.
    function consumido(){ return (Date.now()-S.qStart)/1000 + S.qGasto; }

    function sair(){ if(S.foraDesde==null) S.foraDesde=Date.now(); }
    function voltar(){
      if(S.foraDesde==null) return;
      var ausente=(Date.now()-S.foraDesde)/1000; S.foraDesde=null;
      // Fora da aba o relógio corre em dobro. O Date.now() já contou a primeira vez;
      // aqui se debita a segunda.
      S.fora[i]+=ausente; S.qGasto+=ausente;
      pintar();
    }

    function pintar(){
      var el=document.getElementById('clk'), bar=document.getElementById('clkbar'), box=document.getElementById('tmr');
      if(!el) return;
      var resta=Math.max(0, LIMITE-consumido());
      el.textContent=Math.ceil(resta);
      if(bar) bar.style.transform='scaleX('+(resta/LIMITE)+')';
      if(box){ if(resta<=10) box.classList.add('urgente'); else box.classList.remove('urgente'); }
      if(resta<=0) estourar();
    }

    function fechar(){ encerrada=true; pararRelogio(); }

    function avancar(){
      if(i+1<CONTENT.length){ S.ci=i+1; } else { S.screen='behavior'; S.bi=0; }
      render(); window.scrollTo(0,0);
    }

    function estourar(){
      if(encerrada) return;
      fechar();
      S.estourou[i]=true;
      S.times[i]=LIMITE;
      S.ans[i]=null;               // não respondeu: não é a mesma coisa que errar
      avancar();
    }

    window._vis=function(){ if(document.hidden) sair(); else voltar(); };
    window._sai=sair; window._volta=voltar;
    document.addEventListener('visibilitychange', window._vis);
    window.addEventListener('blur', window._sai);
    window.addEventListener('focus', window._volta);
    window._clk=setInterval(pintar,200);
    pintar();

    Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(b){
      b.onclick = function(){
        if(encerrada) return;
        fechar();
        b.classList.add('sel');
        S.ans[i]=parseInt(b.getAttribute('data-j'),10);
        S.times[i]=Math.max(1, Math.min(LIMITE, Math.round(consumido())));
        setTimeout(avancar, 160);
      };
    });
  }

  function behavior(){
    pararRelogio();
    var i=S.bi, sel=S.beh[i], B=BEHAVIOR[i];
    app.innerHTML =
      '<div class="prog">Parte 2 · situação '+(i+1)+' de '+BEHAVIOR.length+'</div>'+
      '<div class="qbox"><div class="qmat">No dia a dia</div><div class="qtext">'+esc(B.q)+'</div>'+
      B.o.map(function(op,j){ return '<button class="opt'+(sel===j?' sel':'')+'" data-j="'+j+'">'+esc(op[0])+'</button>'; }).join('')+
      '</div>'+
      // O "Voltar" só anda dentro da Parte 2. Voltar para a Parte 1 daria 40 segundos
      // novos numa questão já vencida, que é a mesma brecha do voltar da Parte 1.
      (i>0?'<button class="back" id="back">Voltar</button>':'');
    Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(b){
      b.onclick = function(){
        S.beh[i] = parseInt(b.getAttribute('data-j'),10);
        setTimeout(function(){
          if(i+1<BEHAVIOR.length){ S.bi=i+1; render(); }
          else { S.screen='form'; render(); }
          window.scrollTo(0,0);
        }, 160);
      };
    });
    if(i>0) document.getElementById('back').onclick = function(){ S.bi=i-1; render(); };
  }

  function form(){
    app.innerHTML =
      // "Pra onde mando o seu resultado" prometia envio e o resultado aparece na tela,
      // não é mandado. Promessa que não se cumpre no segundo seguinte custa confiança
      // justamente no degrau em que se pede o telefone. E saiu o "mapa": ninguém no
      // primeiro contato sabe o que é isso.
      '<div class="prog">Terminou</div>'+
      '<h1 style="font-size:23px">Seu resultado está pronto.</h1>'+
      '<p class="lead" style="margin-bottom:18px">Só falta saber quem é você. Ele aparece na próxima tela.</p>'+
      '<div class="field"><label>Onde você está hoje</label>'+
        MOMENTO.map(function(op){ return '<button class="opt'+(S.momento===op?' sel':'')+'" data-m="'+esc(op)+'">'+esc(op)+'</button>'; }).join('')+
      '</div>'+
      '<div class="field"><label>Seu nome</label><input id="f_nome" type="text" placeholder="Como você se chama" value="'+esc(S.nome)+'"></div>'+
      '<div class="field"><label>Seu WhatsApp (com DDD)</label><input id="f_tel" type="tel" inputmode="numeric" placeholder="(00) 00000-0000" value="'+esc(S.tel)+'"></div>'+
      // E-mail virou OBRIGATÓRIO em 02/08/2026, a pedido do Gustavo: metade das linhas
      // do Formspree chegava sem e-mail, e sem ele não existe contato que não dependa
      // do WhatsApp. Custo assumido: campo obrigatório a mais derruba envio de formulário.
      '<div class="field"><label>Seu e-mail</label><input id="f_email" type="email" inputmode="email" autocomplete="email" placeholder="seu@email.com" value="'+esc(S.email)+'"></div>'+
      '<button class="btn full" id="see">Ver o meu resultado</button>'+
      '<div class="small">É grátis e sem spam. Você pode sair quando quiser.</div>';
    // Marcar a opção NÃO re-renderiza o formulário. Antes chamava render(), que refazia a
    // tela inteira e jogava a rolagem para o topo no celular, no último degrau antes do
    // lead. Aqui só troca a classe.
    var opts=app.querySelectorAll('.opt');
    Array.prototype.forEach.call(opts, function(b){
      b.onclick = function(){
        S.momento = b.getAttribute('data-m');
        Array.prototype.forEach.call(opts, function(x){ x.classList.remove('sel'); });
        b.classList.add('sel');
      };
    });
    document.getElementById('see').onclick = function(){
      var nome=document.getElementById('f_nome').value.trim();
      var email=document.getElementById('f_email').value.trim();
      var tel=document.getElementById('f_tel').value.trim();
      var digits=tel.replace(/\D/g,'');
      if(!S.momento){ alert('Marque onde você está hoje para ver o resultado.'); return; }
      if(!nome || digits.length<10){ alert('Preencha o nome e um WhatsApp válido com DDD para ver o resultado.'); return; }
      if(!email){ alert('Preencha o seu e-mail para ver o resultado.'); return; }
      if(!/.+@.+\..+/.test(email)){ alert('O e-mail parece inválido. Confira antes de continuar.'); return; }
      S.nome=nome; S.email=email; S.tel=tel;
      // saveLead() dispara a gravação AGORA e a tela de apuração corre em paralelo:
      // o tempo da barra é o tempo que o banco tem para devolver o id do lead.
      saveLead();
      S.screen='loading'; render(); window.scrollTo(0,0);
    };
  }

  // Apuração. Três passos, todos verdadeiros: é isso que compute() e quadrant() fazem,
  // nesta ordem. A barra é honesta quanto ao que descreve, e o tempo dela não é enfeite:
  // é a janela em que o /api/lead devolve o id que monta o sck= no checkout.
  function carregando(){
    pararRelogio();
    var PASSOS=[
      ['Somando o que você acertou', 34],
      ['Cruzando o tempo de cada resposta', 71],
      ['Montando o seu resultado', 95]
    ];
    var MIN=2700;    // piso: abaixo disso não dá tempo de ler os três passos
    var MAX=4200;    // teto: nunca segurar mais que isso, mesmo sem id do banco
    app.innerHTML =
      '<div class="load">'+
        '<svg class="mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+
          '<rect width="32" height="32" rx="8" fill="#15212B"/>'+
          '<g stroke="#F3EEE4" stroke-width="2.4" fill="none"><circle cx="16" cy="16" r="7.2"/>'+
          '<path d="M16 4.5v4M16 23.5v4M4.5 16h4M23.5 16h4"/></g>'+
          '<circle cx="16" cy="16" r="3" fill="#C77A2B"/></svg>'+
        '<div class="st" id="ldst" role="status" aria-live="polite">'+esc(PASSOS[0][0])+'</div>'+
        '<div class="tr"><i id="ldbar"></i></div>'+
        '<div class="pe">Gerando o seu resultado personalizado</div>'+
      '</div>';

    var st=document.getElementById('ldst'), bar=document.getElementById('ldbar');
    var t0=Date.now(), i=0;
    setTimeout(function(){ if(bar) bar.style.width=PASSOS[0][1]+'%'; }, 60);

    function passo(){
      i++;
      if(i<PASSOS.length){
        if(st){
          st.classList.add('sai');
          setTimeout(function(){ st.textContent=PASSOS[i][0]; st.classList.remove('sai'); }, 220);
        }
        if(bar) bar.style.width=PASSOS[i][1]+'%';
        setTimeout(passo, 900);
      } else {
        entregar();
      }
    }
    setTimeout(passo, 900);

    // Só entrega quando o piso de tempo passou. Se o id do lead ainda não chegou,
    // espera mais um pouco, até o teto, e vai assim mesmo: a página nunca trava
    // esperando rede.
    function entregar(){
      var passou=Date.now()-t0;
      if(passou<MIN) return setTimeout(entregar, MIN-passou);
      if(LEAD_ID===null && passou<MAX) return setTimeout(entregar, 250);
      if(bar) bar.style.width='100%';
      setTimeout(function(){
        if(S.screen!=='loading') return;   // guarda contra entrega dupla
        S.screen='result'; render(); window.scrollTo(0,0);
      }, 260);
    }
  }

  function saveLead(){
    var lead={ nome:S.nome, email:S.email, tel:S.tel, momento:S.momento, ans:S.ans, beh:S.beh, ts:new Date().toISOString() };
    try{ var all=JSON.parse(localStorage.getItem('soqc_leads')||'[]'); all.push(lead); localStorage.setItem('soqc_leads', JSON.stringify(all)); }catch(e){}

    // O mesmo resultado que a pessoa vê vai junto no e-mail do lead. Sem isso
    // chega só um nome e um telefone, e não dá para saber quem o anúncio trouxe.
    var R = compute();
    var Q = quadrant(R.X, R.Y, R);
    var conta = {}, ordem = [];
    CONTENT.forEach(function(qq,i){
      if(S.ans[i]!==qq.c){ if(!conta[qq.mat]){ conta[qq.mat]=0; ordem.push(qq.mat); } conta[qq.mat]++; }
    });
    var erradas = ordem.map(function(m){ return conta[m]>1 ? m+' ('+conta[m]+')' : m; });
    var tsoma = 0, tn = 0;
    CONTENT.forEach(function(_,i){ if(S.times[i]!=null){ tsoma += S.times[i]; tn++; } });

    // Mediana, a mesma que alimenta o eixo de pressão: o número gravado na base
    // tem que ser o mesmo que a pessoa viu na tela, senão a análise não fecha.
    var tmed = tempoMedio();
    var errouEm = erradas.length ? erradas.join(', ') : 'nenhuma';
    var q = new URLSearchParams(location.search);

    // Marca o Lead no pixel. Só roda depois que o lead foi guardado de verdade:
    // disparar antes faz a Meta contar gente que a gente perdeu no caminho.
    function marcarPixel(){
      if(typeof fbq==='undefined') return;
      try{
        // Advanced matching: melhora o EMQ do pixel (a Meta faz o hash sozinha).
        var am={};
        if(S.email) am.em=S.email.trim().toLowerCase();
        var d=S.tel.replace(/\D/g,''); if(d) am.ph='55'+d;
        fbq('init','1024990753668044',am);
        fbq('track','Lead');
      }catch(e){}
    }

    // O payload completo fica numa variável porque o retry precisa mandar O MESMO.
    // Até 02/08/2026 o retry mandava 4 dos 14 campos, e quem caísse nele virava uma
    // linha cega: sem placar, sem eixos, sem matéria errada, sem origem.
    // utm_source, utm_medium e fbclid entraram no mesmo dia. Sem fbclid não existe
    // caminho para ligar a linha do banco ao criativo que trouxe a pessoa.
    var payload = {
      nome:S.nome, telefone:S.tel, email:S.email, momento:S.momento,
      acertos:R.c, total_questoes:CONTENT.length,
      eixo_conteudo:R.X, eixo_pressao:R.Y, perfil:Q.lab,
      errou_em:errouEm, tempo_medio:tmed,
      utm_campaign:q.get('utm_campaign'), utm_content:q.get('utm_content'),
      utm_source:q.get('utm_source'), utm_medium:q.get('utm_medium'),
      fbclid:q.get('fbclid'),
      referrer:document.referrer || null
    };

    // Guarda o id devolvido. Chega depois do render do resultado, e tudo bem: quem
    // usa o id é o clique no botão de comprar, que só acontece depois de ler a página.
    function guardarId(resp){
      return resp.json().then(function(j){ if(j && j.id) LEAD_ID=j.id; return true; })
                        .catch(function(){ return true; });
    }

    // 1) Base própria (Supabase, via /api/lead na Vercel). É a fonte de verdade:
    //    não tem teto mensal e permite cruzar lead contra venda depois.
    var naBase = fetch(BASE_URL, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    }).then(function(r){ return r.ok ? guardarId(r) : false; }).catch(function(){ return false; });

    // 2) Formspree segue como aviso por e-mail, em paralelo. Se um falhar, o outro salva.
    var noEmail = CAPTURE_URL ? fetch(CAPTURE_URL,{
      method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify({ nome:S.nome, email:S.email, telefone:S.tel, momento:S.momento,
        acertos: R.c + ' de ' + CONTENT.length,
        eixo_conteudo: R.X + '%',
        eixo_pressao: R.Y + '%',
        perfil: Q.lab,
        errou_em: errouEm,
        tempo_medio: tmed != null ? tmed + 's por questão' : 'sem registro',
        quando:lead.ts, _subject:'Novo lead do mini-diagnostico Só o que Cai' })
    }).then(function(r){ return r.ok; }).catch(function(){ return false; }) : Promise.resolve(false);

    Promise.all([naBase, noEmail]).then(function(ok){
      if(ok[0] || ok[1]) return marcarPixel();
      // Os dois falharam: tenta a base mais uma vez antes de desistir, com o payload
      // INTEIRO. Mandar meia dúzia de campos aqui era transformar a falha de rede
      // numa perda permanente de dado.
      return fetch(BASE_URL, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      }).then(function(r){ if(r.ok){ guardarId(r); marcarPixel(); } }).catch(function(){});
    });
  }

  // Registra no banco que a pessoa pediu para comprar, e QUAL botão ela usou.
  // sendBeacon porque aqui existe navegação de verdade: um fetch normal é cancelado
  // quando a aba sai para o checkout da Hotmart. Falhar aqui não pode, em hipótese
  // nenhuma, atrapalhar a ida para o checkout, então tudo vai dentro de try.
  function marcarClique(botao, oferta){
    if(!LEAD_ID) return;
    try{
      var corpo=JSON.stringify({ lead_id:LEAD_ID, botao:botao, oferta:String(oferta) });
      if(navigator.sendBeacon){
        navigator.sendBeacon(CLIQUE_URL, new Blob([corpo], {type:'text/plain;charset=UTF-8'}));
      } else {
        fetch(CLIQUE_URL, {method:'POST', headers:{'Content-Type':'text/plain'},
                           body:corpo, keepalive:true}).catch(function(){});
      }
    }catch(e){}
  }

  // ===== EIXO DE PRESSÃO =====
  // Refeito em 02/08/2026. A versão anterior era 70% relógio + 30% autorrelato, e o 100
  // continuava fácil por dois motivos: o autorrelato tem uma alternativa obviamente
  // "certa" em cada cenário, e a faixa boa do relógio era um platô de 15 segundos, que é
  // exatamente onde cai quem lê com atenção. Resultado: não separava ninguém de ninguém.
  // Agora são quatro componentes, e 85% deles são MEDIDOS, não declarados.

  // 1) DECISÃO. Tempo cruzado com acerto, por questão. O tempo sozinho mentia: quem passa
  // por 7 questões a 25 segundos e acerta 3 não decidiu bem, chutou num ritmo confortável.
  function notaDecisao(t, estourou, acertou){
    if(estourou) return 0;
    if(t==null) return null;
    if(t<10)  return acertou? 60 : 0;    // reflexo: acertar assim pode ser sorte; errar é chute
    if(t<18)  return acertou? 85 : 15;   // rápido para pegadinha
    if(t<=32) return acertou? 100: 35;   // leu, pesou e decidiu. Errar aqui é conteúdo, não pressão
    return      acertou? 70 : 25;        // chegou no limite do relógio
  }
  function decisoes(){
    var out=[];
    CONTENT.forEach(function(Q,i){
      var n=notaDecisao(S.times[i], S.estourou[i], S.ans[i]===Q.c);
      if(n!=null) out.push(n);
    });
    return out;
  }
  function notaDecisaoMedia(){
    var d=decisoes(); if(!d.length) return null;
    var s=0; d.forEach(function(x){ s+=x; });
    return Math.round(s/d.length);
  }

  // 2) CONSTÂNCIA. O que mede travar não é a média, é a oscilação. 20,22,19,21,20,23,20 e
  // 8,40,12,38,9,40,15 têm quase a mesma média e são duas pessoas completamente
  // diferentes: a segunda chuta em umas e congela em outras. Coeficiente de variação.
  function notaConstancia(){
    var ts=[]; CONTENT.forEach(function(_,i){ if(S.times[i]!=null) ts.push(S.times[i]); });
    if(ts.length<3) return null;
    var m=0; ts.forEach(function(t){ m+=t; }); m/=ts.length;
    if(m<=0) return 0;
    var v=0; ts.forEach(function(t){ v+=(t-m)*(t-m); }); v/=ts.length;
    var cv=Math.sqrt(v)/m;
    if(cv<=0.20) return 100;
    if(cv<=0.35) return 80;
    if(cv<=0.50) return 55;
    if(cv<=0.70) return 30;
    return 10;
  }

  // 3) RESISTÊNCIA. Na prova o que derruba é cair ao longo das 80. Aqui se compara as 3
  // últimas contra as 3 primeiras, pela nota de DECISÃO e não pelo tempo puro, porque a
  // queda aparece como mais erro E mais tempo ao mesmo tempo. É uma versão crua do "em
  // que ponto o seu rendimento cai" que o produto pago mede em 24 questões.
  function notaResistencia(){
    var d=decisoes(); if(d.length<6) return null;
    function med(a){ var s=0; a.forEach(function(x){ s+=x; }); return s/a.length; }
    var delta=med(d.slice(-3))-med(d.slice(0,3));
    // Faixas largas de propósito. Com 7 questões e 3 de cada lado, UM erro que por acaso
    // caiu no fim já move a média em ~33 pontos. Estreitar isso faria a página acusar
    // queda em quem só teve azar na ordem dos erros. Um erro tardio fica em 80 e não
    // dispara nada; dois erros tardios já é padrão, e aí sim.
    if(delta>=0)   return 100;   // não caiu, ou melhorou
    if(delta>=-25) return 80;
    if(delta>=-50) return 55;
    if(delta>=-75) return 30;
    return 10;
  }

  function tempoMedio(){
    var soma=0, n=0;
    CONTENT.forEach(function(_,i){ if(S.times[i]!=null){ soma+=S.times[i]; n++; } });
    return n? Math.round(soma/n) : null;
  }

  function estourouQuantas(){
    var n=0; CONTENT.forEach(function(_,i){ if(S.estourou[i]) n++; }); return n;
  }
  function segundosFora(){
    var s=0; CONTENT.forEach(function(_,i){ if(S.fora[i]) s+=S.fora[i]; }); return Math.round(s);
  }

  function compute(){
    // Questão estourada é ponto perdido no conteúdo, porque na prova questão não
    // respondida também é ponto perdido. No TEXTO ela nunca se mistura com erro.
    var c=0; CONTENT.forEach(function(Q,i){ if(S.ans[i]===Q.c) c++; });
    var X=Math.round(c/CONTENT.length*100);
    // 4) AUTORRELATO. Cai de 30% para 15% do eixo: em cada cenário existe uma
    // alternativa obviamente "certa", e era ela que segurava o eixo lá em cima.
    var bp=0; BEHAVIOR.forEach(function(B,i){ bp += (S.beh[i]!=null?B.o[S.beh[i]][1]:0); });
    var Yrel=Math.round(bp/(BEHAVIOR.length*2)*100);
    var dec=notaDecisaoMedia(), cons=notaConstancia(), res=notaResistencia();
    // 45 decisão + 20 constância + 20 resistência + 15 autorrelato. 85% medido.
    // Cada peso que falta (por falta de dado) é redistribuído entre os que sobraram,
    // para o eixo nunca sair menor só porque um componente não pôde ser calculado.
    var partes=[[dec,0.45],[cons,0.20],[res,0.20],[Yrel,0.15]];
    var soma=0, peso=0;
    partes.forEach(function(p){ if(p[0]!=null){ soma+=p[0]*p[1]; peso+=p[1]; } });
    var Y = peso? Math.round(soma/peso) : Yrel;
    return {X:X,Y:Y,c:c,Yrel:Yrel,dec:dec,cons:cons,res:res,tmed:tempoMedio(),
            estourou:estourouQuantas(), fora:segundosFora()};
  }

  // Os cortes, terceira calibragem, agora em cima de DADO REAL e não de estimativa.
  //
  // Histórico curto, porque o erro se repetiu invertido e vale não repetir de novo:
  // com 50/50 e questão de padrão médio, 9 de 9 pessoas caíram no mesmo verde. A
  // correção foi 100/80, e aí 8 de 12 caíram no MESMO "perdeu ponto dos dois lados":
  // quem acertou 5 de 7 com 76% de firmeza leu exatamente a mesma manchete de quem
  // acertou 1 de 7 com 33%. Corte que ninguém alcança não separa nada, igual a corte
  // que todo mundo alcança.
  //
  // Os 12 leads reais da versão de 7 questões deram X de 14 a 86 e Y de 26 a 79.
  // Ninguém gabaritou e ninguém passou de 79. Daí:
  //   CORTE_X=71 -> acertar 5 das 7 (as sete são pegadinha escolhida para derrubar).
  //   CORTE_Y=72 -> logo acima da mediana observada, que ficou perto de 70.
  // Com esses cortes, os mesmos 12 se espalhariam por quatro desfechos em vez de dois.
  //
  // ATENÇÃO ao mexer aqui: baixar o CORTE_X faz 'forte' deixar de significar "acertou
  // as sete". Por isso 'forte' NÃO depende mais do corte, e sim de não ter perdido
  // nenhuma. Todo texto que diz "você acertou tudo" está pendurado em 'forte'.
  var CORTE_X=71, CORTE_Y=72;

  // ===== A DISTÂNCIA =====
  // Substituiu o quadrante como manchete em 02/08/2026, depois da varredura de dores
  // reais no Reddit e no X. O público não fala "não sei onde perco ponto": zero
  // ocorrências dessa formulação em toda a varredura. O que ele fala é a MARGEM, e
  // com gíria própria: "sempre fico nos 38/39", "a maldição do 38/39", "o número 39
  // tá me perseguindo", "por uma maldita questão". O corte da prova é 40 de 80.
  //
  // Então a manchete deixa de dizer o que a pessoa É (quadrante, igual para 8 de 12)
  // e passa a dizer QUANTO ela perdeu e ONDE. O número é dela, então discrimina
  // sozinho, sem depender de acertar corte nenhum.
  //
  // A separação matéria x execução não é retórica, é a mesma régua que notaDecisao()
  // já usa: errar uma pegadinha depois de 18 segundos é ter lido, pesado e errado, o
  // que é conteúdo. Errar em menos de 18 é não ter lido direito, o que é execução.
  // Tempo estourado é execução por definição.
  function perdaSeparada(){
    // Trava contra a leitura absurda, encontrada no teste com os leads reais: o
    // Deocleciano acertou 1 de 7 respondendo em 11 segundos, e a regra crua devolvia
    // "você perdeu 6, e nenhuma por falta de matéria". Errar rápido só é problema de
    // DECISÃO em quem provou conteúdo no resto da prova. Em quem não provou, decidir
    // rápido é o sintoma de não saber e chutar, e chutar é matéria.
    var acertos=0; CONTENT.forEach(function(Q,i){ if(S.ans[i]===Q.c) acertos++; });
    var provouConteudo = Math.round(acertos/CONTENT.length*100) >= CORTE_X;
    var mat=0, exec=0;
    CONTENT.forEach(function(Q,i){
      if(S.estourou[i]){ exec++; return; }      // não respondeu: o relógio levou, sempre
      if(S.ans[i]===Q.c) return;                // acertou
      var t=S.times[i];
      if(provouConteudo && t!=null && t<18) exec++;  // sabe, mas decidiu afobado
      else mat++;                                     // leu e errou, ou chutou por não saber
    });
    return {mat:mat, exec:exec, total:mat+exec};
  }

  // Monta {lab, hl} da manchete. 'hl' é o trecho que sai em itálico ocre e PRECISA
  // existir dentro de 'lab', senão a substituição não acha nada e o título sai reto.
  function manchete(){
    var p=perdaSeparada(), n=p.total;
    if(n===0) return {lab:'Você não perdeu nenhuma das '+CONTENT.length, hl:'nenhuma'};
    var quantas = n===1 ? 'Você perdeu 1' : 'Você perdeu '+n;
    if(p.exec===0) return {lab:quantas+', e '+(n===1?'ela foi':'todas foram')+' de matéria', hl:'de matéria'};
    if(p.mat===0)  return {lab:quantas+', e nenhuma por falta de matéria', hl:'nenhuma por falta de matéria'};
    return {lab:quantas+': '+p.mat+' de matéria e '+p.exec+' na hora de decidir', hl:p.exec+' na hora de decidir'};
  }

  // A tradução da distância para a régua da prova. É o que empresta o vocabulário do
  // "39" sem inventar projeção: NÃO diz que a pessoa tiraria X na prova, porque estas
  // 7 são pegadinhas escolhidas a dedo e não uma amostra proporcional das 80. Diz o
  // que a distância VALE, que é verdadeiro e é o que a pessoa reconhece.
  function traduzMargem(){
    var n=perdaSeparada().total;
    if(n===0) return '';
    if(n===1) return 'Na prova, 1 questão é a diferença entre 39 e 40. Entre voltar e não voltar.';
    if(n<=3)  return 'Na prova, '+n+' questões são a distância entre 38 e 41. É nessa faixa que a maioria reprova.';
    return '';
  }

  // A matéria que mais pesa entre as que a pessoa errou, com o peso REAL dela na
  // prova. O campo 'fatia' existia em cada questão desde o começo e nunca era lido:
  // era o argumento mais concreto do produto, escrito questão por questão, morto no
  // código. Substituiu o holofote genérico na Ética, que os dados desmentiram: nos
  // 11 leads reais, Ética foi a MENOS errada (3), e Penal e Constitucional as mais
  // erradas (8 cada). Apontar para a matéria da PESSOA é melhor do que apontar para
  // a matéria que a gente achava que era.
  function materiaPeso(){
    for(var i=0;i<CONTENT.length;i++){
      if(!S.estourou[i] && S.ans[i]!==CONTENT[i].c) return CONTENT[i];
    }
    return null;
  }

  function jaReprovou(){
    return S.momento==='Já fiz a prova uma vez e não passei' ||
           S.momento==='Já fiz duas ou mais vezes e não passei';
  }
  function reprovouMais(){ return S.momento==='Já fiz duas ou mais vezes e não passei'; }

  // Dias até a 1ª fase. Urgência REAL, tirada do calendário, nunca inventada.
  // ATUALIZAR a cada edição do exame.
  var DATA_PROVA=new Date(2026,8,6); // 06/09/2026
  function diasParaProva(){
    var d=Math.ceil((DATA_PROVA-new Date())/86400000);
    return d>0? d : null;
  }
  function faltam(){
    var d=diasParaProva();
    return d? 'Faltam '+d+' dias para a prova. ' : '';
  }

  // Números do exame, confirmados pelo Gustavo em 02/08/2026. ATUALIZAR a cada edição:
  // a taxa muda e o intervalo entre exames também. Número errado aqui é caro, porque o
  // candidato sabe exatamente quanto pagou e quanto esperou.
  var TAXA_EXAME='R$350', ESPERA_EXAME='4 meses';

  // Parcelamento real do checkout, informado pelo Gustavo em 02/08/2026.
  // ATENÇÃO ao escrever qualquer texto com isso: 6 x 8,82 = R$52,92, ou seja, o
  // parcelado TEM juros. Nunca escrever "sem juros" ao lado. Substituiu a divisão por
  // dia, que era um número derivado por retórica; este é uma opção de pagamento de
  // verdade e faz o mesmo trabalho de deixar o valor pequeno.
  var PARCELA='6x de R$8,82';
  // 6 x 8,82. Escrito na página de propósito: esconder o total é o que faz o leitor
  // desconfiar do parcelado, e mostrar empurra para o Pix.
  var TOTAL_PARCELADO='R$52,92';

  // A comparação de custo, em duas colunas. Esquerda longa e cara, direita curta e
  // barata: a assimetria é o argumento inteiro. Muda pelo MOMENTO da pessoa, porque o
  // que ela perde ao não agir é completamente diferente em cada um.
  // Recebe 'forte' porque a tabela não pode desmentir o veredito de quem acertou as 7:
  // para essa pessoa não existe "buraco de hoje" nem "saber se é a matéria" — o veredito
  // acabou de dizer que matéria ela tem. A linha que contradiz troca pela dúvida que as
  // 7 deixam em aberto, que é o único argumento honesto para esse perfil.
  function tabelaCusto(forte){
    var linhas;
    // A promessa da coluna da direita não pode ser uma pergunta que a manchete ACABOU
    // de responder. Quem lê "Você perdeu 4, e todas foram de matéria" e três blocos
    // abaixo encontra "saber se o que te derruba é a matéria ou a hora da prova" percebe
    // que a oferta está fingindo que a dúvida segue aberta. Aqui a promessa avança para
    // o que de fato continua desconhecido depois do veredito.
    var ps=perdaSeparada();
    var promessa = forte
      ? 'Ver em que ponto o seu rendimento cede, com número'
      : (ps.exec===0
          ? 'As matérias, com nome, e quanto falta em cada uma'
          : 'Saber se o que te derruba é a matéria ou a hora da prova');
    if(jaReprovou()){
      linhas=[
        ['Mais uma reprovação, pelo mesmo motivo de antes','O motivo, com nome, antes da próxima'],
        [ESPERA_EXAME+' até poder tentar de novo','20 minutos'],
        [TAXA_EXAME+' na inscrição do próximo exame','R$47, uma vez, ou '+PARCELA],
        ['Repetir a mesma preparação, sem saber o que corrigir', promessa]
      ];
    } else if(S.momento==='Já me formei e vou fazer a minha primeira prova'){
      linhas=[
        forte
          ? ['A primeira reprovação, que é a que instala a dúvida','Chegar sabendo que o seu acerto se sustenta']
          : ['A primeira reprovação, que é a que instala a dúvida','Chegar sabendo onde você perde ponto'],
        [ESPERA_EXAME+' esperando a próxima chance','20 minutos'],
        [TAXA_EXAME+' na inscrição do próximo exame','R$47, uma vez, ou '+PARCELA],
        ['Ver quem passou seguir para a 2ª fase sem você','Corrigir a rota enquanto dá tempo']
      ];
    } else if(S.momento==='Ainda estou na faculdade'){
      linhas=[
        forte
          ? ['Descobrir só no dia o que as 7 não alcançam','Medir isso antes, em 24 questões']
          : ['Chegar na prova com o mesmo buraco de hoje','Chegar com ele fechado'],
        [ESPERA_EXAME+' entre um exame e o seguinte','20 minutos'],
        [TAXA_EXAME+' na inscrição, e de novo se reprovar','R$47, uma vez, ou '+PARCELA],
        // Esta linha dizia "Sair da faculdade já advogado". Saiu em 02/08/2026: a
        // coluna da direita é o que a pessoa RECEBE, e ali estava o resultado do
        // exame. Isso é promessa de aprovação dita pela estrutura da tabela, e é
        // proibido. Todas as outras entregas da coluna são informacionais.
        ['A turma se preparando para a 2ª fase sem você','Entrar na prova com o número, e não com a esperança']
      ];
    } else {
      // "Só estou olhando". Devolvia string vazia, e a oferta ficava sem nada na
      // outra ponta da balança. Linhas neutras, sem inventar uma reprovação que
      // essa pessoa não declarou.
      linhas=[
        forte
          ? ['Sair daqui sabendo só que acertou 7 questões','Saber o que as 7 não alcançaram']
          : ['Sair daqui sabendo que tem um buraco, sem saber onde','O nome dele, e o tamanho'],
        [ESPERA_EXAME+' entre um exame e o seguinte','20 minutos'],
        [TAXA_EXAME+' na inscrição, quando você decidir prestar','R$47, uma vez, ou '+PARCELA],
        // Quarta linha acrescentada em 02/08: com três linhas e o dinheiro movido para
        // depois do tempo, esta tabela passou a FECHAR no preço, enquanto as outras
        // três variantes fecham num ganho. Última linha é a que fica na cabeça.
        ['Continuar sem saber o tamanho disso', promessa]
      ];
    }
    var html='<div class="custo"><div class="lin cab"><div>Se você não fizer nada</div><div>Se você olhar agora</div></div>';
    linhas.forEach(function(l){ html+='<div class="lin"><div>'+esc(l[0])+'</div><div>'+esc(l[1])+'</div></div>'; });
    return html+'</div>';
  }
  // Quantas a pessoa errou de verdade, sem contar as que o tempo estourou.
  function errosReais(){
    var n=0; CONTENT.forEach(function(Q,i){ if(!S.estourou[i] && S.ans[i]!==Q.c) n++; });
    return n;
  }

  // Nomeia a causa REAL da queda de pressão, em vez de listar possibilidades. A página
  // tem o dado; oferecer "ou isso, ou aquilo, ou aquilo outro" soa como chute e é o
  // oposto de diagnóstico.
  function causaPressao(r){
    if(!r) return 'o relógio te cobrou';
    if(r.estourou) return 'em '+r.estourou+(r.estourou>1?' questões o tempo acabou antes de você marcar':' questão o tempo acabou antes de você marcar');
    if(r.res!=null && r.res<=55) return 'o seu rendimento caiu nas três últimas em relação às três primeiras';
    if(r.cons!=null && r.cons<=55) return 'o seu ritmo oscilou demais de uma questão para outra';
    if(r.tmed!=null && r.tmed>=33) return 'você decidiu no limite do relógio, questão após questão';
    if(r.tmed!=null && r.tmed<10) return 'você decidiu rápido demais para quem está lendo questão difícil';
    // Chegar aqui significa que o relógio não acusou nada: o que puxou o Y foi o que a
    // própria pessoa respondeu nos 3 cenários. Dizer "o relógio te cobrou" seria mentira
    // conferível no bloco do relógio, logo abaixo, que sai verde.
    return 'as suas próprias respostas sobre o dia de prova dizem que é ali que você cede';
  }

  // O relógio acusou alguma coisa MEDIDA? Espelha as condições ruins de tempo() (menos
  // o erro com convicção, que é achado de conteúdo). Manter em sincronia com tempo():
  // é ela que impede o veredito de acusar o relógio quando o bloco do relógio sai verde.
  function relogioAcusou(r){
    if(!r) return false;
    if(r.estourou) return true;
    if(r.res!=null && r.res<=55) return true;
    if(r.cons!=null && r.cons<=55) return true;
    if(r.tmed!=null && (r.tmed>=33 || r.tmed<10)) return true;
    return false;
  }

  function quadrant(X,Y,r){
    var hiX=X>=CORTE_X, hiY=Y>=CORTE_Y;
    var perdeu=errosReais()+estourouQuantas();
    // O quinto desfecho, e ele existe por um motivo só: quem já reprovou NUNCA sai
    // "apto". Acrescentar parágrafo não bastava, porque o rótulo verde continuava na
    // tela. Aqui o próprio veredito é interceptado, e a cor deixa de dizer "está tudo
    // bem". A contradição entre gabaritar e ter reprovado não é elogio: é o diagnóstico.
    // Cada desfecho termina numa CURIOSIDADE ESPECÍFICA, e ela não é enfeite: é o que
    // entrega o leitor para o bloco rasurado logo abaixo. A frase final aponta para uma
    // linha trancada do lockbox, então os dois respiram juntos em vez de repetir.
    // 02/08 · v3: o veredito virou CAMPOS em vez de um blob de texto, porque o layout
    // novo distribui a mesma copy em três lugares (manchete com trecho em itálico,
    // lead do hero, dois parágrafos do diagnóstico). Nenhuma frase foi reescrita: só
    // repartida. 'hl' é o trecho que sai em itálico ocre dentro do título, e precisa
    // existir DENTRO de 'lab', senão a substituição não acha nada e o título sai reto.
    // A MANCHETE é a mesma função para todos os desfechos: a distância medida.
    // Cada ramo abaixo continua escolhendo cor, lead e os dois parágrafos, mas nenhum
    // deles escolhe mais o título. Era ali que 8 de 12 pessoas liam a mesma frase.
    var M = manchete();
    // 'forte' passou a significar UMA coisa só: não perdeu nenhuma. Antes era
    // hiX&&hiY, e com o corte em 5 de 7 isso faria a página dizer "você acertou tudo"
    // para quem errou duas. Todo texto de gabarito está pendurado aqui.
    var gabaritou = perdeu===0;

    if(hiX&&hiY&&jaReprovou()) return {cls:'ochre',forte:gabaritou,
      lab:M.lab, hl:M.hl,
      lead:(gabaritou
        ? 'Sete pegadinhas, nenhuma perdida, tudo dentro do tempo. E você já prestou o exame sem passar.'
        : 'Você segurou '+r.c+' das '+CONTENT.length+' mais difíceis. E já prestou o exame sem passar.'),
      p1:'As duas coisas juntas dizem uma coisa só: o que te reprovou não é o núcleo de matéria que estas '+CONTENT.length+' cobrem.',
      p2:'O que te derrubou estava fora do alcance destas '+CONTENT.length+' questões, e é por isso que você nunca achou sozinho. O que falta descobrir é em que ponto exatamente o seu rendimento cede, porque é ali que a sua prova é decidida.'};
    if(hiX&&hiY) return {cls:'green',forte:gabaritou,
      lab:M.lab, hl:M.hl,
      lead:(gabaritou
        ? 'As '+CONTENT.length+' eram difíceis e você não deixou nenhuma passar.'
        : 'As '+CONTENT.length+' eram pegadinhas escolhidas para derrubar, e você segurou '+r.c+'.'),
      p1:'O que estas '+CONTENT.length+' não medem é a questão 40, com três horas de prova nas costas e a sala esvaziando ao seu redor: é ali que quem sabe começa a errar.',
      p2:'E tem uma diferença que decide muita coisa: sete questões não acharem nada em você não é a mesma coisa que não existir nada.'};
    if(hiX&&!hiY) return {cls:'ochre',forte:gabaritou,
      lab:M.lab, hl:M.hl,
      // Quando houve estouro, o prefixo do lead já disse "nas outras N o tempo acabou
      // antes de você marcar". Chamar causaPressao() aqui repetia a frase inteira dentro
      // da mesma linha. Só cabe quando a causa NÃO é o estouro.
      lead:(r.estourou>0
        ? 'Nada do que você marcou estava errado. O que faltou foi tempo.'
        : 'O que cedeu não foi o conteúdo: '+causaPressao(r)+'.'),
      p1:'Na prova isso não aparece como erro de matéria. Aparece como questão em branco nas dez últimas, com você sabendo a resposta.',
      p2:'Estudar mais matéria não conserta isso, e por acaso é o único conselho que você recebe enquanto estiver pagando mensalidade. O que resolve é saber em que ponto da prova o seu rendimento cai, e em qual matéria ele cai primeiro.'};
    // Estouro puro: acertou tudo o que respondeu e o que perdeu foi inteiro para o
    // relógio. Sem este desfecho a pessoa caía em "perdeu ponto dos dois lados" com o
    // conselho invertido (fechar matéria primeiro), violando a regra de que estouro
    // nunca se mistura com erro no texto. Vem ANTES do ramo hiY porque com um estouro
    // só o Y ainda pode passar do corte, e "a matéria não respondeu" seria falso.
    // O X continua contando estouro como ponto perdido (decisão registrada no compute);
    // é o texto que separa, não a régua.
    if(errosReais()===0 && estourouQuantas()>0){
      return {cls:'ochre', lab:M.lab, hl:M.hl,
        lead:'Tudo o que você marcou estava certo.',
        p1:'Na prova, questão em branco vale o mesmo que questão errada.',
        p2:'Estudar mais matéria não muda isso: matéria você mostrou que tem. O que falta saber é para onde o seu tempo vai: em qual matéria você trava, e em que ponto da prova isso começa.'};
    }
    // O peso da matéria que a pessoa errou, dito com o número dela. Antes esta frase
    // apontava sempre para Ética, e os leads reais desmentiram: Ética é a menos errada.
    var mp = materiaPeso();
    var peso = mp ? ' A primeira que caiu foi '+mp.mat+', que vale '+mp.fatia+'.' : '';
    if(!hiX&&hiY) return {cls:'mixed', lab:M.lab, hl:M.hl,
      lead:'Sob pressão você funcionou, e isso é metade do caminho.',
      p1:'A outra metade: você perdeu '+perdeu+' das '+CONTENT.length+', e estas '+CONTENT.length+' são uma de cada matéria do núcleo que decide a prova.'+peso,
      p2:'Ponto perdido aí não se compensa nas 11 matérias de fora: elas valem menos, e é justamente por isso que são de fora. O que falta é o número. Em qual das 6 está o buraco, e de que tamanho ele é.'};
    // O Y cai junto com os erros (a nota de decisão pune errar), então dá para chegar
    // aqui com o relógio limpo. Nesse caso a abertura não pode acusar o relógio: o bloco
    // "O que o relógio mostrou", três blocos abaixo, sai verde e desmentiria o veredito.
    // O lead TEM que sair da mesma régua da manchete, e até 02/08/2026 não saía:
    // vinha de relogioAcusou(), que olha estouro, queda de rendimento e ritmo, enquanto
    // a manchete passou a vir de perdaSeparada(), que olha ONDE o ponto foi perdido.
    // As duas discordavam e a tela dizia, com duas linhas de distância, "todas foram de
    // matéria" e "os dois eixos cederam ao mesmo tempo". Régua diferente para a mesma
    // pergunta produz contradição na cara do leitor, e este publico desconfia de curso.
    // A queda de rendimento continua sendo dita, no bloco "O que o relógio mostrou",
    // que é onde ela é achado e não veredito.
    var ps=perdaSeparada();
    var abriu = (ps.mat>0 && ps.exec>0)
      ? 'Os dois eixos cederam ao mesmo tempo.'
      : (ps.exec===0
          ? 'O relógio não tirou ponto seu: o que pesou foi a matéria.'
          : 'A matéria você mostrou que tem. O que cedeu foi a execução.');
    return {cls:'mixed', lab:M.lab, hl:M.hl,
      lead:abriu,
      p1:'É o diagnóstico mais duro de receber e o mais fácil de tratar, porque aqui a ordem muda tudo: tática de prova em cima de matéria que você não sabe não vira ponto nenhum. Primeiro fecha a matéria de maior peso, e só depois trabalha o tempo.'+peso,
      p2:'O que não funciona é o que você provavelmente já tentou: estudar tudo, todo dia, esperando que a conta feche sozinha. O que falta você saber é qual das 6 matérias entra primeiro nessa ordem, e quanto você tem em cada uma delas hoje.'};
  }

  // A frase que o placar sozinho não diz. O 'momento' era o dado mais pesado do
  // formulário e até 02/08/2026 não entrava em lugar nenhum: era só gravado.
  // Não mexe na nota, porque nota é desempenho medido. Mexe na LEITURA, que é
  // onde ele vale: quem já reprovou e vai bem numa amostra está no ponto cego
  // que este produto existe para tratar.
  // Estrutura fixa de dois tempos: o que a SUA situação revela · o que corrige, com o
  // entregável dito por extenso e o preço na frase.
  // Duas regras aprendidas na marra em 02/08/2026:
  // 1. NUNCA consolar. "Você está cedo, e isso é vantagem" tira a urgência inteira e a
  //    pessoa fecha a aba tranquila. Se ela errou, o fato é que hoje ela não passaria.
  // 2. NUNCA falar por metáfora. "Um mapa do que cai" não significa nada para quem está
  //    no primeiro contato. Dizer o que a pessoa recebe: 24 questões cronometradas, a
  //    porcentagem em cada uma das 6, o nome da que derruba.
  // A urgência aqui é sempre REAL: a data da prova e o próprio placar dela.
  // 02/08 · v3: devolve CAMPOS, não HTML. O layout novo usa os dois tempos em lugares
  // diferentes da página: o "ponto" vira pull-quote logo abaixo do diagnóstico, e o
  // "o que corrige" vira TÍTULO de seção (Spectral) mais parágrafo. Nenhuma frase foi
  // reescrita: o que era "<b>O que corrige:</b> trocar suposição por número. DIAG"
  // virou {titulo:'Trocar suposição por número', texto:DIAG}.
  // Devolve null para "Só estou olhando" (esse momento não tem leitura).
  function leituraMomento(q, r){
    var forte=!!q.forte;
    // Terceiro perfil, descoberto na revisão de 02/08: acertou as 7 mas o eixo da hora
    // não fechou. O ramo padrão mandava essa pessoa ler "a matéria que te derruba seguiu
    // intocada" logo depois de o veredito dizer "Você sabe a matéria". O discriminador
    // de matéria não é 'forte', é não ter errado conteúdo: X cheio OU estouro puro.
    // 'sabe' = não perdeu NENHUMA por matéria. Tem que ser exatamente a mesma régua
    // da manchete, senão o título diz "nenhuma por falta de matéria" e a seção de
    // oferta, 30 linhas abaixo, promete achar a matéria que derruba. Foi o que o
    // teste de borda pegou no caso de quem sabe e decide afobado: erra respondendo,
    // então errosReais() é 2, mas nenhuma dessas duas é matéria.
    var sabe = !forte && perdaSeparada().mat===0;
    // DIAG NÃO enumera o que o relatório mostra: o bloco rasurado faz isso logo abaixo,
    // e melhor, porque é visual. Aqui fica só formato e preço. O R$47 NÃO é só o
    // relatório: inclui as fichas, a folha de tática e 3 simulados.
    // A prosa parou de enumerar fichas, folha de tática e simulados: a lista "O que
    // chega na sua mão" está logo abaixo e faz isso melhor. Duas enumerações iguais na
    // mesma dobra fazem a oferta parecer menor, não maior.
    // Começa em "Elas" porque o título da seção acabou de dizer "As 24 questões".
    // Antes o número aparecia três vezes na mesma altura de tela: no título, aqui, e no
    // primeiro item da lista. A terceira repetição não aumenta desejo nenhum.
    var DIAG='Elas são cronometradas, nas 6 matérias que decidem a prova, e o relatório sai na hora, com o seu nome.';
    // Para quem não perdeu matéria, a oferta não pode prometer "descubra onde você perde
    // ponto": ela acabou de não perder nenhum. Responde a pergunta que o veredito deixou.
    var DIAG_F='Elas são cronometradas, nas mesmas 6 matérias, e o relatório responde isso com número: onde o seu rendimento começa a cair, e em qual matéria.';
    if(forte||sabe) DIAG=DIAG_F;
    var ponto, titulo, texto;
    if(reprovouMais()){
      ponto = forte
        ? 'Duas provas ou mais sem passar, e a matéria do núcleo você tem. Então o que te derruba está no que este teste nem tocou: as outras 11 matérias, o ritmo ao longo de 80 questões e o cansaço da terceira hora. Duas reprovações apontam para o mesmo lugar, e você nunca teve como medir esse lugar.'
        : sabe
        ? 'Duas provas ou mais sem passar, e o que te derrubou aqui não foi a matéria. O que cedeu foi a hora, e agora isso tem registro: aconteceu de novo, num teste de quatro minutos. Duas reprovações e este resultado apontam para o mesmo lugar, e não é o caderno.'
        // Encurtado em 02/08: eram cinco linhas no ponto em que a pessoa já aceitou o
        // diagnóstico e quer saber "e agora". A absolvição ("não é falta de esforço")
        // fica, porque num público em que a regra é o autoflagelo ela é o que segura a
        // leitura. O que saiu foi a repetição do argumento, não o argumento.
        : 'O padrão acabou de se repetir na sua frente, em quatro minutos. Não é falta de esforço: é esforço na matéria errada, porque ninguém nunca te disse qual era.';
      titulo = forte? 'Medir o que ainda não foi medido'
        : sabe? 'Parar de estudar de novo o que você já tem'
        : 'Saber o nome dessa matéria antes de abrir o próximo caderno';
      texto = DIAG + (forte? ' E o Plano Completo cobre justamente o pedaço que as suas provas apontaram: as fichas das 17 disciplinas, dois simulados de 80 questões para ver onde o rendimento cai, e o cronograma dia a dia até a prova, por R$127.' : '');
    } else if(jaReprovou()){
      ponto = forte
        ? 'Você acertou tudo aqui e mesmo assim prestou e não passou. Entre o que você sabe e a nota que saiu tem alguma coisa se perdendo, e não é a matéria do núcleo. Enquanto ela não tiver nome, a segunda tentativa é a primeira de novo.'
        : sabe
        ? 'Você já prestou uma vez e não passou, e aqui a matéria não foi o problema. O que cedeu foi a hora, num teste de quatro minutos, sem sala cheia e sem cinco horas de prova. No dia, isso só aumenta.'
        : 'Você já prestou uma vez e não passou, e o mesmo resultado reapareceu num teste de quatro minutos, sem sala cheia e sem cinco horas de prova. Repetir a mesma preparação costuma devolver a mesma nota.';
      titulo = 'Trocar suposição por número';
      // O rabo "aparece ali com nome" só para quem de fato perdeu matéria: para X cheio
      // o veredito acabou de dizer que matéria não é o problema, e a frase desmentiria.
      texto = DIAG + ((forte||sabe)? '' : ' Se o que te derrubou está entre essas 6 matérias, ele aparece ali com nome.');
    } else if(S.momento==='Já me formei e vou fazer a minha primeira prova'){
      ponto = forte
        ? 'Você vai prestar pela primeira vez e acabou de ver o melhor resultado que este teste dá. O que ele não mede é o que acontece com esse acerto na questão 40, com três horas de prova nas costas. É na primeira prova que isso pega quem sabe a matéria, justamente porque nunca foi medido.'
        : sabe
        ? 'Você vai prestar pela primeira vez, e o que te cobrou aqui não foi a matéria: foi a hora, no conforto de casa. No dia são 80 questões, cinco horas e a sala cheia.'
        : 'Você vai prestar pela primeira vez, e acabou de ver esse resultado no conforto de casa: sem sala cheia, sem cinco horas de prova e sem as outras 11 matérias no meio. No dia, tudo isso entra junto.';
      titulo = forte? 'Medir antes do dia'
        : sabe? 'Medir em que ponto o seu rendimento cai, antes do dia'
        : 'Olhar antes, e não depois';
      texto = faltam() + DIAG;
    } else if(S.momento==='Ainda estou na faculdade'){
      ponto = forte
        ? 'A OAB cobra um pedaço pequeno do Direito, em cinco horas, e nesse pedaço, nestas 7, você não cedeu. O que ninguém mediu ainda é se isso se sustenta por 80 questões seguidas, porque a faculdade não cronometra ninguém.'
        : sabe
        ? 'Ainda na faculdade, e a matéria não foi o que te derrubou aqui. O que apareceu foi a hora, e isso a faculdade não mede nunca: prova de faculdade não cronometra ninguém.'
        // A esperança fica ancorada no que dá para SABER, nunca no tempo que resta: quem
        // está na faculdade pode estar a três semanas da prova, e "você está cedo" faz
        // essa pessoa desconectar na hora.
        : 'Estar na faculdade não te protegeu disso, e não é culpa sua: a faculdade ensina o Direito inteiro, em cinco anos, e a OAB cobra um pedaço pequeno dele, em cinco horas. São duas coisas diferentes, e ninguém avisa. Quem estuda para a faculdade não está estudando para o exame.';
      titulo = (forte||sabe)? 'Medir isso antes do dia' : 'Saber desde já em qual matéria você perde ponto';
      texto = (forte||sabe)? (faltam()+DIAG)
        : (DIAG + ' A maioria reprova sem nunca saber onde perdeu. Você acabou de descobrir que dá para saber antes.');
    } else {
      // "Só estou olhando". Até 02/08/2026 este momento devolvia null, e o efeito
      // era grave: sem leitura e sem tabela de custo, a oferta aparecia como uma
      // lista de itens e um botão, sem uma única frase de transição depois do
      // diagnóstico. Era o único perfil que via o preço sem nenhum antecedente.
      // Nenhum dos 18 leads reais marcou esta opção, então o texto é curto de
      // propósito: existe para a página não quebrar, não para converter.
      ponto = forte
        ? 'Você entrou por curiosidade e não perdeu nenhuma. Isso responde uma pergunta e abre outra: estas '+CONTENT.length+' não medem o que acontece na questão 40, com três horas de prova nas costas.'
        : sabe
        ? 'Você entrou por curiosidade e a matéria não foi o problema. O que apareceu foi a hora, num teste de quatro minutos feito sem sala cheia e sem cinco horas de prova.'
        : 'Você entrou por curiosidade e o teste achou alguma coisa. Curiosidade que encontra buraco deixa de ser curiosidade.';
      titulo = 'Saber o tamanho disso antes de decidir qualquer coisa';
      texto = DIAG;
    }
    return {ponto:ponto, titulo:titulo, texto:texto};
  }

  // Matérias em que a pessoa ERROU (respondeu e errou), sem repetir. Questão em que
  // o tempo estourou fica de fora: não responder não é a mesma coisa que errar, e
  // misturar as duas destrói justamente a separação que este produto vende.
  // materiasErradas() e materiasEstouradas() foram REMOVIDAS em 02/08. Existiam só para
  // imprimir o nome das matérias na linha legível do bloco rasurado, e isso saiu: dizer
  // "você errou Civil e Ética" entrega metade do diagnóstico, que é exatamente o que o
  // R$47 vende. Se um dia for preciso reabrir, está no histórico do git.

  // O bloco do que ainda está trancado. É o motor da urgência e o único bloco que
  // CRESCEU nesta revisão: tudo o mais na tela de resultado encolheu, porque o
  // resultado grátis estava entregando o que o R$47 vende e tirando a urgência.
  // Regra: o que as 7 já mostraram sai legível e verdadeiro; o que depende das 24 sai
  // como barra opaca, sem número por baixo. Valor fixo que parece calculado destrói a
  // credibilidade no primeiro print comparado entre duas pessoas.
  function lockbox(){
    // 02/08: o NOME das matérias erradas saiu da linha legível e virou barra opaca.
    // Dizer "você errou Civil e Ética" é entregar metade do diagnóstico de graça, e era
    // exatamente o que o R$47 vende. No lugar entra a CONTAGEM: prova que o teste mediu
    // alguma coisa, sem dizer o quê, e cria mais curiosidade do que o nome criava,
    // porque agora a pergunta é "quais três?".
    var cederam=[]; CONTENT.forEach(function(qq,i){
      if((S.estourou[i]||S.ans[i]!==qq.c) && cederam.indexOf(qq.mat)<0) cederam.push(qq.mat);
    });
    function real(t,v){ return '<div class="row"><span class="t">'+t+'</span><span class="val">'+esc(v)+'</span></div>'; }
    function trava(t){ return '<div class="row"><span class="t">'+t+'</span><span class="val trava"></span></div>'; }
    var linhas = real('Matérias do núcleo em que você cedeu', cederam.length? cederam.length+' de 6' : 'nenhuma');
    // A média já sai só das respondidas (tempoMedio ignora estouro). Quando houve
    // estouro, o rótulo precisa dizer isso, senão a página elogia o ritmo na mesma
    // tela em que o relógio derrubou a pessoa.
    var estq=estourouQuantas();
    linhas += real(estq? 'Seu tempo médio nas '+(CONTENT.length-estq)+' que você respondeu' : 'Seu tempo médio por questão',
      (tempoMedio()!=null? tempoMedio()+'s' : 'sem registro'));
    linhas +=
      // Só faz sentido perguntar "quais são" se houve alguma. Para quem gabaritou essa
      // linha ficaria contradizendo o "nenhuma" que ela acabou de ler duas linhas acima.
      (cederam.length? trava('Quais delas são, com nome') : '')+
      trava('Sua porcentagem em cada uma das 6')+
      trava('Se o que te derruba é a matéria ou a hora da prova, uma por uma')+
      trava('Em que ponto das 24 questões o seu rendimento cai')+
      trava('Por onde começar a estudar amanhã');
    return '<div class="lockbox">'+
      '<div class="inner" style="padding-top:14px">'+linhas+'</div>'+
      '<div class="cta">O que está legível saiu das suas '+CONTENT.length+' respostas. O resto depende das 24, e sai na hora, com o seu nome.</div>'+
    '</div>';
  }

  function gabarito(){
    // A demo do produto: UMA questão corrigida no formato do relatório pago. É o único
    // bloco de conteúdo que sobrou de graça, e sobrou de propósito: é 1 de 248 questões,
    // não substitui o produto, e é a única prova na tela de que ele é competente.
    // Prioridade: primeiro uma questão em que o TEMPO ESTOUROU, porque é ali que mora a
    // desculpa do relógio, e ler o comentário mata a desculpa sozinho, sem a página
    // precisar discutir. Depois a primeira errada. Só então sorteia, para não repetir a
    // mesma em todo mundo e virar atalho de grupo de WhatsApp.
    var idx=-1, k;
    for(k=0;k<CONTENT.length;k++){ if(S.estourou[k]){ idx=k; break; } }
    if(idx<0) for(k=0;k<CONTENT.length;k++){ if(S.ans[k]!==CONTENT[k].c){ idx=k; break; } }
    if(idx<0) idx=Math.floor(Math.random()*CONTENT.length);
    var Q=CONTENT[idx], sua=S.ans[idx];
    var alts=Q.o.map(function(op,j){
      var cls='alt'+(j===Q.c?' certa':'')+(j===sua&&sua!==Q.c?' sua':'');
      var pre=String.fromCharCode(65+j)+') ';
      var suf=(j===Q.c?' · correta':(j===sua?' · a sua resposta':''));
      return '<div class="'+cls+'">'+pre+esc(op)+suf+'</div>';
    }).join('');
    var nota = S.estourou[idx] ? '<p style="margin-bottom:8px"><b>Nesta o tempo acabou antes de você marcar.</b></p>' : '';
    return '<div class="gab">'+
      '<div class="q">'+esc(Q.mat)+' · '+esc(Q.q)+'</div>'+alts+nota+

  function pressao(){
    // v3: devolve OBJETO. Nomeia só o pior cenário, em uma frase, sem dizer o que fazer
    // com aquilo. Regra da tela inteira: nomear sem dimensionar e sem prescrever.
    var pior=null;
    BEHAVIOR.forEach(function(B,i){
      var sel=S.beh[i]; if(sel==null) return;
      var sc=B.o[sel][1];
      if(pior===null || sc<pior.sc) pior={sc:sc, txt:B.leit[sc]};
    });
    if(!pior) return null;
    // Só a primeira frase do 'leit': ela nomeia o comportamento. O resto traduzia aquilo
    // de volta para a prova, que é a parte que ensina, e ensinar de graça é o produto.
    var frase=String(pior.txt).split('. ')[0];
    if(frase.slice(-1)!=='.') frase+='.';
    var fecho=pior.sc===2
      ? ' O diagnóstico mede se isso se sustenta por 24 questões seguidas.'
      : ' O tamanho disso está no diagnóstico.';
    return {k:'Sob pressão', p:esc(frase)+fecho, cls:(pior.sc===0?'ochre':(pior.sc===1?'':'green'))};
  }

  function tempo(){
    // v3: devolve OBJETO. Sai UM achado, o mais forte, por prioridade: estouro, queda no
    // fim, oscilação, erro com convicção, ritmo. Reporta o fato e para. Não defende a
    // regra do relógio: página que argumenta soa insegura e abre a porta para "na prova
    // eu teria mais tempo".
    var est=estourouQuantas(), fora=segundosFora(), lin=null, ruim=false;
    var cons=notaConstancia(), res=notaResistencia(), tm=tempoMedio();
    var rapErr=null;
    CONTENT.forEach(function(Q,i){
      if(S.times[i]!=null && !S.estourou[i] && S.ans[i]!==Q.c && S.times[i]<=15 &&
         (rapErr===null||S.times[i]<rapErr.t)) rapErr={i:i,t:S.times[i]};
    });
    if(est){
      ruim=true;
      lin='O tempo acabou antes de você marcar em <b>'+est+'</b> '+(est>1?'questões':'questão')+'. Na prova, questão não respondida vale o mesmo que questão errada.';
    } else if(res!=null && res<=55){
      // A queda ao longo do teste é o achado mais vendável daqui: é a prova, com o número
      // da própria pessoa, de que o problema aparece com o tempo de prova.
      ruim=true;
      lin='Você foi pior nas três últimas do que nas três primeiras. E aqui foram sete questões, não oitenta.';
    } else if(cons!=null && cons<=55){
      ruim=true;
      lin='Seu ritmo oscilou muito de uma questão para outra: em umas você decidiu quase na hora, em outras quase no limite. Não é lentidão, é irregularidade.';
    } else if(rapErr){
      ruim=true;
      lin='Você errou a questão de <b>'+esc(CONTENT[rapErr.i].mat)+'</b> em '+rapErr.t+' segundos, sem hesitar. Erro com convicção é o que mais passa despercebido.';
    } else if(tm!=null && tm>=33){
      ruim=true; lin='Você decidiu no limite do relógio: '+tm+' segundos por questão, em média.';
    } else if(tm!=null && tm<10){
      ruim=true; lin='Você decidiu em '+tm+' segundos por questão, em média. Nenhuma questão dessas se lê nesse tempo.';
    } else if(tm!=null){
      lin='Ritmo firme e parelho: '+tm+' segundos por questão, sem oscilar e sem cair no fim.';
    }
    if(lin===null) return null;
    if(fora>=3) lin+=' Você ficou '+fora+' segundos fora desta aba durante a Parte 1, e fora da aba o relógio corre em dobro.';
    return {k:'O que o relógio mostrou', p:lin, cls:(ruim?'ochre':'green')};
  }

  // Rótulo e largura de cada barra do hero. A barra substituiu o gráfico de quadrante:
  // o quadrante exigia leitura de eixo e um rótulo por canto, e no celular virava
  // enfeite. Duas barras dizem a mesma coisa sem precisar de legenda.
  // Teto de 96%: barra cheia encostando na borda lê como "completo", e nada aqui é
  // completo — o produto inteiro é sobre o que ainda não foi medido.
  function barraConteudo(r){
    // Estouro puro: acertou TUDO o que respondeu e o que perdeu foi inteiro para o
    // relógio. A barra media acertos sobre as 7 e saía "Parcial · 6/7" em vermelho,
    // a 200 pixels de uma manchete que dizia "não foi a matéria, foi o relógio".
    // Duas afirmações opostas na mesma tela. Aqui a barra passa a medir o que a
    // pessoa de fato respondeu, que é a única coisa que o conteúdo dela sustenta.
    if(errosReais()===0 && r.estourou>0){
      var resp=CONTENT.length-r.estourou;
      return {rot:'Domínio do conteúdo que cai', v:'Alto · '+r.c+'/'+resp+' do que deu tempo', cls:'ok', w:96};
    }
    var n=r.c, alto=r.X>=CORTE_X;
    var txt = alto? 'Alto · '+n+'/'+CONTENT.length
            : (r.X>=50? 'Parcial · '+n+'/'+CONTENT.length : 'Baixo · '+n+'/'+CONTENT.length);
    return {rot:'Domínio do conteúdo que cai', v:txt, cls:(alto?'ok':'no'), w:Math.max(6,Math.round(r.X*0.96))};
  }
  function barraPressao(r){
    var alto=r.Y>=CORTE_Y;
    var txt = alto? 'Firme' : (r.Y>=55? 'Irregular' : 'Instável');
    return {rot:'Firmeza sob o relógio', v:txt, cls:(alto?'ok':'no'), w:Math.max(6,Math.round(r.Y*0.96))};
  }

  // Contexto compartilhado pelas duas telas do resultado. Existe porque em 02/08/2026 a
  // tela de resultado foi partida em duas: DIAGNÓSTICO (o que o teste achou, sem preço
  // nenhum) e SOLUÇÃO (a oferta). Antes era uma tela só, e a auditoria tinha apontado o
  // efeito: a oferta se disfarçava de continuação do diagnóstico e a etiqueta de preço
  // chegava no meio de uma tabela, sem aviso. Partida em duas, a oferta é uma coisa que
  // a pessoa PEDE, e o clique nesse pedido é um degrau novo de funil que dá para medir.
  function ctx(){
    var r=compute(), q=quadrant(r.X,r.Y,r), L=leituraMomento(q,r);
    // Checkout pré-preenchido com o que a pessoa já digitou: ela não encara o formulário
    // vazio de novo (é onde o funil perde gente).
    var digits=S.tel.replace(/\D/g,'');
    var fill='&name='+encodeURIComponent(S.nome)+
      (S.email?'&email='+encodeURIComponent(S.email):'')+
      (digits?'&phoneNumber='+encodeURIComponent(digits):'');
    // O trecho em itálico do título. Se 'hl' não estiver dentro de 'lab', o título sai
    // reto em vez de quebrar: substituição só acontece quando encontra.
    var h1=esc(q.lab);
    if(q.hl && q.lab.indexOf(q.hl)>=0) h1=h1.replace(esc(q.hl),'<em>'+esc(q.hl)+'</em>');
    if(!/[.!?]$/.test(q.lab)) h1+='.';
    return {
      r:r, q:q, L:L, h1:h1,
      nome: esc((S.nome.split(' ')[0])||'você'),
      buyUrl: CHECKOUT_URL+fill, buyUrlC: CHECKOUT_COMPLETO+fill,
      forte: !!q.forte,
      erroN: CONTENT.length-r.c-r.estourou,
      // Mesma régua da manchete e do 'sabe'. A tabela não pode prometer "descobrir a
      // matéria" para quem o título acabou de absolver de falha de matéria.
      semFalhaDeMateria: perdaSeparada().mat===0,

      // é o que destrava quem não tem cartão com limite, e era a informação mais
      // escondida da página. O prazo de acesso passou a aparecer: a oferta.html sempre
      // disse "12 meses" e aqui só dizia "sem mensalidade", que lê como vitalício.
      // O total do parcelado sai escrito, sem ninguém perguntar. Para um público que
      // já se queimou com cursinho, mostrar o que a página poderia esconder compra
      // confiança, e ainda empurra para o Pix, que é melhor para os dois lados.
      PAGA:'<div class="pag"><span class="pix">Pix</span> <b>R$ 47</b> à vista '+
           '<span>ou '+PARCELA+' no cartão, '+TOTAL_PARCELADO+' no total</span></div>',
