  P3 · A INVERSÃO DA CRENÇA · público frio · campanha de Compra · 1080x1350
  ------------------------------------------------------------------------
  Versão 2, depois da revisão da dupla sênior (+45 anos).
  Briefing: ../../soqc-prompt-sala-de-criacao.md

  O QUE MUDOU E POR QUÊ

  1. Os rótulos saíram do vocabulário de dentro de casa. MATÉRIA e PRESSÃO são o
     nome que o produto dá aos dois eixos; ninguém de fora sabe disso. NÃO SABIA e
     SABIA E ERREI são a fala dela, e a segunda é reconhecimento imediato para
     quem já sentou naquela prova.

  2. As duas caixas pararam de parecer tabela de planos. O conjunto cantos
     arredondados + par simétrico + filete de cor embaixo é literalmente o desenho
     de "Básico / Premium", e a peça que existe para dizer QUE NÃO É CURSO estava
     comunicando curso. Raio de 16 para 4, o filete ocre morreu, e entrou uma
     linha acima do par amarrando o dispositivo à oferta.

  3. Corpo e contraste dos rótulos. 28px a 55% de tinta dava 10,4px efetivos a
     3,58:1: ilegível na entrega, e era metade do argumento da peça.

  4. A manchete não se toca. "Estudar mais não resolveu da última vez" é a tese do
     produto em uma linha: contradiz a crença dela, absolve sem bajular e não
     promete nada. O filtro inteiro mora naquele pretérito.

  Render: ./render.sh p3-a-inversao.html
-->
