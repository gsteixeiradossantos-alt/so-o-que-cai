<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<!--
  P3 · A INVERSÃO DA CRENÇA · público frio · campanha de Compra · 1080x1350
  ------------------------------------------------------------------------
  Saída da sala de criação de 08/08/2026 (dupla copy + direção de arte).
  Briefing: ../../soqc-prompt-sala-de-criacao.md

  É a única das três que oferece absolvição em vez de acusação. Absolvição só
  interessa a quem já foi condenado: "da última vez" é literalmente sem sentido
  para quem nunca prestou, e é por isso que a versão curta ("Não foi falta de
  estudo.") foi descartada — ela perde o passado, e o passado é o filtro.

  Os dois blocos não levam porcentagem nem barra: número de eixo aqui viraria
  alegação sobre resultado alheio. O argumento inteiro é a assimetria de peso
  entre eles — o vazado é o que todo mundo vende, o sólido é o que ninguém vende.

  Render: ./render.sh p3-a-inversao.html
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=Hanken+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap');
  :root{--paper:#F3EEE4;--ink:#231F1A;--navy:#15212B;--ocre:#A65D1E}
  html,body{margin:0;padding:0;background:var(--paper)}
  .art{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--paper);
       font-family:'Hanken Grotesk',system-ui,sans-serif}

  /* ---------- banda 1 · impacto: a frase ---------- */
  .frase{position:absolute;left:88px;top:150px;width:904px;font-family:'Spectral',Georgia,serif;
         font-weight:700;font-size:86px;line-height:1.1;color:var(--ink);letter-spacing:-.02em}

  /* ---------- banda 2 · dispositivo: os dois eixos, em peso desigual ---------- */
  .blocos{position:absolute;left:88px;top:640px;width:904px;display:flex;gap:32px}
  .b{width:436px;height:200px;border-radius:16px;box-sizing:border-box;padding:28px 30px;position:relative;
     display:flex;flex-direction:column;justify-content:center}
  .b.vazio{border:3px solid rgba(35,31,26,.25)}
  .b.cheio{background:var(--navy)}
  .b .tit{font-family:'Space Mono',monospace;font-weight:700;font-size:28px;letter-spacing:.12em}
  .b .sub{margin-top:14px;font-weight:600;font-size:30px;line-height:1.24}
  .b.vazio .tit,.b.vazio .sub{color:rgba(35,31,26,.55)}
  .b.cheio .tit,.b.cheio .sub{color:var(--paper)}
  .filete{position:absolute;left:556px;top:846px;width:436px;height:6px;border-radius:3px;background:var(--ocre)}

  /* ---------- banda 3 · base ---------- */
  .remate{position:absolute;left:88px;top:1050px;width:904px;font-weight:600;font-size:35px;
          line-height:1.2;color:rgba(35,31,26,.75)}
  .selo{position:absolute;left:88px;top:1112px;font-family:'Space Mono',monospace;font-weight:700;
        font-size:26px;color:var(--navy);letter-spacing:.12em}
  .marca{position:absolute;left:88px;top:1250px;font-family:'Space Mono',monospace;font-size:24px;
         color:rgba(35,31,26,.45);letter-spacing:.14em}
</style></head><body data-render="1080x1350">
<div class="art">

  <!-- Três linhas, e não duas: em 86px "Estudar mais não resolveu" não cabe nos 904px
       e quebrava sozinha num rag torto. Três linhas equilibradas preservam o corpo. -->
  <div class="frase">Estudar mais<br>não resolveu<br>da última vez.</div>

  <div class="blocos">
    <div class="b vazio">
      <div class="tit">MATÉRIA</div>
      <div class="sub">resolve estudando</div>
    </div>
    <div class="b cheio">
      <div class="tit">PRESSÃO</div>
      <div class="sub">estudar mais não resolve</div>
    </div>
  </div>
  <div class="filete"></div>

  <div class="remate">Você nunca soube qual dos dois era o seu.</div>
  <div class="selo">7 QUESTÕES · 4 MINUTOS · GRÁTIS</div>

  <div class="marca">SÓ O QUE CAI · 1ª FASE DA OAB</div>
</div>
</body></html>
