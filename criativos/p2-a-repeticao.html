<!--
  P2 · A CENA DA REPETIÇÃO · público frio · campanha de Compra · 1080x1350
  -----------------------------------------------------------------------
  Versão 2, depois da revisão da dupla sênior (+45 anos).
  Briefing: ../../soqc-prompt-sala-de-criacao.md

  O QUE MUDOU E POR QUÊ

  1. A manchete deixou de dizer "estudar". "Você vai estudar tudo de novo"
     CONFIRMA a crença que o produto inteiro existe para desmentir, e anima quem
     quer mais estudo, que é justamente o clique que entra e vai embora sem ver o
     preço. "Você vai fazer a 1ª fase de novo" troca a acusação pelo fato e
     nomeia o exame no corpo grande, que é onde faltava.

  2. Três colunas viraram duas. A leitora sênior não viu "o mesmo caderno três
     vezes": viu skeleton loader, o desenho universal de página que não carregou.
     Filetes de 14px viravam textura de 5,2px na entrega. Duas colunas de filetes
     mais grossos dizem "de novo" melhor, e liberam largura para os rótulos, que
     eram o que morria: "O MESMO CADERNO" a 26px dava 9,6px efetivos.

  3. Os rótulos deixaram de ser coisas e voltaram a ser tempo. A ÚLTIMA VEZ e
     06 DE SETEMBRO montam a sequência sozinhos; a data para de flutuar sem
     legenda e para de ser lida como "tem uma live dia 6".

  4. Olho, linha da oferta e piso de contraste: iguais aos das outras duas. A base
     compartilhada é o que faz o teste ser atribuível.

  Render: ./render.sh p2-a-repeticao.html
-->
