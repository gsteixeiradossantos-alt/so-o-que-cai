<!DOCTYPE html><html><head><meta charset="utf-8">
<style>

html,body{margin:0;padding:0}

<svg width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1920" fill="#F0EBDD"/>

  <rect x="0" y="252" width="1080" height="100" fill="#16232b"/>
  <text x="540" y="316" class="mono" font-size="36" font-weight="700" fill="#F0EBDD" text-anchor="middle" letter-spacing="10">OAB · FGV · 1ª FASE</text>

  <rect x="80" y="420" width="60" height="60" rx="14" fill="#16232b"/>
  <circle cx="110" cy="450" r="11" fill="#C0672B"/>
  <text x="158" y="466" class="serif" font-size="42" font-weight="700" fill="#1b1b1a">Só o que Cai</text>
  <text x="1000" y="460" class="mono" font-size="24" font-weight="700" fill="#C0672B" text-anchor="end" letter-spacing="2">DIAGNÓSTICO</text>
  <line x1="80" y1="512" x2="1000" y2="512" stroke="#1b1b1a" stroke-width="2"/>

  <text x="78" y="760" class="serif" font-size="92" font-weight="800" fill="#1b1b1a">Existem</text>
  <text x="78" y="860" class="serif" font-size="92" font-weight="800" font-style="italic" fill="#C0672B">dois jeitos</text>
  <text x="78" y="960" class="serif" font-size="92" font-weight="800" fill="#1b1b1a">de reprovar</text>
  <text x="78" y="1060" class="serif" font-size="92" font-weight="800" fill="#1b1b1a">na <tspan fill="#C0672B">OAB</tspan>.</text>
  <text x="78" y="1160" class="serif" font-size="92" font-weight="800" fill="#1b1b1a">Você só</text>
  <text x="78" y="1260" class="serif" font-size="92" font-weight="800" fill="#1b1b1a">conhece um.</text>

  <text x="80" y="1370" class="sans" font-size="34" font-weight="500" fill="#6f6857">Não saber a matéria é um. Saber e travar</text>
  <text x="80" y="1418" class="sans" font-size="34" font-weight="500" fill="#6f6857">na prova da FGV é o outro.</text>

  <rect x="80" y="1490" width="530" height="96" rx="48" fill="#16232b"/>
  <text x="345" y="1550" class="sans" font-size="34" font-weight="700" fill="#F0EBDD" text-anchor="middle">Fazer o diagnóstico  →</text>
  <text x="648" y="1532" class="mono" font-size="30" font-weight="700" fill="#1b1b1a">R$ 47</text>
  <text x="648" y="1572" class="mono" font-size="24" fill="#8a8271">resultado na hora</text>
</svg></body></html>
