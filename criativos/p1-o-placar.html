<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<!--
  P1 · O PLACAR · público frio · campanha de Compra · 1080x1350
  ------------------------------------------------------------
  Versão 2, depois da revisão da dupla sênior (+45 anos), que julgou a v1 pela
  régua de quem é o público de verdade. Briefing: ../../soqc-prompt-sala-de-criacao.md

  O QUE MUDOU E POR QUÊ

  1. A régua morreu. Na v1 o dispositivo era uma escala de 0 a 80 com o corte no
     40 e o 39 encostado. No papel funciona; a 400px de largura (37%, que é como
     o feed entrega) exigia três saltos empilhados e o primeiro era insolúvel:
     reconhecer o trilho como eixo numérico dependia de ler "0" e "80" a 8,9px
     efetivos e 2,72:1 de contraste. Ficaram os dois números confrontados, que é
     o que sobrevive: 39 em ocre, 40 em marinho, e só o 40 legendado.
     Cinco saltos viraram um.

  2. Voltou o olho tipográfico nomeando o exame. A v1 cortou o rótulo alegando
     que a peça deve filtrar por artefato e não por rótulo. O corte confundiu
     duas funções: o rótulo não filtra (quem filtra é o pretérito da manchete),
     mas SITUA. Sem ele, a leitora que É o alvo também não reconhecia a prova
     dela. Volta como cabeça de matéria, não como pílula colorida.

  3. A linha da oferta saiu da monoespaçada. "7 QUESTÕES · 4 MINUTOS · GRÁTIS"
     em Space Mono 26px com tracking dava 9,6px efetivos: a mono anula a variação
     de largura e o tracking anula a proximidade, e juntos destroem a silhueta da
     palavra, que é como o leitor maduro lê. Agora é Hanken 700 a 40px, com verbo:
     o botão dentro da arte continua cortado, mas a FUNÇÃO dele volta em texto.

  4. Piso de contraste. Nenhum texto abaixo de 70% de tinta (5,65:1). Os 45% e 55%
     ficaram só em estrutura.

  Render: ./render.sh p1-o-placar.html
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=Hanken+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap');
  :root{--paper:#F3EEE4;--ink:#231F1A;--navy:#15212B;--ocre:#A65D1E}
  html,body{margin:0;padding:0;background:var(--paper)}
  .art{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--paper);
       font-family:'Hanken Grotesk',system-ui,sans-serif}

  /* olho: situa a peça. Registro de cabeça de matéria, não de selo de promoção. */
  .olho{position:absolute;left:88px;top:118px;font-family:'Space Mono',monospace;
        font-weight:700;font-size:36px;letter-spacing:.10em;color:var(--navy)}

  /* ---------- banda 1 · impacto: dois números confrontados ---------- */
  .n{position:absolute;top:300px;font-family:'Spectral',Georgia,serif;font-weight:700;
     font-size:210px;line-height:.9;letter-spacing:-.02em}
  .n39{left:230px;color:var(--ocre)}
  .n40{left:540px;color:var(--navy)}
  .divisor{position:absolute;left:472px;top:310px;width:6px;height:170px;
           background:rgba(35,31,26,.50);border-radius:3px}
  .rot40{position:absolute;left:540px;top:508px;font-family:'Space Mono',monospace;
         font-weight:700;font-size:34px;letter-spacing:.10em;color:var(--navy)}

  /* ---------- banda 2 · a frase ---------- */
  .frase{position:absolute;left:88px;top:700px;width:904px;font-family:'Spectral',Georgia,serif;
         font-weight:700;font-size:76px;line-height:1.12;color:var(--ink);letter-spacing:-.015em}

  /* ---------- banda 3 · base ---------- */
  .remate{position:absolute;left:88px;top:1040px;width:904px;font-weight:600;font-size:38px;
          line-height:1.2;color:rgba(35,31,26,.75)}
  .selo{position:absolute;left:88px;top:1100px;font-weight:700;font-size:40px;color:var(--navy)}
  .marca{position:absolute;left:88px;top:1250px;font-family:'Space Mono',monospace;font-weight:700;
         font-size:28px;color:rgba(35,31,26,.70);letter-spacing:.14em}
</style></head><body data-render="1080x1350">
<div class="art">

  <div class="olho">1ª FASE DA OAB · 06 DE SETEMBRO</div>

  <div class="n n39">39</div>
  <div class="divisor"></div>
  <div class="n n40">40</div>
  <!-- só o 40 é legendado: o 39 é explicado pela manchete logo abaixo. -->
  <div class="rot40">LINHA DE CORTE</div>

  <div class="frase">Faltou uma questão.<br>Ninguém te disse qual.</div>

  <div class="remate">Um ponto de diferença custou quatro meses.</div>
  <div class="selo">Faça o teste grátis. 7 questões, 4 minutos.</div>

  <div class="marca">SÓ O QUE CAI</div>
</div>
</body></html>
