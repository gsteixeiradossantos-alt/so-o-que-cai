<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;} body{margin:0;}
#portalCedente{
  --paper:#EFEAD9; --paper-2:#E2DBC6; --card-warm:#FBF8EF; --cream:#EFEAD9;
  --ink:#0A1530; --ink-2:#15224A; --pgold:#C9A961; --gold-2:#9C7F40;
  --pline:rgba(10,21,48,.12); --mute:rgba(10,21,48,.55);
  --st-judicial:#3A5288; --st-quitado:#5E7C58; --st-cobrar:#9C7F40; --st-semexito:#A65A4A;
  /* display:flex só quando .active (regra #portalCedente.active) — senão o ID sobrescreve .screen{display:none} e a tela vaza embaixo do app do gestor */
  height:100vh; background:var(--paper); color:var(--ink);
  font-family:'Inter Tight',Inter,system-ui,sans-serif;
}
#portalCedente.screen{padding:0;}
#portalCedente.active{flex-direction:row;}
/* Sidebar */
.cp-sidebar{width:256px;min-width:256px;background:var(--ink);background-image:linear-gradient(rgba(201,169,97,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(201,169,97,.05) 1px,transparent 1px);background-size:48px 48px;display:flex;flex-direction:column;height:100vh;border-right:1px solid rgba(201,169,97,.12);}
.cp-sidebar-logo{padding:22px 20px 16px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,.06);}
.cp-logo-mark{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(201,169,97,.45);position:relative;flex-shrink:0;}
.cp-logo-mark::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:var(--pgold);}
.cp-logo-wm{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:23px;line-height:1;color:var(--cream);letter-spacing:.005em;}
.cp-logo-wm .dot{color:var(--pgold);}
.cp-logo-sub{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.22em;color:rgba(239,234,217,.42);margin-top:3px;}
.cp-sidebar-user{margin:14px;padding:12px 14px;border:1px solid rgba(201,169,97,.18);border-radius:14px;background:rgba(255,255,255,.03);display:flex;align-items:center;gap:11px;}
.cp-sidebar-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pgold),var(--gold-2));color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.cp-sidebar-uname{color:var(--cream);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;}
.cp-sidebar-urole{font-family:'JetBrains Mono',monospace;color:rgba(239,234,217,.5);font-size:9px;letter-spacing:.14em;text-transform:uppercase;margin-top:3px;}
.cp-nav{flex:1;padding:8px 12px;overflow-y:auto;}
.cp-nav-sec{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(239,234,217,.38);padding:14px 10px 6px;}
.cp-nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;margin:1px 0;border-radius:9px;color:rgba(239,234,217,.62);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;}
.cp-nav-item:hover{color:var(--cream);background:rgba(255,255,255,.04);}
.cp-nav-item.active{background:rgba(201,169,97,.13);color:var(--cream);box-shadow:inset 2.5px 0 0 var(--pgold);}
.cp-nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.cp-nav-badge{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:500;color:rgba(239,234,217,.6);background:rgba(255,255,255,.06);border-radius:20px;padding:1px 7px;}
.cp-nav-badge.gold{background:var(--pgold);color:var(--ink);font-weight:600;letter-spacing:.05em;}
.cp-nav-item.locked{opacity:.8;cursor:pointer;}
.cp-nav-item.locked:hover{opacity:1;}
.cp-nav-item.locked svg{opacity:.65;}
.cp-nav-item.locked .cp-nav-badge.gold{position:relative;overflow:hidden;}
.cp-nav-item.locked .cp-nav-badge.gold::after{content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:cpShimmer 2.6s ease-in-out infinite;}
@keyframes cpShimmer{0%,72%{left:-60%;}100%{left:130%;}}
.cp-sidebar-footer{padding:12px;border-top:1px solid rgba(255,255,255,.06);}
.cp-beatriz-btn{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-radius:12px;border:1px solid rgba(201,169,97,.25);background:linear-gradient(135deg,rgba(201,169,97,.14),rgba(201,169,97,.04));cursor:pointer;text-align:left;transition:all .15s;}
.cp-beatriz-btn:hover{border-color:rgba(201,169,97,.5);}
.cp-beatriz-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--pgold),var(--gold-2));color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:16px;flex-shrink:0;}
.cp-beatriz-t{color:var(--cream);font-size:12.5px;font-weight:600;}
.cp-beatriz-s{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(239,234,217,.5);}
.cp-sair{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;margin-top:6px;border:0;background:none;color:rgba(239,234,217,.5);font-size:12.5px;cursor:pointer;border-radius:9px;font-family:inherit;}
.cp-sair:hover{color:var(--cream);background:rgba(255,255,255,.04);}
/* Main + topbar */
.cp-main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden;}
.cp-topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;padding:14px 36px;background:rgba(239,234,217,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--pline);}
.cp-topbar-tt{display:flex;flex-direction:column;gap:2px;}
.cp-topbar-eyebrow{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.18em;font-size:10px;color:var(--gold-2);}
.cp-topbar-title{font-family:'Fraunces',Georgia,serif;font-size:21px;font-weight:400;color:var(--ink);letter-spacing:-.01em;}
.cp-search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--card-warm);border:1px solid var(--pline);border-radius:99px;padding:8px 14px;min-width:260px;color:var(--mute);font-size:13px;}
.cp-search input{border:0;background:none;outline:none;flex:1;font:inherit;color:var(--ink);min-width:0;}
.cp-bell{width:38px;height:38px;border-radius:50%;border:1px solid var(--pline);background:var(--card-warm);display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative;cursor:pointer;flex-shrink:0;}
.cp-bell::after{content:"";position:absolute;top:9px;right:10px;width:6px;height:6px;border-radius:50%;background:var(--pgold);}
.cp-body{flex:1;overflow-y:auto;padding:32px 36px 80px;}
.cp-wrap{max-width:1800px;margin:0 auto;}
.cp-wrap.narrow{max-width:980px;} .cp-wrap.mid{max-width:1120px;}
/* Cards / type */
.cp-card{background:var(--card-warm);border:1px solid var(--pline);border-radius:18px;padding:22px 24px;}
.cp-h1{font-family:'Fraunces',Georgia,serif;font-weight:400;font-size:42px;letter-spacing:-.02em;color:var(--ink);line-height:1.05;}
.cp-lead{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:19px;color:var(--mute);margin-top:4px;}
.cp-lead em{color:var(--gold-2);font-style:italic;}
.cp-num{font-family:'Fraunces',Georgia,serif;font-weight:400;letter-spacing:-.01em;}
.cp-mono{font-family:'JetBrains Mono',monospace;}
.cp-label{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);}
.cp-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;padding:11px 18px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:all .15s;}
.cp-btn-primary{background:var(--ink);color:var(--cream);box-shadow:0 8px 20px -10px rgba(10,21,48,.5);}
.cp-btn-primary:hover{background:var(--ink-2);}
.cp-btn-outline{background:transparent;border-color:var(--pgold);color:var(--gold-2);}
.cp-btn-outline:hover{background:rgba(201,169,97,.08);}
.cp-btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none;}
.cp-kpi-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
/* Status pill */
.cp-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;border-radius:100px;padding:4px 11px;}
.cp-pill .dot{width:6px;height:6px;border-radius:50%;}
.cp-st-judicial{color:var(--st-judicial);background:color-mix(in srgb,var(--st-judicial) 14%,transparent);}
.cp-st-judicial .dot{background:var(--st-judicial);}
.cp-st-quitado{color:var(--st-quitado);background:color-mix(in srgb,var(--st-quitado) 14%,transparent);}
.cp-st-quitado .dot{background:var(--st-quitado);}
.cp-st-acordo{color:var(--gold-2);background:color-mix(in srgb,var(--gold-2) 14%,transparent);}
.cp-st-acordo .dot{background:var(--gold-2);}
.cp-st-cobrar{color:var(--st-cobrar);background:color-mix(in srgb,var(--st-cobrar) 14%,transparent);}
.cp-st-cobrar .dot{background:var(--st-cobrar);}
.cp-st-semexito{color:var(--st-semexito);background:color-mix(in srgb,var(--st-semexito) 14%,transparent);}
.cp-st-semexito .dot{background:var(--st-semexito);}
/* progress / chips / stepper / timeline / toggle */
.cp-prog{height:7px;border-radius:99px;background:var(--paper-2);overflow:hidden;}
.cp-prog>span{display:block;height:100%;border-radius:99px;background:var(--pgold);}
.cp-chip{display:inline-flex;align-items:center;gap:6px;border-radius:100px;padding:7px 14px;font-size:12.5px;font-weight:500;cursor:pointer;border:1px solid var(--pline);background:var(--card-warm);color:var(--mute);white-space:nowrap;}
.cp-chip.on{background:var(--ink);color:var(--cream);border-color:var(--ink);}
.cp-chip .ct{font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.7;}
.cp-steps{display:flex;align-items:flex-start;}
.cp-step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;text-align:center;}
.cp-step::before{content:"";position:absolute;top:17px;left:-50%;width:100%;height:2px;background:var(--paper-2);z-index:0;}
.cp-step:first-child::before{display:none;}
</style></head>
<body>
<div id="portalCedente" class="screen" style="display:block;height:auto;min-height:100vh;">
  <div class="cp-body" style="height:auto;"><div id="portalCedenteBody"></div></div>
</div>
<script>
function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtR(v){return 'R$ '+(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function _detData(s){ if(!s) return '—'; var d=String(s).slice(0,10).split('-'); return d.length===3?d[2]+'/'+d[1]+'/'+d[0]:String(s); }
function showToast(){}
var currentUser={clienteId:'cli1',nome:'Bidão Auto Mecânica'};
var DB={clientes:[{id:'cli1',nome:'Bidão Auto Mecânica',nomeFantasia:'Bidão Auto Mecânica'}]};
function cpExtratoPDF(){alert('PDF (mock)');}
function baixarDocumentoDevedor(){}
let _cpExtUI = { q:'', filter:'todos', sort:'orig', sel:{}, open:{}, bodyEl:null, focusSearch:false };
async function cpComputeExtrato(){
  const cid = currentUser.clienteId;
  const supa = getSupabase();
  let repasses=[];
  if(supa){
    try{ const { data } = await supa.from('repasses_cliente').select('*').order('data_pix',{ascending:false,nullsFirst:false}); repasses=data||[]; }catch(_){}
  }
  const repByCob={};
  repasses.forEach(r=>{ (repByCob[r.cobranca_id]=repByCob[r.cobranca_id]||[]).push(r); });
  const cobr=(typeof DB_cobrancas!=='undefined'?DB_cobrancas:[]||[]).filter(c=>c.cliente_id===cid);
  const linhas=cobr.map(c=>{
    const cap=(c.valor_capital!=null)?+c.valor_capital:((c.divida&&c.divida.valorCapital!=null)?+c.divida.valorCapital:null);
    const reps=(repByCob[c.id]||[]).slice().sort((a,b)=>String(b.data_pix||'').localeCompare(String(a.data_pix||'')));
    const recebido=reps.reduce((s,r)=>s+(+r.valor||0),0);
    const saldo=(cap!=null)?(cap-recebido):null;
    const principal=(c.cobranca_partes||[]).find(p=>p.principal)||(c.cobranca_partes||[])[0];
    const devNome=(principal&&principal.devedores&&principal.devedores.nome)||(c.divida&&c.divida.descricao)||'Caso';
    return { id:c.id, cap, reps, recebido, saldo, devNome, status:c.status, quitado:(saldo!=null&&cap>0&&saldo<=0.005), ultimo:(reps[0]&&reps[0].data_pix)||null };
  }).filter(l=>l.cap!=null || l.reps.length);
  linhas.sort((a,b)=>b.recebido-a.recebido);
  linhas.forEach((l,i)=>{ l.origIdx=i; }); // índice de origem estável (seleção/expansão sobrevivem a filtro/ordenação)
  const totCap=linhas.reduce((s,l)=>s+(l.cap||0),0);
  const totRec=linhas.reduce((s,l)=>s+l.recebido,0);
  const nQuit=linhas.filter(l=>l.quitado).length;
  _cpExtrato={ linhas, totCap, totRec, totSaldo:Math.max(totCap-totRec,0), nRep:repasses.length, nQuit, pct: totCap>0?(totRec/totCap*100):0 };
  return _cpExtrato;
}
// ── Extrato: view (filtra+ordena mantendo origIdx), contagens, helpers ──
function _cpExtNorm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function _cpExtView(){
  const ex=_cpExtrato; if(!ex) return [];
  const u=_cpExtUI; let v=ex.linhas.slice();
  const q=_cpExtNorm(u.q.trim());
  if(q) v=v.filter(l=>_cpExtNorm(l.devNome).includes(q));
  if(u.filter==='Quitado') v=v.filter(l=>l.quitado);
  else if(u.filter==='andamento') v=v.filter(l=>!l.quitado);
  else if(u.filter==='sem') v=v.filter(l=>l.recebido<=0.005);
  const sk=u.sort;
  if(sk==='saldo') v.sort((a,b)=>Math.max(b.saldo||0,0)-Math.max(a.saldo||0,0));
  else if(sk==='recebido') v.sort((a,b)=>b.recebido-a.recebido);
  else if(sk==='capital') v.sort((a,b)=>(b.cap||0)-(a.cap||0));
  else if(sk==='nome') v.sort((a,b)=>(a.devNome||'').localeCompare(b.devNome||'','pt-BR'));
  else if(sk==='recente') v.sort((a,b)=>String(b.ultimo||'').localeCompare(String(a.ultimo||'')));
  return v; // 'orig' = ordem do extrato (sem reordenar)
}
function _cpExtCounts(){ const ls=(_cpExtrato&&_cpExtrato.linhas)||[]; return { todos:ls.length, Quitado:ls.filter(l=>l.quitado).length, andamento:ls.filter(l=>!l.quitado).length, sem:ls.filter(l=>l.recebido<=0.005).length }; }
function _cpMoneyBig(v){ const s=fmtR(v||0); const i=s.lastIndexOf(','); return i<0?escHtml(s):(escHtml(s.slice(0,i))+'<span style="font-size:.6em;">'+escHtml(s.slice(i))+'</span>'); }
function _cpCheck(on,partial){
  if(partial) return '<span style="width:18px;height:18px;border-radius:5px;border:1px solid var(--gold-2);background:var(--pgold);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><span style="width:9px;height:2px;background:var(--ink);border-radius:1px;"></span></span>';
  if(on) return '<span style="width:18px;height:18px;border-radius:5px;border:1px solid var(--pgold);background:var(--pgold);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="#0A1530" stroke-width="3"><path d="m5 12 5 5 9-10"/></svg></span>';
  return '<span style="width:18px;height:18px;border-radius:5px;border:1px solid var(--mute);background:transparent;flex-shrink:0;display:block;"></span>';
}
function _cpBia(scope){
  const n=scope.length, nq=scope.filter(l=>l.quitado).length, nand=n-nq;
  const cap=scope.reduce((s,l)=>s+(l.cap||0),0), rec=scope.reduce((s,l)=>s+l.recebido,0);
  const saldo=Math.max(cap-rec,0), pct=cap>0?(rec/cap*100):0, nsem=scope.filter(l=>l.recebido<=0.005).length;
  let maior=null; scope.filter(l=>!l.quitado&&(l.saldo||0)>0).forEach(l=>{ if(!maior||(l.saldo||0)>(maior.saldo||0)) maior=l; });
  let t=`Dos ${n} caso(s) da sua carteira, ${nq} ${nq===1?'já está quitado':'já estão quitados'} e ${nand} ${nand===1?'segue':'seguem'} em andamento. `;
  t+=`Já ${rec>0?'foram recuperados':'foi recuperado'} ${fmtR(rec)} de ${fmtR(cap)} (${pct.toFixed(1).replace('.',',')}%), restando ${fmtR(saldo)} a recuperar.`;
  if(maior) t+=` O maior valor em aberto é de ${maior.devNome} (${fmtR(Math.max(maior.saldo||0,0))}).`;
  if(nsem>0) t+=` ${nsem} caso(s) ainda não tiveram entrada e seguem em fase de cobrança.`;
  return t;
}
function _cpNarr(l){
  if(l.quitado) return `Cobrança quitada — recuperação integral do capital.${l.ultimo?` Último repasse em ${_detData(l.ultimo)}.`:''} Nenhuma ação pendente.`;
  if(l.recebido>0.005){ const pct=l.cap?(l.recebido/l.cap*100):0; return `Recuperação parcial: ${fmtR(l.recebido)} de ${fmtR(l.cap||0)} (${pct.toFixed(1).replace('.',',')}%). Saldo de ${fmtR(Math.max(l.saldo||0,0))} ainda em recuperação.`; }
  return 'Sem repasses até o momento — caso em fase de cobrança.';
}
async function cpRenderRepasses(body){
  if(!body) return;
  _cpExtUI.bodyEl=body;
  body.innerHTML=`<div style="padding:60px;text-align:center;color:var(--mute);">Carregando extrato…</div>`;
  await cpComputeExtrato();
  // estado de UI zera a cada entrada na tela
  _cpExtUI.q=''; _cpExtUI.filter='todos'; _cpExtUI.sort='orig'; _cpExtUI.sel={}; _cpExtUI.open={}; _cpExtUI.focusSearch=false;
  cpExtPaint();
}
// Interações (mutam _cpExtUI e repintam a folha sem refazer a query)
function cpExtSearch(v){ _cpExtUI.q=v; _cpExtUI.focusSearch=true; cpExtPaint(); }
function cpExtSetFilter(f){ _cpExtUI.filter=(_cpExtUI.filter===f?'todos':f); cpExtPaint(); }
function cpExtSetSort(v){ _cpExtUI.sort=v; cpExtPaint(); }
function cpExtClear(){ _cpExtUI.q=''; _cpExtUI.filter='todos'; _cpExtUI.sort='orig'; cpExtPaint(); }
function cpExtToggle(idx){ idx=+idx; _cpExtUI.open[idx]=!_cpExtUI.open[idx]; cpExtPaint(); }
function cpExtToggleAll(){ const v=_cpExtView().filter(l=>l.reps.length); const allOpen=v.length>0&&v.every(l=>_cpExtUI.open[l.origIdx]); v.forEach(l=>{ _cpExtUI.open[l.origIdx]=!allOpen; }); cpExtPaint(); }
function cpExtSel(idx){ idx=+idx; _cpExtUI.sel[idx]=!_cpExtUI.sel[idx]; cpExtPaint(); }
function cpExtSelAll(){ const v=_cpExtView(); const allSel=v.length>0&&v.every(l=>_cpExtUI.sel[l.origIdx]); v.forEach(l=>{ _cpExtUI.sel[l.origIdx]=!allSel; }); cpExtPaint(); }
function cpExtPaint(){
  const body=_cpExtUI.bodyEl, ex=_cpExtrato; if(!body||!ex) return;
  const u=_cpExtUI, view=_cpExtView(), cnt=_cpExtCounts();
  const active = !!u.q.trim() || u.filter!=='todos' || u.sort!=='orig';
  const cli=(DB.clientes||[]).find(c=>c.id===currentUser.clienteId)||{};
  const nomeCli=cli.nomeFantasia||cli.nome_fantasia||cli.nome||currentUser.nome||'Cliente';
  const grid='grid-template-columns:22px minmax(0,1fr) 88px 88px 88px 96px;gap:8px;';
  const filterLbl={todos:'Todos',Quitado:'Quitados',andamento:'Em andamento',sem:'Sem entrada'}[u.filter]||'Todos';
  const sortLbl={orig:'ordem do extrato',saldo:'maior saldo',recebido:'mais recuperado',capital:'maior capital',nome:'nome',recente:'último repasse'}[u.sort]||'ordem do extrato';
  // seleção / expansão (estado do cabeçalho)
  const selN=view.filter(l=>u.sel[l.origIdx]).length;
  const allSel=view.length>0&&selN===view.length, partialSel=selN>0&&selN<view.length;
  const expandables=view.filter(l=>l.reps.length);
  const allOpen=expandables.length>0&&expandables.every(l=>u.open[l.origIdx]);
  const nSel=Object.keys(u.sel).filter(k=>u.sel[k]).length;
  const btnLabel=nSel>0?`Gerar relatório (${nSel})`:'Gerar relatório (todos)';
  // métricas do topo = extrato completo
